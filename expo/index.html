<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세계 무역 박람회</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* Same classroom notice-board look as 무역 실험실·원주 탐험대. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F;
  --nature:#5E9B5A; --tech:#3D6E8C; --geo:#C27A2C;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input,select{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center;font-size:.9em}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .4em;font-size:1rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.quiz .q,.q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.2rem;padding:.9em .5em;line-height:1.3}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.opts.three{grid-template-columns:repeat(3,1fr)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--coral2);line-height:1.25}
.emoji{font-size:clamp(3rem,10vw,4.5rem);line-height:1}
.score{font-family:var(--display);font-size:1.3rem}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
/* 나라 고르기 */
.nations{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.nations button{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;display:grid;gap:4px;font-family:var(--text);font-size:1rem;padding:12px 14px}
.nations button b{font-family:var(--display);font-weight:400;font-size:1.35rem}
.nations button[aria-pressed="true"]{border-color:var(--coral);background:#FFF4DF}
.nations button small{color:var(--muted)}
/* 1단계: 수입품·수출품 나누기 */
.sortcard{display:grid;justify-items:center;gap:4px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 24px;min-width:min(100%,340px)}
.sortcard .nm{font-family:var(--display);font-size:2rem;line-height:1.2}
.sortbtn{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.sortbtn button{font-size:1.3rem;padding:1em .5em;line-height:1.25}
.sortbtn .in{background:var(--blue)} .sortbtn .out{background:var(--coral2)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;text-align:left}
.board>div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:5.5em}
.board h3{font-size:1.15rem}
.board .chipz{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.board .chipz span{background:var(--cream);border-radius:999px;padding:.15em .7em;font-family:var(--display)}
.board .chipz span.hard{background:#F6E1DB;color:var(--bad)}
.board .inb{border-color:var(--blue)} .board .outb{border-color:var(--coral2)}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.flow>div{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 8px}
.flow>div b{display:block;font-family:var(--display);font-weight:400;font-size:1.25rem}
.flow>div .ic{font-size:2rem;line-height:1.2}
.flow>span{font-size:2rem;color:var(--coral2);font-family:var(--display)}
.flow .f1{border-color:var(--blue)} .flow .f2{border-color:var(--gold);background:#FFF9E8} .flow .f3{border-color:var(--coral2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--cream);color:var(--ink);border:1px solid var(--line);padding:.45em .9em;font-family:var(--text);font-size:1.05rem;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 2단계: 홍보관 */
.ncard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:#FFF4DF;border-radius:16px;padding:12px 16px;border:2px solid var(--coral)}
.ncard .flag{font-size:3.2rem;line-height:1}
.ncard h2{font-size:1.7rem}
.facts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.facts li{background:#fff;border-left:6px solid var(--blue2);border-radius:10px;padding:8px 12px}
.prodpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.prodpick button{background:#fff;color:var(--ink);border:2px solid var(--line);display:grid;gap:4px;justify-items:center;padding:12px 6px;font-size:1.1rem;line-height:1.25}
.prodpick button span{font-size:2.6rem;line-height:1}
.prodpick button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.prodpick button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kinds button{background:#fff;color:var(--ink);border:3px solid var(--line);display:grid;gap:4px;justify-items:center;padding:14px 8px;font-size:1.2rem;line-height:1.25}
.kinds button span{font-size:2.4rem;line-height:1}
.kinds button small{font-family:var(--text);font-size:.92rem;color:var(--muted)}
.kinds button.wrong{background:#F6E1DB;border-color:var(--bad)}
.kinds button.right{background:#E3F1E7;border-color:var(--ok)}
.kb{display:inline-block;border-radius:999px;padding:.1em .7em;color:#fff;font-family:var(--display);font-size:.95rem}
.kb.nature{background:var(--nature)} .kb.tech{background:var(--tech)} .kb.geo{background:var(--geo)}
.booth{background:#fff;border:3px solid var(--line);border-radius:18px;overflow:hidden;display:grid}
.booth .roof{height:16px;background:repeating-linear-gradient(90deg,var(--coral) 0 28px,#fff 28px 56px)}
.booth.nature{border-color:var(--nature)} .booth.tech{border-color:var(--tech)} .booth.geo{border-color:var(--geo)}
.booth .in{padding:12px 16px;display:grid;gap:8px}
.booth .hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.booth .hd .e{font-size:2.6rem;line-height:1}
.booth .hd h3{font-size:1.6rem}
.booth .sl{font-family:var(--display);font-size:1.45rem;color:var(--coral2);line-height:1.3}
.booth .pr{font-family:var(--display);font-size:1.15rem}
.booth .nw{font-size:.95rem;color:var(--muted)}
.booth.small .hd .e{font-size:2rem}.booth.small .hd h3{font-size:1.3rem}.booth.small .sl{font-size:1.15rem}
.blist{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.blist>button{padding:0;background:none;color:var(--ink);text-align:left;font-family:var(--text);font-size:1rem;border-radius:18px}
.blist>button{display:flex;flex-direction:column;gap:2px}
.blist>button .booth{flex:1}
.blist>button.got .booth{opacity:.6}
.stamp{font-family:var(--display);color:var(--ok);font-size:1.1rem}
.stamps{display:flex;gap:6px;flex-wrap:wrap;font-size:1.8rem;line-height:1}
.stamps span.no{filter:grayscale(1);opacity:.3}
.fld label{font-family:var(--display);font-size:1.2rem}
/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.list{display:grid;gap:8px}
.list div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px}
.list b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
.map svg{width:100%;height:auto;display:block;border-radius:14px;border:2px solid var(--line)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cols>div{background:#fff;border-radius:16px;padding:10px;display:grid;gap:10px;align-content:start;border-top:8px solid var(--line)}
.cols>div.nature{border-top-color:var(--nature)} .cols>div.tech{border-top-color:var(--tech)} .cols>div.geo{border-top-color:var(--geo)}
.cols h3{font-size:1.25rem}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:2.6em 11em 1fr 5em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 12px}
.rank .r b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--coral2)}
.rank .r .nm{font-family:var(--display);font-size:1.25rem}
.rank .r .pt{font-family:var(--display);font-size:1.4rem;text-align:right;font-variant-numeric:tabular-nums}
.bar .track{height:30px;border-radius:10px;background:var(--cream);overflow:hidden}
.bar .track div{height:100%;background:var(--coral);border-radius:10px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.6rem}
.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}
@media (max-width:820px){
  .hero,.tv,.two,.cols{grid-template-columns:1fr}
  .choose,.opts,.opts.three,.kinds{grid-template-columns:1fr}
  .prodpick{grid-template-columns:1fr 1fr}
  .steps button{font-size:.85rem}
  .flow{grid-template-columns:1fr}.flow>span{transform:rotate(90deg)}
  .rank .r{grid-template-columns:2.2em 1fr 4.5em}.rank .r .trk{display:none}
}
</style></head><body>

<script>
const FIREBASE_CONFIG = {

// 1단계: 우리나라 주요 수입품과 수출품 (교과서 100쪽, 한국 무역 협회 2024)
const SORT=[

  {id:'chem',e:'⚗️',n:'정밀 화학 원료',a:'in',tip:'비료, 의약품, 배터리를 만드는 기초 원료'},
  {id:'gas',e:'🔥',n:'천연가스',a:'in',tip:'땅속에서 뽑아내는 연료'},

  {id:'chip',e:'💾',n:'반도체',a:'out',tip:'컴퓨터와 스마트폰의 두뇌가 되는 부품'},

const FEAT_START='우리나라는 ';
const FEAT_EASY=['천연자원을 수입해서, 발달한 기술로 상품을 만들어 수출해요.','천연자원이 부족해서 다른 나라에서 수입해요.','기술이 발달해서 반도체와 자동차를 많이 수출해요.'];

// 2·3단계: 세계 여러 나라의 무역 (교과서 102~104쪽)
const KINDS={
  nature:{e:'🌏',n:'자연환경·천연자원',d:'넓은 땅, 알맞은 기후, 땅속 자원'},
  tech:{e:'🔬',n:'뛰어난 기술·문화',d:'발달한 기술로 만든 제품, 영화·음악 같은 문화 상품'},

const KCOL={nature:'#5E9B5A',tech:'#3D6E8C',geo:'#C27A2C'};
const NATIONS=[
  {id:'th',e:'🌾',n:'타이',ll:[101,15],lp:'l',kind:'nature',prod:{e:'🌾',n:'쌀'},

// 세계 지도: 홍보관을 연 나라는 진하게, 구매 약속은 화살표로
function mapSVG({on=new Set(),act=new Set(),lines=[],counts={}}={}){
  let g=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E0704F"/></marker></defs>
   <rect width="${MAP.W}" height="${MAP.H}" fill="#CFE3EA"/><path d="${LAND}" fill="#F6EEDA" stroke="#C9B98F" stroke-width="1"/>`;
  lines.forEach(l=>{const a=proj(NN[l.from].ll),b=proj(NN[l.to].ll);
    const mx=(a[0]+b[0])/2,my=Math.min(a[1],b[1])-Math.max(40,Math.abs(a[0]-b[0])*.18);
    g+=`<path d="M${a[0].toFixed(0)} ${a[1].toFixed(0)}Q${mx.toFixed(0)} ${my.toFixed(0)} ${b[0].toFixed(0)} ${b[1].toFixed(0)}" fill="none" stroke="#F98F6E" stroke-width="${2+Math.min(6,l.n*1.5)}" stroke-linecap="round" opacity=".75" marker-end="url(#ah)"/>`;});
  const [kx,ky]=proj(KOREA.ll);
  g+=`<text x="${kx}" y="${ky+7}" text-anchor="middle" font-size="22" fill="#C8452D">★</text><text x="${kx-12}" y="${ky+6}" text-anchor="end" font-size="16" font-family="Jua" fill="#C8452D" stroke="#fff" stroke-width="4" paint-order="stroke">대한민국</text>`;
  NATIONS.forEach(x=>{const [cx,cy]=proj(x.ll);const o=on.has(x.id),a=act.has(x.id);
    const lx=x.lp==='l'?cx-28:x.lp==='r'?cx+28:cx, ly=x.lp==='t'?cy-30:x.lp==='b'?cy+44:cy+7, an=x.lp==='l'?'end':x.lp==='r'?'start':'middle';
    const c=counts[x.id]?` 🤝${counts[x.id]}`:'';
    g+=`<g opacity="${o?1:a?.8:.4}"><circle cx="${cx}" cy="${cy}" r="22" fill="${o?'#fff':'#EFE7D3'}" stroke="${o?KCOL[x.kind]:'#B8A88A'}" stroke-width="4"/>
     <text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="22">${x.e}</text>
     <text x="${lx}" y="${ly}" text-anchor="${an}" font-size="20" font-family="Jua" fill="#453422" stroke="#fff" stroke-width="5" paint-order="stroke">${x.n}${c}</text></g>`;});
  return `<div class="map"><svg viewBox="0 0 ${MAP.W} ${MAP.H}" role="img" aria-label="세계 지도: 홍보관을 연 나라와 구매 약속">${g}</svg></div>`;
}

let me=null, ROOMV={}, ME={}, cur=1, onMe=null, MYC={}, CALL={};
function parseName(s){const m=String(s).trim().match(/^(\d{1,2})\s*[번.]?\s*(.+)$/);return m?{num:+m[1],name:m[2].trim()}:null;}
function joinView(){
  clearOffs();
  const saved=store('ex-student');
  if(saved&&ROOM&&saved.room===ROOM){me=saved;return enterRoom();}
  $('#sub').textContent='학생 화면';
  ClassWatch.student({db,room:ROOM,root:app});ClassWatch.step('들어가기');
  let pick='';
  app.innerHTML=`<div class="grid" style="max-width:760px;margin:0 auto">
   <div class="panel grid"><h2>방 번호</h2><input id="rm" inputmode="numeric" maxlength="4" placeholder="TV에 보이는 4자리" value="${esc(ROOM)}"></div>
   <div class="panel grid"><h2>"번호 이름"을 써요</h2><input id="nm" placeholder="예) 7 김민수" autocomplete="off"></div>
   <div class="panel grid"><h2>짝과 함께 맡을 홍보관 나라</h2><p class="muted" style="margin:0">짝과 같은 나라를 골라요. 다른 짝과 겹치지 않게 해요.</p>
    <div class="nations" id="nat">${NATIONS.map(x=>`<button data-n="${x.id}" aria-pressed="false"><b>${x.e} ${x.n}</b></button>`).join('')}</div></div>
   <div class="msg bad" id="jm" role="status"></div>
   <div class="row"><button id="enter" disabled>들어가기</button><button class="ghost" id="home">처음으로</button></div></div>`;
  const chk=()=>{$('#enter').disabled=!(/^\d{4}$/.test($('#rm').value)&&parseName($('#nm').value)&&pick);};
  $('#rm').oninput=chk;$('#nm').oninput=chk;
  $$('#nat button').forEach(b=>b.onclick=()=>{pick=b.dataset.n;$$('#nat button').forEach(x=>x.setAttribute('aria-pressed',x===b));chk();});
  $('#home').onclick=startView;
  ClassWatch.joinForm({checks:[{label:'홍보관 나라 고르기',ok:()=>!!pick}]});
  $('#enter').onclick=async()=>{
    const code=$('#rm').value, p=parseName($('#nm').value);
    $('#enter').disabled=true;
    try{
      const open=await withTimeout(roomRef(code).child('open').get());
      if(!open.exists()){$('#jm').textContent='방 번호를 다시 확인해요.';return chk();}
      const r=await withTimeout(roomRef(code).child('students/'+p.num).transaction(c=>c?undefined:{name:p.name,c:pick,joinedAt:Date.now()},undefined,false));
      if(!r.committed){const c=r.snapshot.val();
        if(!(c&&c.name===p.name)){$('#jm').textContent=`${p.num}번은 이미 "${c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}
        if(c.c!==pick)await roomRef(code).child('students/'+p.num+'/c').set(pick);}
    }catch(e){$('#jm').textContent='연결 문제: '+(e.code||e.message);return chk();}
    ROOM=code;me={room:code,num:p.num,name:p.name};store('ex-student',me);
    history.replaceState(null,'','?room='+code);
    enterRoom();
  };
}
const myNat=()=>NN[ME.c]||NATIONS[0];
function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app});ClassWatch.who(me.num,me.name);
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  let ready=false;ROOMV={};onMe=null;MYC={};CALL={};
  listen(roomRef(me.room).child('students/'+me.num),s=>{
    const v=s.val();
    if(!v){store('ex-student',null);me=null;clearOffs();return joinView();}
    ME=v;
    $('#sub').textContent=`${me.num}번 ${me.name} · ${myNat().e} ${myNat().n}`;
    if(!ready){ready=true;if(ROOMV.stage){cur=ROOMV.stage;renderStage();}return;}
    if(typeof onMe==='function')onMe();
  });
  listen(roomRef(me.room).child('stage'),s=>{
    const st=s.val()||1;const was=ROOMV.stage;ROOMV.stage=st;
    if(!ready)return;
    if(was!==st){cur=st;renderStage();} else drawSteps();
  });
  listen(roomRef(me.room).child('c'),s=>{CALL=s.val()||{};MYC=CALL[ME.c]||{};if(ready&&typeof onNat==='function')onNat();});
  listen(roomRef(me.room).child('award'),s=>{ROOMV.award=!!s.val();if(ready&&cur===4&&ME.quiz&&ME.quiz.done)quizDone();});
}
let onNat=null;
const openBooths=()=>NATIONS.filter(x=>CALL[x.id]&&CALL[x.id].booth&&CALL[x.id].booth.open);
function stepDone(n){
  if(n===1)return !!(ME.s1&&ME.s1.done);
  if(n===2)return !!(MYC.booth&&MYC.booth.open);
  if(n===3){const b=openBooths().filter(x=>x.id!==ME.c);return b.length>0&&b.every(x=>ME.stamps&&ME.stamps[x.id]);}
  return !!(ME.quiz&&ME.quiz.done);
}
function drawSteps(){
  const el=$('#steps');if(!el)return;
  el.innerHTML=[1,2,3,4].map(n=>`<button data-s="${n}" ${n>ROOMV.stage?'disabled':''} ${n===cur?'aria-current="step"':''} class="${stepDone(n)?'done':''}"><b>${n}</b>${STAGES[n].k}${stepDone(n)?' ✓':''}</button>`).join('');
  $$('#steps button').forEach(b=>b.onclick=()=>{cur=+b.dataset.s;renderStage();});
}
function shell(inner){
  app.innerHTML=`<div class="grid"><nav class="steps" id="steps" aria-label="활동 단계"></nav>${inner}<div style="text-align:right"><button class="ghost" id="relog" style="font-size:.85rem;padding:.4em .8em">다른 이름으로 들어가기</button></div></div>`;

// 선생님 '단계별 화면'에 단계 안의 작은 순서까지 따로 모이게 이름을 붙여요
const wstep=sub=>ClassWatch.step(STAGES[cur].k+(sub?' · '+sub:''),{n:cur,total:4,wait:stepDone(cur)});
function renderStage(){
  onMe=()=>drawSteps();onNat=()=>drawSteps();ClassWatch.detail(null);
  if(cur===1)return stage1();
  if(cur===2)return stage2();
  if(cur===3)return stage3();
  return stage4();
}
// 차례로 문제를 내고, 맞혀야 다음으로 넘어가요
function runQuiz(box,qs,{band,title,fig,onRight,onWrong,onEnd,progress,few,cls}){
  let i=0,missed=false;
  const draw=()=>{
    const q=qs[i];const opts=shuffle([q.a,...(few?shuffle(q.o).slice(0,1):q.o)]);missed=false;const t0=Date.now();
    box.innerHTML=`<div><span class="band">${band}</span></div>${title?`<h2>${title}</h2>`:''}
     <div class="prog">${qs.map((_,k)=>`<span class="${k<i?'on':k===i?'cur':''}"></span>`).join('')}</div>
     ${progress?progress():''}<div class="pop" style="width:100%">${fig?fig(q):''}</div><div class="q">${esc(q.q)}</div>
     <div class="opts ${cls||''}">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
     <div class="msg" id="qm" role="status"></div>`;
    ClassWatch.detail(()=>({q:'문제: '+q.q}));
    $$('.opts button',box).forEach(b=>b.onclick=async()=>{
      if(b.dataset.o===q.a){
        b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);
        $('#qm',box).className='msg ok';
        const extra=onRight?await onRight(q,!missed,(Date.now()-t0)/1000,i):'';
        $('#qm',box).textContent='맞았어요!'+(extra||'');
        await new Promise(r=>setTimeout(r,650));
        i++;if(i<qs.length)return draw();
        onEnd();
      }else{
        missed=true;b.classList.add('wrong');b.disabled=true;
        box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
        $('#qm',box).className='msg bad';$('#qm',box).textContent='다시 골라 봐요';
        if(onWrong)onWrong(q);
      }
    });
  };
  draw();
}

      }
      $('#vq').innerHTML=`<div class="emoji pop" aria-hidden="true">🏅</div><div class="big">도장을 받았어요!</div>
       <p>${x.e} ${x.n}의 ${x.prod.e} ${esc(x.prod.n)}을(를) 사기로 약속했어요. TV 지도에 무역 길이 생겨요.</p>
       <button id="next">다른 홍보관 가기 ▶</button>`;
      $('#next').onclick=()=>{visiting='';s3List();};
    }});
}

/* ---------- 4. 정리 퀴즈 ---------- */
async function stage4(){
  if(ME.quiz&&ME.quiz.done)return quizDone();
  let G=ME.quiz;
  if(!G||!G.order){
    wstep('시작');
    shell(`<div class="panel grid quiz"><div><span class="band">4단계 · 정리 퀴즈 대결</span></div><h2 style="font-size:1.8rem">오늘 배운 내용으로 대결해요</h2>
     <p>${QUIZ.length}문제. 한 번에 맞히면 100점 + 빠르기 보너스. 틀리면 다시 골라야 넘어가요.</p>
     <div class="row" style="justify-content:center"><button id="qs">시작하기</button><button class="ghost" id="qe">보기 2개로 하기</button></div></div>`);
    const go=async easy=>{
      G={order:shuffle(QUIZ.map(g=>g.id)),i:0,score:0,easy,started:Date.now()};
      await roomRef(me.room).child('students/'+me.num+'/quiz').set(G);ME.quiz=G;stage4();
    };
    $('#qs').onclick=()=>go(false);$('#qe').onclick=()=>go(true);
    return;
  }
  if(cur!==4)return;
  wstep('문제 풀기');
  const rest=G.order.slice(G.i||0).map(id=>QQ[id]).filter(Boolean);
  shell(`<div class="panel quiz" id="gz"></div>`);
  if(!rest.length)return finishQuiz();
  let score=G.score||0,idx=G.i||0;
  runQuiz($('#gz'),rest,{band:'4단계 · 정리 퀴즈 대결',few:G.easy,fig:q=>`<div class="emoji" aria-hidden="true">${q.e}</div>`,
    progress:()=>`<div class="score">점수 <b>${score}</b>점 · ${idx+1}/${QUIZ.length}번째 문제</div>`,
    onRight:async(q,ok,sec)=>{
      const pts=ok?100+Math.round(50*Math.max(0,Math.min(1,1-(sec-3)/17))):0;
      score+=pts;idx++;
      await roomRef(me.room).child('students/'+me.num+'/quiz').update({i:idx,score});
      ME.quiz={...ME.quiz,i:idx,score};
      return pts?` +${pts}점`:' (두 번째 도전은 점수 없이 넘어가요)';
    },
    onWrong:q=>{roomRef(me.room).child(`students/${me.num}/quiz/wrong/${q.id}`).transaction(v=>(v||0)+1);},
    onEnd:finishQuiz});
}
async function finishQuiz(){
  await roomRef(me.room).child('students/'+me.num+'/quiz').update({done:true,at:Date.now()});
  ME.quiz={...ME.quiz,done:true};drawSteps();quizDone();
}
async function quizDone(){
  const G=ME.quiz||{};
  let rankTxt='';
  if(ROOMV.award){
    const all=(await roomRef(me.room).child('students').get()).val()||{};
    const L=ranking(all);const k=L.findIndex(x=>x.n===me.num);
    if(k>=0)rankTxt=`<div class="big">우리 반 ${k+1}등!</div>`;
  }
  if(cur!==4)return;
  wstep('끝');
  shell(`<div class="panel quiz pop"><div><span class="band">대결 끝</span></div><h2 style="font-size:2rem">무역 박람회 박사 완료!</h2>
   <div class="score" style="font-size:2rem">${G.score||0}점</div>${rankTxt}
   <div class="rules" style="text-align:left;width:100%"><b>꼭! 기억해요</b><ul><li>우리나라는 <b>천연자원</b>을 수입한 후 상품을 생산하여 수출하는 무역이 발달했어요.</li><li>세계 여러 나라는 <b>자연환경, 발달한 기술, 지리적 위치</b> 등 각 나라의 특징에 따른 무역이 발달했어요.</li></ul></div></div>`);
}
function ranking(all){
  return Object.keys(all||{}).map(Number).map(n=>({n,...all[n]})).filter(x=>x.quiz)
    .sort((a,b)=>(b.quiz.score||0)-(a.quiz.score||0)||(b.quiz.i||0)-(a.quiz.i||0)||(a.quiz.at||9e15)-(b.quiz.at||9e15));
}

/* ---------- teacher ---------- */
let tick=null,RD={};
async function teacherView(){
  clearOffs();
  $('#sub').textContent='선생님 화면 · 연결 중';
  app.innerHTML='<div class="panel grid" style="text-align:center"><h2>방을 만드는 중이에요…</h2></div>';
  let code=store('ex-teacher-room');
  try{
    if(!code||!(await withTimeout(roomRef(code).child('open').get())).exists()){
      code=String(Math.floor(1000+Math.random()*9000));
      await withTimeout(roomRef(code).set({open:Date.now(),app:'expo',stage:1,timer:{min:STAGES[1].tm,left:STAGES[1].tm*60,endAt:0}}));
      store('ex-teacher-room',code);
    }
  }catch(e){return showError(e);}
  ROOM=code;
  ClassWatch.teacher({db,room:code});
  const url=location.origin+location.pathname+'?room='+code;
  $('#sub').textContent='선생님 화면 · TV에 띄워 주세요';
  app.innerHTML=`<div class="tv">
   <div class="grid">
    <div class="panel qr"><h2>태블릿으로 접속</h2><div id="qrbox"></div><div>방 번호 <span class="roomcode">${code}</span></div><p class="muted" style="word-break:break-all;font-size:.75rem;margin:0">${esc(url)}</p></div>
    <div class="panel grid"><div class="timer" id="tm">5:00</div><div class="row" style="justify-content:center"><button class="ghost" id="minus" aria-label="1분 줄이기">－1</button><button id="go">시작</button><button class="ghost" id="plus" aria-label="1분 늘리기">＋1</button></div></div>
    <div class="panel grid"><h2>단계 열기</h2><div class="tsteps" id="tsteps"></div></div>
    <div class="panel grid"><div class="row" style="justify-content:space-between"><h2>참여</h2><span class="muted" id="cnt"></span></div><div class="people" id="ppl"></div></div>
    <div class="row"><button class="ghost" id="newroom">새 방</button><button class="ghost" id="home">처음으로</button></div>
   </div>
   <div class="grid" id="main"></div></div>`;
  if(window.QRCode){try{new QRCode($('#qrbox'),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
  const ref=roomRef(code);
  listen(ref,s=>{RD=s.val()||{};renderTV();});
  const tm=()=>RD.timer||{min:5,left:300,endAt:0};
  $('#minus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.max(1,t.min-1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#plus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.min(20,t.min+1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#go').onclick=()=>{const t=tm();if(t.endAt)ref.child('timer').set({min:t.min,left:Math.max(0,Math.round((t.endAt-Date.now())/1000)),endAt:0});else{const l=t.left>0?t.left:t.min*60;ref.child('timer').set({min:t.min,left:l,endAt:Date.now()+l*1000});}};
  $('#newroom').onclick=()=>{store('ex-teacher-room',null);teacherView();};
  $('#home').onclick=()=>{location.hash='';startView();};
  clearInterval(tick);tick=setInterval(renderTime,250);
}
function setStage(n){roomRef(ROOM).update({stage:n,timer:{min:STAGES[n].tm,left:STAGES[n].tm*60,endAt:0}});}
function renderTime(){
  const el=$('#tm');if(!el)return clearInterval(tick);
  const t=RD.timer||{min:5,left:300,endAt:0};
  const left=t.endAt?Math.max(0,Math.round((t.endAt-Date.now())/1000)):t.left;
  el.textContent=left===0&&t.endAt?'시간 끝!':`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  el.classList.toggle('end',!!t.endAt&&left===0);
  $('#go').textContent=t.endAt?'멈춤':'시작';$('#minus').disabled=$('#plus').disabled=!!t.endAt;
}
const students=()=>{const s=RD.students||{};return Object.keys(s).map(Number).sort((a,b)=>a-b).map(n=>({n,...s[n]}));};
const tvOpen=()=>NATIONS.filter(x=>RD.c&&RD.c[x.id]&&RD.c[x.id].booth&&RD.c[x.id].booth.open);
function renderTV(){
  const main=$('#main');if(!main)return;
  const st=RD.stage||1, S=students(), C=RD.c||{}, open=tvOpen();
  $('#tsteps').innerHTML=[1,2,3,4].map(n=>`<button data-s="${n}" ${n===st?'aria-current="step"':''}><b>${n}</b> ${STAGES[n].t}</button>`).join('');
  $$('#tsteps button').forEach(b=>b.onclick=()=>setStage(+b.dataset.s));
  const doneIn=x=>st===1?!!(x.s1&&x.s1.done):st===2?!!(C[x.c]&&C[x.c].booth&&C[x.c].booth.open):st===3?(open.filter(y=>y.id!==x.c).length>0&&open.filter(y=>y.id!==x.c).every(y=>x.stamps&&x.stamps[y.id])):!!(x.quiz&&x.quiz.done);
  $('#cnt').textContent=`${S.length}명 · 이 단계 끝 ${S.filter(doneIn).length}명`;
  $('#ppl').innerHTML=S.map(x=>`<span class="${doneIn(x)?'ok':''}">${(NN[x.c]||{}).e||''} ${x.n} ${esc(x.name)}</span>`).join('')||'<span class="muted" style="background:none">아직 아무도 없어요</span>';
  if(st===1)return tv1(main,S);
  if(st===2)return tv2(main,S);
  if(st===3)return tv3(main,S);
  return tv4(main,S);
}
function tv1(main,S){
  const done=S.filter(x=>x.s1&&x.s1.done), sorted=S.filter(x=>x.s1&&x.s1.sorted);
  const wrong={};S.forEach(x=>Object.entries((x.s1&&x.s1.wrong)||{}).forEach(([k,v])=>wrong[k]=(wrong[k]||0)+v));
  const chip=x=>`<span class="${wrong[x.id]?'hard':''}">${x.e} ${esc(x.n)}${wrong[x.id]?` · 헷갈림 ${wrong[x.id]}`:''}</span>`;
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">우리나라의 주요 수입품과 수출품 (교과서 100쪽)</h2><span class="muted">나누기 끝 ${sorted.length}/${S.length}명</span></div>
    <div class="board"><div class="inb"><h3>🛬 주요 수입품</h3><div class="chipz">${SORT.filter(x=>x.a==='in').map(chip).join('')}</div></div>
     <div class="outb"><h3>🛫 주요 수출품</h3><div class="chipz">${SORT.filter(x=>x.a==='out').map(chip).join('')}</div></div></div>
    <p class="muted" style="margin:0">빨간 칸은 우리 반이 헷갈린 것이에요. (한국 무역 협회, 2024)</p>
    ${flowHTML()}</div>
   <div class="panel grid"><div class="row" style="justify-content:space-between"><h2>우리 반이 쓴 우리나라 무역의 특징</h2><span class="muted">${done.length}/${S.length}명</span></div><div class="list">${done.map(x=>`<div><b>${x.n} ${esc(x.name)}</b>${esc(FEAT_START+x.s1.feat)}</div>`).join('')||'<p class="muted">아직 보낸 친구가 없어요</p>'}</div></div>
   <div class="rules"><b>핵심 질문</b><ul><li>우리나라가 원유, 천연가스, 석탄 등을 주로 수입하는 까닭은 무엇일까요?</li><li>우리나라가 반도체, 자동차, 무선 통신 기기 등을 주로 수출하는 까닭은 무엇일까요?</li></ul></div>`;
}
function tv2(main,S){
  const C=RD.c||{}, open=tvOpen(), act=new Set(S.map(x=>x.c));
  const prog=x=>{const m=S.filter(s=>s.c===x.id);return `${x.e} ${x.n} <small>(${m.map(s=>s.n+'번').join(', ')}) 대표 수출품 ${m.filter(s=>s.s2&&s.s2.p).length}/${m.length} · 까닭 ${m.filter(s=>s.s2&&s.s2.k).length}/${m.length}</small>`;};
  const waiting=NATIONS.filter(x=>act.has(x.id)&&!open.includes(x));
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">나라별 홍보관 만들기 (교과서 103~104쪽)</h2><span class="muted">열린 홍보관 ${open.length}/${act.size}</span></div>
    ${mapSVG({on:new Set(open.map(x=>x.id)),act})}
    ${waiting.length?`<div class="people">${waiting.map(x=>`<span>🛠 ${prog(x)}</span>`).join('')}</div>`:''}</div>
   <div class="cols">${Object.entries(KINDS).map(([k,v])=>`<div class="${k}"><h3>${v.e} ${v.n}</h3><small class="muted">${v.d}</small>${open.filter(x=>x.kind===k).map(x=>boothHTML(x,C[x.id].booth,{small:1,facts:0})).join('')||'<p class="muted" style="margin:0">아직 없어요</p>'}</div>`).join('')}</div>
   <div class="rules"><b>핵심 질문</b><ul><li>무역에 있어 우리나라와 조건이 다른 나라들은 어떤 특징을 갖고 있나요?</li><li>싱가포르에 큰 항구가 발달할 수 있었던 까닭은 무엇일까요?</li></ul></div>`;
}
function tv3(main,S){
  const C=RD.c||{}, open=tvOpen(), act=new Set(S.map(x=>x.c));
  const agg={},counts={};
  open.forEach(x=>Object.values((C[x.id]&&C[x.id].visits)||{}).forEach(v=>{if(!NN[v.from]||v.from===x.id)return;const k=v.from+'>'+x.id;agg[k]=(agg[k]||0)+1;counts[x.id]=(counts[x.id]||0)+1;}));
  const lines=Object.entries(agg).map(([k,n])=>{const [from,to]=k.split('>');return {from,to,n};});
  const L=Object.values(RD.log||{}).sort((a,b)=>b.at-a.at).slice(0,7);
  const rankB=open.slice().sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">세계 무역 박람회</h2><span class="muted">구매 약속 ${lines.reduce((s,l)=>s+l.n,0)}번</span></div>
    ${mapSVG({on:new Set(open.map(x=>x.id)),act,lines,counts})}</div>
   <div class="two"><div class="panel grid"><h2>인기 홍보관</h2><div class="list">${rankB.map((x,k)=>`<div><b>${k+1}</b>${x.e} ${x.n} · ${kindBadge(x.kind)} · 손님 ${counts[x.id]||0}명</div>`).join('')||'<p class="muted">열린 홍보관이 없어요</p>'}</div>
     <h2>도장 모으기</h2><div class="people">${S.map(x=>{const n=open.filter(y=>y.id!==x.c&&x.stamps&&x.stamps[y.id]).length,t=open.filter(y=>y.id!==x.c).length;return `<span class="${t&&n===t?'ok':''}">${x.n} ${esc(x.name)} ${n}/${t}</span>`;}).join('')}</div></div>
    <div class="panel grid"><h2>박람회 소식</h2><div class="list">${L.map(l=>`<div>${esc(l.t)}</div>`).join('')||'<p class="muted">아직 소식이 없어요</p>'}</div></div></div>
   <div class="rules"><b>정리해요</b><ul><li>${kindBadge('nature')} 농산물이나 풍부한 자원을 수출해요.</li><li>${kindBadge('tech')} 뛰어난 기술로 개발한 제품이나 문화 상품을 수출해요.</li><li>${kindBadge('geo')} 지리적 이점을 활용하여 무역을 해요.</li></ul></div>`;
}
function tv4(main,S){
  const L=ranking(RD.students);
  const wrong={};S.forEach(x=>Object.entries((x.quiz&&x.quiz.wrong)||{}).forEach(([k,v])=>wrong[k]=(wrong[k]||0)+v));
  const hard=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>({q:QQ[k],v})).filter(x=>x.q);
  const top=Math.max(1,...L.map(x=>x.quiz.score||0));
  if(RD.award){
    const p=[L[1],L[0],L[2]];
    main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:2rem">정리 퀴즈 시상식</h2><button class="ghost" id="awoff">순위표로</button></div>
     <div class="podium">${p.map((x,k)=>x?`<div class="p${[2,1,3][k]} pop"><b>${[2,1,3][k]}등</b><span>${esc(x.n)} ${esc(x.name)}</span>${x.quiz.score||0}점</div>`:'<span></span>').join('')}</div></div>
     ${hard.length?`<div class="panel grid"><h2>우리 반이 가장 많이 틀린 문제</h2><div class="list">${hard.map(h=>`<div><b>${h.q.e}</b>${esc(h.q.q)}<br>정답: <b>${esc(h.q.a)}</b> <span class="muted">(틀린 횟수 ${h.v})</span></div>`).join('')}</div></div>`:''}`;
    $('#awoff').onclick=()=>roomRef(ROOM).child('award').set(false);
    return;
  }
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">정리 퀴즈 대결</h2><button id="awon">시상식 ▶</button></div>
   <p class="muted" style="margin:0">한 번에 맞히면 100점 + 빠르기 보너스 최대 50점. 틀리면 다시 골라야 넘어가요. ${QUIZ.length}문제.</p>
   <div class="rank">${L.map((x,k)=>`<div class="r"><b>${k+1}</b><span class="nm">${(NN[x.c]||{}).e||''} ${esc(x.n)} ${esc(x.name)}${x.quiz.done?' 🏁':''}</span><div class="bar trk"><div class="track"><div style="width:${(x.quiz.score||0)/top*100}%"></div></div></div><span class="pt">${x.quiz.score||0}</span></div>`).join('')||'<p class="muted">아직 시작한 친구가 없어요</p>'}</div></div>
   <div class="rules"><b>약속</b><ul><li>친구 화면은 보지 않아요.</li><li>다 푼 친구는 조용히 기다려요.</li></ul></div>`;
  $('#awon').onclick=()=>roomRef(ROOM).child('award').set(true);
}

/* ---------- route ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
