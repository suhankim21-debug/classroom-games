<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말글 탐정단</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* Layout: classroom notice board — cream cards pinned on khaki, coral label bands like the lesson slides. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --gold:#E9B04F;
  --say:#3D6E8C; --write:#B5652F; --both:#7A5BA6;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input,textarea{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:3.2em}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:10px;padding:0 .35em}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 80px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo>div{border-radius:16px;padding:14px;color:#fff;font-family:var(--display);font-size:1.25rem;display:grid;gap:4px}
.duo .s{background:var(--say)} .duo .w{background:var(--write)}
.duo small{font-family:var(--text);font-size:.95rem;opacity:.95}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}

/* steps */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .3em;font-size:.98rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}

/* 1. 매체 탐정 */
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.medium{display:grid;justify-items:center;gap:6px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 26px;min-width:min(420px,100%)}
.medium .em{font-size:4.2rem;line-height:1.1}
.medium b{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,5vw,2.3rem);color:var(--ink);line-height:1.2}
.medium small{color:var(--muted);font-size:1rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:3px solid var(--line);font-size:1.25rem;padding:.8em .3em;line-height:1.25}
.opts button small{display:block;font-family:var(--text);font-size:.9rem;color:var(--muted)}
.opts button[data-k="w"]{border-color:var(--write)} .opts button[data-k="s"]{border-color:var(--say)} .opts button[data-k="b"]{border-color:var(--both)}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{background:var(--cream);color:var(--ink);border:2px solid var(--line);padding:.45em .85em;font-family:var(--display);font-size:1.05rem;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}

/* 2·3. 전달 게임 */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.teams button{background:#fff;color:var(--ink);border:3px solid var(--line);display:grid;gap:4px;text-align:left;padding:12px 14px}
.teams button b{font-size:1.4rem;font-weight:400}
.teams button span{font-family:var(--text);font-size:.95rem;color:var(--muted)}
.teams button[aria-pressed="true"]{border-color:var(--coral);background:#FFF1EA}
.role{display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px 16px;color:#fff;font-family:var(--display);font-size:1.3rem}
.role .ic{font-size:2.2rem;line-height:1}
.role.say{background:var(--say)} .role.write{background:var(--write)} .role.draw{background:var(--ok)}
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px;background:var(--cream);border:3px solid var(--line);border-radius:16px;padding:8px;width:100%;max-width:420px;aspect-ratio:1;margin:0 auto}
.board .c{background:#fff;border-radius:10px;display:grid;place-items:center;padding:0;border:2px solid transparent;min-width:0;min-height:0}
.board .c svg{width:78%;height:78%}
.board.pick .c:hover{border-color:var(--coral)}
.board .c.hit{border-color:var(--ok);background:#E3F1E7}
.board .c.miss{border-color:var(--bad);background:#F9E6E0}
.board.mini{max-width:150px;gap:3px;padding:4px;border-width:2px;border-radius:10px}
.board.mini .c{border-radius:5px;border-width:1px}
.pal{display:grid;gap:8px}
.pal .row button{background:#fff;color:var(--ink);border:3px solid var(--line);padding:.35em;width:3.2em;height:3.2em;display:grid;place-items:center}
.pal .row button svg{width:100%;height:100%}
.pal .row button[aria-pressed="true"]{border-color:var(--ink);background:var(--cream)}
.pal .row button.col{border-radius:50%;width:2.8em;height:2.8em}
.pal .row button.col[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.chat{display:grid;gap:6px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;max-height:300px;overflow:auto;min-height:120px;align-content:start}
.chat div{background:var(--cream);border-radius:14px 14px 14px 4px;padding:6px 12px;justify-self:start;max-width:92%;font-size:1.1rem}
.chat div.me{background:var(--write);color:#fff;border-radius:14px 14px 4px 14px;justify-self:end}
.chat div small{display:block;font-size:.8rem;opacity:.8}
.big{font-family:var(--display);font-size:clamp(2rem,6vw,3rem);line-height:1.1}
.lock{display:grid;place-items:center;text-align:center;gap:10px;padding:26px}
.count{font-family:var(--display);font-size:clamp(2.6rem,8vw,4rem);color:var(--coral2);font-variant-numeric:tabular-nums;line-height:1}
.result{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}
.result figure{margin:0;display:grid;gap:4px;justify-items:center;font-family:var(--display)}
.stat{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:.25em .8em;font-family:var(--display);font-size:1.15rem}

/* 4. 비교 */
.sort{display:grid;gap:10px}
.sort .it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:10px}
.sort .it b{font-family:var(--display);font-weight:400;font-size:1.2rem}
.seg{display:flex;gap:6px}
.seg button{background:#fff;color:var(--ink);border:3px solid var(--line);padding:.45em .8em;font-size:1rem}
.seg button[data-v="s"][aria-pressed="true"]{background:var(--say);border-color:var(--say);color:#fff}
.seg button[data-v="w"][aria-pressed="true"]{background:var(--write);border-color:var(--write);color:#fff}
.seg button.wrong{border-color:var(--bad)!important;background:#F6E1DB!important;color:var(--bad)!important}
.cmp{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:1.15rem}
.cmp th{font-family:var(--display);font-weight:400;text-align:center;padding:4px 8px;color:var(--muted)}
.cmp td{background:#fff;padding:8px 10px;text-align:center;font-family:var(--display);font-variant-numeric:tabular-nums}
.cmp td:first-child{border-radius:12px 0 0 12px;text-align:left} .cmp td:last-child{border-radius:0 12px 12px 0}
.cmp th.s,.cmp td.s{color:var(--say)} .cmp th.w,.cmp td.w{color:var(--write)}
.cmp tr.avg td{background:var(--cream)}

/* 5. 단원 지도 */
.map{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.map>div{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.map h3{font-size:1.2rem;color:var(--coral2)}
.map ul{margin:0;padding-left:1.1em;font-size:1rem}

/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(9em,15em) 1fr;gap:10px;align-items:center}
.bar h3{font-size:1.15rem}
.bar .track{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--cream)}
.bar .track div{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-size:1.05rem;min-width:0}
.bar.hard h3{color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.tteams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tteam{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;align-content:start}
.tteam.fin{border-color:var(--ok)}
.tteam h3{font-size:1.4rem;display:flex;justify-content:space-between;align-items:center}
.tteam .mem{font-size:1rem;display:grid;gap:2px}
.tag{display:inline-block;font-family:var(--display);font-size:.9rem;border-radius:999px;padding:0 .7em;background:var(--cream);color:var(--body)}
.tag.ok{background:var(--ok);color:#fff}
.say-t{color:var(--say)} .write-t{color:var(--write)}
.wall{display:grid;gap:8px}
.wall div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:10px 14px;font-size:1.15rem}
.wall b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
.tally{display:flex;gap:10px;flex-wrap:wrap}
.tally span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:.2em .8em;font-family:var(--display);font-size:1.1rem}
.tally b{font-weight:400;color:var(--coral2);margin-left:.3em}
@media (max-width:820px){
  .hero,.tv,.play,.map,.duo{grid-template-columns:1fr}
  .choose{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .sort .it{grid-template-columns:1fr}
  .steps button{font-size:.8rem}
  .bar{grid-template-columns:1fr}
}
</style></head><body>

// 5단계
const READ=['어린이 신문','인터넷 뉴스','과학 잡지','학교 신문','아직 없어요'];
const WANT=['자막이 있으면 왜 이해가 잘될까?','말할 때와 글 쓸 때 무엇이 다를까?','기사문은 어떻게 쓸까?','읽는 사람을 생각하며 쓰려면?','영상 속 말과 글은 어떤 효과가 있을까?'];

const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sec=ms=>ms==null?'-':Math.round(ms/1000)+'초';

function shapeSVG(k,c){

    st:'<polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38"/>',

}
const pname=v=>{if(!v)return '';const [s,c]=v.split('-');return `${CO[c].t} ${SH[s]}`;};
function boardHTML(cells,o={}){
  cells=cells||{};
  return `<div class="board ${o.cls||''}" ${o.attr||''}>${Array.from({length:CELLS},(_,i)=>{const v=cells[i];
    const st=o.target?(o.target[i]?(v===o.target[i]?'hit':'miss'):(v?'miss':'')):'';
    return `<button type="button" class="c ${st}" data-i="${i}" ${o.pick?'':'tabindex="-1"'} aria-label="${Math.floor(i/4)+1}째 줄 ${i%4+1}째 칸${v?' '+pname(v):' 빈칸'}">${v?(()=>{const [s,c]=v.split('-');return shapeSVG(s,c);})():''}</button>`;}).join('')}</div>`;
}
// 방·조·라운드가 같으면 짝 둘의 화면에 같은 그림이 나와요
function seedRand(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function targetOf(room,team,round){
  const r=seedRand(`${room}-${team}-${round}`);
  const cells=Array.from({length:CELLS},(_,i)=>i);const kinds=[];Object.keys(SH).forEach(s=>Object.keys(CO).forEach(c=>kinds.push(s+'-'+c)));
  const pick=a=>a.splice(Math.floor(r()*a.length),1)[0];
  const t={};for(let k=0;k<PIECES;k++)t[pick(cells)]=pick(kinds);
  return t;
}
const scoreOf=(t,cells)=>Object.keys(t).filter(i=>(cells||{})[i]===t[i]).length;

function withTimeout(pr,ms=10000){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),ms))]);}
function showError(e){
  const m=String(e&&(e.code||e.message)||e);
  let why='알 수 없는 오류가 났어요.';
  if(/permission/i.test(m)) why='Firebase 데이터베이스의 <b>규칙</b>이 막고 있어요. Realtime Database → 규칙 탭을 확인해 주세요.';
  else if(/TIMEOUT/.test(m)) why='Firebase 서버에 10초 동안 연결되지 않았어요. 학교 인터넷이 Firebase를 막고 있을 수 있어요.';
  $('#sub').textContent='연결 문제';
  app.innerHTML=`<div class="panel grid"><h2 style="color:var(--bad)">서버에 연결하지 못했어요</h2><p>${why}</p><p class="muted">오류 내용: <code>${esc(m)}</code></p><div class="row"><button id="retry">다시 시도</button><button class="ghost" id="home">처음으로</button></div></div>`;
  $('#retry').onclick=()=>location.reload(); $('#home').onclick=()=>{location.hash='';startView();};
}
window.addEventListener('unhandledrejection',ev=>showError(ev.reason));
firebase.initializeApp(FIREBASE_CONFIG);

let skew=0;db.ref('.info/serverTimeOffset').on('value',s=>{skew=s.val()||0;});

const params=new URLSearchParams(location.search);

let offs=[];const clearOffs=()=>{offs.forEach(f=>f());offs=[];};
function listen(ref,cb){const h=ref.on('value',cb);offs.push(()=>ref.off('value',h));}
const timeLeft=t=>{t=t||{};return t.endAt?Math.max(0,Math.round((t.endAt-now())/1000)):(t.left??0);};
const running=t=>!!(t&&t.endAt&&t.endAt>now());

/* ---------- student: join ---------- */
let me=null, RV={stage:0,timer:{},teams:{}}, ME={}, cur=1;
function parseName(s){const m=String(s).trim().match(/^(\d{1,2})\s*[번.]?\s*(.+)$/);return m?{num:+m[1],name:m[2].trim()}:null;}

  app.innerHTML=`<div class="grid" style="max-width:560px;margin:0 auto">
   <div class="panel grid"><h2>방 번호</h2><input id="rm" inputmode="numeric" maxlength="4" placeholder="TV에 보이는 4자리" value="${esc(ROOM)}"></div>

        if(!(c&&c.name===p.name)){$('#jm').textContent=`${p.num}번은 이미 "${c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}}

let onMe=null,onTeams=null,onTimer=null,stick=null;
function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app});ClassWatch.who(me.num,me.name);
  $('#sub').textContent=`${me.num}번 ${me.name}`;
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  let ready=false;RV={stage:0,timer:{},teams:{}};onMe=onTeams=onTimer=null;
  const R=roomRef(me.room);
  listen(R.child('students/'+me.num),s=>{
    const v=s.val();
    if(!v){store('mg-student',null);me=null;clearOffs();return joinView();}

  });
  listen(R.child('stage'),s=>{

    if(was!==st){cur=st;renderStage();} else drawSteps();
  });
  listen(R.child('timer'),s=>{RV.timer=s.val()||{};if(typeof onTimer==='function')onTimer();});
  listen(R.child('teams'),s=>{RV.teams=s.val()||{};if(typeof onTeams==='function')onTeams();});
  clearInterval(stick);stick=setInterval(()=>{if(typeof onTimer==='function')onTimer(true);},500);
}
function stepDone(n){
  if(n===1)return !!(ME.s1&&ME.s1.done&&ME.s1.fav);
  if(n===2||n===3){const t=RV.teams[ME.team];return !!(t&&t['r'+n]&&t['r'+n].done);}
  if(n===4)return !!(ME.s4&&ME.s4.done);
  return !!(ME.s5&&ME.s5.done);
}
function drawSteps(){
  const el=$('#steps');if(!el)return;
  el.innerHTML=Array.from({length:NS},(_,i)=>i+1).map(n=>`<button data-s="${n}" ${n>RV.stage?'disabled':''} ${n===cur?'aria-current="step"':''} class="${stepDone(n)?'done':''}"><b>${n}</b>${STAGES[n].k}${stepDone(n)?' ✓':''}</button>`).join('');
  $$('#steps button').forEach(b=>b.onclick=()=>{cur=+b.dataset.s;renderStage();});
}
function shell(inner){
  app.innerHTML=`<div class="grid"><nav class="steps" id="steps" aria-label="활동 단계"></nav>${inner}<div style="text-align:right"><button class="ghost" id="relog" style="font-size:.85rem;padding:.4em .8em">다른 이름으로 들어가기</button></div></div>`;
  $('#relog').onclick=()=>{store('mg-student',null);me=null;clearOffs();joinView();};
  drawSteps();
}
const wstep=sub=>ClassWatch.step(STAGES[cur].k+(sub?' · '+sub:''),{n:cur,total:NS,wait:stepDone(cur)});
function renderStage(){
  onMe=()=>drawSteps();onTeams=null;onTimer=null;ClassWatch.detail(null);
  wstep();
  if(cur===1)return stage1();
  if(cur===2||cur===3)return stageRound(cur);
  if(cur===4)return stage4();
  return stage5();
}
const meRef=()=>roomRef(me.room).child('students/'+me.num);

/* ---------- 1. 매체 탐정 ---------- */
function stage1(){
  const S1=ME.s1||{};
  if(S1.done)return S1.fav?s1Done():s1Fav();
  const ans={...(S1.ans||{})};
  const left=shuffle(MEDIA.filter(m=>!ans[m.id]));
  let i=0,missed=false;
  shell(`<div class="panel quiz" id="qz"></div>`);
  const draw=()=>{
    const m=left[i];missed=false;
    const doneN=MEDIA.length-left.length+i;
    wstep(`${doneN+1}/${MEDIA.length}`);ClassWatch.detail(()=>({q:'매체: '+m.t}));
    $('#qz').innerHTML=`<div><span class="band">1단계 · 매체 탐정</span></div><h2>이 매체는 무엇으로 전할까요?</h2>
     <div class="prog">${MEDIA.map((_,k)=>`<span class="${k<doneN?'on':k===doneN?'cur':''}"></span>`).join('')}</div>
     <div class="medium pop"><div class="em" aria-hidden="true">${m.e}</div><b>${esc(m.t)}</b>${m.s?`<small>${esc(m.s)}</small>`:''}</div>
     <div class="opts">${['w','s','b'].map(k=>`<button data-k="${k}">${k==='w'?'✍️':k==='s'?'🗣️':'✍️🗣️'} ${KIND[k].t}<small>${KIND[k].l}</small></button>`).join('')}</div>
     <div class="msg" id="qm" role="status"></div>`;
    $$('.opts button').forEach(b=>b.onclick=async()=>{
      const k=b.dataset.k;
      if(!missed&&!ans[m.id]){ans[m.id]=k;meRef().child('s1/ans/'+m.id).set(k);}
      if(k===m.a){
        b.classList.add('right');$$('.opts button').forEach(x=>x.disabled=true);
        $('#qm').className='msg ok';$('#qm').textContent='맞았어요! '+m.why;
        await new Promise(r=>setTimeout(r,1300));
        i++;
        if(i<left.length)return draw();
        await meRef().child('s1/done').set(Date.now());
        ME.s1={...(ME.s1||{}),ans,done:Date.now()};drawSteps();s1Fav();
      }else{
        missed=true;b.classList.add('wrong');b.disabled=true;
        const q=$('#qz');q.classList.remove('shake');void q.offsetWidth;q.classList.add('shake');
        $('#qm').className='msg bad';$('#qm').textContent='다시 생각해 봐요. 눈으로 읽나요, 귀로 듣나요?';
      }
    });
  };
  if(!left.length){meRef().child('s1/done').set(Date.now());return s1Fav();}
  draw();
}
function s1Fav(){
  wstep('즐겨 보는 매체');ClassWatch.detail(()=>({q:'즐겨 보는 매체 고르기'}));
  let fav=(ME.s1||{}).fav||'';
  shell(`<div class="panel grid pop"><div><span class="band">1단계 · 하나 더</span></div><h2>내가 가장 즐겨 보는 매체는?</h2>
    <div class="chips" id="fv">${FAV.map(f=>`<button data-f="${esc(f)}" aria-pressed="${fav===f}">${esc(f)}</button>`).join('')}</div>
    <p class="muted">그 매체는 글로 전하나요, 말로 전하나요? 둘 다인가요? 짝과 이야기해 봐요.</p>
    <div class="msg" id="fm" role="status"></div><div class="row"><button id="fsave">골랐어요</button></div></div>`);
  $$('#fv button').forEach(b=>b.onclick=()=>{fav=b.dataset.f;$$('#fv button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('#fsave').onclick=async()=>{
    if(!fav){$('#fm').className='msg bad';$('#fm').textContent='하나를 골라요.';return;}
    await meRef().child('s1/fav').set(fav);ME.s1={...(ME.s1||{}),fav};drawSteps();s1Done();
  };
}
function s1Done(){
  wstep('끝');ClassWatch.detail(null);
  const ans=(ME.s1||{}).ans||{};const first=MEDIA.filter(m=>ans[m.id]===m.a).length;
  shell(`<div class="panel quiz pop"><div><span class="band">매체 탐정 성공</span></div><h2 style="font-size:2rem">${MEDIA.length}개 중 ${first}개를 한 번에 맞혔어요!</h2>
    <div class="rules" style="text-align:left;width:100%"><b>생각해 봐요</b><ul><li>자막이 나오는 영상은 왜 내용을 알기 쉬울까요?</li><li>글로도, 말로도 전하는 매체를 더 찾아볼까요?</li></ul></div>
    <p class="muted">TV에서 우리 반 결과를 함께 봐요. 선생님이 2단계를 열면 짝과 게임을 해요.</p></div>`);
}

/* ---------- 2·3. 말로 전해요 / 글로 전해요 ---------- */
const teamMembers=t=>{const m=((RV.teams[t]||{}).members)||{};return Object.keys(m).map(Number).sort((a,b)=>m[a]-m[b]||a-b);};
// 2단계는 먼저 들어온 친구가, 3단계는 다음 친구가 설명해요
const explainerOf=(t,round)=>{const m=teamMembers(t);return m.length<2?null:m[(round-2)%m.length];};
function stageRound(round){
  if(!ME.team)return teamPick(round);
  playRound(round);
}
function teamPick(round){
  wstep('조 고르기');ClassWatch.detail(()=>({q:'짝과 같은 조 고르기'}));
  shell(`<div class="panel grid"><div><span class="band">${round}단계</span></div><h2>짝과 같은 조를 골라요</h2>
    <p class="muted">짝과 둘이 같은 조 번호를 눌러요. 한 조에 ${MAXTEAM}명까지 들어갈 수 있어요.</p>
    <div class="teams" id="tp"></div><div class="msg bad" id="tm" role="status"></div></div>`);
  const draw=()=>{
    const el=$('#tp');if(!el)return;
    el.innerHTML=Array.from({length:NTEAM},(_,i)=>i+1).map(t=>{const m=teamMembers(t);
      return `<button data-t="${t}" ${m.length>=MAXTEAM?'disabled':''}><b>${t}조</b><span>${m.length?m.map(n=>n+'번').join(', '):'비어 있어요'}</span></button>`;}).join('');
    $$('#tp button').forEach(b=>b.onclick=()=>joinTeam(+b.dataset.t,round));
  };
  onTeams=draw;draw();
}
async function joinTeam(t,round){
  const ref=roomRef(me.room).child('teams/'+t+'/members');
  const r=await ref.transaction(m=>{m=m||{};if(m[me.num])return m;if(Object.keys(m).length>=MAXTEAM)return;m[me.num]=Date.now();return m;});
  if(!r.committed){$('#tm').textContent='그 조는 꽉 찼어요. 다른 조를 골라요.';return;}
  await meRef().child('team').set(t);ME.team=t;
  playRound(round);
}
function playRound(round){
  const t=ME.team, key='r'+round, tref=roomRef(me.room).child('teams/'+t+'/'+key);
  const target=targetOf(me.room,t,round);
  const say=round===2;
  let sel={s:'o',c:'r'}, cells=null, sending=false, pending=0;
  let lastMode='',lastHead='';
  const draw=()=>{
    const T=RV.teams[t]||{}, R=T[key]||{}, mem=teamMembers(t), ex=explainerOf(t,round);
    const isEx=ex===me.num, tm=RV.timer||{}, live=running(tm)&&RV.stage===round;
    const ended=!!R.done, waitingPair=mem.length<2, left=timeLeft(tm);
    const mode=waitingPair?'pair':ended?'end':!live?'wait'+(tm.startAt?'p':''):isEx?'ex':'draw';
    if(cells===null||ended||(mode!==lastMode&&!pending))cells={...(R.cells||{})};
    // 시간이 끝났는데 아직 안 냈으면 지금 판으로 내요 (놓는 사람만)
    if(!ended&&!isEx&&!waitingPair&&tm.endAt&&left===0&&RV.stage===round)submit(true);
    const headKey=mem.join(',')+'|'+ex;
    if(headKey!==lastHead){lastHead=headKey;
      $('#rhead').innerHTML=`<div class="row" style="justify-content:space-between"><span class="band">${round}단계 · ${say?'🗣️ 말로 전해요':'✍️ 글로 전해요'}</span><span class="tag">${t}조 · ${mem.map(n=>n+'번').join(', ')}</span></div>
      ${waitingPair?'':`<div class="role ${isEx?(say?'say':'write'):'draw'}"><span class="ic" aria-hidden="true">${isEx?(say?'🗣️':'✍️'):'🧩'}</span><div>${isEx?(say?'나는 <b>말로 설명</b>하는 사람':'나는 <b>글로 설명</b>하는 사람'):'나는 <b>판에 놓는</b> 사람'}<div style="font-family:var(--text);font-size:1rem">${isEx?(say?'등을 맞대고 앉아, 그림을 말로만 설명해요. 화면은 보여 주지 않아요.':'입을 꼭 닫고, 메시지로만 설명해요. 말하면 안 돼요!'):(say?'짝의 말을 듣고 같은 자리에 같은 조각을 놓아요. 짝에게 질문해도 돼요.':'짝이 보낸 메시지를 읽고 조각을 놓아요. 질문도 메시지로만!')}</div></div></div>`}`;}
    if(mode===lastMode){
      const cd=$('#cd');if(cd)cd.textContent=left;
      const pc=$('#pc');if(pc)pc.textContent=Object.keys(R.cells||{}).length;
      // 셋이 한 조일 때 다른 친구가 놓은 조각도 내 판에 보여요
      if(mode==='draw'&&R.cells&&JSON.stringify(R.cells)!==JSON.stringify(cells)&&!pending){cells={...R.cells};updBoard();}
      return;
    }
    lastMode=mode;
    wstep(ended?'결과':waitingPair?'짝 기다리기':!live?'시작 기다리기':isEx?(say?'말로 설명하기':'글로 설명하기'):'판에 놓기');
    ClassWatch.detail(()=>({q:`${t}조 · ${waitingPair?'짝 기다리기':isEx?'설명하는 사람':'놓는 사람'}`}));
    let body='';
    if(waitingPair){

  const updBoard=()=>{const b=$('#bd');if(!b)return;b.outerHTML=boardHTML(cells,{cls:'pick',pick:true,attr:'id="bd"'});bindBoard();};

    const i=+c.dataset.i;

  });};
  const bind=()=>{
    if($('#leave'))$('#leave').onclick=async()=>{await roomRef(me.room).child(`teams/${t}/members/${me.num}`).remove();await meRef().child('team').remove();ME.team=null;teamPick(round);};

    }

  async function submit(auto){
    if(sending)return;sending=true;
    const tm=RV.timer||{};
    const used=Math.max(0,Math.min((tm.min||3)*60000,now()-(tm.startAt||now())));

  let chatOff=null;

    $('#csend').onclick=send;$('#cin').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send();}};

    chatOff=()=>cref.off('value',h);offs.push(()=>{if(chatOff)chatOff();});
  }
  shell(`<div class="panel grid" id="rhead"></div><div id="rbox" class="grid"></div>`);
  onTeams=draw;onTimer=draw;
  draw();
}

}

function setStage(n){roomRef(ROOM).update({stage:n,timer:{min:STAGES[n].tm,left:STAGES[n].tm*60,endAt:0}});}
function renderTime(){
  const el=$('#tm');if(!el)return clearInterval(tick);
  const t=RD.timer||{min:5,left:300,endAt:0};
  const left=timeLeft(t);
  el.textContent=left===0&&t.endAt?'시간 끝!':`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  el.classList.toggle('end',!!t.endAt&&left===0);
  $('#go').textContent=t.endAt&&left>0?'멈춤':'시작';$('#minus').disabled=$('#plus').disabled=!!t.endAt&&left>0;
}
const students=()=>{const s=RD.students||{};return Object.keys(s).map(Number).sort((a,b)=>a-b).map(n=>({n,...s[n]}));};
const tMembers=t=>{const m=((RD.teams||{})[t]||{}).members||{};return Object.keys(m).map(Number).sort((a,b)=>m[a]-m[b]||a-b);};
function renderTV(){
  const main=$('#main');if(!main)return;
  const st=RD.stage||1, S=students();
  $('#tsteps').innerHTML=Array.from({length:NS},(_,i)=>i+1).map(n=>`<button data-s="${n}" ${n===st?'aria-current="step"':''}><b>${n}</b> ${STAGES[n].t}</button>`).join('');
  $$('#tsteps button').forEach(b=>b.onclick=()=>setStage(+b.dataset.s));
  const teamDone=(x,r)=>{const T=(RD.teams||{})[x.team];return !!(T&&T['r'+r]&&T['r'+r].done);};
  const doneIn=x=>st===1?!!(x.s1&&x.s1.done&&x.s1.fav):st===2||st===3?teamDone(x,st):st===4?!!(x.s4&&x.s4.done):!!(x.s5&&x.s5.done);
  $('#cnt').textContent=`${S.length}명 · 이 단계 끝 ${S.filter(doneIn).length}명`;
  $('#ppl').innerHTML=S.map(x=>`<span class="${doneIn(x)?'ok':''}">${x.n} ${esc(x.name)}</span>`).join('')||'<span class="muted" style="background:none">아직 아무도 없어요</span>';
  if(st===1)return tv1(main,S);
  if(st===2||st===3)return tvRound(main,S,st);
  if(st===4)return tv4(main,S);
  return tv5(main,S);
}
function tv1(main,S){
  const done=S.filter(x=>x.s1&&x.s1.ans);
  const rows=MEDIA.map(m=>{const c={w:0,s:0,b:0};done.forEach(x=>{const a=x.s1.ans[m.id];if(a)c[a]++;});const tot=c.w+c.s+c.b;const wrong=tot-c[m.a];return {m,c,tot,wrong};});
  const hard=rows.filter(r=>r.tot&&r.wrong/r.tot>=.3).sort((a,b)=>b.wrong-a.wrong);
  const fav={};S.forEach(x=>{const f=x.s1&&x.s1.fav;if(f)fav[f]=(fav[f]||0)+1;});
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">매체 탐정: 글일까, 말일까?</h2><span class="muted">처음 고른 답 · ${done.length}명</span></div>
    <div class="legend">${['w','s','b'].map(k=>`<span><i style="background:${KIND[k].hex}"></i>${KIND[k].t} (${KIND[k].l})</span>`).join('')}</div>
    <div class="bars">${rows.map(r=>`<div class="bar ${hard.includes(r)?'hard':''}"><h3>${r.m.e} ${esc(r.m.t)}</h3><div class="track">${['w','s','b'].map(k=>r.c[k]?`<div style="width:${r.c[k]/r.tot*100}%;background:${KIND[k].hex}">${r.c[k]}${k===r.m.a?' ✓':''}</div>`:'').join('')}</div></div>`).join('')}</div></div>
   ${hard.length?`<div class="rules"><b>헷갈린 매체</b><ul>${hard.slice(0,3).map(r=>`<li>${r.m.e} ${esc(r.m.t)} → 정답 <b>${KIND[r.m.a].t}</b>: ${esc(r.m.why)}</li>`).join('')}</ul></div>`:''}
   <div class="panel grid"><h2>우리 반이 즐겨 보는 매체</h2><div class="tally">${Object.entries(fav).sort((a,b)=>b[1]-a[1]).map(([f,c])=>`<span>${esc(f)}<b>${c}</b></span>`).join('')||'<span class="muted" style="border:0;background:none">아직 없어요</span>'}</div></div>
   <div class="rules"><b>함께 이야기해요</b><ul><li>자막이 나오는 영상은 왜 내용을 알기 쉬울까요? (교과서 220쪽)</li><li>내가 즐겨 보는 매체는 글과 말을 어떻게 쓰나요?</li></ul></div>`;
}
function tvRound(main,S,round){
  const say=round===2, key='r'+round, teams=RD.teams||{};
  const tm=RD.timer||{}, live=running(tm);
  const list=Object.keys(teams).map(Number).filter(t=>tMembers(t).length).sort((a,b)=>a-b);
  const noTeam=S.filter(x=>!x.team);
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.9rem">${say?'🗣️ 말로 전해요':'✍️ 글로 전해요'}</h2><span class="band">${round}단계</span></div>
    <div class="rules"><b>약속</b><ul>${say?'<li>짝과 <b>등을 맞대고</b> 앉아요.</li><li>설명하는 사람은 화면을 보여 주지 않아요. 말로만!</li><li>놓는 사람은 모르면 바로 물어봐요.</li>':'<li><b>입을 꼭 닫아요.</b> 소리 내어 말하면 안 돼요.</li><li>설명도, 질문도 메시지로만 해요.</li><li>이번에는 역할을 바꾸어요.</li>'}</ul></div>
    ${!list.length?'<p class="muted">학생들이 짝과 같은 조를 고르고 있어요.</p>':''}${noTeam.length?`<p class="muted" style="margin:0">아직 조를 안 고른 친구: ${noTeam.map(x=>x.n+'번').join(', ')}</p>`:''}</div>
   <div class="tteams">${list.map(t=>{const T=teams[t]||{},R=T[key]||{},d=R.done,m=tMembers(t),ex=m.length<2?null:m[(round-2)%m.length];
     const nm=n=>esc(((RD.students||{})[n]||{}).name||'');const chatN=Object.keys(T.chat||{}).length;
     return `<div class="tteam ${d?'fin':''}"><h3><span>${t}조</span>${d?`<span class="tag ok">${d.score}/${PIECES} · ${sec(d.ms)}</span>`:`<span class="tag">${live?'하는 중':'준비'}</span>`}</h3>
      <div class="mem">${m.map(n=>`<span>${n===ex?(say?'🗣️ 설명':'✍️ 설명'):'🧩 놓기'} · ${n}번 ${nm(n)}</span>`).join('')}${m.length<2?'<span class="muted">짝을 기다려요</span>':''}</div>
      ${d?`<div class="row" style="justify-content:center;flex-wrap:nowrap">${boardHTML(targetOf(ROOM,t,round),{cls:'mini'})}<span aria-hidden="true">→</span>${boardHTML(R.cells,{cls:'mini',target:targetOf(ROOM,t,round)})}</div>`:`<div class="muted">놓은 조각 ${Object.keys(R.cells||{}).length}/${PIECES}</div>`}
      ${!say?`<div class="muted">메시지 ${chatN}개</div>`:''}</div>`;}).join('')}</div>`;
}
function roundStats(){
  const teams=RD.teams||{};const rows=[];
  Object.keys(teams).map(Number).sort((a,b)=>a-b).forEach(t=>{const T=teams[t];if(!tMembers(t).length)return;
    rows.push({t,r2:(T.r2||{}).done,r3:(T.r3||{}).done,chat:Object.keys(T.chat||{}).length});});
  const avg=(k,f)=>{const v=rows.map(r=>r[k]).filter(Boolean).map(f);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  return {rows,s2:avg('r2',d=>d.score),s3:avg('r3',d=>d.score),m2:avg('r2',d=>d.ms),m3:avg('r3',d=>d.ms)};
}
function tv4(main,S){
  const st=roundStats();
  const done=S.filter(x=>x.s4&&x.s4.done);
  const ez={s:done.filter(x=>x.s4.easy==='s').length,w:done.filter(x=>x.s4.easy==='w').length};
  const fx=v=>v==null?'-':(Math.round(v*10)/10);
  const hard=FEAT.map(f=>({f,n:S.filter(x=>x.s4&&x.s4.tries&&x.s4.tries[f.id]).length})).filter(o=>o.n).sort((a,b)=>b.n-a.n);
  main.innerHTML=`<div class="panel grid"><h2 style="font-size:1.8rem">말로 전할 때 vs 글로 전할 때</h2>
    <table class="cmp"><thead><tr><th>조</th><th class="s">🗣️ 말: 맞힌 조각</th><th class="s">🗣️ 말: 시간</th><th class="w">✍️ 글: 맞힌 조각</th><th class="w">✍️ 글: 시간</th><th class="w">메시지</th></tr></thead><tbody>
     ${st.rows.map(r=>`<tr><td>${r.t}조</td><td class="s">${r.r2?r.r2.score:'-'}</td><td class="s">${r.r2?sec(r.r2.ms):'-'}</td><td class="w">${r.r3?r.r3.score:'-'}</td><td class="w">${r.r3?sec(r.r3.ms):'-'}</td><td class="w">${r.chat||'-'}</td></tr>`).join('')}
     <tr class="avg"><td>평균</td><td class="s">${fx(st.s2)}</td><td class="s">${st.m2==null?'-':sec(st.m2)}</td><td class="w">${fx(st.s3)}</td><td class="w">${st.m3==null?'-':sec(st.m3)}</td><td class="w"></td></tr></tbody></table>
    ${st.m2!=null&&st.m3!=null?`<p class="big" style="font-size:1.6rem;margin:0;text-align:center">${st.m3>st.m2?`글로 전할 때 평균 <span class="write-t">${Math.round((st.m3-st.m2)/1000)}초</span> 더 걸렸어요.`:`말로 전할 때 평균 <span class="say-t">${Math.round((st.m2-st.m3)/1000)}초</span> 더 걸렸어요.`}</p>`:''}</div>
   <div class="duo"><div class="s">🗣️ 음성 언어 (말)<small>${FEAT.filter(f=>f.a==='s').map(f=>'· '+esc(f.t)).join('<br>')}</small></div><div class="w">✍️ 문자 언어 (글)<small>${FEAT.filter(f=>f.a==='w').map(f=>'· '+esc(f.t)).join('<br>')}</small></div></div>
   ${hard.length?`<div class="rules"><b>헷갈린 특징</b> ${hard.slice(0,3).map(o=>`${esc(o.f.t)} (${o.n}명)`).join(' · ')}</div>`:''}
   <div class="panel grid"><div class="row" style="justify-content:space-between"><h2>더 편했던 쪽</h2><div class="tally"><span>🗣️ 말<b>${ez.s}</b></span><span>✍️ 글<b>${ez.w}</b></span></div></div>
    <div class="wall">${done.filter(x=>x.s4.why).map(x=>`<div><b>${x.s4.easy==='s'?'🗣️':'✍️'} ${x.n}번</b>${esc(x.s4.why)}</div>`).join('')||'<p class="muted">아직 없어요</p>'}</div></div>`;
}
function tv5(main,S){
  const done=S.filter(x=>x.s5&&x.s5.done);
  const rd={};done.forEach(x=>(x.s5.read||[]).forEach(r=>rd[r]=(rd[r]||0)+1));
  main.innerHTML=`<div class="panel grid"><h2 style="font-size:1.8rem">5. 언어와 소통 · 우리 반이 알고 싶은 것</h2>
    <div class="map"><div><h3>1. 언어의 표현 효과 이해하기</h3><ul><li>문자 언어와 음성 언어의 특성</li><li>매체 자료에서 언어의 표현 효과</li><li>영상 감상하기</li></ul></div><div><h3>2. 독자를 고려하며 글 쓰기</h3><ul><li>독자를 고려해 글 쓰는 방법</li><li>기사문 쓰기</li></ul></div><div><h3>실천</h3><ul><li>마음을 전하는 편지 쓰기</li></ul></div></div></div>
   <div class="panel grid"><h2>알고 싶어요 (${done.length}/${S.length}명)</h2><div class="wall">${done.map(x=>`<div><b>${x.n}번 ${esc(x.name)}</b>${esc(x.s5.want)}</div>`).join('')||'<p class="muted">아직 없어요</p>'}</div></div>
   <div class="panel grid"><h2>기사문을 읽어 본 곳</h2><div class="tally">${READ.filter(r=>rd[r]).map(r=>`<span>${esc(r)}<b>${rd[r]}</b></span>`).join('')||'<span class="muted" style="border:0;background:none">아직 없어요</span>'}</div></div>`;
}

/* ---------- route ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
