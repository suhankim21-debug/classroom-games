<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리말 지킴이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>body{margin:0}
/* Layout: classroom notice board — cream cards pinned on khaki, coral label bands like the lesson slides. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
button.dark{background:var(--ink)}
input,textarea{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:3.2em}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:10px;padding:0 .35em}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.bubbles{display:grid;gap:10px}
.bub{background:var(--coral);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 16px;justify-self:end;font-family:var(--display);font-size:1.2rem;max-width:90%}
.bub.l{background:var(--cream);color:var(--ink);border-radius:18px 18px 18px 4px;justify-self:start}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .4em;font-size:1rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}

/* check table */
.chk{display:grid;gap:10px}
.chk .it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:10px}
.chk .it b{font-family:var(--display);font-size:1.2rem;font-weight:400}
.seg{display:flex;gap:6px}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.5em .7em;font-size:.98rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* mission */
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.quiz .word{font-family:var(--display);font-size:clamp(2.6rem,9vw,4rem);color:var(--coral2);line-height:1.1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.25rem;padding:.9em .4em}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.prog{display:flex;gap:6px;justify-content:center}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}

/* pledge */
.write{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.fld{display:grid;gap:6px}
.fld label{font-family:var(--display);font-size:1.1rem}
.frame{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frame span{font-family:var(--display);color:var(--body);white-space:nowrap}
.frame input{flex:1;min-width:12em}
.hint{font-size:.92rem;color:var(--blue);min-height:1.2em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--cream);color:var(--ink);border:1px solid var(--line);padding:.35em .7em;font-family:var(--text);font-size:.95rem;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.paper{background:#fff;border:2px solid var(--line);border-radius:14px;padding:22px 22px 18px;box-shadow:0 3px 0 var(--line);font-size:1.05rem;color:var(--body)}
.paper h3{text-align:center;color:var(--ink);font-size:1.4rem;margin-bottom:10px}
.paper p{margin:.35em 0}
.paper .sign{text-align:right;margin-top:12px}
.paper .blank{color:#C9B48A}
.selfchk{display:grid;gap:6px}
.selfchk label{display:flex;gap:8px;align-items:center;font-size:1.02rem}
.selfchk input{width:1.3em;height:1.3em}
.sticky{position:sticky;top:12px}

/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.bars{display:grid;gap:14px}
.bar h3{font-size:1.25rem;margin-bottom:4px}
.bar .track{display:flex;height:40px;border-radius:10px;overflow:hidden;background:var(--cream)}
.bar .track div{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-size:1.15rem;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.cloud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cloud span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:.1em .6em;font-family:var(--display);color:var(--body)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gallery .paper{cursor:pointer;font-size:.95rem;padding:16px}
.gallery .paper h3{font-size:1.15rem}
.tag{display:inline-block;font-family:var(--display);font-size:.85rem;border-radius:999px;padding:0 .7em;background:var(--cream);color:var(--body)}
.tag.ok{background:var(--ok);color:#fff}
.modal{position:fixed;inset:0;background:rgba(40,28,15,.72);display:grid;place-items:center;padding:24px;z-index:9}
.modal .paper{max-width:900px;width:100%;font-size:1.6rem;max-height:92vh;overflow:auto}
.modal .paper h3{font-size:2.2rem}
.board{display:grid;gap:8px}
.board div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:10px 14px;font-size:1.1rem}
.board b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week span{border:2px solid var(--line);border-radius:10px;padding:.4em 0;font-family:var(--display);background:#fff}
@media (max-width:820px){
  .hero,.tv,.write{grid-template-columns:1fr}
  .choose,.opts{grid-template-columns:1fr}
  .chk .it{grid-template-columns:1fr}
  .steps button{font-size:.85rem}
  .sticky{position:static}
}
@media print{
  .top,.noprint{display:none!important}
  .tv{display:block}
  body{background:#fff}
  .printgrid{display:grid;grid-template-columns:1fr;gap:0}
  .printgrid .paper{break-inside:avoid;box-shadow:none;border:2px solid #999;margin:0 0 14mm;font-size:15pt}
}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><i>가</i> 우리말 지킴이</div><small id="sub"></small></div></header>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCSSwT67k7lXoYDz4qsmHHDRXUqTS0Zh14",
  authDomain: "classroom-games-7ae7d.firebaseapp.com",
  databaseURL: "https://classroom-games-7ae7d-default-rtdb.asia-southeast1.firebasedatabase.app",

  messagingSenderId: "433158756735",
  appId: "1:433158756735:web:254d9b0b2e36502b4de24a"
};
const STAGES=[null,
  {k:'점검',t:'언어생활 점검하기',tm:4},
  {k:'다짐문',t:'실천 다짐문 쓰기',tm:10},
  {k:'고쳐 쓰기',t:'친구 다짐문 읽고 고쳐 쓰기',tm:7},
  {k:'챌린지',t:'스스로 점검하고 챌린지 정하기',tm:3}];
const CHECK=[
  {k:'f',t:'외래어',ex:'예) 레시피, 팩트, 오픈'},
  {k:'s',t:'줄임말',ex:'예) 점메추, 생파, 갑분싸'},

const MISSION=[
  {w:'점메추',a:'점심 메뉴 추천',o:['점심 메뉴 추가','점점 메우기','점심 매우 추움']},
  {w:'핫플',a:'인기 있는 곳',o:['뜨거운 접시','더운 날씨','새 학교']},
  {w:'인생샷',a:'아주 멋진 사진',o:['사람 사진','인생 이야기','증명사진']},
  {w:'노잼',a:'재미없다',o:['노래 잘한다','잠이 온다','재미있다']},
  {w:'스크린도어',a:'안전문',o:['화면','유리창','현관']},
  {w:'레시피',a:'조리법',o:['영수증','식탁','요리사']},
  {w:'웰빙',a:'참살이',o:['좋은 우물','빨리 살기','부자 되기']},
  {w:'팩트',a:'사실',o:['공장','거짓말','소문']}];
const PRAISE=['까닭이 잘 드러나요','약속이 구체적이에요','지킬 수 있는 약속이에요','고유어를 잘 넣었어요','마음이 잘 느껴져요'];
const FIX=['약속에 언제·어디서를 넣어 봐요','지킬 수 있는 약속으로 바꿔 봐요','고유어를 넣어 봐요','까닭을 더 자세히 써 봐요','고칠 점이 없어요'];
const SELF=[{k:'a',t:'다짐하는 까닭이 잘 드러났나요?'},{k:'b',t:'실천 약속이 구체적인가요?'},{k:'c',t:'내가 지킬 수 있는 약속인가요?'}];
const DEF_TITLE='우리말 지킴이 실천 다짐문', DEF_END='소중한 우리말을 바르게 사용할 것을 약속합니다.';

const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const today=()=>{const d=new Date();return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;};
// "~하겠습니다."를 학생이 직접 써도 두 번 붙지 않게 다듬어요
const cleanP=s=>String(s||'').trim().replace(/^하나,?\s*(나는)?\s*/,'');
const promiseText=s=>{s=cleanP(s);if(!s)return '';return /[.!]$/.test(s)?s:s+'.';};
const CONCRETE=/(때|에게|하루|매일|날마다|시간|번|에서|동안|주에|아침|저녁|점심|학교|집|문자|메시지|친구|가족|게임|급식|일기)/;

function withTimeout(pr,ms=10000){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),ms))]);}
function showError(e){
  const m=String(e&&(e.code||e.message)||e);
  let why='알 수 없는 오류가 났어요.';
  if(/permission/i.test(m)) why='Firebase 데이터베이스의 <b>규칙</b>이 막고 있어요. Realtime Database → 규칙 탭을 확인해 주세요.';
  else if(/TIMEOUT/.test(m)) why='Firebase 서버에 10초 동안 연결되지 않았어요. 학교 인터넷이 Firebase를 막고 있을 수 있어요.';
  $('#sub').textContent='연결 문제';
  app.innerHTML=`<div class="panel grid"><h2 style="color:var(--bad)">서버에 연결하지 못했어요</h2><p>${why}</p><p class="muted">오류 내용: <code>${esc(m)}</code></p><div class="row"><button id="retry">다시 시도</button><button class="ghost" id="home">처음으로</button></div></div>`;
  $('#retry').onclick=()=>location.reload(); $('#home').onclick=()=>{location.hash='';startView();};
}
window.addEventListener('unhandledrejection',ev=>showError(ev.reason));
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.database();
const roomRef=c=>db.ref('rooms/'+c);
const params=new URLSearchParams(location.search);
let ROOM=params.get('room')||'';
let offs=[];const clearOffs=()=>{offs.forEach(f=>f());offs=[];};
function listen(ref,cb){const h=ref.on('value',cb);offs.push(()=>ref.off('value',h));}

/* ---------- start ---------- */
function startView(){
  clearOffs();clearInterval(tick);ClassWatch.teacherStop();
  $('#sub').textContent='6학년 국어 · 4. 소중한 우리말';
  app.innerHTML=`<section class="hero"><div class="grid"><h1>내 말을 점검하고,<br>우리말을 지켜요</h1>
   <p>내 언어생활을 점검하고, 실천 다짐문을 써요. 친구의 다짐문을 읽고 의견을 주고받아 고쳐 쓴 뒤, 일주일 동안 지킬 약속을 골라요.</p></div>
   <div class="panel bubbles" aria-hidden="true"><div class="bub">할머니! 토요일 점메추 해 주세요</div><div class="bub l">점메추? 무슨 말이니…</div><div class="bub">점심 메뉴 추천해 주세요!</div><div class="bub l">그럼~ 맛있는 거 해 줄게</div></div></section>
   <div class="choose"><button id="goStu">학생으로 참여하기</button><button class="ghost" id="goTv">선생님 화면 (TV)</button></div>`;
  $('#goStu').onclick=joinView; $('#goTv').onclick=()=>{location.hash='teacher';teacherView();};
}

/* ---------- student: join ---------- */
let me=null, ROOMV={}, ME={}, cur=1;
function parseName(s){const m=String(s).trim().match(/^(\d{1,2})\s*[번.]?\s*(.+)$/);return m?{num:+m[1],name:m[2].trim()}:null;}
function joinView(){
  clearOffs();
  const saved=store('um-student');
  if(saved&&ROOM&&saved.room===ROOM){me=saved;return enterRoom();}
  $('#sub').textContent='학생 화면';
  // 선생님의 👀 학생 화면에 들어가기 화면부터 보여요
  ClassWatch.student({db,room:ROOM,root:app});ClassWatch.step('들어가기');
  app.innerHTML=`<div class="grid" style="max-width:560px;margin:0 auto">
   <div class="panel grid"><h2>방 번호</h2><input id="rm" inputmode="numeric" maxlength="4" placeholder="TV에 보이는 4자리" value="${esc(ROOM)}"></div>
   <div class="panel grid"><h2>"번호 이름"을 써요</h2><input id="nm" placeholder="예) 7 김민수" autocomplete="off"></div>
   <div class="msg bad" id="jm" role="status"></div>
   <div class="row"><button id="enter" disabled>들어가기</button><button class="ghost" id="home">처음으로</button></div></div>`;
  const chk=()=>{$('#enter').disabled=!(/^\d{4}$/.test($('#rm').value)&&parseName($('#nm').value));};
  $('#rm').oninput=chk;$('#nm').oninput=chk;
  $('#home').onclick=startView;
  ClassWatch.joinForm();
  $('#enter').onclick=async()=>{
    const code=$('#rm').value, p=parseName($('#nm').value);
    $('#enter').disabled=true;
    try{
      const open=await withTimeout(roomRef(code).child('open').get());
      if(!open.exists()){$('#jm').textContent='방 번호를 다시 확인해요.';return chk();}
      const r=await withTimeout(roomRef(code).child('students/'+p.num).transaction(c=>c?undefined:{name:p.name,joinedAt:Date.now()},undefined,false));
      if(!r.committed){const c=r.snapshot.val();
        if(!(c&&c.name===p.name)){$('#jm').textContent=`${p.num}번은 이미 "${c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}}
    }catch(e){$('#jm').textContent='연결 문제: '+(e.code||e.message);return chk();}
    ROOM=code;me={room:code,num:p.num,name:p.name};store('um-student',me);
    history.replaceState(null,'','?room='+code);
    enterRoom();
  };
}
function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app});ClassWatch.who(me.num,me.name);
  $('#sub').textContent=`${me.num}번 ${me.name}`;
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  let ready=false;ROOMV={};onMe=null;
  listen(roomRef(me.room).child('students/'+me.num),s=>{
    const v=s.val();
    if(!v){if(ready){store('um-student',null);me=null;clearOffs();return joinView();}
      // 선생님이 새 방을 만들었거나 지워진 경우: 다시 들어가기
      store('um-student',null);me=null;clearOffs();return joinView();}
    ME=v;
    if(!ready){ready=true;if(ROOMV.stage){cur=ROOMV.stage;renderStage();}return;}
    if(typeof onMe==='function')onMe();
  });
  listen(roomRef(me.room).child('stage'),s=>{
    const st=s.val()||1;const was=ROOMV.stage;ROOMV.stage=st;
    if(!ready)return;
    if(was!==st){cur=st;renderStage();} else drawSteps();
  });
}
let onMe=null;
function stepDone(n){return n===1?!!(ME.check&&ME.mission&&ME.mission.done):n===2?!!(ME.pledge&&ME.pledge.at):n===3?!!(ME.pledge&&ME.pledge.rev):!!(ME.pick!=null);}
function drawSteps(){
  const el=$('#steps');if(!el)return;
  el.innerHTML=[1,2,3,4].map(n=>`<button data-s="${n}" ${n>ROOMV.stage?'disabled':''} ${n===cur?'aria-current="step"':''} class="${stepDone(n)?'done':''}"><b>${n}</b>${STAGES[n].k}${stepDone(n)?' ✓':''}</button>`).join('');
  $$('#steps button').forEach(b=>b.onclick=()=>{cur=+b.dataset.s;renderStage();});
}
function shell(inner){
  if(gotOff){gotOff();gotOff=null;}
  app.innerHTML=`<div class="grid"><nav class="steps" id="steps" aria-label="활동 단계"></nav>${inner}<div style="text-align:right"><button class="ghost" id="relog" style="font-size:.85rem;padding:.4em .8em">다른 이름으로 들어가기</button></div></div>`;
  $('#relog').onclick=()=>{store('um-student',null);me=null;clearOffs();joinView();};

let gotOff=null;
function renderStage(){
  ClassWatch.step(STAGES[cur].k,{n:cur,total:4,wait:stepDone(cur)});
  onMe=()=>drawSteps();
  if(cur===1)return stage1();
  if(cur===2)return stage2();
  if(cur===3)return stage3();
  return stage4();
}

/* ---------- 3. 친구 다짐문 읽고 고쳐 쓰기 ---------- */
let STU={};
async function assignFriend(){
  if(ME.reviewTo)return ME.reviewTo;
  const all=(await roomRef(me.room).child('students').get()).val()||{};
  const rv=(await roomRef(me.room).child('reviews').get()).val()||{};
  const cands=Object.keys(all).map(Number).filter(n=>n!==me.num&&all[n].pledge&&all[n].pledge.at);
  if(!cands.length)return null;
  // 의견을 적게 받은 친구부터, 같으면 내 번호 바로 다음 친구
  const dist=n=>(n-me.num+100)%100;
  const assigned=Object.values(all).filter(s=>s.reviewTo).map(s=>s.reviewTo);
  const load=n=>Object.keys(rv[n]||{}).length+assigned.filter(x=>x===n).length;
  cands.sort((a,b)=>load(a)-load(b)||dist(a)-dist(b));
  const to=cands[0];
  await roomRef(me.room).child('students/'+me.num+'/reviewTo').set(to);
  ME.reviewTo=to;return to;
}

  shell(`<div class="panel"><span class="band">3단계</span> <h2 style="display:inline;margin-left:6px">친구 다짐문 읽고, 내 다짐문 고쳐 쓰기</h2></div>

  partA();partB();
}

    if(!pr||!fx){$('#rmsg').className='msg bad';$('#rmsg').textContent='잘한 점과 고칠 점을 하나씩 골라요.';return;}
    $('#rsend').disabled=true;
    await roomRef(me.room).child(`reviews/${to}/${me.num}`).set({praise:pr,fix:fx,note:$('#rnote').value.trim(),from:me.name,at:Date.now()});
    $('#rmsg').className='msg ok';$('#rmsg').textContent='의견을 보냈어요! 이제 아래에서 내 다짐문을 고쳐 써요.';
    $('#rsend').disabled=false;$('#rsend').textContent='의견 다시 보내기';
  };
}
function partB(){
  const P=ME.pledge||{};
  const f=pledgeForm(P.v2||P.v1,{btn:P.rev?'고쳐 쓴 다짐문 다시 올리기':'고쳐 쓴 다짐문 올리기',done:async v=>{
    await roomRef(me.room).child('students/'+me.num+'/pledge').update({v2:v,rev:firebase.database.ServerValue.TIMESTAMP});
    ME.pledge={...ME.pledge,v2:v,rev:Date.now()};
    $('#fm').className='msg ok';$('#fm').textContent='고쳐 쓴 다짐문을 올렸어요! TV에 보여요.';
    $('#fsub').disabled=false;$('#fsub').textContent='고쳐 쓴 다짐문 다시 올리기';drawSteps();
  }});
  $('#partB').innerHTML=`<div class="panel grid"><h2>나. 친구들이 준 의견</h2><div id="got" class="board"><p class="muted">아직 받은 의견이 없어요. 친구가 읽는 중이에요.</p></div></div>
   <div class="panel"><h2>다. 의견을 보고 내 다짐문 고쳐 쓰기</h2></div>${f.html}`;
  f.bind();
  const ref=roomRef(me.room).child('reviews/'+me.num);
  const h=ref.on('value',s=>{const v=s.val()||{};const el=$('#got');if(!el)return;const ks=Object.keys(v);
    if(!ks.length)return;
    el.innerHTML=ks.map(k=>`<div><b>${esc(k)}번 ${esc(v[k].from)}</b>👍 ${esc(v[k].praise)} · ✏️ ${esc(v[k].fix)}${v[k].note?`<br><span class="muted">“${esc(v[k].note)}”</span>`:''}</div>`).join('');});
  gotOff=()=>ref.off('value',h);
}

/* ---------- 4. 스스로 점검·챌린지 ---------- */
function stage4(){
  const P=ME.pledge||{};const fp=P.v2||P.v1;
  if(!fp){shell(`<div class="panel grid"><h2>먼저 다짐문을 써요</h2><div><button id="go2">2단계로 가기</button></div></div>`);$('#go2').onclick=()=>{cur=2;renderStage();};return;}
  const self={...(ME.self||{})};let pick=ME.pick;
  const ps=(fp.p||[]).map(promiseText);
  shell(`<div class="panel"><span class="band">4단계</span> <h2 style="display:inline;margin-left:6px">스스로 점검하고 챌린지 정하기</h2></div>
   <div class="write"><div class="grid">
    <div class="panel grid"><h2>스스로 점검하기</h2>
     <div class="chk">${SELF.map(it=>`<div class="it"><b>${it.t}</b><div class="seg" data-k="${it.k}">${[3,2,1].map(n=>`<button data-v="${n}" aria-pressed="${self[it.k]===n}" aria-label="${['','보통','잘함','매우 잘함'][n]}">${'●'.repeat(n)}</button>`).join('')}</div></div>`).join('')}</div>
     <p class="muted" style="font-size:.92rem">●●● 매우 잘함 · ●● 잘함 · ● 보통</p></div>
    <div class="panel grid"><h2>일주일 우리말 지킴이 챌린지</h2><p>내 약속 중 하나를 골라 일주일 동안 지켜 봐요.</p>
     <div class="chips" id="pk" style="display:grid;gap:8px">${ps.map((t,k)=>`<button data-k="${k}" aria-pressed="${pick===k}" style="text-align:left;border-radius:12px;font-size:1.05rem">하나, 나는 ${esc(t)}</button>`).join('')}</div>
     <div class="week">${['월','화','수','목','금','토','일'].map(d=>`<span>${d}</span>`).join('')}</div>
     <p class="muted" style="font-size:.92rem">지킨 날은 알림장에 O를 표시해요. 다음 국어 시간에 결과를 이야기해요.</p></div>
    <div class="panel grid"><div class="fld"><label for="feel">오늘 활동을 하며 느낀 점 한 줄</label><input id="feel" maxlength="60" value="${esc(ME.feel||'')}" placeholder="예) 내가 줄임말을 이렇게 많이 쓰는 줄 몰랐다."></div>
     <div class="msg" id="sm" role="status"></div><div class="row"><button id="ssave">챌린지 시작!</button></div></div>
   </div><div class="grid sticky"><div class="muted" style="font-family:var(--display)">나의 다짐문</div>${pledgeHTML(fp,`${me.num}번 ${me.name}`)}</div></div>`);
  $$('.seg').forEach(seg=>$$('button',seg).forEach(b=>b.onclick=()=>{self[seg.dataset.k]=+b.dataset.v;$$('button',seg).forEach(x=>x.setAttribute('aria-pressed',x===b));}));
  $$('#pk button').forEach(b=>b.onclick=()=>{pick=+b.dataset.k;$$('#pk button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('#ssave').onclick=async()=>{
    if(SELF.some(it=>!self[it.k])||pick==null){$('#sm').className='msg bad';$('#sm').textContent='점검 세 가지와 챌린지 약속을 골라요.';return;}
    $('#ssave').disabled=true;
    await roomRef(me.room).child('students/'+me.num).update({self,pick,feel:$('#feel').value.trim()});
    ME.self=self;ME.pick=pick;drawSteps();
    $('#sm').className='msg ok';$('#sm').textContent='챌린지를 시작했어요! 일주일 동안 우리말 지킴이가 되어 봐요.';
    $('#ssave').disabled=false;$('#ssave').textContent='다시 저장';
  };
}

/* ---------- teacher ---------- */
let tick=null,RD={},big=null;
async function teacherView(){
  clearOffs();
  $('#sub').textContent='선생님 화면 · 연결 중';
  app.innerHTML='<div class="panel grid" style="text-align:center"><h2>방을 만드는 중이에요…</h2></div>';
  let code=store('um-teacher-room');
  try{
    if(!code||!(await withTimeout(roomRef(code).child('open').get())).exists()){
      code=String(Math.floor(1000+Math.random()*9000));
      await withTimeout(roomRef(code).set({open:Date.now(),app:'urimal',stage:1,timer:{min:STAGES[1].tm,left:STAGES[1].tm*60,endAt:0}}));
      store('um-teacher-room',code);
    }
  }catch(e){return showError(e);}
  ROOM=code;
  ClassWatch.teacher({db,room:code});
  const url=location.origin+location.pathname+'?room='+code;
  $('#sub').textContent='선생님 화면 · TV에 띄워 주세요';
  app.innerHTML=`<div class="tv">
   <div class="grid noprint">
    <div class="panel qr"><h2>태블릿으로 접속</h2><div id="qrbox"></div><div>방 번호 <span class="roomcode">${code}</span></div><p class="muted" style="word-break:break-all;font-size:.75rem;margin:0">${esc(url)}</p></div>
    <div class="panel grid"><div class="timer" id="tm">5:00</div><div class="row" style="justify-content:center"><button class="ghost" id="minus" aria-label="1분 줄이기">－1</button><button id="go">시작</button><button class="ghost" id="plus" aria-label="1분 늘리기">＋1</button></div></div>
    <div class="panel grid"><h2>단계 열기</h2><div class="tsteps" id="tsteps"></div></div>
    <div class="panel grid"><div class="row" style="justify-content:space-between"><h2>참여</h2><span class="muted" id="cnt"></span></div><div class="people" id="ppl"></div></div>
    <div class="row"><button class="ghost" id="newroom">새 방</button><button class="ghost" id="home">처음으로</button></div>
   </div>
   <div class="grid" id="main"></div></div><div id="modal"></div>`;
  if(window.QRCode){try{new QRCode($('#qrbox'),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
  const ref=roomRef(code);
  listen(ref,s=>{RD=s.val()||{};renderTV();});
  const tm=()=>RD.timer||{min:5,left:300,endAt:0};
  $('#minus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.max(1,t.min-1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#plus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.min(20,t.min+1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#go').onclick=()=>{const t=tm();if(t.endAt)ref.child('timer').set({min:t.min,left:Math.max(0,Math.round((t.endAt-Date.now())/1000)),endAt:0});else{const l=t.left>0?t.left:t.min*60;ref.child('timer').set({min:t.min,left:l,endAt:Date.now()+l*1000});}};
  $('#newroom').onclick=()=>{store('um-teacher-room',null);teacherView();};
  $('#home').onclick=()=>{location.hash='';startView();};
  clearInterval(tick);tick=setInterval(renderTime,250);
}
function setStage(n){const ref=roomRef(ROOM);ref.update({stage:n,timer:{min:STAGES[n].tm,left:STAGES[n].tm*60,endAt:0}});}
function renderTime(){
  const el=$('#tm');if(!el)return clearInterval(tick);
  const t=RD.timer||{min:5,left:300,endAt:0};
  const left=t.endAt?Math.max(0,Math.round((t.endAt-Date.now())/1000)):t.left;
  el.textContent=left===0&&t.endAt?'시간 끝!':`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  el.classList.toggle('end',!!t.endAt&&left===0);
  $('#go').textContent=t.endAt?'멈춤':'시작';$('#minus').disabled=$('#plus').disabled=!!t.endAt;
}
const students=()=>{const s=RD.students||{};return Object.keys(s).map(Number).sort((a,b)=>a-b).map(n=>({n,...s[n]}));};
function renderTV(){
  const main=$('#main');if(!main)return;
  const st=RD.stage||1, S=students();
  $('#tsteps').innerHTML=[1,2,3,4].map(n=>`<button data-s="${n}" ${n===st?'aria-current="step"':''}><b>${n}</b> ${STAGES[n].t}</button>`).join('');
  $$('#tsteps button').forEach(b=>b.onclick=()=>setStage(+b.dataset.s));
  const doneIn=x=>st===1?!!(x.mission&&x.mission.done):st===2?!!(x.pledge&&x.pledge.at):st===3?!!(x.pledge&&x.pledge.rev):x.pick!=null;
  $('#cnt').textContent=`${S.length}명 · 이 단계 끝 ${S.filter(doneIn).length}명`;
  $('#ppl').innerHTML=S.map(x=>`<span class="${doneIn(x)?'ok':''}">${x.n} ${esc(x.name)}</span>`).join('')||'<span class="muted" style="background:none">아직 아무도 없어요</span>';
  if(st===1)return tv1(main,S);
  if(st===2)return tv2(main,S);
  if(st===3)return tv3(main,S);
  return tv4(main,S);
}
function tv1(main,S){
  const done=S.filter(x=>x.check);
  const words={};S.forEach(x=>(x.words||[]).forEach(w=>{const k=w.replace(/\s/g,'');if(k)words[k]=(words[k]||0)+1;}));
  const top=Object.entries(words).sort((a,b)=>b[1]-a[1]).slice(0,24);
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">우리 반 언어생활 점검 결과</h2><span class="muted">${done.length}명 응답 · 미션 성공 ${S.filter(x=>x.mission&&x.mission.done).length}명</span></div>
    <div class="legend">${LV.map(l=>`<span><i style="background:${l.c}"></i>${l.t}</span>`).join('')}</div>
    <div class="bars">${CHECK.map(it=>{const cnt=LV.map(l=>done.filter(x=>x.check[it.k]===l.k).length);const tot=cnt.reduce((a,b)=>a+b,0)||1;
      return `<div class="bar"><h3>${it.t}</h3><div class="track">${LV.map((l,i)=>cnt[i]?`<div style="width:${cnt[i]/tot*100}%;background:${l.c}">${cnt[i]}명</div>`:'').join('')}</div></div>`;}).join('')}</div></div>
   <div class="panel grid"><h2>우리 반이 자주 쓰는 말</h2><div class="cloud">${top.map(([w,c])=>`<span style="font-size:${1+Math.min(c,5)*.25}rem">${esc(w)}${c>1?` <small class="muted">${c}</small>`:''}</span>`).join('')||'<span class="muted" style="border:0;background:none">아직 없어요</span>'}</div></div>
   <div class="rules"><b>함께 이야기해요</b><ul><li>결과를 보고 느낀 점은 무엇인가요?</li><li>우리 반은 어떤 말을 바꾸면 좋을까요?</li></ul></div>`;
}
function tv2(main,S){
  main.innerHTML=`<div class="panel grid"><h2 style="font-size:1.8rem">실천 다짐문 쓰기</h2>
    <div class="write"><div>${pledgeHTML({title:DEF_TITLE,reason:'아름답고 소중한 우리말을 지키고 바르게 사용하고자',p:['친구에게 문자를 보낼 때 줄임말 대신 끝까지 풀어서 쓰겠습니다.','하루에 고유어 한 개를 찾아 일기에 써 보겠습니다.','게임할 때 비속어를 쓰지 않고 고운 말로 친구를 존중하겠습니다.'],date:'20○○년 ○○월 ○○일'},'○○○')}</div>
    <div class="grid"><div class="rules"><b>좋은 실천 약속</b><ul><li><b>구체적</b>이에요: 언제, 무엇을 할지 보여요.</li><li><b>지킬 수 있어요</b>: "한 개도 안 쓰겠다"보다 "하루 한 번만"</li></ul></div>
     <div class="rules"><b>짜임</b><ul><li>① 제목</li><li>② 다짐하는 까닭</li><li>③ 실천 약속 "하나, 나는 ~하겠습니다."</li><li>④ 날짜와 이름</li></ul></div></div></div></div>
   <div class="panel grid"><h2>올린 친구 ${S.filter(x=>x.pledge&&x.pledge.at).length}/${S.length}명</h2><div class="people">${S.map(x=>`<span class="${x.pledge&&x.pledge.at?'ok':''}">${x.n} ${esc(x.name)}${x.pledge&&x.pledge.at?' ✓':x.draft?' ✎':''}</span>`).join('')}</div></div>`;
}
function tv3(main,S){
  const rv=RD.reviews||{};
  const list=S.filter(x=>x.pledge&&(x.pledge.v1||x.pledge.v2));
  main.innerHTML=`<div class="panel grid noprint"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">우리 반 실천 다짐문</h2><div class="row"><span class="muted">고쳐 씀 ${S.filter(x=>x.pledge&&x.pledge.rev).length}명 · 카드를 누르면 크게 보여요</span><button class="ghost" id="print">인쇄해서 알림판에</button></div></div></div>
   <div class="gallery printgrid">${list.map(x=>pledgeHTML(x.pledge.v2||x.pledge.v1,`${x.n}번 ${x.name}`,{attr:`data-n="${x.n}" tabindex="0" role="button"`,foot:`<div class="row noprint" style="margin-top:8px">${x.pledge.rev?'<span class="tag ok">고쳐 씀</span>':'<span class="tag">처음 쓴 글</span>'}<span class="tag">받은 의견 ${Object.keys(rv[x.n]||{}).length}</span></div>`})).join('')||'<div class="panel muted">아직 올린 다짐문이 없어요</div>'}</div>`;
  $$('.gallery [data-n]').forEach(c=>{const open=()=>{big=+c.dataset.n;drawBig();};c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter')open();};});
  $('#print').onclick=()=>window.print();
  drawBig();
}
function drawBig(){
  const m=$('#modal');if(!m)return;
  const x=big!=null&&(RD.students||{})[big];
  if(!x||!x.pledge){m.innerHTML='';return;}
  const rv=(RD.reviews||{})[big]||{};
  m.innerHTML=`<div class="modal" id="mbg">${pledgeHTML(x.pledge.v2||x.pledge.v1,`${big}번 ${x.name}`,{foot:`${Object.keys(rv).length?`<div class="board" style="margin-top:14px;font-size:1.1rem">${Object.keys(rv).map(k=>`<div><b>${esc(k)}번 ${esc(rv[k].from)}</b>👍 ${esc(rv[k].praise)} · ✏️ ${esc(rv[k].fix)}</div>`).join('')}</div>`:''}<div class="row" style="justify-content:flex-end;margin-top:12px"><button id="mclose">닫기</button></div>`})}</div>`;
  $('#mclose').onclick=()=>{big=null;drawBig();};
  $('#mbg').onclick=e=>{if(e.target.id==='mbg'){big=null;drawBig();}};
}
function tv4(main,S){
  const sel=S.filter(x=>x.pick!=null&&x.pledge);
  const avg=k=>{const v=S.filter(x=>x.self&&x.self[k]).map(x=>x.self[k]);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'-';};
  main.innerHTML=`<div class="panel grid"><h2 style="font-size:1.8rem">일주일 우리말 지킴이 챌린지</h2>
    <div class="board">${sel.map(x=>{const fp=x.pledge.v2||x.pledge.v1;return `<div><b>${x.n} ${esc(x.name)}</b>하나, 나는 ${esc(promiseText((fp.p||[])[x.pick]))}</div>`;}).join('')||'<p class="muted">아직 고른 친구가 없어요</p>'}</div></div>
   <div class="panel grid"><h2>느낀 점</h2><div class="board">${S.filter(x=>x.feel).map(x=>`<div><b>${x.n} ${esc(x.name)}</b>${esc(x.feel)}</div>`).join('')||'<p class="muted">아직 없어요</p>'}</div></div>
   <div class="panel grid"><h2>스스로 점검 (평균, ●3개 만점)</h2><div class="row">${SELF.map(it=>`<span class="tag" style="font-size:1rem;padding:.3em .8em">${it.t} <b>${avg(it.k)}</b></span>`).join('')}</div></div>`;
}

/* ---------- route ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
</body></html>
