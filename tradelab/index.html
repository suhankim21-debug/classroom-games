<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>무역 실험실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* Same classroom notice-board look as 원주 탐험대·우리말 지킴이. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
button.okb{background:var(--ok)} button.badb{background:#fff;color:var(--bad);border:2px solid var(--bad)}
input,select{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center;font-size:.9em}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .4em;font-size:1rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.quiz .q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.2rem;padding:.9em .5em;line-height:1.3}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--coral2);line-height:1.25}
.emoji{font-size:clamp(3rem,10vw,4.5rem);line-height:1}
.score{font-family:var(--display);font-size:1.3rem}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
/* 나라 고르기 */
.nations{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.nations button{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;display:grid;gap:4px;font-family:var(--text);font-size:1rem;padding:12px 14px}
.nations button b{font-family:var(--display);font-weight:400;font-size:1.35rem}
.nations button[aria-pressed="true"]{border-color:var(--coral);background:#FFF4DF}
.nations button small{color:var(--muted)}
/* 생산 */
.ncard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:#FFF4DF;border-radius:16px;padding:12px 16px;border:2px solid var(--coral)}
.ncard .flag{font-size:3.2rem;line-height:1}
.ncard h2{font-size:1.7rem}
.prod{display:grid;gap:8px}
.prod .p{display:grid;grid-template-columns:3em 1fr auto 5.5em;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.prod .p.best{border-color:var(--gold);background:#FFF9E8}
.prod .p.zero{opacity:.65}
.prod .ge{font-size:2rem;text-align:center}
.prod .nm{font-family:var(--display);font-size:1.2rem;line-height:1.2}
.prod .nm small{display:block;font-family:var(--text);font-size:.9rem;color:var(--muted)}
.prod .ctl{display:flex;align-items:center;gap:6px}
.prod .ctl button{width:2.4em;height:2.4em;padding:0;font-size:1.3rem;border-radius:50%}
.prod .ctl span{font-family:var(--display);font-size:1.4rem;min-width:1.6em;text-align:center}
.prod .out{font-family:var(--display);font-size:1.2rem;text-align:right}
.hands{display:flex;gap:4px;flex-wrap:wrap;font-size:1.6rem}
.hands span.used{opacity:.25}
/* 창고 */
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.inv div{background:#fff;border:2px solid var(--line);border-radius:14px;text-align:center;padding:8px 4px}
.inv div.low{border-color:var(--bad);background:#FCEDE8}
.inv div b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;font-variant-numeric:tabular-nums}
.inv div span{font-size:1.7rem}
.inv div small{display:block;color:var(--muted);font-size:.85rem}
.sets{display:flex;align-items:center;gap:14px;justify-content:center;background:var(--cream);border-radius:16px;padding:10px 16px;flex-wrap:wrap}
.sets b{font-family:var(--display);font-weight:400;font-size:2.6rem;color:var(--coral2);font-variant-numeric:tabular-nums}
.closed{background:#EFE7D3;border:2px dashed var(--muted);border-radius:14px;padding:12px 16px;text-align:center;font-family:var(--display);font-size:1.15rem;color:var(--muted)}
/* 무역 */
.offer{display:grid;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px}
.offer .pick{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.offer .pick label{font-family:var(--display);font-size:1.1rem}
.gpick{display:flex;gap:6px;flex-wrap:wrap}
.gpick button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.35em .6em;font-size:1.5rem;line-height:1}
.gpick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.gpick button[aria-pressed="true"] span{color:#fff}
.num{display:flex;align-items:center;gap:6px}
.num button{width:2.2em;height:2.2em;padding:0;border-radius:50%;font-size:1.2rem}
.num span{font-family:var(--display);font-size:1.5rem;min-width:1.8em;text-align:center}
.olist{display:grid;gap:8px}
.olist .o{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border-left:6px solid var(--blue);border-radius:12px;padding:10px 14px}
.olist .o.in{border-left-color:var(--coral)}
.olist .o .t{font-family:var(--display);font-size:1.15rem;line-height:1.35}
.list{display:grid;gap:8px}
.list div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px}
.list b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
/* 1단계 */
.ifcard{display:grid;justify-items:center;gap:6px}
.ifcard .q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chips button{background:var(--cream);color:var(--ink);border:1px solid var(--line);padding:.45em .9em;font-family:var(--text);font-size:1.05rem;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.ntable{width:100%;border-collapse:separate;border-spacing:0 6px;font-variant-numeric:tabular-nums}
.ntable th{font-family:var(--display);font-weight:400;color:var(--muted);font-size:1rem;text-align:center;padding:0 6px}
.ntable td{background:#fff;text-align:center;padding:8px 6px;font-family:var(--display);font-size:1.25rem}
.ntable td:first-child{text-align:left;border-radius:12px 0 0 12px;padding-left:14px}
.ntable td:last-child{border-radius:0 12px 12px 0}
.ntable td.best{background:#FFF1CC}
.ntable td.z{color:var(--bad)}
.ntable td.sets{color:var(--coral2);font-size:1.6rem;background:var(--cream)}
.chart svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.bigsum{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;text-align:center}
.bigsum div{background:#fff;border-radius:16px;padding:10px 22px;border:2px solid var(--line)}
.bigsum b{display:block;font-family:var(--display);font-weight:400;font-size:3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:2.6em 11em 1fr 5em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 12px}
.rank .r b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--coral2)}
.rank .r .nm{font-family:var(--display);font-size:1.25rem}
.rank .r .pt{font-family:var(--display);font-size:1.4rem;text-align:right;font-variant-numeric:tabular-nums}
.bar .track{height:30px;border-radius:10px;background:var(--cream);overflow:hidden}
.bar .track div{height:100%;background:var(--coral);border-radius:10px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.6rem}
.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}
@media (max-width:820px){
  .hero,.tv,.two{grid-template-columns:1fr}
  .choose,.opts{grid-template-columns:1fr}
  .steps button{font-size:.85rem}
  .prod .p{grid-template-columns:2.4em 1fr auto;}.prod .out{grid-column:2/4;text-align:left}
  .inv{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.inv div b{font-size:1.3rem}.inv div span{font-size:1.3rem}
  .rank .r{grid-template-columns:2.2em 1fr 4.5em}.rank .r .trk{display:none}
  .offer .pick{grid-template-columns:1fr}
}

// 차례로 문제를 내고, 맞혀야 다음으로 넘어가요
function runQuiz(box,qs,{band,title,fig,onRight,onWrong,onEnd,progress,few}){
  let i=0,missed=false;
  const draw=()=>{
    const q=qs[i];const opts=shuffle([q.a,...(few?shuffle(q.o).slice(0,1):q.o)]);missed=false;const t0=Date.now();
    box.innerHTML=`<div><span class="band">${band}</span></div>${title?`<h2>${title}</h2>`:''}
     <div class="prog">${qs.map((_,k)=>`<span class="${k<i?'on':k===i?'cur':''}"></span>`).join('')}</div>
     ${progress?progress():''}<div class="pop" style="width:100%">${fig?fig(q):''}</div><div class="q">${esc(q.q)}</div>
     <div class="opts">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
     <div class="msg" id="qm" role="status"></div>`;
    $$('.opts button',box).forEach(b=>b.onclick=async()=>{
      if(b.dataset.o===q.a){
        b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);
        $('#qm',box).className='msg ok';
        const extra=onRight?await onRight(q,!missed,(Date.now()-t0)/1000,i):'';
        $('#qm',box).textContent='맞았어요!'+(extra||'');
        await new Promise(r=>setTimeout(r,650));
        i++;if(i<qs.length)return draw();
        onEnd();
      }else{
        missed=true;b.classList.add('wrong');b.disabled=true;
        box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
        $('#qm',box).className='msg bad';$('#qm',box).textContent='다시 골라 봐요';
        if(onWrong)onWrong(q);
      }
    });
  };
  draw();
}

function stageProd(R){
  const nat=myNat(), key='r'+R;
  const mine=()=>MYC[key]||{};
  const draft=store('tl-draft-'+me.room+'-'+key)||zeroInv();
  const draw=()=>{
    const d=mine();
    if(R===1&&d.done)return r1Done();
    if(R===2&&d.made)return tradeView();
    const used=GOODS.reduce((s,g)=>s+(draft[g.id]||0),0);
    const out=Object.fromEntries(GOODS.map(g=>[g.id,(draft[g.id]||0)*nat.r[g.id]]));
    const best=bestOf(nat);
    shell(`<div class="panel grid"><div><span class="band">${R===1?'1라운드 · 우리 나라 혼자 만들기':'2라운드 · 잘하는 것 만들고 무역하기'}</span></div>
     ${natCard(nat)}
     ${R===1?`<div class="closed">🚫 1라운드는 국경이 닫혀 있어요. 다른 나라와 바꿀 수 없어요!</div>`:`<div class="rules"><b>2라운드는 무역을 할 수 있어요!</b> 만든 다음 다른 나라와 상품을 바꿀 수 있어요. 그렇다면 일손을 어디에 쓰는 게 좋을까요? 짝과 의논해요.</div>`}
     <div class="row" style="justify-content:space-between"><h3 style="font-size:1.3rem">일손 ${HANDS}명을 나눠 보내요</h3><div class="hands" aria-label="남은 일손 ${HANDS-used}명">${Array.from({length:HANDS},(_,k)=>`<span class="${k<used?'used':''}">🧑‍🌾</span>`).join('')}</div></div>

async function acceptOffer(id){
  const oref=roomRef(me.room).child('offers/'+id);
  // 먼저 제안을 잡아 두어 짝과 동시에 눌러도 한 번만 바뀌게 해요
  const lock=await oref.transaction(o=>o&&o.st==='open'?{...o,st:'busy'}:undefined);
  if(!lock.committed)return;
  const o=lock.snapshot.val();
  const sw=await roomRef(me.room).child('c').transaction(C=>{
    if(!C)return C;
    const A=C[o.from]&&C[o.from].r2&&C[o.from].r2.inv, B=C[o.to]&&C[o.to].r2&&C[o.to].r2.inv;
    if(!A||!B||(A[o.give.g]||0)<o.give.n||(B[o.get.g]||0)<o.get.n)return;
    A[o.give.g]-=o.give.n;B[o.give.g]=(B[o.give.g]||0)+o.give.n;
    B[o.get.g]-=o.get.n;A[o.get.g]=(A[o.get.g]||0)+o.get.n;
    const f=C[o.from].r2,t=C[o.to].r2;f.ex=(f.ex||0)+o.give.n;f.im=(f.im||0)+o.get.n;t.ex=(t.ex||0)+o.get.n;t.im=(t.im||0)+o.give.n;
    return C;
  });
  await oref.update({st:sw.committed?'ok':'fail',done:Date.now()});
  if(sw.committed){
    const f=NN[o.from],t=NN[o.to];
    roomRef(me.room).child('log').push({t:`${f.e}${f.n} ${GN[o.give.g].e}${o.give.n}개 ⇄ ${t.e}${t.n} ${GN[o.get.g].e}${o.get.n}개`,at:Date.now()});
  }
}

  let G=ME.quiz;
  if(!G||!G.order){
    shell(`<div class="panel grid quiz"><div><span class="band">4단계 · 정리 퀴즈 대결</span></div><h2 style="font-size:1.8rem">오늘 배운 내용으로 대결해요</h2>
     <p>${QUIZ.length}문제. 한 번에 맞히면 100점 + 빠르기 보너스. 틀리면 다시 골라야 넘어가요.</p>
     <div class="row" style="justify-content:center"><button id="qs">시작하기</button><button class="ghost" id="qe">보기 2개로 하기</button></div></div>`);

      G={order:shuffle(QUIZ.map(g=>g.id)),i:0,score:0,easy,started:Date.now()};
      await roomRef(me.room).child('students/'+me.num+'/quiz').set(G);ME.quiz=G;stage4();
    };

    return;
  }
  if(cur!==4)return;
  const rest=G.order.slice(G.i||0).map(id=>QQ[id]).filter(Boolean);
  shell(`<div class="panel quiz" id="gz"></div>`);
  if(!rest.length)return finishQuiz();
  let score=G.score||0,idx=G.i||0;
  runQuiz($('#gz'),rest,{band:'4단계 · 정리 퀴즈 대결',few:G.easy,fig:q=>`<div class="emoji" aria-hidden="true">${q.e}</div>`,
    progress:()=>`<div class="score">점수 <b>${score}</b>점 · ${idx+1}/${QUIZ.length}번째 문제</div>`,
    onRight:async(q,ok,sec)=>{
      const pts=ok?100+Math.round(50*Math.max(0,Math.min(1,1-(sec-3)/17))):0;
      score+=pts;idx++;
      await roomRef(me.room).child('students/'+me.num+'/quiz').update({i:idx,score});
      ME.quiz={...ME.quiz,i:idx,score};
      return pts?` +${pts}점`:' (두 번째 도전은 점수 없이 넘어가요)';
    },
    onWrong:q=>{roomRef(me.room).child(`students/${me.num}/quiz/wrong/${q.id}`).transaction(v=>(v||0)+1);},
    onEnd:finishQuiz});
}

}
function ranking(all){

}

  const done=S.filter(x=>x.s1&&x.s1.done);
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">만약에 카드 (교과서 97쪽)</h2><span class="muted">${done.length}/${S.length}명 끝</span></div>
    <div class="nations" style="grid-template-columns:repeat(4,1fr)">${IFS.map(f=>`<div class="panel" style="text-align:center;padding:12px"><div class="emoji" style="font-size:2.6rem">${f.e}</div><div style="font-family:var(--display);font-size:1.15rem">${esc(f.q)}</div><div class="muted" style="font-size:.95rem">${esc(f.a)}</div></div>`).join('')}</div></div>
   <div class="panel grid"><h2>우리 반이 생각한 무역이 필요한 까닭</h2><div class="list">${done.map(x=>`<div><b>${x.n} ${esc(x.name)}</b>${esc(WHY_START+x.s1.why)}</div>`).join('')||'<p class="muted">아직 보낸 친구가 없어요</p>'}</div></div>
   <div class="rules"><b>핵심 질문</b><ul><li>한 나라 안에서 구할 수 있는 물자나 서비스라도 다른 나라에서 생산한 것을 이용하는 경우가 있을까요? 그 까닭은?</li></ul></div>`;
}
function natTable(nats,C,R){
  return `<table class="ntable"><thead><tr><th style="text-align:left">나라</th>${GOODS.map(g=>`<th>${g.e}<br>${g.n}</th>`).join('')}<th>꾸러미</th>${R===2?'<th>수출/수입</th>':''}</tr></thead><tbody>
   ${nats.map(x=>{const d=C[x.id]&&C[x.id]['r'+R];const inv=d&&d.inv;const best=bestOf(x);
     return `<tr><td>${x.e} ${x.n}</td>${GOODS.map(g=>inv?`<td class="${(inv[g.id]||0)===0?'z':''}">${inv[g.id]||0}</td>`:`<td class="${g.id===best?'best':x.r[g.id]===0?'z':''}"><small class="muted">일손 1명→</small> ${x.r[g.id]}</td>`).join('')}
       <td class="sets">${inv?sets(inv):'…'}</td>${R===2?`<td>${d?`${d.ex||0} / ${d.im||0}`:''}</td>`:''}</tr>`;}).join('')}</tbody></table>`;
}
function compareChart(nats,C){
  const W=820,H=340,L=60,B=290,T=56;
  const vals=nats.map(x=>{const c=C[x.id]||{};return {x,a:c.r1?sets(c.r1.inv):0,b:c.r2?sets(c.r2.inv):0};});
  const mx=Math.max(4,...vals.map(v=>Math.max(v.a,v.b)));
  const y=v=>B-(v/mx)*(B-T);
  const bw=Math.min(54,(W-L-20)/nats.length/2.6);
  let g=`<line x1="${L}" y1="${B}" x2="${W-10}" y2="${B}" stroke="#453422" stroke-width="2"/>`;
  for(let k=0;k<=mx;k+=Math.max(1,Math.ceil(mx/5))){g+=`<line x1="${L}" y1="${y(k)}" x2="${W-10}" y2="${y(k)}" stroke="#EADFC4"/><text x="${L-8}" y="${y(k)+5}" text-anchor="end" font-size="14" fill="#8A7458">${k}</text>`;}
  vals.forEach((v,i)=>{const cx=L+(i+.5)*(W-L-10)/nats.length;
    g+=`<rect x="${cx-bw-3}" y="${y(v.a)}" width="${bw}" height="${B-y(v.a)}" fill="#8DB3C7" rx="4"/><text x="${cx-bw/2-3}" y="${y(v.a)-6}" text-anchor="middle" font-size="18" fill="#3D6E8C" font-family="Jua">${v.a}</text>`;
    g+=`<rect x="${cx+3}" y="${y(v.b)}" width="${bw}" height="${B-y(v.b)}" fill="#F98F6E" rx="4"/><text x="${cx+bw/2+3}" y="${y(v.b)-6}" text-anchor="middle" font-size="18" fill="#E0704F" font-family="Jua">${v.b}</text>`;
    g+=`<text x="${cx}" y="${B+28}" text-anchor="middle" font-size="18" fill="#453422" font-family="Jua">${v.x.e} ${v.x.n}</text>`;});
  g+=`<rect x="${L+10}" y="6" width="16" height="16" fill="#8DB3C7"/><text x="${L+32}" y="20" font-size="15" fill="#453422">1라운드 혼자 만들기</text><rect x="${L+200}" y="6" width="16" height="16" fill="#F98F6E"/><text x="${L+222}" y="20" font-size="15" fill="#453422">2라운드 잘하는 것+무역</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="나라별 꾸러미 비교 그래프">${g}</svg></div>`;
}
function tvRound(main,S,R){
  const C=RD.c||{}, nats=activeNations(S);
  const tot=k=>nats.reduce((s,x)=>s+(C[x.id]&&C[x.id]['r'+k]?sets(C[x.id]['r'+k].inv):0),0);
  if(R===1){
    main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">1라운드: 우리 나라 혼자 만들기</h2><div class="closed" style="padding:6px 14px">🚫 국경 닫힘</div></div>
      <p class="muted" style="margin:0">일손 ${HANDS}명으로 ${GOODS.map(g=>g.e).join('')}를 모두 만들어야 꾸러미가 돼요. 숫자를 누르기 전에는 "일손 1명이 만드는 양"이 보여요.</p>
      ${natTable(nats,C,1)}
      <div class="bigsum"><div>우리 반 꾸러미<b style="color:#3D6E8C">${tot(1)}</b></div></div></div>
     <div class="rules"><b>핵심 질문</b><ul><li>나라마다 잘 만드는 상품이 다른 까닭은 무엇일까요? (자연환경, 자원, 자본, 기술)</li><li>사막나라는 왜 꾸러미를 만들지 못했을까요?</li></ul></div>`;
    return;
  }
  const L=Object.values(RD.log||{}).sort((a,b)=>b.at-a.at).slice(0,8);
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">2라운드: 잘하는 것 만들고 무역하기</h2><span class="muted">무역 ${Object.values(RD.log||{}).length}번</span></div>
     ${natTable(nats,C,2)}
     <div class="bigsum"><div>1라운드 꾸러미<b style="color:#3D6E8C">${tot(1)}</b></div><div style="border:0;background:none;font-size:2.4rem">→</div><div>2라운드 꾸러미<b style="color:#E0704F">${tot(2)}</b></div></div></div>
   <div class="two"><div class="panel grid"><h2>나라별 비교</h2>${compareChart(nats,C)}</div>
    <div class="panel grid"><h2>무역 소식</h2><div class="list">${L.map(l=>`<div>${esc(l.t)}</div>`).join('')||'<p class="muted">아직 무역이 없어요</p>'}</div></div></div>
   <div class="rules"><b>핵심 질문</b><ul><li>1라운드와 2라운드 중 언제 더 풍족했나요? 그 까닭은?</li><li>교과서 98쪽: ㉮ 나라는 옷, ㉯ 나라는 쌀처럼 잘 만드는 상품을 무역하면 어떤 좋은 점이 있을까요?</li></ul></div>`;
}
function tv4(main,S){
  const L=ranking(RD.students);
  const wrong={};S.forEach(x=>Object.entries((x.quiz&&x.quiz.wrong)||{}).forEach(([k,v])=>wrong[k]=(wrong[k]||0)+v));
  const hard=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>({q:QQ[k],v})).filter(x=>x.q);
  const top=Math.max(1,...L.map(x=>x.quiz.score||0));
  if(RD.award){
    const p=[L[1],L[0],L[2]];
    main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:2rem">정리 퀴즈 시상식</h2><button class="ghost" id="awoff">순위표로</button></div>
     <div class="podium">${p.map((x,k)=>x?`<div class="p${[2,1,3][k]} pop"><b>${[2,1,3][k]}등</b><span>${esc(x.n)} ${esc(x.name)}</span>${x.quiz.score||0}점</div>`:'<span></span>').join('')}</div></div>
     ${hard.length?`<div class="panel grid"><h2>우리 반이 가장 많이 틀린 문제</h2><div class="list">${hard.map(h=>`<div><b>${h.q.e}</b>${esc(h.q.q)}<br>정답: <b>${esc(h.q.a)}</b> <span class="muted">(틀린 횟수 ${h.v})</span></div>`).join('')}</div></div>`:''}`;
    $('#awoff').onclick=()=>roomRef(ROOM).child('award').set(false);
    return;
  }
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">정리 퀴즈 대결</h2><button id="awon">시상식 ▶</button></div>
   <p class="muted" style="margin:0">한 번에 맞히면 100점 + 빠르기 보너스 최대 50점. 틀리면 다시 골라야 넘어가요. ${QUIZ.length}문제.</p>
   <div class="rank">${L.map((x,k)=>`<div class="r"><b>${k+1}</b><span class="nm">${(NN[x.c]||{}).e||''} ${esc(x.n)} ${esc(x.name)}${x.quiz.done?' 🏁':''}</span><div class="bar trk"><div class="track"><div style="width:${(x.quiz.score||0)/top*100}%"></div></div></div><span class="pt">${x.quiz.score||0}</span></div>`).join('')||'<p class="muted">아직 시작한 친구가 없어요</p>'}</div></div>
   <div class="rules"><b>약속</b><ul><li>친구 화면은 보지 않아요.</li><li>다 푼 친구는 조용히 기다려요.</li></ul></div>`;
  $('#awon').onclick=()=>roomRef(ROOM).child('award').set(true);
}

/* ---------- route ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
</body></html>
