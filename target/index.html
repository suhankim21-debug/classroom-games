<title>과녁 넓이 연구소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* Same classroom notice-board look as 우리말 지킴이 so the class sees one family of tools. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .4em;font-size:1rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.quiz .q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.2rem;padding:.9em .5em;line-height:1.3}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}
.fig{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--coral2);line-height:1.25}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.5em .9em;font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.roll svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--cream);color:var(--ink);border:1px solid var(--line);padding:.35em .8em;font-family:var(--text);font-size:1rem;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:grid;gap:6px}
.fld label{font-family:var(--display);font-size:1.1rem}
.unit{display:flex;align-items:center;gap:8px}
.unit span{font-family:var(--display)}
.meter{position:relative;height:46px;background:var(--cream);border-radius:10px;margin:26px 0 8px}
.meter .band3{position:absolute;top:0;bottom:0;background:#DDEBE1}
.meter .mk{position:absolute;top:-24px;transform:translateX(-50%);font-family:var(--display);font-size:.95rem;white-space:nowrap}
.meter .ln{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}

.emoji{font-size:clamp(3rem,10vw,4.5rem);line-height:1}
.score{font-family:var(--display);font-size:1.3rem}

.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}

.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}

.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,15em) 1fr 3.5em;gap:10px;align-items:center}

.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}

.tbl th,.tbl td{background:#fff;padding:.45em .6em;text-align:center}
.tbl thead th{background:var(--coral);color:#fff;font-family:var(--display);font-weight:400}
.tbl tbody th{font-family:var(--display);font-weight:400;color:var(--coral2)}
.tbl tr.outr td,.tbl tr.outr th{background:#FFF4DF}
.okc{color:var(--ok);font-family:var(--display);font-size:1.3rem;font-weight:400}
.chart svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}

.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-size:1.1rem}
.legend i{display:inline-block;width:1.1em;height:1.1em;border-radius:4px;vertical-align:-.15em;margin-right:.3em}
.cnt{font-family:var(--display);font-size:1.4rem;text-align:center}
.tool{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tool button{font-size:1rem;padding:.5em .9em}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.objs button{background:#fff;color:var(--ink);border:2px solid var(--line);display:grid;gap:2px;justify-items:center;padding:.6em .4em;font-size:1.05rem}
.objs button b{font-size:1.8rem;font-weight:400}
.objs button[aria-pressed="true"]{border-color:var(--coral);background:#FFF4DF}
.rangebar{position:relative;height:30px;background:var(--cream);border-radius:8px}
.rangebar .sq{position:absolute;top:4px;bottom:4px;background:#F6D3C8;border-radius:6px}
.rangebar .gd{position:absolute;top:9px;bottom:9px;background:var(--ok);border-radius:6px}
.rangebar .ey{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--blue);border:2px solid #fff;transform:translate(-50%,-50%)}
.lane .road{position:relative;height:44px;background:repeating-linear-gradient(90deg,#F7E8C2 0 38px,#EFDDB0 38px 40px);border-radius:8px}
.lane{display:grid;grid-template-columns:8.5em 1fr 4em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:6px 12px}
.lane .nm{font-family:var(--display);font-size:1.15rem}
.lane .road .goal{position:absolute;right:2px;top:2px;font-size:36px;line-height:40px}
.lane .road .h{position:absolute;top:4px;font-size:30px;line-height:36px;transform:translateX(-50%);transition:left .8s ease-out}
.lane .pt{font-family:var(--display);font-size:1.3rem;text-align:right;font-variant-numeric:tabular-nums}
.track4{display:grid;gap:8px}
.dots svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
@media (max-width:820px){.lane{grid-template-columns:6em 1fr 3.4em}}

function quarterCells(r,u=1){

  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const far=((i+1)*u)**2+((j+1)*u)**2, near=(i*u)**2+(j*u)**2;
    if(far<=r*r+1e-9)inn.push(i+','+j); else if(near<r*r-1e-9)cross.push(i+','+j);}
  return {n,inn,cross};
}
function cellRange(r,u=1){const q=quarterCells(r,u);return {lo:r2(q.inn.length*4*u*u),hi:r2((q.inn.length+q.cross.length)*4*u*u),qi:q.inn.length,qc:q.cross.length};}

/* ---------- 그림: 과녁판과 정사각형 ---------- */
/* show: {inS, outS, tri, diag, rad, hexIn, hexOut} */
function targetSVG(show={},{big}={}){
  const W=420,C=210,R=150,s=R/R6;
  const rings=big?[200,186,172].map((rr,k)=>`<circle cx="${C}" cy="${C}" r="${rr}" fill="${['#2F5D7C','#C8452D','#2F5D7C'][k]}" opacity=".18"/>`).join(''):'';
  let g=`<rect x="0" y="0" width="${W}" height="${W}" fill="#FFFDF7"/>${rings}<circle cx="${C}" cy="${C}" r="${R}" fill="#F7D34A" stroke="#D3A72A" stroke-width="3"/>`;
  if(show.outS)g+=`<rect x="${C-R}" y="${C-R}" width="${2*R}" height="${2*R}" fill="none" stroke="#C8452D" stroke-width="5"/>`;
  if(show.inS){const p=[[C,C-R],[C+R,C],[C,C+R],[C-R,C]];g+=`<polygon points="${p.map(x=>x.join(',')).join(' ')}" fill="${show.tri?'none':'rgba(63,138,90,.25)'}" stroke="#3F8A5A" stroke-width="5"/>`;}
  if(show.tri){const T=[[[C,C],[C,C-R],[C+R,C]],[[C,C],[C+R,C],[C,C+R]],[[C,C],[C,C+R],[C-R,C]],[[C,C],[C-R,C],[C,C-R]]];
    g+=T.map((t,k)=>`<polygon points="${t.map(x=>x.join(',')).join(' ')}" fill="${k%2?'rgba(63,138,90,.45)':'rgba(63,138,90,.22)'}" stroke="#3F8A5A" stroke-width="2"/>`).join('');}
  if(show.diag)g+=`<line x1="${C-R}" y1="${C}" x2="${C+R}" y2="${C}" stroke="#3D6E8C" stroke-width="3" stroke-dasharray="8 6"/><line x1="${C}" y1="${C-R}" x2="${C}" y2="${C+R}" stroke="#3D6E8C" stroke-width="3" stroke-dasharray="8 6"/><text x="${C+R/2}" y="${C+26}" text-anchor="middle" font-size="20" fill="#3D6E8C" font-family="Jua">대각선 12\u00A0cm</text>`;
  if(show.hexIn||show.hexOut){const hx=(rr)=>Array.from({length:6},(_,k)=>{const a=Math.PI/3*k;return [C+rr*Math.cos(a),C+rr*Math.sin(a)].map(v=>v.toFixed(1)).join(',');}).join(' ');
    if(show.hexIn)g+=`<polygon points="${hx(R)}" fill="rgba(233,176,79,.25)" stroke="#E0704F" stroke-width="4"/>`;
    if(show.hexOut)g+=`<polygon points="${hx(R/Math.cos(Math.PI/6))}" fill="none" stroke="#3D6E8C" stroke-width="4" transform="rotate(0 ${C} ${C})"/>`;}
  if(show.rad!==false)g+=`<line x1="${C}" y1="${C}" x2="${C+R*Math.cos(-Math.PI/4)}" y2="${C+R*Math.sin(-Math.PI/4)}" stroke="#453422" stroke-width="3"/><circle cx="${C}" cy="${C}" r="5" fill="#453422"/><text x="${C+R*.42}" y="${C-R*.46}" font-size="22" fill="#453422" font-family="Jua" transform="rotate(-45 ${C+R*.42} ${C-R*.46})">6\u00A0cm</text>`;
  return `<svg class="fig2" viewBox="0 0 ${W} ${W}" role="img" aria-label="반지름 6\u00A0cm인 노란색 원">${g}</svg>`;
}

/* ---------- 그림: 모눈 칠하기 (사분원) ----------
   mode: 'in' 초록(완전히 안쪽) / 'cross' 주황(원이 지나가는 칸) / 'view' 칠하지 않고 보기 */
function mountGrid(el,{r,mode='in',state={},lock={},onChange}={}){
  const n=Math.ceil(r-1e-9),cs=Math.min(48,Math.floor(500/n)),P=28,W=P*2+n*cs,Cx=P,Cy=P+n*cs;
  const col={in:'#5FAE7A',cross:'#F2A65A'};
  let cells='';
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const k=i+','+j;cells+=`<rect data-k="${k}" x="${Cx+i*cs+1}" y="${Cy-(j+1)*cs+1}" width="${cs-2}" height="${cs-2}" rx="3"/>`;}
  const arc=`M ${Cx} ${Cy-r*cs} A ${r*cs} ${r*cs} 0 0 1 ${Cx+r*cs} ${Cy}`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="원의 4분의 1과 모눈"><g class="cells">${cells}</g>
    <path d="M ${Cx} ${Cy} L ${Cx} ${Cy-r*cs} ${arc.slice(arc.indexOf('A'))} Z" fill="rgba(247,211,74,.18)" stroke="none" pointer-events="none"/>
    <path d="${arc}" fill="none" stroke="#C8452D" stroke-width="4" pointer-events="none"/>
    <line x1="${Cx}" y1="${Cy}" x2="${Cx+r*cs}" y2="${Cy}" stroke="#453422" stroke-width="2" pointer-events="none"/><circle cx="${Cx}" cy="${Cy}" r="5" fill="#453422" pointer-events="none"/>
    <text x="${Cx+r*cs/2}" y="${Cy+20}" text-anchor="middle" font-size="16" fill="#453422" font-family="Jua" pointer-events="none">반지름 ${nf(r)}\u00A0cm</text>
    <text x="${Cx}" y="${Cy+20}" text-anchor="middle" font-size="13" fill="#8A7458" pointer-events="none">중심</text><g class="mk" pointer-events="none"></g></svg>`;
  const svg=$('svg',el);
  const paint=()=>{$$('rect[data-k]',svg).forEach(rc=>{const v=lock[rc.dataset.k]||state[rc.dataset.k];rc.setAttribute('fill',v?col[v]:'#FFFFFF');rc.setAttribute('stroke','#C9BC98');rc.setAttribute('stroke-width','1');});};
  paint();
  if(mode!=='view'){
    let down=false,val=null;
    const hit=(x,y)=>{const t=document.elementFromPoint(x,y);return t&&t.dataset&&t.dataset.k&&svg.contains(t)?t.dataset.k:null;};
    svg.addEventListener('pointerdown',e=>{const k=hit(e.clientX,e.clientY);if(!k||lock[k])return;down=true;val=state[k]===mode?'':mode;if(val)state[k]=val;else delete state[k];paint();onChange&&onChange();e.preventDefault();});
    svg.addEventListener('pointermove',e=>{if(!down)return;const k=hit(e.clientX,e.clientY);if(!k||lock[k])return;if(val)state[k]=val;else delete state[k];paint();onChange&&onChange();});
    const up=()=>{down=false;};window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  }
  const mark=(missing,extra)=>{
    $('.mk',svg).innerHTML=missing.map(k=>{const [i,j]=k.split(',').map(Number);return `<rect x="${Cx+i*cs+3}" y="${Cy-(j+1)*cs+3}" width="${cs-6}" height="${cs-6}" rx="3" fill="none" stroke="#3D6E8C" stroke-width="3" stroke-dasharray="5 4"/>`;}).join('')
      +extra.map(k=>{const [i,j]=k.split(',').map(Number),x=Cx+i*cs,y=Cy-(j+1)*cs;return `<path d="M ${x+8} ${y+8} L ${x+cs-8} ${y+cs-8} M ${x+cs-8} ${y+8} L ${x+8} ${y+cs-8}" stroke="#C8452D" stroke-width="3"/>`;}).join('');};
  return {paint,mark,count:m=>Object.values(state).filter(v=>v===m).length};
}
/* 원 전체 + 모눈 (TV): u = 모눈 한 칸(cm) */
function fullGridSVG(r,{u=1,show='both'}={}){
  const n=Math.ceil(r/u-1e-9),cs=Math.min(30,Math.floor(560/(2*n))),P=16,W=P*2+2*n*cs,C=P+n*cs,q=quarterCells(r,u);
  const IN=new Set(q.inn),CR=new Set(q.cross);let g='';
  for(let i=-n;i<n;i++)for(let j=-n;j<n;j++){const k=(i<0?-i-1:i)+','+(j<0?-j-1:j);
    const f=IN.has(k)&&(show!=='none')?'#5FAE7A':CR.has(k)&&show==='both'?'#F2A65A':'#fff';
    g+=`<rect x="${C+i*cs}" y="${C-(j+1)*cs}" width="${cs}" height="${cs}" fill="${f}" stroke="#D6C9A4" stroke-width="1"/>`;}
  g+=`<circle cx="${C}" cy="${C}" r="${r/u*cs}" fill="none" stroke="#C8452D" stroke-width="4"/>`;
  return `<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="모눈 위의 원" style="width:100%;max-width:520px;height:auto;display:block;margin:0 auto;background:#fff;border-radius:14px;border:2px solid var(--line)">${g}</svg>`;
}

    if(b.dataset.o===a){b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);$('#pm',box).className='msg ok';$('#pm',box).textContent='맞았어요!';setTimeout(onOk,600);}
    else{b.classList.add('wrong');b.disabled=true;box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');$('#pm',box).className='msg bad';$('#pm',box).textContent='다시 골라 봐요';}
  });
}
/* 칸 채우기: fields=[{id,want,label}] , hint(values)->안내 */
function fillEq(box,{html,fields,hint,okText,onOk,solve}){
  box.innerHTML=html+`<div class="msg" id="wm" role="status"></div><div class="row" id="act" style="justify-content:center"><button id="chk">확인하기</button></div>`;
  let miss=0;
  $('#chk').onclick=async()=>{
    const v=fields.map(f=>num($('#'+f.id,box).value));
    const bad=t=>{$('#wm',box).className='msg bad';$('#wm',box).innerHTML=t;};
    if(v.some(x=>x==null))return bad('빈칸을 모두 채워요.');
    if(fields.some((f,k)=>!same(v[k],f.want))){miss++;return bad((hint(v)||'다시 계산해 봐요.')+(miss>=2&&solve?`<br>풀이: ${solve}`:''));}
    $('#chk').disabled=true;$$('input',box).forEach(x=>x.disabled=true);
    $('#wm',box).className='msg ok';$('#wm',box).innerHTML=okText;
    onOk(miss);
  };
}

  fillEq(box,{html:`<h2>⭐ 빨리 끝낸 친구 도전: 정육각형으로 어림하기</h2><p class="muted" style="margin:0">(지도서 수업 활동 아이디어) 다른 원이에요. 원 안 정육각형은 삼각형 6개(한 개 <b>30\u00A0cm²</b>), 원 밖 정육각형은 삼각형 6개(한 개 <b>40\u00A0cm²</b>)로 나뉘어요.</p>
     ${targetSVG({hexIn:1,hexOut:1,rad:false})}
     <div class="eq"><input id="a" type="number" inputmode="numeric" aria-label="원 안 정육각형"> cm² &lt; (원의 넓이) &lt; <input id="b" type="number" inputmode="numeric" aria-label="원 밖 정육각형"> cm²</div>`,
    fields:[{id:'a',want:180},{id:'b',want:240}],hint:()=>'삼각형 한 개의 넓이 × 6을 해 봐요.',solve:'30 × 6 = 180, 40 × 6 = 240',
    okText:'맞았어요! 정육각형은 원에 더 꼭 맞아서 범위가 좁아져요.',onOk:async()=>{ME.s1={...ME.s1,hex:true};await roomRef(me.room).child('students/'+me.num+'/s1/hex').set(true);}});
}

/* ---------- 2. 모눈으로 어림하기 (교과서 115쪽) ---------- */
function stage2(){
  const R={ph:0,miss:0,...(ME.s2||{})};

  const Q=quarterCells(R6);
  const st={},lock={};

  if(R.ph>=3)Q.cross.forEach(k=>lock[k]='cross');
  const tips=['','<b>원 안에 완전히 들어간 칸</b>만 초록색으로 칠해요. 손가락으로 쭉 그어도 돼요.','<b>빨간 선(원)이 지나가는 칸</b>을 주황색으로 칠해요.'];
  shell(`<div class="two"><div class="panel grid"><div><span class="band">2단계 · 모눈으로 어림하기</span></div>
    <h2>반지름 6\u00A0cm인 원을 모눈종이(한 칸 1\u00A0cm²)에 그렸어요. 원의 4분의 1만 세고 4배 하면 빨라요!</h2>
    <div class="gridbox" id="gb"></div><div class="legend"><span><i style="background:#5FAE7A"></i>원 안쪽 칸</span><span><i style="background:#F2A65A"></i>원이 지나가는 칸</span></div></div>
   <div class="panel grid" id="work"></div></div>`);
  const save=async p=>{Object.assign(R,p);ME.s2={...R};await roomRef(me.room).child('students/'+me.num+'/s2').update(p);drawSteps();};

    work.innerHTML=`<h2>${R.ph===0?'① 초록 칸 칠하기':'② 주황 칸 칠하기'}</h2><p style="margin:0">${tips[R.ph===0?1:2]}</p>

    let miss=0;
    $('#clr').onclick=()=>{Object.keys(st).forEach(k=>delete st[k]);G.paint();G.mark([],[]);$('#cn').textContent=0;};
    $('#chk').onclick=async()=>{
      const mine=Object.keys(st).filter(k=>st[k]===mode),W=new Set(want);
      const missing=want.filter(k=>st[k]!==mode),extra=mine.filter(k=>!W.has(k));

        $('#wm').className='msg bad';
        $('#wm').innerHTML=(R.ph===0?(extra.length?`원에 걸친 칸은 빼요. `:''):(extra.length?'원이 지나가지 않는 칸이 있어요. ':''))+(missing.length?`빠진 칸이 ${missing.length}칸 있어요.`:'')+(miss>=2?'<br>파란 점선 칸은 더 칠하고, ✕ 칸은 지워요.':'');
        if(miss>=2)G.mark(missing,extra);return;}
      addMiss(miss);$('#chk').disabled=true;$('#wm').className='msg ok';$('#wm').textContent=`맞았어요! ${want.length}칸`;
      await new Promise(r=>setTimeout(r,RM?0:700));await save({ph:R.ph+1});stage2();
    };
    return;
  }
  mountGrid($('#gb'),{r:R6,mode:'view',lock});
  if(R.ph===1)return fillEq(work,{html:`<h2>원 안쪽 모눈의 수</h2><p style="margin:0">4분의 1에 초록 칸이 <b>${Q.inn.length}칸</b>이에요. 원 전체에는 몇 칸일까요?</p>
      <div class="eq">${Q.inn.length} × <input id="a" type="number" inputmode="numeric" aria-label="몇 배"> = <input id="b" type="number" inputmode="numeric" aria-label="초록 칸 수"> 칸</div>`,
    fields:[{id:'a',want:4},{id:'b',want:Q.inn.length*4}],hint:()=>'원 전체는 4분의 1이 4개예요.',solve:`${Q.inn.length} × 4 = <b>${Q.inn.length*4}</b>`,
    okText:`맞았어요! 초록색 선 안쪽 모눈은 ${Q.inn.length*4}칸`,onOk:async m=>{addMiss(m);await new Promise(r=>setTimeout(r,RM?0:900));await save({ph:2});stage2();}});
  if(R.ph===3){const tot=Q.inn.length+Q.cross.length;
    return fillEq(work,{html:`<h2>원에 걸친 칸까지 센 모눈의 수</h2><p style="margin:0">4분의 1에 초록 ${Q.inn.length}칸 + 주황 ${Q.cross.length}칸이에요. 원 전체에는 몇 칸일까요?</p>
      <div class="eq">( ${Q.inn.length} + ${Q.cross.length} ) × 4 = <input id="a" type="number" inputmode="numeric" aria-label="빨간 선 안쪽 칸 수"> 칸</div>`,
    fields:[{id:'a',want:tot*4}],hint:v=>same(v[0],Q.cross.length*4)?'초록 칸도 더해요.':'',solve:`${tot} × 4 = <b>${tot*4}</b>`,
    okText:`맞았어요! 빨간색 선 안쪽 모눈은 ${tot*4}칸`,onOk:async m=>{addMiss(m);await new Promise(r=>setTimeout(r,RM?0:900));await save({ph:4});stage2();}});}
  if(R.ph===4){const c=cellRange(R6);
    return fillEq(work,{html:`<h2>모눈으로 원의 넓이 어림하기</h2><p style="margin:0">모눈 한 칸은 1\u00A0cm²예요.</p>
      <div class="eq"><input id="a" type="number" inputmode="numeric" aria-label="작은 쪽"> cm² &lt; (원의 넓이) &lt; <input id="b" type="number" inputmode="numeric" aria-label="큰 쪽"> cm²</div>`,

  return pick(work,{q:'정사각형: 72 ~ 144\u00A0cm²<br>모눈: 88 ~ 132\u00A0cm²<br>어느 쪽이 더 정확하게 어림했을까요?',a:'모눈 (범위가 더 좁아요)',o:['정사각형 (범위가 더 넓어요)','둘 다 똑같아요'],onOk:async()=>{await save({done:true,at:Date.now()});stage2();}});
}
function s2Done(){
  shell(`<div class="panel quiz pop"><div><span class="band">2단계 끝</span></div><div class="big">88\u00A0cm² &lt; (원의 넓이) &lt; 132\u00A0cm²</div>
    <table class="tbl" style="max-width:560px"><thead><tr><th>어림한 방법</th><th>범위</th><th>차이</th></tr></thead><tbody>

}

/* ---------- 3. 짝과 교실 원 물건 넓이 어림하기 (교과서 115쪽 3번) ---------- */
let s3={};
function stage3(){
  const items=Object.values((ME.s3&&ME.s3.items)||{}).sort((a,b)=>a.at-b.at);
  const C=s3;
  if(!C.ph){s3=Object.assign(C,{ph:'pick',st:{},lock:{}});}
  shell(`<div class="panel grid"><div class="row" style="justify-content:space-between"><span class="band">3단계 · 짝과 교실의 둥근 물건 넓이 어림하기</span><span class="muted">어림한 물건 ${items.length}개</span></div>
    <p style="margin:0">짝과 둥근 물건 하나를 골라 <b>자로 지름</b>을 재요. 짝과 함께 재고, 모눈은 각자 칠해요. 다 하면 물건을 바꿔 하나 더!</p></div>
   <div class="two"><div class="panel grid" id="left"></div><div class="panel grid" id="work"></div></div>
   <div class="panel grid"><h2>내가 어림한 물건</h2><div id="mine"></div></div>`);
  mineTable();
  const left=$('#left'),work=$('#work');
  if(C.ph==='pick'){
    left.innerHTML=`<h2>어떤 물건을 잴까요?</h2><div class="objs" id="ob">${OBJS.map((o,k)=>`<button data-k="${k}" aria-pressed="${C.k===k}"><b>${o.e}</b>${o.nm}</button>`).join('')}</div><input id="own" placeholder="물건 이름" style="display:${C.k===OBJS.length-1?'block':'none'}">`;
    work.innerHTML=`<div class="fld"><label for="dd">자로 잰 지름 (${DMIN}~${DMAX}\u00A0cm, 0.5\u00A0cm 단위까지)</label><div class="unit"><input id="dd" type="number" inputmode="decimal" step="0.5" min="${DMIN}" max="${DMAX}"><span>cm</span></div></div>
      <div class="fld"><label for="eye">넓이를 눈으로 어림하면? (계산하지 않기)</label><div class="unit"><input id="eye" type="number" inputmode="numeric"><span>cm²</span></div></div>
      <div class="msg bad" id="wm" role="status"></div><button id="go">모눈에 그려 보기 ▶</button>`;
    $$('#ob button').forEach(b=>b.onclick=()=>{C.k=+b.dataset.k;$$('#ob button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#own').style.display=C.k===OBJS.length-1?'block':'none';});
    $('#go').onclick=()=>{const d=num($('#dd').value),eye=num($('#eye').value),bad=t=>$('#wm').textContent=t;
      if(C.k==null)return bad('물건을 골라요.');
      const nm=C.k===OBJS.length-1?$('#own').value.trim().slice(0,12):OBJS[C.k].nm;if(!nm)return bad('물건 이름을 써요.');
      if(d==null)return bad('지름을 써요.');
      if(d<DMIN||d>DMAX)return bad(d>DMAX?`지름이 ${DMAX}\u00A0cm보다 크면 칸이 너무 많아요. 더 작은 물건을 골라요.`:`지름이 ${DMIN}\u00A0cm보다 작으면 칸이 너무 적어요. 더 큰 물건을 골라요.`);
      if(Math.abs(d*2-Math.round(d*2))>1e-9)return bad('0.5\u00A0cm 단위로 써요. 예) 12.5');
      if(!(eye>0))return bad('눈 어림 넓이를 써요.');
      Object.assign(C,{ph:'in',obj:nm,e:OBJS[C.k].e,d,r:d/2,eye:Math.round(eye),st:{},lock:{}});ClassWatch.step('우리 교실 원 · 칠하기',{n:3,total:4});stage3();};
    return;
  }
  const Q=quarterCells(C.r);
  left.innerHTML=`<h2>${esc(C.e)} ${esc(C.obj)} · 지름 ${nf(C.d)}\u00A0cm → 반지름 ${nf(C.r)}\u00A0cm</h2><div class="gridbox" id="gb"></div><div class="legend"><span><i style="background:#5FAE7A"></i>원 안쪽 칸</span><span><i style="background:#F2A65A"></i>원이 지나가는 칸</span></div>`;
  if(C.ph==='in'||C.ph==='cross'){
    const mode=C.ph,want=mode==='in'?Q.inn:Q.cross;
    const G=mountGrid($('#gb'),{r:C.r,mode,state:C.st,lock:C.lock,onChange:()=>{$('#cn').textContent=G.count(mode);}});
    work.innerHTML=`<h2>${mode==='in'?'① 원 안에 완전히 들어간 칸을 초록색으로':'② 원이 지나가는 칸을 주황색으로'}</h2><p class="muted" style="margin:0">원의 4분의 1이에요. 다 세면 앱이 4배 해 줘요.</p>
      <div class="cnt">칠한 칸: <b id="cn">${G.count(mode)}</b>칸</div><div class="msg" id="wm" role="status"></div>
      <div class="tool"><button class="ghost" id="back">물건 다시 고르기</button><button class="ghost" id="clr">지우기</button><button id="chk">다 칠했어요</button></div>`;
    let miss=0;
    $('#back').onclick=()=>{s3={};stage3();};
    $('#clr').onclick=()=>{Object.keys(C.st).forEach(k=>delete C.st[k]);G.paint();G.mark([],[]);$('#cn').textContent=0;};
    $('#chk').onclick=()=>{
      const W=new Set(want),missing=want.filter(k=>C.st[k]!==mode),extra=Object.keys(C.st).filter(k=>C.st[k]===mode&&!W.has(k));
      if(missing.length||extra.length){miss++;$('#wm').className='msg bad';
        $('#wm').innerHTML=(extra.length?(mode==='in'?'원에 걸친 칸은 빼요. ':'원이 지나가지 않는 칸이 있어요. '):'')+(missing.length?`빠진 칸이 ${missing.length}칸 있어요.`:'')+(miss>=2?'<br>파란 점선 칸은 더 칠하고, ✕ 칸은 지워요.':'');

      <div class="eq"><input id="a" type="number" inputmode="numeric" aria-label="작은 쪽"> cm² &lt; (원의 넓이) &lt; <input id="b" type="number" inputmode="numeric" aria-label="큰 쪽"> cm²</div>`,
    fields:[{id:'a',want:lo},{id:'b',want:hi}],hint:v=>same(v[0],Q.inn.length)?'원 전체는 4분의 1의 4배예요.':same(v[1],Q.cross.length*4)?'큰 쪽은 초록 칸과 주황 칸을 더해서 4배 해요.':'',

    okText:`맞았어요! ${C.obj}의 넓이는 ${lo}\u00A0cm²보다 넓고 ${hi}\u00A0cm²보다 좁아요. 눈 어림 ${C.eye}\u00A0cm²는 ${C.eye>lo&&C.eye<hi?'범위 안이에요 👍':'범위 밖이었어요'}`,
    onOk:async()=>{
      const it={obj:C.obj,e:C.e,d:C.d,eye:C.eye,lo,hi,at:Date.now()};

      if(!(ME.s3&&ME.s3.done))await roomRef(me.room).child('students/'+me.num+'/s3/done').set(true);
      mineTable();
      $('#act').innerHTML=`<button id="more">다른 물건 하나 더 ▶</button>`;
      $('#more').onclick=()=>{s3={};stage3();};
    }});
}

function mineTable(){
  const el=$('#mine');if(!el)return;
  const items=Object.values((ME.s3&&ME.s3.items)||{}).sort((a,b)=>a.at-b.at);
  el.innerHTML=items.length?`<table class="tbl"><thead><tr><th>물건</th><th>지름</th><th>눈 어림</th><th>모눈으로 어림한 넓이</th></tr></thead><tbody>${items.map(x=>`<tr><th>${esc(x.e)} ${esc(x.obj)}</th><td>${nf(x.d)}\u00A0cm</td><td>${x.eye}\u00A0cm² ${x.eye>x.lo&&x.eye<x.hi?'✓':''}</td><td><b>${x.lo}\u00A0cm²</b>보다 넓고 <b>${x.hi}\u00A0cm²</b>보다 좁아요</td></tr>`).join('')}</tbody></table>`:'<p class="muted" style="margin:0">아직 없어요</p>';
}

/* ---------- 4. 과녁 맞히기 ---------- */
async function stage4(){
  if(ME.game&&ME.game.done)return gameDone();
  let G=ME.game;
  if(!G||!G.order){
    G={order:shuffle(GAME.map(g=>g.id)),i:0,score:0,started:Date.now()};
    await roomRef(me.room).child('students/'+me.num+'/game').set(G);ME.game=G;
  }
  if(cur!==4)return;
  const rest=G.order.slice(G.i||0).map(id=>GQ[id]).filter(Boolean);
  shell(`<div class="panel quiz" id="gz"></div>`);
  if(!rest.length)return finishGame();
  let score=G.score||0,idx=G.i||0;
  onMe=()=>drawSteps();
  runQuiz($('#gz'),rest,{band:'4단계 · 과녁 맞히기',fig:q=>`<div class="emoji" aria-hidden="true">${q.e}</div>`,
    progress:()=>`<div class="score">점수 <b id="sc">${score}</b>점 · ${idx+1}/${GAME.length}번째 문제</div>`,
    onRight:async(q,ok,sec)=>{
      const pts=ok?100+Math.round(50*Math.max(0,Math.min(1,1-(sec-5)/20))):0;
      score+=pts;idx++;
      await roomRef(me.room).child('students/'+me.num+'/game').update({i:idx,score});
      ME.game={...ME.game,i:idx,score};
      return pts?` +${pts}점, 화살이 날아가요! 🏹`:' (두 번째 도전은 점수 없이 넘어가요)';
    },
    onWrong:q=>{roomRef(me.room).child(`students/${me.num}/game/wrong/${q.id}`).transaction(v=>(v||0)+1);},
    onEnd:finishGame});
}
async function finishGame(){
  await roomRef(me.room).child('students/'+me.num+'/game').update({done:true,at:Date.now()});
  ME.game={...ME.game,done:true};drawSteps();gameDone();
}
async function gameDone(){
  const G=ME.game||{};
  let rankTxt='';
  if(ROOMV.award){
    const all=(await roomRef(me.room).child('students').get()).val()||{};

function ranking(all){

function enterRoom(){

  });
  listen(roomRef(me.room).child('stage'),s=>{

}
function stepDone(n){return n===1?!!(ME.s1&&ME.s1.done):n===2?!!(ME.s2&&ME.s2.done):n===3?!!(ME.s3&&ME.s3.done):!!(ME.game&&ME.game.done);}
function drawSteps(){

function renderStage(){
  ClassWatch.step(STAGES[cur].k,{n:cur,total:4,wait:stepDone(cur)});

}
function runQuiz(box,qs,{band,fig,onRight,onWrong,onEnd,progress}){
  let i=0,missed=false;
  const draw=()=>{
    const q=qs[i];const opts=shuffle([q.a,...q.o]);missed=false;const t0=Date.now();
    box.innerHTML=`<div><span class="band">${band}</span></div>
     <div class="prog">${qs.map((_,k)=>`<span class="${k<i?'on':k===i?'cur':''}"></span>`).join('')}</div>
     ${progress?progress():''}<div class="pop" style="width:100%">${fig?fig(q):''}</div><div class="q">${esc(q.q)}</div>
     <div class="opts">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
     <div class="msg" id="qm" role="status"></div>`;
    $$('.opts button',box).forEach(b=>b.onclick=async()=>{
      if(b.dataset.o===q.a){
        b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);
        $('#qm',box).className='msg ok';
        const extra=onRight?await onRight(q,!missed,(Date.now()-t0)/1000,i):'';
        $('#qm',box).textContent='맞았어요!'+(extra||'');
        await new Promise(r=>setTimeout(r,650));
        i++;if(i<qs.length)return draw();
        onEnd();
      }else{
        missed=true;b.classList.add('wrong');b.disabled=true;
        box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
        $('#qm',box).className='msg bad';$('#qm',box).textContent='다시 골라 봐요';
        if(onWrong)onWrong(q);
      }
    });
  };
  draw();
}

function eyePlot(vals,lo,hi,{max=250}={}){
  const W=900,H=150,X0=30,S=(W-2*X0)/max,x=v=>X0+Math.min(max,Math.max(0,v))*S;
  let g=`<rect x="${x(lo)}" y="40" width="${(hi-lo)*S}" height="56" fill="#E3F1E7" rx="6"/><line x1="${X0}" y1="96" x2="${W-X0}" y2="96" stroke="#453422" stroke-width="2"/>`;
  for(let v=0;v<=max;v+=50)g+=`<line x1="${x(v)}" y1="96" x2="${x(v)}" y2="104" stroke="#453422"/><text x="${x(v)}" y="124" text-anchor="middle" font-size="16" fill="#6D4215">${v}</text>`;
  g+=`<text x="${x(lo)}" y="32" text-anchor="middle" font-size="16" fill="#3F8A5A" font-family="Jua">${lo}</text><text x="${x(hi)}" y="32" text-anchor="middle" font-size="16" fill="#3F8A5A" font-family="Jua">${hi}</text>`;
  const cnt={};vals.forEach(v=>{const b=Math.round(Math.min(max,v)/5);cnt[b]=(cnt[b]||0)+1;g+=`<circle cx="${x(v)}" cy="${86-(cnt[b]-1)*13}" r="7" fill="${v>lo&&v<hi?'#3F8A5A':'#E0704F'}" stroke="#fff" stroke-width="2"/>`;});
  g+=`<text x="${W-X0}" y="144" text-anchor="end" font-size="14" fill="#8A7458">(cm²) ${vals.some(v=>v>max)?`· ${max}보다 큰 값은 끝에 표시`:''}</text>`;
  return `<div class="dots"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="우리 반 눈 어림">${g}</svg></div>`;
}

    ${rows.map(r=>{const rr=r.d/2,sl=2*rr*rr,sh=4*rr*rr;return `<tr><th style="white-space:nowrap">${esc(r.n+' '+r.name)}</th><td>${esc(r.e)} ${esc(r.obj)}</td><td style="white-space:nowrap">${nf(r.d)}\u00A0cm</td><td>${r.lo} ~ ${r.hi}\u00A0cm²</td>
      <td><div class="rangebar"><div class="sq" style="left:${pos(sl)}%;width:${pos(sh)-pos(sl)}%"></div><div class="gd" style="left:${pos(r.lo)}%;width:${pos(r.hi)-pos(r.lo)}%"></div><div class="ey" style="left:${pos(r.eye)}%"></div></div></td>
      <td>${r.eye}\u00A0cm² ${r.eye>r.lo&&r.eye<r.hi?'<span class="okc">✓</span>':''}</td></tr>`;}).join('')||'<tr><td colspan="6" class="muted">짝과 재어 어림하면 여기에 모여요</td></tr>'}</tbody></table></div>
   <div class="rules"><b>이야기해 봐요</b><ul><li>눈으로 어림한 값이 모눈으로 어림한 범위 안에 있나요?</li><li>지름이 2배가 되면 넓이는 몇 배쯤 될까요? (표에서 찾아봐요)</li></ul></div>`;
}
function tv4(main,S){
  const L=ranking(RD.students);
  const wrong={};S.forEach(x=>Object.entries((x.game&&x.game.wrong)||{}).forEach(([k,v])=>wrong[k]=(wrong[k]||0)+v));
  const hard=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>({q:GQ[k],v})).filter(x=>x.q);
  if(RD.award){
    const p=[L[1],L[0],L[2]];
    main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:2rem">과녁 맞히기 시상식</h2><button class="ghost" id="awoff">경기장으로</button></div>
     <div class="podium">${p.map((x,k)=>x?`<div class="p${[2,1,3][k]} pop"><b>${[2,1,3][k]}등</b><span>${esc(x.n)} ${esc(x.name)}</span>${x.game.score||0}점</div>`:'<span></span>').join('')}</div></div>
     ${hard.length?`<div class="panel grid"><h2>우리 반이 가장 많이 틀린 문제</h2><div class="list">${hard.map(h=>`<div><b>${h.q.e}</b>${esc(h.q.q)}<br>정답: <b>${esc(h.q.a)}</b> <span class="muted">(틀린 횟수 ${h.v})</span></div>`).join('')}</div></div>`:''}`;
    $('#awoff').onclick=()=>roomRef(ROOM).child('award').set(false);
    return;
  }
  const max=GAME.length*150;
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">과녁 맞히기</h2><button id="awon">시상식 ▶</button></div>
   <p class="muted" style="margin:0">맞힌 만큼 화살이 과녁으로 날아가요. 한 번에 맞히면 100점 + 빠르기 보너스 최대 50점. 틀리면 다시 골라야 넘어가요. ${GAME.length}문제.</p>
   <div class="track4">${L.map(x=>`<div class="lane"><span class="nm">${esc(x.n)} ${esc(x.name)}${x.game.done?' 🎯':''}</span><div class="road"><span class="goal" aria-hidden="true">🎯</span><span class="h" style="left:${4+Math.min(1,(x.game.score||0)/max)*84}%" aria-hidden="true">🏹</span></div><span class="pt">${x.game.score||0}</span></div>`).join('')||'<p class="muted">아직 시작한 친구가 없어요</p>'}</div></div>
   <div class="rules"><b>약속</b><ul><li>친구 화면은 보지 않아요.</li><li>소리 지르지 않고, 다 푼 친구는 조용히 기다려요.</li></ul></div>`;
  $('#awon').onclick=()=>roomRef(ROOM).child('award').set(true);
}

else if(location.hash==='#teacher')teacherView();
