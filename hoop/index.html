<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>굴렁쇠 레이스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* Same classroom notice-board look as 우리말 지킴이 so the class sees one family of tools. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .4em;font-size:1rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.quiz .q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.2rem;padding:.9em .5em;line-height:1.3}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}
.fig{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--coral2);line-height:1.25}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.5em .9em;font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.roll svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--cream);color:var(--ink);border:1px solid var(--line);padding:.35em .8em;font-family:var(--text);font-size:1rem;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:grid;gap:6px}
.fld label{font-family:var(--display);font-size:1.1rem}
.unit{display:flex;align-items:center;gap:8px}
.unit span{font-family:var(--display)}
.meter{position:relative;height:46px;background:var(--cream);border-radius:10px;margin:26px 0 8px}
.meter .band3{position:absolute;top:0;bottom:0;background:#DDEBE1}
.meter .mk{position:absolute;top:-24px;transform:translateX(-50%);font-family:var(--display);font-size:.95rem;white-space:nowrap}
.meter .ln{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.meter .dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--coral2);transform:translate(-50%,-50%);border:3px solid #fff}
.list{display:grid;gap:8px}
.list div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px}
.list div.out{border-left-color:var(--gold)}
.list b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
.emoji{font-size:clamp(3rem,10vw,4.5rem);line-height:1}
.score{font-family:var(--display);font-size:1.3rem}
/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,15em) 1fr 3.5em;gap:10px;align-items:center}
.bar .track{height:34px;border-radius:10px;background:var(--cream);overflow:hidden}
.bar .track div{height:100%;background:var(--ok);border-radius:10px}
.bar span{font-family:var(--display);font-size:1.1rem}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:2.6em 9em 1fr 5em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 12px}
.rank .r b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--coral2)}
.rank .r .nm{font-family:var(--display);font-size:1.25rem}
.rank .r .pt{font-family:var(--display);font-size:1.4rem;text-align:right;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.6rem}
.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:1.1rem}
.tbl th,.tbl td{background:#fff;padding:.45em .6em;text-align:center}
.tbl thead th{background:var(--coral);color:#fff;font-family:var(--display);font-weight:400}
.tbl tbody th{font-family:var(--display);font-weight:400;color:var(--coral2)}
.tbl tr.outr td,.tbl tr.outr th{background:#FFF4DF}
.okc{color:var(--ok);font-family:var(--display);font-size:1.3rem;font-weight:400}
.chart svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
@media (max-width:820px){
  .hero,.tv,.two{grid-template-columns:1fr}
  .choose,.opts{grid-template-columns:1fr}
  .steps button{font-size:.85rem}
  .rank .r{grid-template-columns:2.2em 1fr 4.5em}.rank .r .trk{display:none}
}
/* 굴렁쇠 레이스 */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.teams button{background:#fff;color:var(--ink);border:3px solid var(--line);display:grid;gap:4px;text-align:left;padding:12px 14px}
.teams button b{font-size:1.4rem;font-weight:400}
.teams button span{font-family:var(--text);font-size:.95rem;color:var(--muted)}
.formula{font-family:var(--display);font-size:clamp(1.3rem,3.6vw,1.9rem);background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4em .8em;text-align:center}
.formula u{text-decoration:none;color:var(--coral2)}
.eq{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-family:var(--display);font-size:1.5rem}
.eq input{width:6.2em;text-align:center;font-size:1.3rem}
.eq .r{width:7.5em}
.coin{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;background:var(--gold);color:#fff;border:6px solid #D39A36;margin:0 auto;line-height:1.15;text-align:center}
@media (prefers-reduced-motion:no-preference){.coin.flip{animation:flip .9s ease-out}@keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(1440deg)}}}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.card.in{border-color:var(--coral)}
.fbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbtn button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.fbtn button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.track4{display:grid;gap:8px}
.lane{display:grid;grid-template-columns:8.5em 1fr 4em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:6px 12px}
.lane .nm{font-family:var(--display);font-size:1.15rem}
.lane .road{position:relative;height:44px;background:repeating-linear-gradient(90deg,#F7E8C2 0 38px,#EFDDB0 38px 40px);border-radius:8px}
.lane .road .goal{position:absolute;right:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(0deg,#453422 0 6px,#fff 6px 12px)}
.lane .road .h{position:absolute;top:2px;width:40px;height:40px;transform:translateX(-50%);transition:left .8s ease-out}
.lane .pt{font-family:var(--display);font-size:1.3rem;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:820px){.lane{grid-template-columns:6em 1fr 3.4em}.fbtn{grid-template-columns:1fr}}
</style></head><body>

function mountHoop(el,{d=60,big}={}){
  const W=900,X0=34,MAX=250,S=(W-X0*2)/MAX,BY=big?250:236,H=BY+64;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="굴렁쇠 굴리기" style="width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)"><g class="ax"></g><line class="tr" x1="${X0}" y1="${BY}" x2="${X0}" y2="${BY}" stroke="#E0704F" stroke-width="8" stroke-linecap="round"/><g class="hp"></g><g class="lb"></g></svg>`;
  let ax=`<rect x="${X0-8}" y="${BY}" width="${MAX*S+16}" height="40" rx="6" fill="#DCEBF2"/>`;
  for(let c=0;c<=MAX;c+=10){const x=X0+c*S;ax+=`<line x1="${x}" y1="${BY}" x2="${x}" y2="${BY+(c%50?8:14)}" stroke="#453422" stroke-width="2"/>${c%50?'':`<text x="${x}" y="${BY+32}" text-anchor="middle" font-size="15" fill="#6D4215">${c}</text>`}`;}
  $('.ax',el).innerHTML=ax+`<text x="${X0+MAX*S}" y="${BY+56}" text-anchor="end" font-size="14" fill="#8A7458">(cm)</text>`;
  let cur=d;
  const draw=(dist,dd)=>{
    const r=dd/2*S,cx=X0+dist*S,cy=BY-r,th=dist*S/r;
    const px=cx-r*Math.sin(th),py=cy+r*Math.cos(th);
    $('.hp',el).innerHTML=`<circle cx="${cx}" cy="${cy}" r="${r-3}" fill="none" stroke="#5B5B5B" stroke-width="6"/><line x1="${cx-r+3}" y1="${cy}" x2="${cx+r-3}" y2="${cy}" stroke="#3D6E8C" stroke-width="3" stroke-dasharray="7 5" transform="rotate(${th*180/Math.PI} ${cx} ${cy})"/><circle cx="${px}" cy="${py}" r="8" fill="#E0704F"/><text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="16" fill="#3D6E8C" font-family="Jua">지름 ${dd} cm</text>`;
    $('.tr',el).setAttribute('x2',X0+dist*S);
  };
  const set=dd=>{cur=dd;draw(0,dd);$('.lb',el).innerHTML='';};
  set(d);
  const roll=dd=>new Promise(res=>{
    if(dd)cur=dd;const C=cur*PI,dur=RM?0:2400,t0=performance.now();$('.lb',el).innerHTML='';
    const step=now=>{const p=dur?Math.min(1,(now-t0)/dur):1;draw(C*p,cur);
      if(p<1)return requestAnimationFrame(step);
      $('.lb',el).innerHTML=`<text x="${X0+C*S/2}" y="${BY-cur*S-14}" text-anchor="middle" font-size="22" fill="#E0704F" font-family="Jua">${nf(C)} cm</text>`;res(C);};
    requestAnimationFrame(step);});
  return {set,roll};
}
/* 원주를 알 때 지름: 둘레를 감은 끈을 펼치고, 지름 막대가 몇 번 들어가는지 보여 줘요 */
function mountPost(el,{c=91.06}={}){
  const W=900,X0=34,LY=250,H=300;let S=1;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="둘레를 펼쳐 지름 찾기" style="width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)"><g class="top"></g><g class="seg"></g><g class="lb"></g></svg>`;
  let cur=c;
  const set=cc=>{cur=cc;S=(W-X0*2)/(cc*1.04);const d=cc/PI,r=Math.max(18,Math.min(80,d/2*S));
    $('.top',el).innerHTML=`<circle cx="${W/2}" cy="105" r="${r}" fill="#C89B6A" stroke="#E0704F" stroke-width="7"/><circle cx="${W/2}" cy="105" r="${r*.55}" fill="none" stroke="#A97B4C" stroke-width="2"/><text x="${W/2}" y="${105-r-14}" text-anchor="middle" font-size="18" fill="#E0704F" font-family="Jua">둘레 ${nf(cc)} cm</text>`;
    $('.seg',el).innerHTML='';$('.lb',el).innerHTML='';};
  set(c);
  const show=()=>new Promise(res=>{
    const d=cur/PI,C=cur;let k=0;const n=Math.ceil(PI);
    const L=`<line x1="${X0}" y1="${LY}" x2="${X0+C*S}" y2="${LY}" stroke="#E0704F" stroke-width="8" stroke-linecap="round"/><text x="${X0}" y="${LY+30}" font-size="15" fill="#E0704F" font-family="Jua">펼친 둘레 ${nf(C)} cm</text>`;
    $('.seg',el).innerHTML=L;
    const add=()=>{if(k>=n){$('.lb',el).innerHTML=`<text x="${W-X0}" y="${LY+36}" text-anchor="end" font-size="22" fill="#3D6E8C" font-family="Jua">지름 막대가 약 3.14번 → 지름 ${nf(d)} cm</text>`;return res(d);}
      const x=X0+k*d*S,w=Math.min(d,C-k*d)*S;
      $('.seg',el).insertAdjacentHTML('beforeend',`<rect x="${x}" y="${LY-26}" width="${w}" height="16" rx="3" fill="${k%2?'#8DB3C7':'#3D6E8C'}" class="pop"/>${k<3?`<text x="${x+w/2}" y="${LY-32}" text-anchor="middle" font-size="14" fill="#3D6E8C">${k+1}</text>`:''}`);
      k++;setTimeout(add,RM?0:450);};
    add();});
  return {set,show};
}

/* ---------- 공통: 고르기 문제 ---------- */
function pick(box,{q,a,o,onOk}){
  const opts=shuffle([a,...o]);
  box.innerHTML=`<div class="quiz"><div class="q">${q}</div><div class="opts">${opts.map(x=>`<button data-o="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="msg" id="pm" role="status"></div></div>`;
  $$('.opts button',box).forEach(b=>b.onclick=()=>{
    if(b.dataset.o===a){b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);$('#pm',box).className='msg ok';$('#pm',box).textContent='맞았어요!';setTimeout(onOk,600);}
    else{b.classList.add('wrong');b.disabled=true;box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');$('#pm',box).className='msg bad';$('#pm',box).textContent='다시 골라 봐요';}
  });
}

/* ---------- 1. 지름을 알 때 원주 구하기 ---------- */
function stage1(){
  const R={i:0,ph:0,miss:0,...(ME.s1||{})};
  if(R.done)return s1Done();
  const it=HOOPS[R.i];
  shell(`<div class="panel grid"><div><span class="band">1단계 · 지름을 알 때 원주 구하기 (${R.i+1}/${HOOPS.length})</span></div>
    <h2>${it.e} 지름이 ${it.d} cm인 ${it.nm}를 한 바퀴 굴리면 몇 cm를 갈까요?</h2><div id="roll"></div></div>
   <div class="panel grid" id="work"></div>`);
  const H=mountHoop($('#roll'),{d:it.d});
  const save=async p=>{Object.assign(R,p);ME.s1={...R};await roomRef(me.room).child('students/'+me.num+'/s1').update(p);drawSteps();};
  const work=$('#work');
  if(R.ph===0)return pick(work,{q:'굴렁쇠가 한 바퀴 굴렀을 때 움직인 거리는 무엇과 같을까요?',a:'굴렁쇠의 원주',o:['굴렁쇠의 지름','굴렁쇠의 반지름'],onOk:async()=>{await save({ph:1});stage1();}});
  if(R.ph===1)return pick(work,{q:'(원주율) = (원주) ÷ (지름)이에요.<br>그럼 (원주) = (지름) × ( ? )',a:'원주율',o:['반지름','원주','지름'],onOk:async()=>{await save({ph:2});stage1();}});
  work.innerHTML=`<div class="formula">(원주) = (지름) × (<u>원주율</u>)</div>
    <p style="margin:0">식에 수를 넣고 계산기로 구해요. 원주율은 <b>3.14</b>로 계산해요.</p>
    <div class="eq"><input id="a" type="number" inputmode="decimal" aria-label="지름"> × <input id="b" type="number" inputmode="decimal" aria-label="원주율"> = <input id="c" class="r" type="number" inputmode="decimal" aria-label="원주"> cm</div>
    <div class="msg" id="wm" role="status"></div><div class="row" id="act"><button id="chk">확인하기</button></div>`;
  let miss=0;
  $('#chk').onclick=async()=>{
    const a=num($('#a').value),b=num($('#b').value),c=num($('#c').value);
    const bad=t=>{$('#wm').className='msg bad';$('#wm').innerHTML=t;};
    if(a==null||b==null||c==null)return bad('세 칸을 모두 채워요.');
    let why='';
    if(!same(a,it.d)&&same(b,it.d))why='(지름) × (원주율) 순서로 써 볼까요?';
    else if(!same(a,it.d))why=`지름은 몇 cm인가요? 그림을 다시 봐요.`;
    else if(!same(b,PI))why=b===3||b===3.1?'원주율은 <b>3.14</b>로 계산해요.':'원주율은 얼마로 계산하나요?';
    else if(!same(c,it.d*PI))why=same(c,it.d/PI)?'원주는 지름보다 길어요! 나누지 말고 <b>곱해요</b>.':'계산기로 다시 계산해 봐요.';
    if(why){miss++;R.miss=(R.miss||0)+1;roomRef(me.room).child('students/'+me.num+'/s1/miss').set(R.miss);
      return bad(why+(miss>=2?`<br>풀이: ${it.d} × 3.14 = <b>${nf(it.d*PI)}</b>`:''));}
    $('#chk').disabled=true;$$('#work input').forEach(x=>x.disabled=true);
    $('#wm').className='msg ok';$('#wm').textContent=`맞았어요! ${it.d} × 3.14 = ${nf(it.d*PI)} (cm). 굴려서 확인해 봐요!`;
    await H.roll();
    const last=R.i>=HOOPS.length-1;
    $('#act').innerHTML=`<button id="nx">${last?'1단계 끝내기 ✓':'다음 바퀴 ▶'}</button>`;
    $('#nx').onclick=async()=>{$('#nx').disabled=true;await save(last?{done:true,at:Date.now()}:{i:R.i+1});stage1();};
  };
}
function s1Done(){
  shell(`<div class="panel quiz pop"><div><span class="band">1단계 끝</span></div><div class="big">(원주) = (지름) × (원주율)</div>
   <table class="tbl" style="max-width:520px"><thead><tr><th></th><th>지름</th><th>원주</th></tr></thead><tbody>${HOOPS.map(h=>`<tr><th>${h.e} ${h.nm}</th><td>${h.d} cm</td><td><b>${nf(h.d*PI)} cm</b></td></tr>`).join('')}</tbody></table>

/* ---------- 3. 짝과 원주·지름 주고받기 (지도서 수업 활동 아이디어) ----------
   동전 앞면 → 지름을 정해 보내요 (짝은 원주를 구해요)
   동전 뒷면 → 지름을 몰래 정하고 원주를 계산해 보내요 (짝은 지름을 구해요)
   짝이 없으면 🤖 로봇 짝이 문제를 내고 풀어 줘요. */
const TEAMS=[1,2,3,4,5];
const GOAL3=3;
let T3={},s3state={};
function stage3(){
  if(!ME.team)return teamPick();
  shell(`<div class="panel grid"><div class="row" style="justify-content:space-between"><span class="band">3단계 · 짝과 원주·지름 주고받기</span><span class="muted" id="who3"></span></div>
    <p style="margin:0">동전을 던져 <b>앞면</b>이면 지름을, <b>뒷면</b>이면 원주를 짝에게 보내요. 짝이 보낸 문제를 풀어 표를 채워요. <b>${GOAL3}문제</b>를 풀면 성공!</p></div>
   <div class="two"><div class="panel grid" id="give"></div><div class="panel grid" id="take"></div></div>
   <div class="panel grid"><h2>우리 조 표</h2><div id="tab3"></div></div>`);
  s3state={};
  const ref=roomRef(me.room).child('teams/'+ME.team);
  const h=ref.on('value',s=>{T3=s.val()||{};draw3();});
  subOff=()=>ref.off('value',h);
}
// Firebase는 내 쓰기를 바로(같은 호출 안에서) 알려 줘서, 그리기가 겹치지 않게 한 번에 하나씩 그려요
let d3busy=false,d3again=false;
function draw3(){if(d3busy){d3again=true;return;}d3busy=true;try{do{d3again=false;draw3now();}while(d3again);}finally{d3busy=false;}}
function teamPick(){
  shell(`<div class="panel grid"><div><span class="band">3단계 · 짝과 같은 조 고르기</span></div><h2>짝과 같은 조 번호를 눌러요</h2><div class="teams" id="tp"></div><div class="msg bad" id="tpm" role="status"></div></div>`);
  const ref=roomRef(me.room).child('teams');
  const h=ref.on('value',s=>{const A=s.val()||{};const el=$('#tp');if(!el)return;
    el.innerHTML=TEAMS.map(t=>{const m=(A[t]||{}).m||{};const L=Object.entries(m);return `<button data-t="${t}" ${L.length>=2?'disabled':''}><b>${t}조</b><span>${L.map(([n,nm])=>esc(n+' '+nm)).join(', ')||'비어 있어요'}</span></button>`;}).join('');
    $$('#tp button').forEach(b=>b.onclick=async()=>{const t=+b.dataset.t;
      const r=await roomRef(me.room).child('teams/'+t+'/m').transaction(m=>{m=m||{};if(m[me.num])return m;if(Object.keys(m).length>=2)return;m[me.num]=me.name;return m;});
      if(!r.committed){$('#tpm').textContent='이 조는 꽉 찼어요. 다른 조를 골라요.';return;}
      await roomRef(me.room).child('students/'+me.num+'/team').set(t);ME.team=t;stage3();});});
  subOff=()=>ref.off('value',h);
}
const partnerOf=()=>{const m=T3.m||{};const o=Object.keys(m).map(Number).filter(n=>n!==me.num);return o.length?o[0]:0;};
const nameOf=n=>n===0?'🤖 로봇 짝':`${n} ${(T3.m||{})[n]||''}`;
function cardsList(){return Object.entries(T3.cards||{}).map(([id,c])=>({id,...c})).sort((a,b)=>a.at-b.at);}
function draw3now(){
  if(cur!==3||!$('#give'))return;
  const P=partnerOf(),C=cardsList(),R=roomRef(me.room).child('teams/'+ME.team+'/cards');
  $('#who3').textContent=`${ME.team}조 · 짝: ${P?nameOf(P):'아직 없어요'}`;
  // 로봇 짝: 짝이 없을 때만 움직여요
  if(P)s3state.alone=0;
  if(!P){
    const mineOpen=C.filter(c=>c.from===me.num&&c.to===0&&c.st==='open');
    mineOpen.forEach(c=>{if(s3state['bot'+c.id])return;s3state['bot'+c.id]=1;
      setTimeout(()=>R.child(c.id).update({st:'ok',by:0,ans:c.kind==='d'?r2(c.v*PI):c.key}),RM?300:2500);});
    // 짝이 곧 들어올 수 있으니 혼자인 채로 8초가 지나야 로봇 짝이 문제를 내요
    if(!s3state.alone){s3state.alone=Date.now();setTimeout(draw3,RM?1200:8200);}
    const waited=Date.now()-s3state.alone>=(RM?1000:8000);
    if(waited&&!C.some(c=>c.to===me.num&&c.st==='open')&&!s3state.botMaking){s3state.botMaking=1;
      const d=[8,12,15,20,24,25,30,32,40,45,50][Math.floor(Math.random()*11)],kind=Math.random()<.5?'d':'c';
      R.push({from:0,to:me.num,kind,v:kind==='d'?d:r2(d*PI),key:d,st:'open',at:Date.now()}).then(()=>{s3state.botMaking=0;});}
  }
  // 내가 문제 내기
  const give=$('#give'),open=C.find(c=>c.from===me.num&&c.st==='open');
  if(!s3state.giveBusy){
    if(open){give.innerHTML=`<h2>내가 낸 문제</h2><div class="card"><div>${open.kind==='d'?`지름 <b>${nf(open.v)} cm</b> → 원주는?`:`원주 <b>${nf(open.v)} cm</b> → 지름은?`}</div><div class="muted">${nameOf(open.to)}가 풀고 있어요…</div></div><p class="muted" style="margin:0">짝이 풀면 다음 문제를 낼 수 있어요.</p>`;}
    else if(!s3state.coin){give.innerHTML=`<h2>내가 문제 내기</h2><div class="coin" id="coin" aria-hidden="true">🪙</div><button id="flip">동전 던지기</button><p class="muted" style="margin:0">앞면: 지름 보내기 · 뒷면: 원주 보내기</p>`;
      $('#flip').onclick=()=>{$('#flip').disabled=true;const k=Math.random()<.5?'d':'c';$('#coin').classList.add('flip');
        setTimeout(()=>{s3state.coin=k;draw3();},RM?0:900);};}
      else drawGive(give,R);
  }
  // 짝이 낸 문제
  const take=$('#take'),inc=C.find(c=>c.to===me.num&&c.st==='open');
  if(!s3state.takeBusy){
    if(!inc){s3state.takeBusy=0;s3state.takeId=null;take.innerHTML=`<h2>짝이 낸 문제</h2><p class="muted">${P||C.some(c=>c.from===0)?'짝이 문제를 내고 있어요. 기다리는 동안 나도 문제를 내요!':'짝이 들어오면 문제를 받아요.'}</p>`;}
    else if(s3state.takeId!==inc.id){s3state.takeId=inc.id;s3state.takeBusy=1;drawTake(take,inc,R);}
  }
  // 표
  const T=C.filter(c=>c.st!=='open').slice().reverse();
  const mySolved=C.filter(c=>c.to===me.num&&c.st==='ok').length;
  $('#tab3').innerHTML=`<p class="score" style="margin:0">내가 푼 문제 <b>${mySolved}</b> / ${GOAL3}${mySolved>=GOAL3?' 🎉 성공! 더 해도 좋아요.':''}</p>
   <table class="tbl"><thead><tr><th>낸 사람</th><th>원주(cm)</th><th>지름(cm)</th><th>푼 사람</th></tr></thead><tbody>
   ${T.map(c=>`<tr><th>${esc(nameOf(c.from))}</th><td>${c.kind==='c'?nf(c.v):`<b>${nf(c.ans)}</b>`}</td><td>${c.kind==='d'?nf(c.v):`<b>${nf(c.ans)}</b>`}</td><td>${esc(nameOf(c.to))} ${c.st==='ok'?'✓':'(풀이 봄)'}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">아직 없어요</td></tr>'}</tbody></table>`;
  if(mySolved>=GOAL3&&!ME.s3done){ME.s3done=true;roomRef(me.room).child('students/'+me.num+'/s3done').set(true);drawSteps();}
}
function drawGive(give,R){
  const k=s3state.coin;s3state.giveBusy=1;
  give.innerHTML=k==='d'?`<h2>앞면! 지름을 보내요</h2><div class="coin" aria-hidden="true">앞면<br>지름</div>
     <div class="fld"><label for="gd">짝에게 보낼 지름 (1~100 cm, 자연수)</label><div class="unit"><input id="gd" type="number" inputmode="numeric" min="1" max="100"><span>cm</span></div></div>
     <div class="msg" id="gm" role="status"></div><button id="send">보내기 ▶</button>`
    :`<h2>뒷면! 원주를 보내요</h2><div class="coin" aria-hidden="true">뒷면<br>원주</div>
     <div class="fld"><label for="gd">지름을 몰래 정해요 (1~100 cm, 자연수)</label><div class="unit"><input id="gd" type="number" inputmode="numeric" min="1" max="100"><span>cm</span></div></div>
     <div class="fld"><label for="gc">그 원의 원주를 계산해요 (지름 × 3.14)</label><div class="unit"><input id="gc" type="number" inputmode="decimal"><span>cm</span></div></div>
     <div class="msg" id="gm" role="status"></div><button id="send">원주 보내기 ▶</button>`;
  let miss=0;
  $('#send').onclick=async()=>{
    const d=num($('#gd').value),bad=t=>{$('#gm').className='msg bad';$('#gm').innerHTML=t;};
    if(!(d>=1&&d<=100&&Number.isInteger(d)))return bad('지름은 1부터 100까지 자연수로 써요.');
    let v=d;
    if(k==='c'){const c=num($('#gc').value);if(c==null)return bad('원주를 계산해 써요.');
      if(!same(c,d*PI)){miss++;return bad((same(c,d/PI)?'원주는 지름보다 길어요! 곱해요.':'계산기로 다시 해 봐요.')+(miss>=2?` 풀이: ${d} × 3.14 = <b>${nf(d*PI)}</b>`:''));}
      v=r2(d*PI);}
    $('#send').disabled=true;
    await R.push({from:me.num,to:partnerOf(),kind:k,v,key:d,st:'open',at:Date.now()});
    await roomRef(me.room).child('students/'+me.num+'/s3made').transaction(x=>(x||0)+1);
    s3state.coin=null;s3state.giveBusy=0;draw3();
  };
}
function drawTake(take,inc,R){
  const wantF=inc.kind==='d'?'x':'/',want=inc.kind==='d'?r2(inc.v*PI):inc.key;
  take.innerHTML=`<h2>짝이 낸 문제</h2><div class="card in"><div class="q" style="font-family:var(--display);font-size:1.4rem">${esc(nameOf(inc.from))}: ${inc.kind==='d'?`지름이 <b>${nf(inc.v)} cm</b>인 원의 <u>원주</u>는?`:`원주가 <b>${nf(inc.v)} cm</b>인 원의 <u>지름</u>은?`}</div>
    <div class="fbtn" id="ff"><button data-f="x" aria-pressed="false">(지름) × (원주율)</button><button data-f="/" aria-pressed="false">(원주) ÷ (원주율)</button></div>
    <div class="unit"><input id="ta" type="number" inputmode="decimal" aria-label="답" placeholder="계산기로 구한 답"><span>cm</span></div>
    <div class="msg" id="tm3" role="status">어떤 식으로 구할지 먼저 골라요.</div><button id="tchk">확인하기</button></div>`;
  let f='',miss=0;
  $$('#ff button').forEach(b=>b.onclick=()=>{f=b.dataset.f;$$('#ff button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('#tchk').onclick=async()=>{
    const v=num($('#ta').value),bad=t=>{$('#tm3').className='msg bad';$('#tm3').innerHTML=t;};
    if(!f)return bad('어떤 식으로 구할지 먼저 골라요.');
    if(f!==wantF){miss++;return bad(inc.kind==='d'?'지름을 알 때는 지름에 원주율을 곱해요.':'원주를 알 때는 원주를 원주율로 나눠요.');}
    if(v==null)return bad('답을 써요.');
    if(!same(v,want)){miss++;
      if(miss>=3){$('#tchk').disabled=true;$('#tm3').className='msg bad';$('#tm3').innerHTML=`풀이: ${inc.kind==='d'?`${nf(inc.v)} × 3.14`:`${nf(inc.v)} ÷ 3.14`} = <b>${nf(want)}</b> (cm)`;
        await new Promise(r=>setTimeout(r,2500));await R.child(inc.id).update({st:'shown',ans:want});s3state.takeBusy=0;return draw3();}
      return bad('계산기로 다시 해 봐요.'+(miss>=2?' 한 번 더 틀리면 풀이를 보여 줘요.':''));}
    $('#tchk').disabled=true;$('#tm3').className='msg ok';$('#tm3').textContent=`맞았어요! ${nf(want)} cm`;
    await R.child(inc.id).update({st:'ok',ans:want,tries:miss+1});
    setTimeout(()=>{s3state.takeBusy=0;draw3();},900);
  };
}

/* ---------- 4. 굴렁쇠 레이스 ---------- */
async function stage4(){
  if(ME.game&&ME.game.done)return gameDone();
  let G=ME.game;
  if(!G||!G.order){
    G={order:shuffle(GAME.map(g=>g.id)),i:0,score:0,started:Date.now()};
    await roomRef(me.room).child('students/'+me.num+'/game').set(G);ME.game=G;
  }
  if(cur!==4)return;
  const rest=G.order.slice(G.i||0).map(id=>GQ[id]).filter(Boolean);
  shell(`<div class="panel quiz" id="gz"></div>`);
  if(!rest.length)return finishGame();
  let score=G.score||0,idx=G.i||0;
  onMe=()=>drawSteps();
  runQuiz($('#gz'),rest,{band:'4단계 · 굴렁쇠 레이스',fig:q=>`<div class="emoji" aria-hidden="true">${q.e}</div>`,
    progress:()=>`<div class="score">점수 <b id="sc">${score}</b>점 · ${idx+1}/${GAME.length}번째 문제 · 계산기 OK</div>`,
    onRight:async(q,ok,sec)=>{
      const pts=ok?100+Math.round(50*Math.max(0,Math.min(1,1-(sec-5)/20))):0;
      score+=pts;idx++;
      await roomRef(me.room).child('students/'+me.num+'/game').update({i:idx,score});
      ME.game={...ME.game,i:idx,score};
      return pts?` +${pts}점, 굴렁쇠가 굴러가요!`:' (두 번째 도전은 점수 없이 넘어가요)';
    },
    onWrong:q=>{roomRef(me.room).child(`students/${me.num}/game/wrong/${q.id}`).transaction(v=>(v||0)+1);},
    onEnd:finishGame});
}
async function finishGame(){
  await roomRef(me.room).child('students/'+me.num+'/game').update({done:true,at:Date.now()});
  ME.game={...ME.game,done:true};drawSteps();gameDone();
}
async function gameDone(){
  const G=ME.game||{};
  let rankTxt='';
  if(ROOMV.award){
    const all=(await roomRef(me.room).child('students').get()).val()||{};
    const L=ranking(all);const k=L.findIndex(x=>x.n===me.num);
    if(k>=0)rankTxt=`<div class="big">우리 반 ${k+1}등!</div>`;
  }
  if(cur!==4)return;
  shell(`<div class="panel quiz pop"><div><span class="band">결승선 도착</span></div><h2 style="font-size:2rem">굴렁쇠 레이스 완주!</h2>
   <div class="score" style="font-size:2rem">${G.score||0}점</div>${rankTxt}${MEMO}
   <p class="muted">${ROOMV.award?'TV에서 시상식을 봐요!':'TV에서 시상식을 기다려요.'}</p></div>`);
}
function ranking(all){
  return Object.keys(all||{}).map(Number).map(n=>({n,...all[n]})).filter(x=>x.game)
    .sort((a,b)=>(b.game.score||0)-(a.game.score||0)||(b.game.i||0)-(a.game.i||0)||(a.game.at||9e15)-(b.game.at||9e15));
}

/* ---------- student: join ---------- */
let me=null, ROOMV={}, ME={}, cur=1, onMe=null;
function parseName(s){const m=String(s).trim().match(/^(\d{1,2})\s*[번.]?\s*(.+)$/);return m?{num:+m[1],name:m[2].trim()}:null;}
function joinView(){
  clearOffs();
  const saved=store('hoop-student');
  if(saved&&ROOM&&saved.room===ROOM){me=saved;return enterRoom();}
  $('#sub').textContent='학생 화면';
  ClassWatch.student({db,room:ROOM,root:app,gate:true});ClassWatch.step('들어가기');
  app.innerHTML=`<div class="grid" style="max-width:560px;margin:0 auto">
   <div class="panel grid"><h2>방 번호</h2><input id="rm" inputmode="numeric" maxlength="4" placeholder="TV에 보이는 4자리" value="${esc(ROOM)}"></div>
   <div class="panel grid"><h2>"번호 이름"을 써요</h2><input id="nm" placeholder="예) 7 김민수" autocomplete="off"></div>
   <div class="msg bad" id="jm" role="status"></div>
   <div class="row"><button id="enter" disabled>들어가기</button><button class="ghost" id="home">처음으로</button></div></div>`;
  const chk=()=>{$('#enter').disabled=!(/^\d{4}$/.test($('#rm').value)&&parseName($('#nm').value));};
  $('#rm').oninput=chk;$('#nm').oninput=chk;
  $('#home').onclick=startView;
  ClassWatch.joinForm();
  $('#enter').onclick=async()=>{
    const code=$('#rm').value, p=parseName($('#nm').value);
    $('#enter').disabled=true;
    try{
      const open=await withTimeout(roomRef(code).child('open').get());
      if(!open.exists()){$('#jm').textContent='방 번호를 다시 확인해요.';return chk();}
      const r=await withTimeout(roomRef(code).child('students/'+p.num).transaction(c=>c?undefined:{name:p.name,joinedAt:Date.now()},undefined,false));
      if(!r.committed){const c=r.snapshot.val();
        if(!(c&&c.name===p.name)){$('#jm').textContent=`${p.num}번은 이미 "${c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}}
    }catch(e){$('#jm').textContent='연결 문제: '+(e.code||e.message);return chk();}
    ROOM=code;me={room:code,num:p.num,name:p.name};store('hoop-student',me);
    history.replaceState(null,'','?room='+code);
    enterRoom();
  };
}
function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app,gate:true});ClassWatch.who(me.num,me.name);
  $('#sub').textContent=`${me.num}번 ${me.name}`;
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  let ready=false;ROOMV={};onMe=null;
  listen(roomRef(me.room).child('students/'+me.num),s=>{
    const v=s.val();
    if(!v){store('hoop-student',null);me=null;clearOffs();return joinView();}
    ME=v;
    if(!ready){ready=true;if(ROOMV.stage){cur=ROOMV.stage;renderStage();}return;}
    if(typeof onMe==='function')onMe();
  });
  listen(roomRef(me.room).child('stage'),s=>{
    const st=s.val()||1;const was=ROOMV.stage;ROOMV.stage=st;
    if(!ready)return;
    if(was!==st){cur=st;renderStage();} else drawSteps();
  });
  listen(roomRef(me.room).child('award'),s=>{ROOMV.award=!!s.val();if(ready&&cur===4&&ME.game&&ME.game.done)gameDone();});
}
function stepDone(n){return n===1?!!(ME.s1&&ME.s1.done):n===2?!!(ME.s2&&ME.s2.done):n===3?!!ME.s3done:!!(ME.game&&ME.game.done);}
function drawSteps(){
  const el=$('#steps');if(!el)return;
  el.innerHTML=[1,2,3,4].map(n=>`<button data-s="${n}" ${n>ROOMV.stage?'disabled':''} ${n===cur?'aria-current="step"':''} class="${stepDone(n)?'done':''}"><b>${n}</b>${STAGES[n].k}${stepDone(n)?' ✓':''}</button>`).join('');
  $$('#steps button').forEach(b=>b.onclick=()=>{cur=+b.dataset.s;renderStage();});
}
let subOff=null;
function shell(inner){
  if(subOff){subOff();subOff=null;}
  app.innerHTML=`<div class="grid"><nav class="steps" id="steps" aria-label="활동 단계"></nav>${inner}<div style="text-align:right"><button class="ghost" id="relog" style="font-size:.85rem;padding:.4em .8em">다른 이름으로 들어가기</button></div></div>`;
  $('#relog').onclick=()=>{store('hoop-student',null);me=null;clearOffs();joinView();};
  drawSteps();
}
function renderStage(){
  ClassWatch.step(STAGES[cur].k,{n:cur,total:4,wait:stepDone(cur)});
  onMe=()=>drawSteps();
  if(cur===1)return stage1();
  if(cur===2)return stage2();
  if(cur===3)return stage3();
  return stage4();
}
function runQuiz(box,qs,{band,fig,onRight,onWrong,onEnd,progress}){
  let i=0,missed=false;
  const draw=()=>{
    const q=qs[i];const opts=shuffle([q.a,...q.o]);missed=false;const t0=Date.now();
    box.innerHTML=`<div><span class="band">${band}</span></div>
     <div class="prog">${qs.map((_,k)=>`<span class="${k<i?'on':k===i?'cur':''}"></span>`).join('')}</div>
     ${progress?progress():''}<div class="pop" style="width:100%">${fig?fig(q):''}</div><div class="q">${esc(q.q)}</div>
     <div class="opts">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
     <div class="msg" id="qm" role="status"></div>`;
    $$('.opts button',box).forEach(b=>b.onclick=async()=>{
      if(b.dataset.o===q.a){
        b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);
        $('#qm',box).className='msg ok';
        const extra=onRight?await onRight(q,!missed,(Date.now()-t0)/1000,i):'';
        $('#qm',box).textContent='맞았어요!'+(extra||'');
        await new Promise(r=>setTimeout(r,650));
        i++;if(i<qs.length)return draw();
        onEnd();
      }else{
        missed=true;b.classList.add('wrong');b.disabled=true;
        box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
        $('#qm',box).className='msg bad';$('#qm',box).textContent='다시 골라 봐요';
        if(onWrong)onWrong(q);
      }
    });
  };
  draw();
}

  const left=t.endAt?Math.max(0,Math.round((t.endAt-Date.now())/1000)):t.left;
  el.textContent=left===0&&t.endAt?'시간 끝!':`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  el.classList.toggle('end',!!t.endAt&&left===0);
  $('#go').textContent=t.endAt?'멈춤':'시작';$('#minus').disabled=$('#plus').disabled=!!t.endAt;
}
const students=()=>{const s=RD.students||{};return Object.keys(s).map(Number).sort((a,b)=>a-b).map(n=>({n,...s[n]}));};
let tvStage=0;
function renderTV(){
  const main=$('#main');if(!main)return;
  const st=RD.stage||1, S=students();
  $('#tsteps').innerHTML=[1,2,3,4].map(n=>`<button data-s="${n}" ${n===st?'aria-current="step"':''}><b>${n}</b> ${STAGES[n].t}</button>`).join('');
  $$('#tsteps button').forEach(b=>b.onclick=()=>setStage(+b.dataset.s));
  const doneIn=x=>st===1?!!(x.s1&&x.s1.done):st===2?!!(x.s2&&x.s2.done):st===3?!!x.s3done:!!(x.game&&x.game.done);
  $('#cnt').textContent=`${S.length}명 · 이 단계 끝 ${S.filter(doneIn).length}명`;
  $('#ppl').innerHTML=S.map(x=>`<span class="${doneIn(x)?'ok':''}">${x.n} ${esc(x.name)}</span>`).join('')||'<span class="muted" style="background:none">아직 아무도 없어요</span>';
  const changed=tvStage!==st;tvStage=st;
  if(st===1)return tv1(main,S,changed);
  if(st===2)return tv2(main,S,changed);
  if(st===3)return tv3(main,S);
  return tv4(main,S);
}
function progressBox(S,key,list,label){
  return `<div class="bars">${list.map((h,k)=>{const c=S.filter(x=>x[key]&&(x[key].done||(x[key].i||0)>k)).length;
    return `<div class="bar"><span>${h.e} ${h.nm}</span><div class="track"><div style="width:${S.length?c/S.length*100:0}%"></div></div><span>${c}명</span></div>`;}).join('')}</div>
    <p class="muted" style="margin:0">${label}</p>`;
}
function tv1(main,S,changed){
  if(changed||!$('#tvroll')){
    main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">지름을 알 때 원주 구하기 (교과서 112쪽)</h2>
      <div class="seg" id="hsel">${HOOPS.map((h,k)=>`<button data-k="${k}" aria-pressed="${k===0}">${h.e} ${h.d} cm</button>`).join('')}</div></div>
      <div id="tvroll"></div><div class="row" style="justify-content:space-between"><div class="formula">(원주) = (지름) × (<u>원주율</u>)</div><button id="tvgo">한 바퀴 굴리기 ▶</button></div></div>
     <div class="panel grid"><h2>얼마나 했나요?</h2><div id="tv1stat"></div></div>`;
    const H=mountHoop($('#tvroll'),{d:60,big:true});let k=0;
    $$('#hsel button').forEach(b=>b.onclick=()=>{k=+b.dataset.k;$$('#hsel button').forEach(x=>x.setAttribute('aria-pressed',x===b));H.set(HOOPS[k].d);});
    $('#tvgo').onclick=async()=>{$('#tvgo').disabled=true;await H.roll(HOOPS[k].d);$('#tvgo').disabled=false;};
  }
  const miss=S.reduce((s,x)=>s+((x.s1&&x.s1.miss)||0),0);
  $('#tv1stat').innerHTML=progressBox(S,'s1',HOOPS,`계산을 다시 한 횟수: 우리 반 ${miss}번`);
}
function tv2(main,S,changed){
  if(changed||!$('#tvpost')){
    main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">원주를 알 때 지름 구하기 (교과서 113쪽)</h2>
      <div class="seg" id="psel">${POSTS.map((h,k)=>`<button data-k="${k}" aria-pressed="${k===0}">${h.e} ${nf(h.c)} cm</button>`).join('')}</div></div>
      <div id="tvpost"></div><div class="row" style="justify-content:space-between"><div class="formula">(지름) = (원주) <u>÷</u> (원주율)</div><button id="tvgo">둘레 펼치기 ▶</button></div></div>
     <div class="two"><div class="panel grid"><h2>얼마나 했나요?</h2><div id="tv2stat"></div></div>
      <div class="rules"><b>조심해요!</b><ul><li>지름을 (원주) × (원주율)로 구하면? 지름이 원주보다 길어져요.</li><li>원주는 지름의 약 3배 → 지름은 원주를 3.14로 <b>나눠요</b>.</li></ul></div></div>`;
    const P=mountPost($('#tvpost'),{c:91.06});let k=0;
    $$('#psel button').forEach(b=>b.onclick=()=>{k=+b.dataset.k;$$('#psel button').forEach(x=>x.setAttribute('aria-pressed',x===b));P.set(POSTS[k].c);});
    $('#tvgo').onclick=async()=>{$('#tvgo').disabled=true;P.set(POSTS[k].c);await P.show();$('#tvgo').disabled=false;};
  }
  const miss=S.reduce((s,x)=>s+((x.s2&&x.s2.miss)||0),0);
  $('#tv2stat').innerHTML=progressBox(S,'s2',POSTS,`계산을 다시 한 횟수: 우리 반 ${miss}번`);
}
function tv3(main,S){
  const A=RD.teams||{};
  const nm=(t,n)=>n===0?'🤖':`${n} ${((A[t]||{}).m||{})[n]||''}`;
  const all=TEAMS.map(t=>({t,...(A[t]||{})})).filter(x=>x.m);
  const total=all.reduce((s,x)=>s+Object.values(x.cards||{}).filter(c=>c.st==='ok').length,0);
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">짝과 원주·지름 주고받기</h2><span class="big" style="font-size:1.6rem">우리 반이 맞힌 문제 ${total}개</span></div>
    <p class="muted" style="margin:0">동전 앞면: 지름을 보내면 짝이 원주를 구해요. 뒷면: 지름을 몰래 정해 원주를 계산해 보내면 짝이 지름을 구해요. 한 사람이 ${GOAL3}문제씩 풀어요.</p></div>
   <div class="tteams" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px">${all.map(x=>{const C=Object.values(x.cards||{}).filter(c=>c.st!=='open').sort((a,b)=>b.at-a.at).slice(0,5);
     return `<div class="panel grid" style="padding:12px"><h3 style="font-size:1.4rem">${x.t}조 <span class="muted" style="font-size:1rem">${Object.entries(x.m).map(([n,v])=>esc(n+' '+v)).join(' · ')}</span></h3>
      <table class="tbl" style="font-size:1rem"><thead><tr><th>낸 사람</th><th>원주</th><th>지름</th><th></th></tr></thead><tbody>${C.map(c=>`<tr><th>${esc(nm(x.t,c.from))}</th><td>${c.kind==='c'?nf(c.v):`<b>${nf(c.ans)}</b>`}</td><td>${c.kind==='d'?nf(c.v):`<b>${nf(c.ans)}</b>`}</td><td>${c.st==='ok'?'✓':'💡'}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">아직 없어요</td></tr>'}</tbody></table></div>`;}).join('')||'<p class="muted">아직 조를 고른 친구가 없어요</p>'}</div>
   ${MEMO}`;
}
function tv4(main,S){
  const L=ranking(RD.students);
  const wrong={};S.forEach(x=>Object.entries((x.game&&x.game.wrong)||{}).forEach(([k,v])=>wrong[k]=(wrong[k]||0)+v));
  const hard=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>({q:GQ[k],v})).filter(x=>x.q);
  if(RD.award){
    const p=[L[1],L[0],L[2]];
    main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:2rem">굴렁쇠 레이스 시상식</h2><button class="ghost" id="awoff">경주로로</button></div>
     <div class="podium">${p.map((x,k)=>x?`<div class="p${[2,1,3][k]} pop"><b>${[2,1,3][k]}등</b><span>${esc(x.n)} ${esc(x.name)}</span>${x.game.score||0}점</div>`:'<span></span>').join('')}</div></div>
     ${hard.length?`<div class="panel grid"><h2>우리 반이 가장 많이 틀린 문제</h2><div class="list">${hard.map(h=>`<div><b>${h.q.e}</b>${esc(h.q.q)}<br>정답: <b>${esc(h.q.a)}</b> <span class="muted">(틀린 횟수 ${h.v})</span></div>`).join('')}</div></div>`:''}`;
    $('#awoff').onclick=()=>roomRef(ROOM).child('award').set(false);
    return;
  }
  const max=GAME.length*150;
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">굴렁쇠 레이스</h2><button id="awon">시상식 ▶</button></div>
   <p class="muted" style="margin:0">맞힌 만큼 굴렁쇠가 굴러가요. 한 번에 맞히면 100점 + 빠르기 보너스 최대 50점. 틀리면 다시 골라야 넘어가요. ${GAME.length}문제, 계산기 사용.</p>
   <div class="track4">${L.map(x=>`<div class="lane"><span class="nm">${esc(x.n)} ${esc(x.name)}${x.game.done?' 🏁':''}</span><div class="road"><div class="goal"></div><svg class="h" viewBox="0 0 40 40" style="left:${4+Math.min(1,(x.game.score||0)/max)*88}%" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="#5B5B5B" stroke-width="4"/><line x1="6" y1="20" x2="34" y2="20" stroke="#E0704F" stroke-width="3" transform="rotate(${(x.game.score||0)%360} 20 20)"/></svg></div><span class="pt">${x.game.score||0}</span></div>`).join('')||'<p class="muted">아직 시작한 친구가 없어요</p>'}</div></div>
   <div class="rules"><b>약속</b><ul><li>친구 화면은 보지 않아요.</li><li>소리 지르지 않고, 다 푼 친구는 조용히 기다려요.</li></ul></div>`;
  $('#awon').onclick=()=>roomRef(ROOM).child('award').set(true);
}

/* ---------- route ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
</body></html>
