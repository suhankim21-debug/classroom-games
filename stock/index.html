<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 반 쿠키 증권</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* 다른 게임과 같은 교실 게시판 느낌. 주가는 우리나라 증권 화면처럼 오르면 빨강, 내리면 파랑 */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --gold:#E9B04F; --up:#D2402F; --down:#2F6FD2;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
button.okb{background:var(--ok)} button.upb{background:var(--up)} button.downb{background:var(--down)} button.inkb{background:var(--ink)}
button.small{font-size:.9rem;padding:.35em .8em;border-radius:10px}
input,select,textarea{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:5.5em;resize:vertical}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center;font-size:.9em}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 24px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.center{text-align:center;justify-items:center}
.emoji{font-size:clamp(3rem,10vw,4.5rem);line-height:1}
.big{font-family:var(--display);font-size:clamp(1.5rem,4.2vw,2.2rem);line-height:1.25}
.huge{font-family:var(--display);font-size:clamp(2rem,6vw,3.4rem);line-height:1.15}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px;color:var(--ink)}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.warn{background:#FBE3DC;border:2px solid var(--bad);border-radius:14px;padding:10px 14px;color:var(--ink)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.9);opacity:.3}to{transform:none;opacity:1}}
}
/* 첫 화면 */
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.minis div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-family:var(--display)}
.minis span{display:block;font-size:2.2rem;line-height:1.2}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.check{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-family:var(--display);font-size:1.15rem}
.check input{width:1.6em;height:1.6em;flex:none;accent-color:var(--coral2)}
/* 학생 화면 */
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.status div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.status small{display:block;color:var(--muted);font-size:.9rem}
.status b{font-family:var(--display);font-weight:400;font-size:1.45rem}
.mkt{font-family:var(--display);font-size:1.15rem;border-radius:12px;padding:8px 14px;background:#E3F1E7;color:var(--ok)}
.mkt.closed{background:#EEE6D3;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tabs button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.1rem;padding:.6em .3em}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.co{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:4px;text-align:left;color:var(--ink);font-family:var(--text);font-size:1rem;line-height:1.35}
button.co{cursor:pointer}
.co[aria-pressed="true"]{border-color:var(--coral2);background:#FFF4DF}
.co .hd{display:flex;gap:10px;align-items:center}
.co .hd span{font-size:2.2rem;line-height:1}
.co .hd b{font-family:var(--display);font-weight:400;font-size:1.35rem}
.co .pr{font-family:var(--display);font-size:1.6rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.co .pr small{font-size:1.05rem}
.co svg{width:100%;height:44px;display:block}
.co .mine{font-size:.95rem;color:var(--coral2);font-family:var(--display)}
.detail{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.detail svg{width:100%;height:120px;display:block}
.stepper{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.stepper button{font-size:1.6rem;width:2.4em;padding:.25em 0}
.stepper output{font-family:var(--display);font-size:2rem;text-align:center}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bs button{font-size:1.25rem;padding:.8em .4em}
.tbl{width:100%;border-collapse:collapse;font-size:1rem}
.tbl th,.tbl td{border-bottom:2px solid var(--line);padding:6px 8px;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-family:var(--display);font-weight:400;color:var(--muted)}
.hist{display:grid;gap:6px;max-height:340px;overflow:auto}
.hist div{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;gap:8px;justify-content:space-between}
.newsc{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px;display:grid;gap:8px}
.newsc .nh{display:flex;gap:12px;align-items:center}
.newsc .nh span{font-size:3rem;line-height:1}
.newsc h2{font-size:clamp(1.5rem,4vw,2.1rem)}
.newsc p{margin:0;font-size:1.15rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fxbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fxbar .big{white-space:nowrap}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:14px;border-radius:7px;background:var(--line)}
.prog i.on{background:var(--coral)}
.chips span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:.2em .8em;font-family:var(--display);font-size:1.1rem}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.picks button{background:#fff;color:var(--ink);border:3px solid var(--line);font-size:1.1rem;padding:.6em .3em;line-height:1.25}
.picks button span{display:block;font-size:2rem}
.picks.upk button[aria-pressed="true"]{border-color:var(--up);background:#FBE3DC}
.picks.dnk button[aria-pressed="true"]{border-color:var(--down);background:#E1EAF8}
.ops{display:grid;gap:6px}
.ops div{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fp{font-size:2.6rem;letter-spacing:.1em}
.easy .co .hd span{font-size:3rem}.easy .co .pr{font-size:2rem}
.easy .bs button{font-size:1.6rem;padding:1em .4em}
.easy .picks button span{font-size:3rem}
/* 선생님 TV */
.tv{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.4rem);line-height:1;font-variant-numeric:tabular-nums}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display);color:var(--ink)}
.req{display:grid;gap:6px}
.req div{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;background:#FFF1D0;border:2px solid var(--gold);border-radius:12px;padding:6px 10px}
.req b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.side button{width:100%}
.badge{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;padding:0 .55em;margin-left:.3em}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.board .co .hd span{font-size:1.6rem}.board .co .pr{font-size:1.3rem}
.sect{font-family:var(--display);font-size:1.3rem;margin:6px 0 -4px}
.tip{background:#fff7e0;border:2px dashed var(--coral);border-radius:14px;padding:10px 14px}
.board .co .pr{font-size:2rem}
.rank{display:grid;gap:6px}
.rank .r{display:grid;grid-template-columns:2.2em 1fr auto 5em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:6px 12px;font-family:var(--display);font-size:1.15rem;color:var(--ink)}
.rank .r b{font-weight:400;color:var(--coral2)}
.rank .r .rt{text-align:right}
.feed{display:grid;gap:4px;font-size:1rem}
.two2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.people button{background:var(--cream);color:var(--ink);border-radius:999px;padding:.2em .8em;font-size:1rem}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.2rem;font-weight:400}
.podium div span{display:block;font-size:1.5rem}
.podium .p1{background:var(--gold);min-height:230px}.podium .p2{min-height:180px;background:#8DB3C7}.podium .p3{min-height:140px}
#modal{position:fixed;inset:0;z-index:95;background:rgba(40,30,20,.55);display:none;overflow:auto;padding:24px max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px))}
#modal.on{display:block}
#modal .panel{max-width:900px;margin:0 auto}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1rem;padding:.4em .7em}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:grid;gap:6px}
.fld .lb{font-family:var(--display);font-size:1.1rem}
.f2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.effrow{display:grid;grid-template-columns:9em 1fr;gap:8px;align-items:center}
.nlist{display:grid;gap:6px;max-height:280px;overflow:auto}
.nlist button{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;font-size:1.05rem;padding:.5em .8em}
.nlist button[aria-pressed="true"]{border-color:var(--coral2);background:#FFF4DF}
.nlist button.used{opacity:.55}
.secret{background:#2B2140;color:#fff;border-radius:14px;padding:10px 14px;display:none}
.secret.on{display:block}
.opg{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.opg .row b{font-family:var(--display);font-weight:400;font-size:1.25rem}
@media (max-width:900px){
  .hero,.tv,.detail{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .choose,.two2{grid-template-columns:1fr}
}
@media (max-width:600px){
  .status{grid-template-columns:1fr}
  .tabs{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
  .picks{grid-template-columns:1fr 1fr}
}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><i>📈</i> 우리 반 쿠키 증권</div><small id="sub"></small></div></header>
<main class="wrap" id="app"></main>
<div class="wrap" id="foot" style="text-align:right;padding-bottom:90px"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../common/watch.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCSSwT67k7lXoYDz4qsmHHDRXUqTS0Zh14",
  authDomain: "classroom-games-7ae7d.firebaseapp.com",
  databaseURL: "https://classroom-games-7ae7d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "classroom-games-7ae7d",
  storageBucket: "classroom-games-7ae7d.firebasestorage.app",
  messagingSenderId: "433158756735",
  appId: "1:433158756735:web:254d9b0b2e36502b4de24a"
};
const DH_API='https://api.dahandin.com/openapi/v1';

/* ---------- 가상 회사 6개 (사회 2단원 무역·시장경제와 이어져요) ---------- */
// g: 회사가 꾸준히 크는 힘(하루 %), v: 매일 흔들리는 정도(±%). 학생에게는 보이지 않아요
const CO=[
  {id:'sea',e:'🚢',n:'바다해운',d:'큰 배로 여러 나라에 물건을 실어 날라요',p:1000,g:.3,v:3},
  {id:'volt',e:'🔋',n:'번개배터리',d:'전기차 배터리를 만들어요. 원료인 흑연을 수입해요',p:1500,g:.5,v:4},
  {id:'chip',e:'💾',n:'반짝반도체',d:'반도체를 만들어 세계 여러 나라에 수출해요',p:2000,g:.5,v:4},
  {id:'car',e:'🚗',n:'씽씽자동차',d:'자동차를 만들어 여러 나라에 수출해요',p:3000,g:.4,v:3},
  {id:'sun',e:'☀️',n:'햇살에너지',d:'햇빛으로 전기를 만들어요',p:900,g:.5,v:4.5},
  {id:'tteok',e:'🌶️',n:'냠냠떡볶이',d:'우리 동네에서 가장 인기 있는 분식집이에요',p:500,g:.2,v:3},
  {id:'mart',e:'🛒',n:'바로마트',d:'먹을거리와 생활용품을 팔아요. 경기가 나빠도 꾸준히 팔려요',p:700,g:.3,v:1.5},
  {id:'farm',e:'🌾',n:'푸른농장',d:'쌀과 과일을 길러요. 날씨가 아주 중요해요',p:800,g:.2,v:2.5},
  {id:'game',e:'🎮',n:'두근게임즈',d:'재미있는 게임을 만들어 팔아요',p:1200,g:.4,v:4.5},
  {id:'star',e:'🎤',n:'반짝엔터',d:'케이팝 가수를 키워 세계 무대에 세워요',p:1300,g:.4,v:5},
  {id:'drug',e:'💊',n:'튼튼제약',d:'감기약과 백신을 만들어요',p:2500,g:.4,v:3.5},
  {id:'bank',e:'🏛️',n:'든든은행',d:'사람들의 돈을 맡아 주고 빌려줘요. 이자가 오르면 돈을 더 벌어요',p:1800,g:.3,v:2},
  {id:'air',e:'✈️',n:'구름항공',d:'비행기로 사람과 물건을 실어 날라요. 기름값과 여행객 수가 중요해요',p:1100,g:.2,v:4}
];
// ETF: 여러 회사를 바구니에 함께 담은 상품. 값은 담긴 회사들의 평균 움직임을 따라가요
const ETF=[
  {id:'etfall',e:'🧺',n:'우리반 전체 ETF',d:'13개 회사를 모두 조금씩 담은 바구니예요. 한 회사가 어려워도 덜 흔들려요',p:1000,k:'etf',of:CO.map(c=>c.id)},
  {id:'etffut',e:'🚀',n:'미래기술 ETF',d:'배터리·반도체·자동차·태양광 회사를 함께 담았어요',p:1000,k:'etf',of:['volt','chip','car','sun']}
];
const GOLD={id:'gold',e:'🥇',n:'금',d:'세상이 불안할 때 사람들이 찾는 안전 자산이에요. 천천히 움직여요',p:3000,k:'gold',g:.25,v:1};
const AS=[...CO,...ETF,GOLD];
const COI=Object.fromEntries(AS.map(c=>[c.id,c]));
const feeRate=(c,cfg)=>c.k==='etf'?cfg.fee*.3:c.k==='gold'?cfg.fee*.5:cfg.fee;
const feeOf=(amt,c,cfg,short)=>Math.max(10,Math.round(amt*(feeRate(c,cfg)+(short?cfg.sfee:0))/100));
/* ---------- 뉴스 카드: x는 다음 날 아침 주가에 주는 영향(-2 ~ +2). 실제 오르내림은 여기에 작은 운이 더해져요 ---------- */
const NEWS=[

/* ---------- 주문 서명: 학생 기기마다 열쇠를 만들어, 다른 친구 이름으로 주문을 넣을 수 없게 해요 ---------- */
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const EC={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'};
async function myKeys(room,num){
  const k0='stock-key-'+room+'-'+num;let k=store(k0);
  if(!k||!k.priv){
    const kp=await crypto.subtle.generateKey(EC,true,['sign','verify']);
    const priv=await crypto.subtle.exportKey('jwk',kp.privateKey),pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
    k={priv,pub:{kty:pub.kty,crv:pub.crv,x:pub.x,y:pub.y}};store(k0,k);
  }
  return k;
}
async function signStr(priv,str){const key=await crypto.subtle.importKey('jwk',priv,EC,false,['sign']);return b64(await crypto.subtle.sign(SG,key,new TextEncoder().encode(str)));}
async function verifyStr(pub,str,sig){try{const key=await crypto.subtle.importKey('jwk',{kty:pub.kty,crv:pub.crv,x:pub.x,y:pub.y,ext:true},EC,false,['verify']);return await crypto.subtle.verify(SG,key,unb64(sig),new TextEncoder().encode(str));}catch(e){return false;}}
async function fpOf(pub){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pub.x+pub.y)));return FP[h[0]%FP.length]+FP[h[1]%FP.length];}

function parseName(s){const m=String(s).trim().match(/^(\d{1,2})\s*[번.]?\s*(.+)$/);return m?{num:+m[1],name:m[2].trim()}:null;}
function joinView(){
  clearOffs();$('#foot').innerHTML='';
  const saved=store('stock-me');
  if(saved&&ROOM&&saved.room===ROOM){me=saved;return enterRoom();}
  $('#sub').textContent='학생 화면';
  ClassWatch.student({db,room:ROOM,root:app});ClassWatch.step('들어가기');
  app.innerHTML=`<div class="grid" style="max-width:760px;margin:0 auto">
   <div class="panel grid"><h2>방 번호</h2><input id="rm" inputmode="numeric" maxlength="4" placeholder="TV에 보이는 4자리" value="${esc(ROOM)}"></div>
   <div class="panel grid"><h2>"번호 이름"을 써요</h2><input id="nm" placeholder="예) 7 김민수" autocomplete="off"></div>
   <label class="check"><input type="checkbox" id="ez"> 🌟 쉬운 화면 (그림과 글자를 크게, 한 주씩 사고팔기)</label>
   <div class="msg bad" id="jm" role="status"></div>
   <div class="row"><button id="enter" disabled>들어가기</button><button class="ghost" id="home">처음으로</button></div>
   <p class="muted" style="margin:0">이 태블릿이 내 증권 계좌가 돼요. 3주 동안 같은 태블릿으로 들어와요.</p></div>`;
  const chk=()=>{$('#enter').disabled=!(/^\d{4}$/.test($('#rm').value)&&parseName($('#nm').value));};
  $('#rm').oninput=chk;$('#nm').oninput=chk;
  $('#home').onclick=startView;
  ClassWatch.joinForm({checks:[]});
  $('#enter').onclick=async()=>{
    const code=$('#rm').value,p=parseName($('#nm').value),easy=$('#ez').checked;
    $('#enter').disabled=true;
    try{
      const a=await withTimeout(roomRef(code).child('app').get());
      if(a.val()!=='stock'){$('#jm').textContent='방 번호를 다시 확인해요.';return chk();}
      const k=await myKeys(code,p.num),f=await fpOf(k.pub);
      const r=await withTimeout(roomRef(code).child('players/'+p.num).transaction(c=>{
        if(c&&c.name!==p.name)return;
        return {...(c||{}),name:p.name,key:k.pub,fp:f,easy:easy||!!(c&&c.easy),at:Date.now()};
      },undefined,false));
      if(!r.committed){const c=r.snapshot.val();$('#jm').textContent=`${p.num}번은 이미 "${c&&c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}
    }catch(e){$('#jm').textContent='연결 문제: '+(e.code||e.message);return chk();}
    ROOM=code;me={room:code,num:p.num,name:p.name};store('stock-me',me);
    history.replaceState(null,'','?room='+code);
    enterRoom();
  };
}
async function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app});ClassWatch.who(me.num,me.name);
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  KEYS=await myKeys(me.room,me.num);MYFP=await fpOf(KEYS.pub);
  PUB=null;P=null;MYO={};MYP=null;predDay=null;vkey='';
  const R=roomRef(me.room);
  listen(R.child('players/'+me.num),s=>{
    const v=s.val();
    if(!v){store('stock-me',null);me=null;clearOffs();return joinView();}
    P=v;$('#sub').textContent=`${me.num}번 ${me.name}`;document.body.classList.toggle('easy',!!P.easy);render();
  });
  listen(R.child('pub'),s=>{PUB=s.val();render();});
  listen(R.child('orders/'+me.num),s=>{MYO=s.val()||{};render();});
  offs.push(()=>{if(predOff)predOff();predOff=null;});
  clearInterval(tick);tick=setInterval(()=>{
    const el=$('#cd');if(el&&PUB)el.textContent=hms(PUB.closeAt-now());
    const o=isOpen(PUB);if(o!==wasOpen){wasOpen=o;render(true);}
  },500);
}
const myAcct=()=>PUB&&PUB.acct&&PUB.acct[me.num];
const myOps=()=>Object.entries((PUB&&PUB.ops)||{}).filter(([,o])=>o.num===me.num).sort((a,b)=>b[1].at-a[1].at);
const pendingOrders=()=>Object.entries(MYO).filter(([,o])=>!o.r).map(([id,o])=>{try{return JSON.parse(o.d);}catch(e){return null;}}).filter(Boolean);
function render(force){
  if(!me)return;
  if(PUB&&PUB.day!==predDay){
    if(predOff)predOff();predDay=PUB.day;MYP=null;DRAFT=null;
    const ref=roomRef(me.room).child(`pred/${predDay}/${me.num}`);const h=ref.on('value',x=>{MYP=x.val();render();});predOff=()=>ref.off('value',h);
  }
  const a=myAcct();
  const st=!PUB||!P?'load':P.fp!==MYFP?'other':!a||a.fp!==MYFP?'wait':'main';
  const open=isOpen(PUB);
  const data=st!=='main'?[a&&a.fp]:TAB==='news'?[PUB.news,PUB.reveal,MYP]:[PUB.prices,PUB.hist,PUB.fx,PUB.fxHist,a,MYO,myOps(),PUB.cfg];
  const key=JSON.stringify([st,TAB,SEL,QTY,NIN,NOUT,FXQ,DW,SW,open,!!(P&&P.easy),PUB&&PUB.day,PUB&&PUB.phase,data]);
  if(key===vkey&&!force)return;vkey=key;
  if(st==='load'){app.innerHTML='<div class="panel"><h2>불러오는 중…</h2></div>';return;}
  if(st==='other')return stuOther();
  if(st==='wait')return stuWait(a);
  stuMain(a,open);
}
function frame(inner){
  app.innerHTML=`<div class="grid" style="max-width:980px;margin:0 auto">${inner}</div>`;
  $('#foot').innerHTML='<button class="ghost small" id="relog">다른 이름으로 들어가기</button>';
  $('#relog').onclick=()=>{if(!confirm('다른 이름으로 들어갈까요? 이 태블릿의 내 계좌 열쇠는 그대로 남아 있어요.'))return;store('stock-me',null);me=null;clearOffs();joinView();};
}
function stuOther(){
  ClassWatch.step('다른 기기 알림',{wait:true});
  frame(`<div class="panel grid center"><div class="emoji">📱</div><h2 style="font-size:1.7rem">다른 기기에서 ${me.num}번으로 들어왔어요</h2>
   <p style="margin:0">내 계좌는 한 기기에서만 쓸 수 있어요. 이 태블릿으로 계속하려면 아래 버튼을 누르고 선생님께 승인을 받아요.</p>
   <button id="rereg">이 태블릿으로 다시 등록</button></div>`);
  $('#rereg').onclick=()=>roomRef(me.room).child('players/'+me.num).update({key:KEYS.pub,fp:MYFP,at:Date.now()});
}
function stuWait(a){
  ClassWatch.step('승인 기다리기',{wait:true});
  frame(`<div class="panel grid center"><div class="emoji">⏳</div><h2 style="font-size:1.7rem">${a?'새 기기라서 선생님 승인이 필요해요':'선생님이 계좌를 열어 주고 있어요'}</h2>
   <p style="margin:0">선생님 화면에 내 이름과 이 그림이 보이면 승인을 기다려요.</p><div class="fp">${MYFP}</div></div>
   ${rulesBox()}`);
}
function rulesBox(){
  const c=(PUB&&PUB.cfg)||{rate:1000,cap:20,ratio:.5};
  return `<div class="rules"><b>쿠키 증권의 약속</b><ul>
    <li>쿠키 1개는 <b>${won(c.rate)}</b>이에요. 다했니 쿠키를 맡기면 투자할 돈이 생겨요.</li>
    <li>주가는 오를 수도, 내릴 수도 있어요. <b>쿠키를 잃을 수도 있어요.</b> 잃어도 괜찮은 만큼만 맡겨요.</li>
    <li>맡길 수 있는 쿠키는 남은 쿠키의 ${Math.round(c.ratio*100)}%, 모두 합쳐 최대 ${c.cap}개예요.</li>
    <li>장은 매일 아침 뉴스와 함께 열리고 <b>오후 ${esc(c.close||'1:10')}</b>에 닫혀요. 수업 시간에는 거래하지 않아요.</li>
    <li>사고팔 때마다 수수료가 붙어요. 산 지 ${c.sdays!=null?c.sdays:3}일이 안 돼서 팔면 수수료가 더 붙어요. <b>자주 사고팔면 손해</b>예요.</li>
    <li>한 회사에 몰지 말고 여러 회사, ETF, 금에 나누어 담아요. 🏦 은행에서 달러 환전, 예금, 적금도 할 수 있어요.</li>
    <li>친구 태블릿으로 주문하지 않아요. 내 계좌는 내 태블릿에서만 움직여요.</li></ul></div>`;
}
function stuMain(a,open){
  const easy=!!(P&&P.easy);
  const ph=PUB.phase;
  const status=ph==='end'?'<span class="mkt closed">🏁 프로젝트가 끝났어요</span>'
    :ph==='setup'?'<span class="mkt closed">⏳ 곧 첫 거래일이 시작돼요. 먼저 쿠키를 맡겨요</span>'
    :open?`<span class="mkt">🟢 장이 열려 있어요 · 마감까지 <b id="cd">${hms(PUB.closeAt-now())}</b></span>`
    :'<span class="mkt closed">🔴 장이 닫혔어요 · 내일 아침 새 뉴스와 함께 열려요</span>';
  const tabs=[['market','📈 시장'],['bank','🏦 은행'],['news','📰 뉴스'],['wallet','💰 내 지갑'],['cookie','🍪 쿠키']];
  ClassWatch.step({market:'시장',bank:'은행·환전',news:'뉴스와 예측',wallet:'내 지갑',cookie:'쿠키 맡기기·찾기'}[TAB],{n:tabs.findIndex(t=>t[0]===TAB)+1,total:tabs.length});
  frame(`<div class="row between"><span class="band">${PUB.day?`${PUB.day}일째 / ${PUB.cfg.days}일`:'준비'}</span>${status}</div>
   <div class="status"><div><small>💵 투자할 수 있는 돈</small><b class="num">${won(a.cash)}</b></div><div><small>📊 내 자산 (돈 + 주식 + 은행)</small><b class="num">${won(a.v)}</b></div>
    <div><small>📈 수익률</small><b class="num ${ud(a.ret)}">${a.dep?pctTxt(a.ret):'－'}</b></div></div>
   <nav class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${TAB===k}">${l}</button>`).join('')}</nav>
   <div id="tabbox" class="grid"></div>`);
  $$('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();});
  const box=$('#tabbox');
  if(TAB==='market')stuMarket(box,a,open,easy);
  else if(TAB==='bank')stuBank(box,a,open);
  else if(TAB==='news')stuNews(box,open,easy);
  else if(TAB==='wallet')stuWallet(box,a);
  else stuCookie(box,a,easy);
}
function coCard(c,a,btn){
  const pr=PUB.prices[c.id],ch=(PUB.chg||{})[c.id]||0,mine=(a.hold||{})[c.id]||0;
  return `<${btn?'button':'div'} class="co" ${btn?`data-co="${c.id}" aria-pressed="${SEL===c.id}"`:''}><div class="hd"><span>${c.e}</span><b>${esc(c.n)}</b></div>
    <div class="pr num">${won(pr)} <small class="${ud(ch)}">${pctTxt(ch)}</small></div>${spark((PUB.hist||{})[c.id])}
    ${mine?`<div class="mine">내 주식 ${mine}주</div>`:'<div class="muted" style="font-size:.95rem">아직 없어요</div>'}</${btn?'button':'div'}>`;
}
function stuMarket(box,a,open,easy){
  const pend=pendingOrders().filter(o=>o.t==='buy'||o.t==='sell');
  let det='';
  if(SEL){
    const c=COI[SEL],pr=PUB.prices[SEL],mine=(a.hold||{})[SEL]||0,avg=mine?Math.round(((a.cost||{})[SEL]||0)/mine):0;
    if(easy)QTY=1;
    const fr=feeRate(c,PUB.cfg)/100,maxBuy=Math.max(0,Math.floor(a.cash/(pr*(1+fr))));
    const lb=(a.lb||{})[SEL],short=lb!=null&&PUB.day-lb<PUB.cfg.sdays;
    const bf=feeOf(pr*QTY,c,PUB.cfg,false),sf=feeOf(pr*QTY,c,PUB.cfg,short);

      <div class="detail"><div class="grid" style="gap:6px"><div class="big num">${won(pr)} <span class="${ud((PUB.chg||{})[SEL]||0)}" style="font-size:.7em">${pctTxt((PUB.chg||{})[SEL]||0)}</span></div>${((PUB.hist||{})[SEL]||[]).length>1?spark((PUB.hist||{})[SEL],400,120):'<p class="muted" style="margin:0">내일 아침부터 주가 그래프가 그려져요.</p>'}
        <div class="muted">처음 값 ${won(((PUB.hist||{})[SEL]||[pr])[0])} · 내 주식 <b>${mine}주</b>${mine?` · 산 값 평균 ${won(avg)}`:''}</div></div>
       <div class="grid" style="gap:10px">${easy?`<div class="big center">한 주씩 사고팔아요</div>`:`<div class="stepper"><button class="ghost" id="qm" aria-label="한 주 빼기">−</button><output class="num" id="qv">${QTY}주</output><button class="ghost" id="qp" aria-label="한 주 더하기">＋</button></div>
         <div class="row" style="justify-content:center"><button class="ghost small" id="qmax" ${maxBuy?'':'disabled'}>살 수 있는 만큼 (${maxBuy}주)</button><button class="ghost small" id="qall" ${mine?'':'disabled'}>가진 만큼 (${mine}주)</button></div>

        ${short&&mine?`<div class="warn" style="padding:6px 10px">⏱ 산 지 ${PUB.day-lb}일밖에 안 됐어요. 지금 팔면 단기 매매 수수료 ${PUB.cfg.sfee}%가 더 붙어요.</div>`:''}
        <div class="bs"><button class="upb" id="buy" ${open&&cost<=a.cash?'':'disabled'}>${easy?'1주 사기':'사기'}</button><button class="downb" id="sell" ${open&&mine>=QTY?'':'disabled'}>${easy?'1주 팔기':'팔기'}</button></div>
        <div class="msg ${open?'':'bad'}" role="status">${!open?'장이 닫혀 있어서 지금은 사고팔 수 없어요.':cost>a.cash?'돈이 모자라요.':''}</div></div></div></div>`;
  }

   <div class="tip">💡 사고팔 때마다 <b>수수료</b>가 붙어요 (주식 ${PUB.cfg.fee}%, ETF ${+(PUB.cfg.fee*.3).toFixed(2)}%, 금 ${+(PUB.cfg.fee*.5).toFixed(2)}%). 산 지 ${PUB.cfg.sdays}일이 안 돼서 팔면 <b>${PUB.cfg.sfee}%</b>가 더 붙어요. 자주 사고팔수록 손해예요!</div>
   <div class="sect">📈 주식 (회사 하나)</div><div class="cos">${CO.map(c=>coCard(c,a,true)).join('')}</div>
   <div class="sect">🧺 ETF (여러 회사를 담은 바구니)</div><div class="cos">${ETF.map(c=>coCard(c,a,true)).join('')}</div>
   <div class="sect">🥇 금 (안전 자산)</div><div class="cos">${coCard(GOLD,a,true)}</div>
   <p class="muted" style="margin:0">누르면 사고팔 수 있어요. 빨간색은 어제보다 오른 값, 파란색은 내린 값이에요.</p>`;
  $$('[data-co]',box).forEach(b=>b.onclick=()=>{SEL=SEL===b.dataset.co?'':b.dataset.co;QTY=1;render();});
  if(!SEL)return;

    $('#qmax').onclick=()=>{QTY=Math.max(1,Math.floor(a.cash/(pr*(1+feeRate(COI[SEL],PUB.cfg)/100))));render();};$('#qall').onclick=()=>{QTY=Math.max(1,mine);render();};}
  $('#buy').onclick=()=>sendOrder({t:'buy',c:SEL,q:QTY});
  $('#sell').onclick=()=>{const lb=(a.lb||{})[SEL];if(lb!=null&&PUB.day-lb<PUB.cfg.sdays&&!confirm(`산 지 ${PUB.day-lb}일밖에 안 됐어요.\n지금 팔면 수수료가 ${PUB.cfg.sfee}% 더 붙어요. 그래도 팔까요?`))return;sendOrder({t:'sell',c:SEL,q:QTY});};
}

   <div class="panel grid"><h2>💵 환전소 (원 ↔ 달러)</h2>

function basket(hold,prices,usdWon){
  const w={};let tot=0;
  AS.forEach(c=>{const v=(hold[c.id]||0)*prices[c.id];if(!v)return;tot+=v;
    if(c.k==='etf')c.of.forEach(id=>w[id]=(w[id]||0)+v/c.of.length);else w[c.id]=(w[c.id]||0)+v;});
  if(usdWon>0){w.usd=usdWon;tot+=usdWon;}
  if(!tot)return 0;
  return 1/Object.values(w).reduce((s,v)=>s+(v/tot)**2,0);
}

function norm(x){
  if(x===null||x===undefined)return undefined;
  if(typeof x==='object'){const o={};Object.keys(x).sort().forEach(k=>{const v=norm(x[k]);if(v!==undefined)o[k]=v;});return Object.keys(o).length?o:undefined;}
  if(typeof x==='number'&&!isFinite(x))return undefined;
  return x;
}

async function verifyOps(n,type){

async function applyNews(){
  if(!M.day||!M.today)return;
  const P=(await withTimeout(roomRef(ROOM).child('pred/'+M.day).get())).val()||{};
  const chg={};
  /* 하루 주가 = 꾸준히 크는 힘 + 뉴스 영향 + 운 − 어제 뉴스로 너무 오른(내린) 만큼 조금 되돌림
     그래서 뉴스를 보고 바로 따라 사고팔기보다, 좋은 회사를 골고루 오래 가진 친구가 유리해요 */
  const mom={};
  [...CO,GOLD].forEach(c=>{
    const lv=(M.eff||{})[c.id]||0,gold=c.k==='gold';
    const news=lv*(gold?1+Math.random()*1.5:2+Math.random()*3);
    let p=c.g+news+(Math.random()*2-1)*c.v-.4*((M.mom||{})[c.id]||0);p=Math.max(-20,Math.min(20,p));
    mom[c.id]=news;
    const old=M.prices[c.id],np=gold?Math.max(100,Math.round(old*(1+p/100))):Math.max(100,Math.round(old*(1+p/100)/10)*10);
    chg[c.id]=Math.round((np-old)/old*1000)/10;M.prices[c.id]=np;M.hist[c.id].push(np);
  });
  M.mom=mom;
  ETF.forEach(e=>{
    const r=e.of.reduce((s,id)=>s+M.prices[id]/M.hist[id][M.hist[id].length-2],0)/e.of.length;
    const old=M.prices[e.id],np=Math.max(100,Math.round(old*r));
    chg[e.id]=Math.round((np-old)/old*1000)/10;M.prices[e.id]=np;M.hist[e.id].push(np);
  });
  M.chg=chg;
  // 환율: 뉴스 영향 한 단계에 1~2%, 작은 운 ±1%, 하루 최대 ±6%
  const fl=(M.eff||{}).fx||0;
  let fp=fl*(1+Math.random())+(Math.random()*2-1);fp=Math.max(-6,Math.min(6,fp));
  const ofx=M.fx,nfx=Math.max(500,Math.round(ofx*(1+fp/100)));
  M.fx=nfx;M.fxHist.push(nfx);M.fxChg=Math.round((nfx-ofx)/ofx*1000)/10;
  let right=0;
  Object.entries(P).forEach(([n,p])=>{const a=M.acct[n];if(!a||!p)return;let pt=0;if(p.up&&chg[p.up]>0)pt++;if(p.down&&chg[p.down]<0)pt++;a.pt=(a.pt||0)+pt;if(pt)right++;});
  M.reveal={day:M.day,e:M.today.e,t:M.today.t,chg,fx:M.fxChg,right,n:Object.keys(P).length};
  M.log.push({day:M.day,e:M.today.e,t:M.today.t,eff:M.eff,chg,fx:M.fx});
}
/* 새 날 아침 은행 일: 예금 이자(복리), 적금 자동 납입과 만기 */
function bankDay(){
  const c=M.cfg,nd=M.day+1;
  Object.values(M.acct).forEach(a=>{
    if(M.day){const b=basket(a.hold||{},M.prices,(a.usd||0)*M.fx);a.divSum=(a.divSum||0)+b;a.divDays=(a.divDays||0)+1;}
    if(M.day&&a.dpst>0){const it=Math.floor(a.dpst*c.dRate/100);if(it>0){a.dpst+=it;a.dInt=(a.dInt||0)+it;a.bk=[{d:nd,m:`🏦 예금 이자 ${won(it)}을 받았어요`},...(a.bk||[])].slice(0,15);}}
    const s=a.sav;if(!s)return;
    if(s.paid>=c.term){const p=s.paid*s.w,it=Math.floor(p*c.sRate/100);a.cash+=p+it;a.sav=null;a.bk=[{d:nd,m:`🐷 적금 만기! ${won(p)} + 이자 ${won(it)}을 받았어요`},...(a.bk||[])].slice(0,15);return;}
    if(a.cash>=s.w){a.cash-=s.w;s.paid++;a.bk=[{d:nd,m:`🐷 적금에 ${won(s.w)}을 넣었어요 (${s.paid}/${c.term}번)`},...(a.bk||[])].slice(0,15);}
    else{s.miss=(s.miss||0)+1;a.bk=[{d:nd,m:`🐷 돈이 모자라서 오늘은 적금을 건너뛰었어요`},...(a.bk||[])].slice(0,15);}
  });
}
async function startDay(nw){
  await drain();
  await applyNews();
  bankDay();
  M.day++;M.today={e:nw.e,t:nw.t,b:nw.b,day:M.day};M.eff=nw.x||{};
  if(nw.i!=null&&!M.used.includes(nw.i))M.used.push(nw.i);
  M.closeAt=nextClose(M.cfg.close);M.phase='open';M.feed=[];M.award=false;
  saveM();listenPred();publish();
}
async function endProject(){
  await drain();
  await applyNews();
  const rate=M.cfg.rate;
  Object.entries(M.acct).forEach(([n,a])=>{
    AS.forEach(c=>{const q=(a.hold||{})[c.id]||0;if(q)a.cash+=q*M.prices[c.id];});
    a.hold={};a.cost={};
    // 달러는 마지막 환율로 바꾸고, 예금은 찾고, 적금은 다 모았으면 이자까지 줘요
    if(a.usd){a.cash+=a.usd*M.fx;a.usd=0;a.usdCost=0;}
    if(a.dpst){a.cash+=a.dpst;a.dpst=0;}
    if(a.sav){const p=a.sav.paid*a.sav.w;a.cash+=p+(a.sav.paid>=M.cfg.term?Math.floor(p*M.cfg.sRate/100):0);a.sav=null;}
    const k=Math.round(a.cash/rate);
    if(k>0)M.ops['fin'+n]={num:+n,type:'out',n:k,st:'wait',at:Date.now(),fin:true};
    a.fin={cash:a.cash,n:k};a.cash=0;
    if(k>0)snapOp('fin'+n);
  });
  M.phase='end';M.today=null;M.closeAt=0;
  saveM();publish();
}

   <div class="rules">${M.day?`<b>누르면 이렇게 돼요</b><ul><li>남은 주문을 모두 처리해요.</li><li>어제 뉴스(${esc(M.today?M.today.t:'')})의 영향으로 주가와 환율이 바뀌고, 예측 점수를 매겨요.</li><li>예금 이자를 주고, 적금을 자동으로 넣어요.</li><li>아래 고른 뉴스가 오늘의 뉴스로 나오고 장이 열려요 (마감 오후 ${esc(M.cfg.close)}).</li></ul>`:'첫 뉴스가 나오고 장이 열려요. 주가는 내일 아침 이 뉴스에 따라 바뀌어요.'}</div>
   <div class="seg"><button data-own="0" aria-pressed="${!P.own}">준비된 뉴스에서 고르기</button><button data-own="1" aria-pressed="${P.own}">✏️ 직접 쓰기 (우리 반 일로)</button></div>
   ${P.own?`<div class="f2"><label class="fld"><span class="lb">그림 (이모지)</span><input id="ne" value="${esc(P.e)}" maxlength="4"></label><label class="fld" style="grid-column:span 2"><span class="lb">제목</span><input id="nt" value="${esc(P.t)}" maxlength="40" placeholder="예) 우리 학교 체육대회가 열려요"></label></div>
     <label class="fld"><span class="lb">내용 (두세 문장)</span><textarea id="nb" maxlength="200">${esc(P.b)}</textarea></label>
     <div class="fld"><span class="lb">내일 주가와 환율에 주는 영향 (학생에게는 안 보여요)</span>${EFF.map(c=>`<div class="effrow"><span>${c.e} ${esc(c.n)}</span><div class="seg" data-c="${c.id}">${LV.map(([v,l])=>`<button data-v="${v}" aria-pressed="${(P.x[c.id]||0)===v}">${l}</button>`).join('')}</div></div>`).join('')}</div>`
    :`<div class="nlist">${NEWS.map((n,k)=>`<button data-i="${k}" aria-pressed="${P.i===k}" class="${M.used.includes(k)?'used':''}">${n.e} ${esc(n.t)}${M.used.includes(k)?' (썼어요)':''}</button>`).join('')}</div>
     ${newsCard({...sel,day:M.day+1})}
     <button class="ghost" id="peek">🔒 내일 주가 영향 보기 (꾹 누르기 · 학생에게 보이지 않게)</button>
     <div class="secret" id="sec">${EFF.map(c=>`${c.e} ${esc(c.n)} ${(LV.find(l=>l[0]===(sel.x[c.id]||0))||LV[2])[1]}`).join(' · ')}</div>`}
   <div class="row" style="justify-content:center"><button id="go" style="font-size:1.3rem">${M.day?'🌅 새 날 시작':'🔔 장 열기'}</button></div>
   <div class="msg bad" id="dm"></div></div>`;
  bindClose();
  $$('[data-own]').forEach(b=>b.onclick=()=>{P.own=b.dataset.own==='1';drawDay();});
  $$('[data-i]').forEach(b=>b.onclick=()=>{P.i=+b.dataset.i;drawDay();});
  $$('.seg[data-c]').forEach(s=>$$('button',s).forEach(b=>b.onclick=()=>{P.x[s.dataset.c]=+b.dataset.v;drawDay();}));
  ['ne','nt','nb'].forEach(id=>{const el=$('#'+id);if(el)el.oninput=()=>{P[id[1]]=el.value;};});
  if($('#peek')){const s=$('#sec');$('#peek').onpointerdown=e=>{e.preventDefault();s.classList.add('on');};['pointerup','pointerleave','pointercancel'].forEach(t=>$('#peek').addEventListener(t,()=>s.classList.remove('on')));}
  $('#go').onclick=async()=>{
    const nw=P.own?{e:P.e||'📰',t:P.t.trim(),b:P.b.trim(),x:{...P.x}}:{...NEWS[P.i],i:P.i};
    if(!nw.t){$('#dm').textContent='뉴스 제목을 써 주세요.';return;}
    $('#go').disabled=true;
    try{await startDay(nw);DAYPICK=null;closeModal();}catch(e){$('#dm').textContent='시작하지 못했어요: '+(e.message||e);$('#go').disabled=false;}
  };
}
function drawCookie(){
  if(MODAL!=='cookie')return;
  const groups={};
  Object.entries(M.ops).forEach(([id,o])=>{if(o.st!=='wait')return;const k=o.num+'|'+o.type;(groups[k]=groups[k]||{num:o.num,type:o.type,ops:[]}).ops.push(o);});
  const G=Object.values(groups).sort((a,b)=>a.type<b.type?1:a.type>b.type?-1:a.num-b.num);
  const done=Object.values(M.ops).filter(o=>o.st!=='wait').sort((a,b)=>(b.doneAt||b.at)-(a.doneAt||a.at)).slice(0,15);
  const ready=!!DH.key;
  const sumIn=G.filter(g=>g.type==='in').reduce((s,g)=>s+g.ops.reduce((t,o)=>t+o.n,0),0),sumOut=G.filter(g=>g.type==='out').reduce((s,g)=>s+g.ops.reduce((t,o)=>t+o.n,0),0);
  modal.innerHTML=`<div class="panel grid">${mhead('🍪 쿠키 처리')}
   <p style="margin:0">다했니에서 아래만큼 <b>빼거나(사용 처리)</b> <b>주고</b>, 확인을 눌러요. ${ready?'확인을 누르면 다했니 쿠키가 정말 바뀌었는지 API로 읽어서 맞을 때만 처리해요.':'다했니 API를 연결하지 않아서 "직접 확인"으로 처리해요. (⚙️ 설정에서 연결할 수 있어요)'}</p>
   <div class="chips"><span>빼야 할 쿠키 ${sumIn}개</span><span>줘야 할 쿠키 ${sumOut}개</span></div>
   ${G.map(g=>{const n=g.ops.reduce((s,o)=>s+o.n,0),a=M.acct[g.num]||{};const warn=g.ops.map(o=>o.warn||o.snapErr).filter(Boolean);
     return `<div class="opg"><div class="row between"><b>${g.num} ${esc(a.name||'')} · ${g.type==='in'?`다했니에서 쿠키 <span class="down">${n}개 빼기</span> → ${won(n*M.cfg.rate)} 넣기`:`다했니에서 쿠키 <span class="up">${n}개 주기</span>${g.ops.some(o=>o.fin)?' (마지막 정산)':''}`}</b>
       <div class="row">${ready&&dhReady(g.num)?`<button class="okb small" data-v="${g.num}|${g.type}">다했니에서 확인</button>`:''}<button class="${ready&&dhReady(g.num)?'ghost':'okb'} small" data-m="${g.num}|${g.type}">직접 확인</button>${g.ops.some(o=>o.fin)?'':`<button class="ghost small" data-c="${g.num}|${g.type}">취소</button>`}</div></div>
       ${warn.length?`<div class="warn" style="padding:4px 10px">${warn.map(esc).join(' · ')}</div>`:''}<div class="msg bad" style="min-height:0" id="vm${g.num}${g.type}"></div></div>`;}).join('')||'<p class="muted">지금 처리할 쿠키가 없어요.</p>'}
   <details><summary>최근 처리한 것</summary><div class="ops" style="margin-top:8px">${done.map(o=>`<div><span>${o.num} ${esc((M.acct[o.num]||{}).name||'')} · ${o.type==='in'?'맡기기':'돌려주기'} ${o.n}개</span><span>${o.st==='done'?(o.how==='api'?'✔ 다했니로 확인':'✔ 직접 확인'):'✕ 취소'}</span></div>`).join('')||'<span class="muted">없어요</span>'}</div></details></div>`;
  bindClose();
  $$('[data-v]').forEach(b=>b.onclick=async()=>{const [n,t]=b.dataset.v.split('|');b.disabled=true;const m=await verifyOps(+n,t);const el=$(`#vm${n}${t}`);if(el)el.textContent=m;b.disabled=false;});
  $$('[data-m]').forEach(b=>b.onclick=()=>{const [n,t]=b.dataset.m.split('|');if(confirm(`다했니에서 ${n}번 쿠키를 ${t==='in'?'뺐나요':'줬나요'}?`))finishOps(+n,t,'manual');});
  $$('[data-c]').forEach(b=>b.onclick=()=>{const [n,t]=b.dataset.c.split('|');if(confirm(`${n}번 신청을 취소할까요?`))finishOps(+n,t,'cancel');});
}
function drawSet(){
  const c=M.cfg;
  const codes=Object.entries(DH.codes||{}).sort((a,b)=>a[0]-b[0]).map(([n,v])=>`${n} ${v}`).join('\n');
  modal.innerHTML=`<div class="panel grid">${mhead('⚙️ 설정')}
   <div class="f2"><label class="fld"><span class="lb">장 마감 시간</span><input type="time" id="sc" value="${esc(c.close)}"></label>
    <label class="fld"><span class="lb">프로젝트 기간 (거래일)</span><input type="number" id="sd" min="1" max="60" value="${c.days}"></label>
    <label class="fld"><span class="lb">쿠키 1개 = ?원</span><input type="number" id="sr" min="100" step="100" value="${c.rate}" ${M.day||Object.values(M.acct).some(a=>a.dep)?'disabled title="쿠키를 맡긴 뒤에는 바꿀 수 없어요"':''}></label>
    <label class="fld"><span class="lb">한 명이 맡길 수 있는 쿠키 (모두 합쳐)</span><input type="number" id="sp" min="1" max="200" value="${c.cap}"></label>
    <label class="fld"><span class="lb">남은 쿠키의 몇 %까지</span><input type="number" id="so" min="10" max="100" step="10" value="${Math.round(c.ratio*100)}"></label>
    <label class="fld"><span class="lb">주식 수수료 (%) · ETF는 0.3배, 금은 0.5배</span><input type="number" id="sfe" min="0" max="5" step="0.1" value="${c.fee}"></label>
    <label class="fld"><span class="lb">단기 매매 수수료 (%)</span><input type="number" id="ssf" min="0" max="10" step="0.5" value="${c.sfee}"></label>
    <label class="fld"><span class="lb">단기 매매 기준 (산 지 며칠 안에 팔면)</span><input type="number" id="ssd" min="0" max="10" value="${c.sdays}"></label>
    <label class="fld"><span class="lb">예금 하루 이자 (%)</span><input type="number" id="sdr" min="0" max="10" step="0.1" value="${c.dRate}"></label>
    <label class="fld"><span class="lb">적금 만기 이자 (%)</span><input type="number" id="ssr" min="0" max="50" value="${c.sRate}"></label>
    <label class="fld"><span class="lb">적금 기간 (넣는 횟수)</span><input type="number" id="stm" min="2" max="15" value="${c.term}" ${Object.values(M.acct).some(a=>a.sav)?'disabled title="적금을 든 친구가 있어서 바꿀 수 없어요"':''}></label></div>
   <h3 style="font-size:1.4rem">다했니 연결 (읽기 전용)</h3>
   <div class="warn">API 키와 학생 코드는 <b>이 컴퓨터에만</b> 저장되고 학생 화면이나 서버에 올라가지 않아요. 학생 코드와 쿠키 수가 보이니 <b>TV에 띄우지 말고</b> 넣어 주세요. 새 키를 만들면 예전 키를 쓰던 다른 다했니 앱이 멈춰요.</div>
   <label class="fld"><span class="lb">다했니 API 키 (다했니 → API 센터)</span><input type="password" id="dk" value="${esc(DH.key)}" autocomplete="off" placeholder="복사해 둔 키를 붙여 넣어요"></label>
   <label class="fld"><span class="lb">학생 코드: 한 줄에 "번호 학생코드"</span><textarea id="dc" placeholder="1 ABCD1234&#10;2 EFGH5678" style="min-height:8em">${esc(codes)}</textarea></label>
   <div class="row"><button id="save">저장</button><button class="ghost" id="test">다했니 연결 확인</button></div>
   <div id="tres"></div></div>`;
  bindClose();
  const readCodes=()=>{const o={};$('#dc').value.split('\n').forEach(l=>{const p=l.trim().split(/\s+/);if(p.length>=2&&/^\d{1,2}$/.test(p[0]))o[+p[0]]=p[p.length-1];});return o;};
  $('#save').onclick=()=>{
    c.close=$('#sc').value||'13:10';c.days=Math.max(1,+$('#sd').value||15);if(!$('#sr').disabled)c.rate=Math.max(100,+$('#sr').value||1000);
    c.cap=Math.max(1,+$('#sp').value||20);c.ratio=Math.min(1,Math.max(.1,(+$('#so').value||50)/100));
    c.dRate=Math.min(10,Math.max(0,+$('#sdr').value||0));c.fee=Math.min(5,Math.max(0,+$('#sfe').value||0));c.sfee=Math.min(10,Math.max(0,+$('#ssf').value||0));c.sdays=Math.min(10,Math.max(0,Math.round(+$('#ssd').value||0)));c.sRate=Math.min(50,Math.max(0,+$('#ssr').value||0));if(!$('#stm').disabled)c.term=Math.min(15,Math.max(2,Math.round(+$('#stm').value||5)));
    DH={key:$('#dk').value.trim(),codes:readCodes()};store('stock-dh',DH);
    saveM();publish();closeModal();
  };
  $('#test').onclick=async()=>{
    DH={key:$('#dk').value.trim(),codes:readCodes()};
    const box=$('#tres');const rows=[];
    if(!DH.key){box.innerHTML='<p class="msg bad">API 키를 넣어 주세요.</p>';return;}
    box.innerHTML='<p class="muted">읽는 중…</p>';
    for(const [n,code] of Object.entries(DH.codes)){
      const ours=(M.acct[n]||PL[n]||{}).name||'';
      try{const d=await dhGet(code);rows.push(`<tr><td>${n} ${esc(ours)}</td><td>${d.number} ${esc(d.name)}</td><td class="num">${d.totalCookie}개</td><td>${ours&&ours!==d.name?'<b class="down">이름이 달라요</b>':'✔'}</td></tr>`);}
      catch(e){rows.push(`<tr><td>${n} ${esc(ours)}</td><td colspan="3" class="down">${esc(e.message)}</td></tr>`);}
      box.innerHTML=`<table class="tbl"><tr><th>우리 반</th><th>다했니</th><th>남은 쿠키</th><th>확인</th></tr>${rows.join('')}</table>`;
    }
    if(!rows.length)box.innerHTML='<p class="msg bad">학생 코드를 한 줄에 하나씩 넣어 주세요.</p>';
  };
}
function drawBackup(){
  modal.innerHTML=`<div class="panel grid">${mhead('💾 장부 백업')}
   <p style="margin:0">장부는 이 컴퓨터의 브라우저에 저장돼요. 브라우저 기록을 지우거나 다른 컴퓨터로 옮길 때를 위해 가끔 백업 파일을 내려받아 두세요. (다했니 키와 학생 코드는 백업 파일에 들어가지 않아요)</p>
   <div class="row"><button id="dl">백업 파일 내려받기</button><label class="ghost" style="display:inline-block;border:2px solid var(--coral);color:var(--coral2);border-radius:14px;padding:.6em 1.1em;font-family:var(--display);cursor:pointer">백업 파일 불러오기<input type="file" id="ul" accept=".json,application/json" hidden></label></div>
   <div class="msg" id="bm"></div>
   <details><summary>처음부터 다시 시작</summary><p>새 방을 만들고 장부를 비워요. 지금 장부는 먼저 백업해 두세요.</p><button class="ghost" id="reset">새 방 만들기</button></details></div>`;
  bindClose();
  $('#dl').onclick=()=>{const d=new Date();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(M)],{type:'application/json'}));a.download=`쿠키증권_장부_${d.getMonth()+1}월${d.getDate()}일_${M.day}일째.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);};
  $('#ul').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const o=JSON.parse(await f.text());if(!o||!o.room||!o.acct||!o.prices)throw 0;
      if(!confirm(`${o.room}번 방, ${o.day}일째 장부로 바꿀까요? 지금 장부는 사라져요.`))return;
      M=fixM(o);saveM();closeModal();teacherView();}
    catch(err){$('#bm').className='msg bad';$('#bm').textContent='쿠키 증권 백업 파일이 아니에요.';}
  };
  $('#reset').onclick=()=>{if(confirm('정말 새 방을 만들까요? 지금 장부는 사라지고 학생들은 다시 들어와야 해요.')){store('stock-master',null);closeModal();teacherView();}};
}

/* ---------- 길 찾기 ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
</body></html>
