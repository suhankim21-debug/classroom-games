<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>원기둥 연구소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* Same classroom notice-board look as 우리말 지킴이 so the class sees one family of tools. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .4em;font-size:1rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.quiz .q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.2rem;padding:.9em .5em;line-height:1.3}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}
.fig{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--coral2);line-height:1.25}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.5em .9em;font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.roll svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--cream);color:var(--ink);border:1px solid var(--line);padding:.35em .8em;font-family:var(--text);font-size:1rem;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:grid;gap:6px}
.fld label{font-family:var(--display);font-size:1.1rem}
.unit{display:flex;align-items:center;gap:8px}
.unit span{font-family:var(--display)}
.meter{position:relative;height:46px;background:var(--cream);border-radius:10px;margin:26px 0 8px}
.meter .band3{position:absolute;top:0;bottom:0;background:#DDEBE1}
.meter .mk{position:absolute;top:-24px;transform:translateX(-50%);font-family:var(--display);font-size:.95rem;white-space:nowrap}
.meter .ln{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.meter .dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--coral2);transform:translate(-50%,-50%);border:3px solid #fff}
.list{display:grid;gap:8px}
.list div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px}
.list div.out{border-left-color:var(--gold)}
.list b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
.emoji{font-size:clamp(3rem,10vw,4.5rem);line-height:1}
.score{font-family:var(--display);font-size:1.3rem}
/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,15em) 1fr 3.5em;gap:10px;align-items:center}
.bar .track{height:34px;border-radius:10px;background:var(--cream);overflow:hidden}
.bar .track div{height:100%;background:var(--ok);border-radius:10px}
.bar span{font-family:var(--display);font-size:1.1rem}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:2.6em 9em 1fr 5em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 12px}
.rank .r b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--coral2)}
.rank .r .nm{font-family:var(--display);font-size:1.25rem}
.rank .r .pt{font-family:var(--display);font-size:1.4rem;text-align:right;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.6rem}
.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:1.1rem}
.tbl th,.tbl td{background:#fff;padding:.45em .6em;text-align:center}
.tbl thead th{background:var(--coral);color:#fff;font-family:var(--display);font-weight:400}
.tbl tbody th{font-family:var(--display);font-weight:400;color:var(--coral2)}
.tbl tr.outr td,.tbl tr.outr th{background:#FFF4DF}
.okc{color:var(--ok);font-family:var(--display);font-size:1.3rem;font-weight:400}
.chart svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
@media (max-width:820px){
  .hero,.tv,.two{grid-template-columns:1fr}
  .choose,.opts{grid-template-columns:1fr}
  .steps button{font-size:.85rem}
  .rank .r{grid-template-columns:2.2em 1fr 4.5em}.rank .r .trk{display:none}
}
/* 공통 모양 */
.fig{max-width:300px}
.eq{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-family:var(--display);font-size:1.3rem}
.eq input{width:5.5em;text-align:center;font-size:1.25rem}
.formula{font-family:var(--display);font-size:clamp(1.05rem,3vw,1.4rem);background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4em .8em;text-align:center}
.formula u{text-decoration:none;color:var(--coral2)}
.plist{display:grid;gap:8px}
.pcard{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px;font-family:var(--display);font-size:1.2rem}
.pcard.star{border-left-color:var(--gold)}
.pcard b{font-weight:400;color:var(--coral2);margin-right:6px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:start}
.figs>div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-family:var(--display)}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.plot{background:#E7F2D6;border:2px solid #B9D79A;border-radius:14px;padding:8px;text-align:center}
.plot b{display:block;font-family:var(--display);font-weight:400;font-size:1.1rem}
.plot .fl{font-size:1.5rem;line-height:1.3;min-height:2.6em;letter-spacing:2px}
.plot small{color:var(--muted)}
.expl{background:#FFF4DF;border-radius:12px;padding:8px 14px;width:100%;text-align:left}
/* 문제별 정답률 */
.qrate{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.qrow.low{border-color:var(--bad);background:#FFF5F2}
.qrow .qt,.qrow .qw{text-align:left;justify-self:start}
.qrow .qb{display:grid;grid-template-columns:minmax(0,1fr) 3.6em;gap:2px 8px;align-items:center;width:100%}
.qrow .qb .track{width:100%;height:14px;border-radius:999px;background:var(--cream);overflow:hidden}
.qrow .qb .track div{height:100%;background:var(--ok);border-radius:999px}
.qrow.low .qb .track div{background:var(--bad)}
.qrow .pc{font-family:var(--display);font-size:1.3rem}
.qrow.low .pc{color:var(--bad)}
@media (max-width:820px){.qrow{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><i>🥫</i> 원기둥 연구소</div><small id="sub"></small></div></header>

.shapes button svg{width:100%;max-width:120px;height:auto}
.shapes button[aria-pressed="true"]{border-color:var(--coral);background:#FFF1EA}
.shapes button.right{border-color:var(--ok);background:#E3F1E7}
@media (max-width:820px){.shapes{grid-template-columns:repeat(3,1fr)}}
.tapfig{width:100%;max-width:300px;height:auto;display:block;margin:0 auto;touch-action:manipulation}
.tapfig .tp{cursor:pointer}
.concept{background:#E8F3EC;border:2px solid var(--ok);border-radius:14px;padding:10px 14px;text-align:left;width:100%}
.concept b{color:var(--ok)}
.rot input[type=range]{width:100%;accent-color:var(--coral)}
textarea{font-family:var(--text);font-size:1.15rem;padding:.6em .75em;border:2px solid var(--line);border-radius:12px;width:100%;min-height:5.5em;color:var(--ink);background:#fff}
.whys{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.whys div{background:#fff;border-left:6px solid var(--blue);border-radius:10px;padding:8px 14px;font-size:1.15rem}
.whys small{display:block;color:var(--muted)}
</style>

function rec(id,ok){
  if(!me||!id)return;

/* ---------- 공통: 고르기 문제 ---------- */
function pick(box,{id,q,a,o,why,onOk,fig='',noShuffle}){
  const opts=noShuffle?[a,...o].sort():shuffle([a,...o]);let first=true;
  box.innerHTML=`<div class="quiz">${fig}<div class="q">${q}</div><div class="opts">${opts.map(x=>`<button data-o="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="msg" id="pm" role="status"></div></div>`;
  $$('.opts button',box).forEach(b=>b.onclick=()=>{
    const ok=b.dataset.o===a;if(first){rec(id,ok);first=false;}
    if(ok){b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);$('#pm',box).className='msg ok';$('#pm',box).textContent='맞았어요!';setTimeout(onOk,RM?0:650);}
    else{b.classList.add('wrong');b.disabled=true;box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');$('#pm',box).className='msg bad';$('#pm',box).innerHTML=(why&&why[b.dataset.o])||'다시 골라 봐요';}
  });
}
function fillEq(box,{id,html,fields,hint,okText,onOk,solve}){
  box.innerHTML=html+`<div class="msg" id="wm" role="status"></div><div class="row" id="act" style="justify-content:center"><button id="chk">확인하기</button></div>`;
  let miss=0,first=true;
  $('#chk').onclick=async()=>{
    const v=fields.map(f=>num($('#'+f.id,box).value));
    const bad=t=>{$('#wm',box).className='msg bad';$('#wm',box).innerHTML=t;box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');};
    if(v.some(x=>x==null))return bad('빈칸을 모두 채워요.');
    const ok=fields.every((f,k)=>same(v[k],f.want));
    if(first){rec(id,ok);first=false;}
    if(!ok){miss++;return bad((hint(v)||'다시 생각해 봐요.')+(miss>=2&&solve?`<br>풀이: ${solve}`:''));}
    $('#chk').disabled=true;$$('input',box).forEach(x=>x.disabled=true);
    $('#wm',box).className='msg ok';$('#wm',box).innerHTML=okText;
    onOk(miss);
  };
}

/* 직사각형 돌리기: 축 x=A, 직사각형 가로 w(축에서 오른쪽), 위 y0, 높이 h. th(도) 만큼 돌렸을 때 */
function figRot(th){
  const A=150,w=80,y0=40,h=140,k=.28,ph=th*Math.PI/180;
  const pts=yy=>{let s='';const n=Math.max(2,Math.round(th/6));for(let i=0;i<=n;i++){const p=ph*i/n;s+=`${(A+w*Math.cos(p)).toFixed(1)},${(yy+w*k*Math.sin(p)).toFixed(1)} `;}return s;};
  const full=th>=359.5;
  const xw=A+w*Math.cos(ph);
  return `<svg class="fig" viewBox="0 0 300 230" role="img" aria-label="직사각형을 세로 막대를 기준으로 ${Math.round(th)}도 돌린 모습">
   ${full?cylSVG(A,y0,w,w*k,h,{side:'#FCE0C6',top:'#FFF1E3'}):''}
   ${th>0&&!full?`<polyline points="${pts(y0)}" fill="none" stroke="${OR}" stroke-width="3"/><polyline points="${pts(y0+h)}" fill="none" stroke="${OR}" stroke-width="3"/>`:''}
   ${full?'':`<polygon points="${A},${y0} ${xw.toFixed(1)},${(y0+w*k*Math.sin(ph)).toFixed(1)} ${xw.toFixed(1)},${(y0+h+w*k*Math.sin(ph)).toFixed(1)} ${A},${y0+h}" fill="${OR}" fill-opacity=".85" stroke="${INK}" stroke-width="2.5"/>`}
   <line x1="${A}" y1="10" x2="${A}" y2="220" stroke="${INK}" stroke-width="3"/>
   <path d="M ${A-22} 22 A 22 7 0 1 0 ${A+22} 22" fill="none" stroke="#D6336C" stroke-width="2.5"/><polygon points="${A+22},22 ${A+16},14 ${A+28},15" fill="#D6336C"/>
   ${th===0?`${T(A+w/2,y0-8,'가로')}${T(A+w+22,y0+h/2,'세로')}`:''}</svg>`;
}

/* ---------- student: room ---------- */
let me=null, ROOMV={}, ME={}, cur=1, onMe=null;
function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app});ClassWatch.who(me.num,me.name);
  $('#sub').textContent=`${me.num}번 ${me.name}`;
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  let ready=false;ROOMV={};onMe=null;
  listen(roomRef(me.room).child('students/'+me.num),s=>{
    const v=s.val();
    if(!v){store(APP+'-student',null);me=null;clearOffs();return joinView();}
    ME=v;
    if(!ready){ready=true;if(ROOMV.stage){cur=ROOMV.stage;renderStage();}return;}
    if(typeof onMe==='function')onMe();
  });
  listen(roomRef(me.room).child('stage'),s=>{
    const st=s.val()||1;const was=ROOMV.stage;ROOMV.stage=st;
    if(!ready)return;
    if(was!==st){cur=st;renderStage();} else drawSteps();
  });
  /* 선생님이 시작을 누르기 전에는 그 단계를 대기 화면으로 보여 줘요 */
  listen(roomRef(me.room).child('go'),s=>{
    const g=s.val()||0;const was=ROOMV.go||0;ROOMV.go=g;
    if(!ready)return;
    if((cur>was)!==(cur>g))renderStage(); else drawSteps();
  });
}
function waitView(){
  ClassWatch.step('대기',{n:cur,total:NST,wait:true});
  shell(`<div class="panel quiz pop"><div><span class="band">${cur}단계 · ${STAGES[cur].k}</span></div><div class="emoji" aria-hidden="true">👂</div>
    <h2 style="font-size:1.8rem">선생님 설명을 들어요</h2><p>선생님이 <b>시작</b>을 누르면 활동이 열려요. 태블릿은 잠깐 내려놓아요.</p></div>`);
}
function stepDone(n){return !!(ME['s'+n]&&ME['s'+n].done);}
function drawSteps(){
  const el=$('#steps');if(!el)return;
  el.innerHTML=[1,2,3,4].map(n=>`<button data-s="${n}" ${n>ROOMV.stage||n>(ROOMV.go||0)?'disabled':''} ${n===cur?'aria-current="step"':''} class="${stepDone(n)?'done':''}"><b>${n}</b>${STAGES[n].k}${stepDone(n)?' ✓':''}</button>`).join('');
  $$('#steps button').forEach(b=>b.onclick=()=>{cur=+b.dataset.s;renderStage();});
}
function shell(inner){
  app.innerHTML=`<div class="grid"><nav class="steps" id="steps" aria-label="활동 단계"></nav>${inner}<div style="text-align:right"><button class="ghost" id="relog" style="font-size:.85rem;padding:.4em .8em">다른 이름으로 들어가기</button></div></div>`;
  $('#relog').onclick=()=>{store(APP+'-student',null);me=null;clearOffs();joinView();};
  drawSteps();
}
function renderStage(){
  if(cur>(ROOMV.go||0))return waitView();
  ClassWatch.step(STAGES[cur].k,{n:cur,total:NST,wait:stepDone(cur)});
  onMe=()=>drawSteps();
  if(cur===1)return stage1();
  if(cur===2)return stage2();
  if(cur===3)return stage3();
  return stage4();
}

function withTimeout(pr,ms=10000){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),ms))]);}
function showError(e){
  const m=String(e&&(e.code||e.message)||e);
  let why='알 수 없는 오류가 났어요.';
  if(/permission/i.test(m)) why='Firebase 데이터베이스의 <b>규칙</b>이 막고 있어요. Realtime Database → 규칙 탭을 확인해 주세요.';
  else if(/TIMEOUT/.test(m)) why='Firebase 서버에 10초 동안 연결되지 않았어요. 학교 인터넷이 Firebase를 막고 있을 수 있어요.';
  $('#sub').textContent='연결 문제';
  app.innerHTML=`<div class="panel grid"><h2 style="color:var(--bad)">서버에 연결하지 못했어요</h2><p>${why}</p><p class="muted">오류 내용: <code>${esc(m)}</code></p><div class="row"><button id="retry">다시 시도</button><button class="ghost" id="home">처음으로</button></div></div>`;
  $('#retry').onclick=()=>location.reload(); $('#home').onclick=()=>{location.hash='';startView();};
}
window.addEventListener('unhandledrejection',ev=>showError(ev.reason));
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.database();
const roomRef=c=>db.ref('rooms/'+c);
const params=new URLSearchParams(location.search);
let ROOM=params.get('room')||'';
let offs=[];const clearOffs=()=>{offs.forEach(f=>f());offs=[];};
function listen(ref,cb){const h=ref.on('value',cb);offs.push(()=>ref.off('value',h));}

function parseName(s){const m=String(s).trim().match(/^(\d{1,2})\s*[번.]?\s*(.+)$/);return m?{num:+m[1],name:m[2].trim()}:null;}
function joinView(){
  clearOffs();
  const saved=store(APP+'-student');
  if(saved&&ROOM&&saved.room===ROOM){me=saved;return enterRoom();}
  $('#sub').textContent='학생 화면';
  ClassWatch.student({db,room:ROOM,root:app});ClassWatch.step('들어가기');
  app.innerHTML=`<div class="grid" style="max-width:560px;margin:0 auto">
   <div class="panel grid"><h2>방 번호</h2><input id="rm" inputmode="numeric" maxlength="4" placeholder="TV에 보이는 4자리" value="${esc(ROOM)}"></div>
   <div class="panel grid"><h2>"번호 이름"을 써요</h2><input id="nm" placeholder="예) 7 김민수" autocomplete="off"></div>
   <div class="msg bad" id="jm" role="status"></div>
   <div class="row"><button id="enter" disabled>들어가기</button><button class="ghost" id="home">처음으로</button></div></div>`;
  const chk=()=>{$('#enter').disabled=!(/^\d{4}$/.test($('#rm').value)&&parseName($('#nm').value));};
  $('#rm').oninput=chk;$('#nm').oninput=chk;
  $('#home').onclick=startView;
  ClassWatch.joinForm();
  $('#enter').onclick=async()=>{
    const code=$('#rm').value, p=parseName($('#nm').value);
    $('#enter').disabled=true;
    try{
      const open=await withTimeout(roomRef(code).child('open').get());
      if(!open.exists()){$('#jm').textContent='방 번호를 다시 확인해요.';return chk();}
      const r=await withTimeout(roomRef(code).child('students/'+p.num).transaction(c=>c?undefined:{name:p.name,joinedAt:Date.now()},undefined,false));
      if(!r.committed){const c=r.snapshot.val();
        if(!(c&&c.name===p.name)){$('#jm').textContent=`${p.num}번은 이미 "${c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}}
    }catch(e){$('#jm').textContent='연결 문제: '+(e.code||e.message);return chk();}
    ROOM=code;me={room:code,num:p.num,name:p.name};store(APP+'-student',me);
    history.replaceState(null,'','?room='+code);
    enterRoom();
  };
}

/* ---------- teacher ---------- */
let tick=null,RD={};
async function teacherView(){
  clearOffs();
  $('#sub').textContent='선생님 화면 · 연결 중';
  app.innerHTML='<div class="panel grid" style="text-align:center"><h2>방을 만드는 중이에요…</h2></div>';
  let code=store(APP+'-teacher-room');
  try{
    if(!code||!(await withTimeout(roomRef(code).child('open').get())).exists()){
      code=String(Math.floor(1000+Math.random()*9000));
      await withTimeout(roomRef(code).set({open:Date.now(),app:APP,stage:1,timer:{min:STAGES[1].tm,left:STAGES[1].tm*60,endAt:0}}));
      store(APP+'-teacher-room',code);
    }
  }catch(e){return showError(e);}
  ROOM=code;
  ClassWatch.teacher({db,room:code});
  const url=location.origin+location.pathname+'?room='+code;
  $('#sub').textContent='선생님 화면 · TV에 띄워 주세요';
  app.innerHTML=`<div class="tv">
   <div class="grid">
    <div class="panel qr"><h2>태블릿으로 접속</h2><div id="qrbox"></div><div>방 번호 <span class="roomcode">${code}</span></div><p class="muted" style="word-break:break-all;font-size:.75rem;margin:0">${esc(url)}</p></div>
    <div class="panel grid"><div class="timer" id="tm">5:00</div><div class="row" style="justify-content:center"><button class="ghost" id="minus" aria-label="1분 줄이기">－1</button><button id="go">시작</button><button class="ghost" id="plus" aria-label="1분 늘리기">＋1</button></div><div class="msg" id="gostat" role="status" style="text-align:center;font-size:1rem"></div></div>
    <div class="panel grid"><h2>단계 열기</h2><div class="tsteps" id="tsteps"></div></div>
    <div class="panel grid"><div class="row" style="justify-content:space-between"><h2>참여</h2><span class="muted" id="cnt"></span></div><div class="people" id="ppl"></div></div>
    <div class="row"><button class="ghost" id="newroom">새 방</button><button class="ghost" id="home">처음으로</button></div>
   </div>
   <div class="grid" id="main"></div></div>`;
  if(window.QRCode){try{new QRCode($('#qrbox'),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
  const ref=roomRef(code);
  listen(ref,s=>{RD=s.val()||{};renderTV();});
  const tm=()=>RD.timer||{min:5,left:300,endAt:0};
  $('#minus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.max(1,t.min-1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#plus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.min(20,t.min+1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#go').onclick=()=>{const t=tm();if(t.endAt)ref.child('timer').set({min:t.min,left:Math.max(0,Math.round((t.endAt-Date.now())/1000)),endAt:0});else{const l=t.left>0?t.left:t.min*60;ref.child('timer').set({min:t.min,left:l,endAt:Date.now()+l*1000});const st=RD.stage||1;if((RD.go||0)<st)ref.child('go').set(st);}};
  $('#newroom').onclick=()=>{store(APP+'-teacher-room',null);teacherView();};
  $('#home').onclick=()=>{location.hash='';startView();};
  clearInterval(tick);tick=setInterval(renderTime,250);
}
function setStage(n){roomRef(ROOM).update({stage:n,timer:{min:STAGES[n].tm,left:STAGES[n].tm*60,endAt:0}});}
function renderTime(){
  const el=$('#tm');if(!el)return clearInterval(tick);
  const t=RD.timer||{min:5,left:300,endAt:0};
  const left=t.endAt?Math.max(0,Math.round((t.endAt-Date.now())/1000)):t.left;
  el.textContent=left===0&&t.endAt?'시간 끝!':`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  el.classList.toggle('end',!!t.endAt&&left===0);
  const waitSt=(RD.go||0)<(RD.stage||1);
  $('#go').textContent=t.endAt?'멈춤':waitSt?'▶ 활동 시작':'시작';
  const gs=$('#gostat');if(gs){gs.textContent=waitSt?`학생들은 대기 중이에요. 설명을 마치면 [▶ 활동 시작]을 눌러요.`:`${RD.stage||1}단계 활동이 열려 있어요.`;gs.className='msg '+(waitSt?'bad':'ok');}$('#minus').disabled=$('#plus').disabled=!!t.endAt;
}
const students=()=>{const s=RD.students||{};return Object.keys(s).map(Number).sort((a,b)=>a-b).map(n=>({n,...s[n]}));};

let tvStage=0,tvAll=false,showWrong=false,tvAns=false,tvAward=false,whyNames=false;
function renderTV(){
  const main=$('#main');if(!main)return;
  const st=RD.stage||1, S=students();
  $('#tsteps').innerHTML=[1,2,3,4].map(n=>`<button data-s="${n}" ${n===st?'aria-current="step"':''}><b>${n}</b> ${STAGES[n].t}</button>`).join('');
  $$('#tsteps button').forEach(b=>b.onclick=()=>setStage(+b.dataset.s));
  const doneIn=x=>stepDoneOf(x,st);
  $('#cnt').textContent=`${S.length}명 · 이 단계 끝 ${S.filter(doneIn).length}명`;
  $('#ppl').innerHTML=S.map(x=>`<span class="${doneIn(x)?'ok':''}">${x.n} ${esc(x.name)}</span>`).join('')||'<span class="muted" style="background:none">아직 아무도 없어요</span>';
  const changed=tvStage!==st;tvStage=st;
  if(changed||!$('#tvtop')){
    tvAns=false;tvAward=false;
    main.innerHTML=`<div id="tvtop"></div><div id="tvmid"></div><div id="tvq"></div>`;
    tvTop(st);
  }
  $('#tvmid').innerHTML=st===4?rankBox(S):progressBox(st,S)+(st===3?whyBox(S):'');
  $('#tvq').innerHTML=quizBox(S,st);
  $('#wrongT').onclick=()=>{showWrong=!showWrong;renderTV();};
  $('#allT').onclick=()=>{tvAll=!tvAll;renderTV();};
  const wn=$('#whyN');if(wn)wn.onclick=()=>{whyNames=!whyNames;renderTV();};
}
function stepDoneOf(x,n){return !!(x['s'+n]&&x['s'+n].done);}
const TVP={
  1:{h:'굽은 면이 있는 입체도형은 어떻게 분류할 수 있을까? (교과서 128~129쪽)',figs:()=>[[figBaton(),'계주 봉'],[figCone(),'안전 고깔'],[figBall(),'배구공'],[figPrism(),'삼각기둥'],[figPyr(),'사각뿔']],
     talk:['체육 시간에 재미있게 했던 활동은? 그때 쓴 교구는?','계주 봉·안전 고깔·공은 각각 어떤 모양인가요?','6학년 1학기에 배운 각기둥·각뿔의 구성 요소를 떠올려요'],
     ans:['계주 봉: 기둥 모양 · 안전 고깔: 뿔 모양 · 배구공: 공 모양','삼각기둥: ① <b>꼭짓점</b> ② <b>옆면</b> ③ <b>모서리</b>','사각뿔: ① <b>각뿔의 꼭짓점</b> ② <b>높이</b> ③ <b>밑면</b>']},
  2:{h:'원이 있는 기둥 모양을 알아볼까? (교과서 130쪽)',figs:()=>[...SHK.map(k=>[SH[k](),k]),[figRot(360),'직사각형 돌리기']],
     talk:['가~마의 같은 점과 다른 점은? 어떤 기준으로 나눌 수 있을까요?','각기둥이 아닌 입체도형(가, 다, 마)의 특징은?','직사각형을 막대를 기준으로 한 바퀴 돌리면? 먼저 예상해요'],
     ans:['각기둥: <b>나, 라</b> · 각기둥이 아닌 입체도형: <b>가, 다, 마</b>','가, 다, 마와 같은 입체도형을 <b>원기둥</b>이라고 합니다.','직사각형을 한 변을 기준으로 돌리면 <b>원기둥</b>','가로 3 cm·세로 5 cm → 높이 <b>5 cm</b>, 밑면의 지름 <b>6 cm</b>']},
  3:{h:'원기둥의 구성 요소를 알아봅시다 (교과서 131쪽)',figs:()=>[[figTapCyl({},true),'원기둥의 구성 요소'],[figFrustum(),'지우: 원기둥이네. · 희수: 원기둥이 아니네.']],
     talk:['서로 평행하고 합동인 두 면은? 그 면과 만나는 면의 특징은?','두 면 사이의 거리는 어떻게 재면 좋을까요? (자와 삼각자)','각기둥과 비교하면 원기둥에 없는 것은?'],
     ans:['서로 평행하고 합동인 두 면: <b>밑면</b> · 두 밑면과 만나는 면: <b>옆면</b>(굽은 면)','두 밑면 사이의 거리: <b>높이</b>','원기둥에는 <b>꼭짓점과 모서리가 없어요</b>','바르게 말한 사람: <b>희수</b> · 까닭: 두 밑면이 서로 합동이 아니에요']}};
function tvTop(st){
  if(st===4){
    $('#tvtop').innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">🥫 원기둥 퀴즈</h2><button class="ghost" id="awT">🏆 시상식</button></div>
      <p class="muted" style="margin:0">오늘 배운 원기둥 8문제 · 맞힌 문제가 같으면 빨리 끝낸 친구가 앞이에요.</p></div>`;
    $('#awT').onclick=()=>{tvAward=!tvAward;$('#awT').textContent=tvAward?'순위 보기':'🏆 시상식';renderTV();};
    return;
  }
  const P=TVP[st];
  const draw=()=>{$('#tva').innerHTML=tvAns?`<div class="plist">${P.ans.map(a=>`<div class="pcard">${a}</div>`).join('')}</div>`:'';$('#tvaT').textContent=tvAns?'정답 가리기':'정답 보기';};
  $('#tvtop').innerHTML=`<div class="panel grid"><h2 style="font-size:1.8rem">${P.h}</h2>
    <div class="figs">${P.figs().map(([f,c])=>`<div>${f}${c}</div>`).join('')}</div>
    <div class="rules"><b>함께 이야기해요</b><ul>${P.talk.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <div class="row"><button class="ghost" id="tvaT"></button></div><div id="tva"></div></div>`;
  $('#tvaT').onclick=()=>{tvAns=!tvAns;draw();};
  draw();
}
function ranked(S){
  return S.filter(x=>x.s4).map(x=>({...x,sc:x.s4.score||0,fin:!!x.s4.done,t:x.s4.done?(x.s4.at-(x.s4.startAt||x.s4.at)):Infinity}))
    .sort((a,b)=>b.sc-a.sc||(b.fin-a.fin)||a.t-b.t||a.n-b.n);
}
function rankBox(S){
  const R=ranked(S);
  if(tvAward){
    const top=R.filter(x=>x.fin).slice(0,3);
    const p=(x,c,m)=>x?`<div class="${c}"><b>${m}</b><span>${x.n} ${esc(x.name)}</span>🥫 ${x.sc}</div>`:`<div class="${c}"><b>${m}</b><span>-</span></div>`;
    return `<div class="panel grid" id="award"><h2 style="font-size:1.8rem;text-align:center">🏆 원기둥 연구소 시상식</h2>
      <div class="podium">${p(top[1],'p2','🥈')}${p(top[0],'p1','🥇')}${p(top[2],'p3','🥉')}</div>
      <p class="muted" style="text-align:center;margin:0">맞힌 문제가 같으면 빨리 끝낸 친구가 앞이에요.</p></div>`;
  }
  return `<div class="panel grid" id="rankb"><div class="row" style="justify-content:space-between"><h2>원기둥 퀴즈 순위</h2><span class="muted">끝 ${R.filter(x=>x.fin).length}/${S.length}명</span></div>
    <div class="rank">${R.map((x,k)=>{const s4=x.s4||{};const i=Math.min(QUIZ.length,(s4.i||0)+(s4.di===s4.i?1:0));return `<div class="r"><b>${k+1}</b><span class="nm">${x.n} ${esc(x.name)}</span><span class="trk muted">${s4.done?'끝 ✓':i+'/'+QUIZ.length+' 문제'}</span><span class="pt">🥫 ${x.sc}</span></div>`;}).join('')||'<p class="muted">아직 아무도 없어요</p>'}</div></div>`;
}
function whyBox(S){
  const W=S.filter(x=>x.s3&&x.s3.why);
  return `<div class="panel grid" id="whys"><div class="row" style="justify-content:space-between"><h2>원기둥이 아닌 까닭 (${W.length}명)</h2><button class="ghost" id="whyN">${whyNames?'이름 가리기':'이름 보기'}</button></div>
    <p class="muted" style="margin:0" id="tfsum">${ThinkFirst.summary(W.map(x=>x.s3.hint))}</p>
    <div class="whys">${W.map(x=>`<div>${esc(x.s3.why)}${whyNames?`<small>${x.n} ${esc(x.name)}${x.s3.hint?' · '+ThinkFirst.tag(x.s3.hint):''}</small>`:''}</div>`).join('')||'<p class="muted">아직 없어요</p>'}</div></div>`;
}
function progressBox(st,S){
  const its=ITEMS.filter(x=>x.st===st);
  const has=id=>S.filter(x=>x.ans&&x.ans[id]!==undefined).length;
    return `<div class="panel grid"><h2>얼마나 했나요?</h2><div class="bars">${its.map((q,k)=>`<div class="bar"><span>${esc(q.q.length>26?q.q.slice(0,25)+'…':q.q)}</span><div class="track"><div style="width:${S.length?has(q.id)/S.length*100:0}%"></div></div><span>${has(q.id)}명</span></div>`).join('')}</div></div>`;
}
/* 문제별 정답률 + 틀린 학생 이름 (처음 답 기준) */
function quizStats(S,st){
  return ITEMS.map(q=>({q,no:ITEMS.filter(x=>x.st===q.st).indexOf(q)+1})).filter(r=>tvAll||r.q.st===st).map(r=>{
    const done=S.filter(x=>x.ans&&x.ans[r.q.id]!==undefined);
    const miss=done.filter(x=>x.ans[r.q.id]===false);
    const ok=done.length-miss.length;
    return {...r,done:done.length,ok,miss,rate:done.length?Math.round(ok/done.length*100):null};
  });
}
function quizBox(S,st){
  const R=quizStats(S,st).sort((a,b)=>(a.rate??101)-(b.rate??101)||a.q.st-b.q.st||a.no-b.no);
  return `<div class="panel grid" id="qstat"><div class="row" style="justify-content:space-between"><h2>문제별 정답률 ${tvAll?'(모든 단계)':`(${st}단계)`}</h2><div class="row"><button class="ghost" id="allT">${tvAll?'이 단계만':'모든 단계 보기'}</button><button class="ghost" id="wrongT">${showWrong?'이름 가리기':'틀린 학생 이름 보기'}</button></div></div>
   <p class="muted" style="margin:0">처음 답한 것이 맞은 비율이에요. 낮은 문제부터 보여요. 다시 골라서 맞힌 학생도 틀린 학생에 들어가요.</p>
   <div class="qrate">${R.map(r=>`<div class="qrow${r.rate!==null&&r.rate<70?' low':''}" data-q="${r.q.id}">
     <div class="qt"><b>${r.q.st}-${r.no}</b> ${esc(r.q.q)}<br><small class="muted">정답: ${esc(r.q.a)}</small></div>
     <div class="qb"><div class="track"><div style="width:${r.rate||0}%"></div></div><span class="pc">${r.rate===null?'-':r.rate+'%'}</span><small class="muted">${r.ok}/${r.done}명</small></div>
     <div class="qw">${r.miss.length?`틀린 학생 <b>${r.miss.length}명</b>${showWrong?`: <span class="who">${r.miss.map(x=>`<span style="white-space:nowrap">${esc(x.n)} ${esc(x.name)}</span>`).join(', ')}</span>`:''}`:'<span class="muted">틀린 학생 없음</span>'}</div></div>`).join('')}</div></div>`;
}

/* ---------- route ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
</body></html>
