<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한국 문화 해설사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F; --space:#7A4A2B;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; --en:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--space);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .4em;font-size:1rem;line-height:1.2}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);line-height:1.3}
.en{font-family:var(--en);font-weight:700;color:var(--blue)}
.opts{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:640px}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-family:var(--en);font-weight:700;font-size:1.3rem;padding:.8em .6em;line-height:1.3}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.emoji{font-size:clamp(3.5rem,12vw,5rem);line-height:1}
.score{font-family:var(--display);font-size:1.3rem}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
.say{background:#fff;border:3px dashed var(--blue2);border-radius:16px;padding:12px 16px;font-family:var(--en);font-weight:700;font-size:1.5rem;color:var(--blue)}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}
/* 카드 판 */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:640px}
.cards.easy{grid-template-columns:repeat(4,1fr)}
.cards button{aspect-ratio:3/4;border-radius:14px;background:repeating-linear-gradient(45deg,#C9573B 0 10px,#D9664A 10px 20px);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);display:grid;place-items:center;align-content:center;gap:4px;color:#fff;font-size:2rem;padding:4px;line-height:1.1}
.cards button.up{background:#fff;color:var(--ink);border-color:var(--gold)}
.cards button.got{background:#E3F1E7;color:var(--ok);border-color:var(--ok);opacity:.75}
.cards button .e{font-size:clamp(2.2rem,8vw,3.2rem)}
.cards button .w{font-family:var(--en);font-weight:700;font-size:1.05rem;color:var(--blue)}
.cards button .k{font-size:.85rem;color:var(--muted)}
.cards button:disabled{opacity:1;cursor:default}
.cards button.got:disabled{opacity:.75}
/* 행성 판 */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--space);border-radius:20px;padding:14px;width:100%;max-width:640px}
.board div{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5A6FA8,#2E3E73);display:grid;place-items:center;align-content:center;gap:2px;color:#fff;font-family:var(--display);font-size:.95rem;line-height:1.1;text-align:center;border:4px solid transparent;transition:transform .08s}
.board div .e{font-size:2.3rem}
.board div.hot{border-color:var(--gold);transform:scale(1.08);background:radial-gradient(circle at 35% 30%,#FFE6A3,#E9B04F);color:var(--ink)}
.board div.mine{box-shadow:0 0 0 3px var(--ok) inset}
.board div.lucky{background:radial-gradient(circle at 35% 30%,#FFD27A,#E08A2C)}
.board div.fail{background:radial-gradient(circle at 35% 30%,#8a8a8a,#4b4b4b)}
.board.easy div{font-size:1.15rem}
.ask{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border:3px solid var(--blue2);border-radius:18px;padding:10px 16px;width:100%;max-width:640px;text-align:left}
.ask .e{font-size:3rem;line-height:1}
.ask b{font-family:var(--en);font-size:1.4rem;color:var(--blue)}
.ask button{font-size:1.4rem;padding:.4em .7em}
.big{font-size:1.6rem;padding:.8em 2em}
/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qrp{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people button{background:var(--cream);color:var(--ink);border-radius:999px;padding:.25em .8em;font-size:1rem}
.people button.ok{background:var(--ok);color:#fff}
.list{display:grid;gap:8px}
.list div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px}
.list b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
.lanes{display:grid;gap:8px}
.lane{display:grid;grid-template-columns:9em 1fr 3.5em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:6px 12px}
.lane .nm{font-family:var(--display);font-size:1.15rem}
.lane .road{position:relative;height:34px;background:linear-gradient(90deg,#2E3E73,#5A6FA8);border-radius:8px}
.lane .road span{position:absolute;top:0;font-size:1.7rem;line-height:34px;transition:left .6s}
.lane .road::after{content:'🌕';position:absolute;right:2px;top:0;font-size:1.6rem;line-height:34px}
.lane .pt{font-family:var(--display);font-size:1.3rem;text-align:right}
.planets{letter-spacing:2px;font-size:1.3rem}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.6rem}
.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
/* 문제별 정답률 */
.qrate{display:grid;gap:8px}
.qr{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.qr.low{border-color:var(--bad);background:#FFF5F2}
.qr .qb{display:grid;grid-template-columns:minmax(0,1fr) 3.6em;gap:2px 8px;align-items:center;width:100%}
.qr .qb .track{height:14px;border-radius:999px;background:var(--cream);overflow:hidden}
.qr .qb .track div{height:100%;background:var(--ok);border-radius:999px}
.qr.low .qb .track div{background:var(--bad)}
.qr .pc{font-family:var(--display);font-size:1.3rem}
.qr.low .pc{color:var(--bad)}
@media (max-width:820px){
  .qr,.hero,.tv,.two{grid-template-columns:1fr}
  .choose{grid-template-columns:1fr}
  .lane{grid-template-columns:6em 1fr 2.8em}
}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand">🏯 한국 문화 해설사</div><small id="sub"></small></div></header>
<main class="wrap" id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../common/watch.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCSSwT67k7lXoYDz4qsmHHDRXUqTS0Zh14",
  authDomain: "classroom-games-7ae7d.firebaseapp.com",
  databaseURL: "https://classroom-games-7ae7d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "classroom-games-7ae7d",
  storageBucket: "classroom-games-7ae7d.firebasestorage.app",
  messagingSenderId: "433158756735",
  appId: "1:433158756735:web:254d9b0b2e36502b4de24a"
};
// 영어 11단원 Do You Know about the Space Station? (YBM 최희경 6학년) 2차시, 교과서 162~163쪽
// Mission 2 한국 문화 해설사 놀이(그림 카드 짝 맞추기)를 태블릿으로: 카드를 뒤집으면 짝이 묻고, 같은 카드면 알고 있다고 대답하고 설명해요.
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let MUTE=false;
function sayEn(t){try{if(MUTE||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u);}catch(e){}}

const STAGE={k:'한국 문화 해설사',t:'🃏 한국 문화 해설사 놀이 (Mission 2)',tm:9};
// 교과서 163쪽 ZETO Town·Your Turn·Real Talk에 나온 대상
const ITEMS={
  hanbok:{e:'👘',w:'hanbok',k:'한복',d:"It's traditional Korean clothes."},
  hanok:{e:'🏠',w:'hanok',k:'한옥',d:"It's a traditional Korean house."},
  kimchi:{e:'🥬',w:'kimchi',k:'김치',d:"It's a traditional Korean food."},
  yunnori:{e:'🎲',w:'yunnori',k:'윷놀이',d:"It's a Korean board game."},
  sikhye:{e:'🥤',w:'sikhye',k:'식혜',d:"It's a traditional Korean drink."},
  seoul:{e:'🏙️',w:'Seoul',k:'서울',d:"It's a big city."}
};
const ORDER=['hanbok','hanok','kimchi','yunnori','sikhye','seoul'];
const EASY=['hanbok','hanok','kimchi','yunnori'];
const YES='Yes, I know about it.', NO='No, I have no idea.';
const ODD=['Yes, I know it about.','No, I have idea.','Yes, I know about you.'];
const ask=id=>`Do you know about ${ITEMS[id].w}?`;
// 선생님 화면 '문제별 정답률' 줄: 대답 2줄 + 대상마다 설명 1줄
const ROWS=[{id:'yes',t:'같은 카드일 때 대답',a:YES},{id:'no',t:'다른 카드일 때 대답',a:NO},...ORDER.map(id=>({id:'d_'+id,t:`${ITEMS[id].e} ${ITEMS[id].w} 설명하기`,a:ITEMS[id].d}))];

function withTimeout(pr,ms=10000){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),ms))]);}
function showError(e){
  const m=String(e&&(e.code||e.message)||e);
  let why='알 수 없는 오류가 났어요.';
  if(/permission/i.test(m)) why='Firebase 데이터베이스의 <b>규칙</b>이 막고 있어요.';
  else if(/TIMEOUT/.test(m)) why='Firebase 서버에 10초 동안 연결되지 않았어요. 학교 인터넷이 Firebase를 막고 있을 수 있어요.';
  $('#sub').textContent='연결 문제';
  app.innerHTML=`<div class="panel grid"><h2 style="color:var(--bad)">서버에 연결하지 못했어요</h2><p>${why}</p><p class="muted">오류 내용: <code>${esc(m)}</code></p><div class="row"><button id="retry">다시 시도</button></div></div>`;
  $('#retry').onclick=()=>location.reload();
}
window.addEventListener('unhandledrejection',ev=>showError(ev.reason));
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.database();
const roomRef=c=>db.ref('rooms/'+c);
const params=new URLSearchParams(location.search);
let ROOM=params.get('room')||'';
let offs=[];const clearOffs=()=>{offs.forEach(f=>f());offs=[];};
function listen(ref,cb){const h=ref.on('value',cb);offs.push(()=>ref.off('value',h));}

/* ---------- start ---------- */
function startView(){
  clearOffs();clearInterval(tick);ClassWatch.teacherStop();
  $('#sub').textContent='6학년 영어 · Lesson 11 Do You Know about the Space Station? · 2차시';
  app.innerHTML=`<section class="hero"><div class="grid"><h1>한국 문화<br>해설사</h1>
   <p>카드 두 장을 뒤집어요. 같은 카드면 <span class="en">Yes, I know about it.</span> 하고 친구에게 설명해 줘요!</p></div>
   <div class="panel grid"><div class="cards">${ORDER.slice(0,4).map(id=>`<button class="up" disabled><span class="e">${ITEMS[id].e}</span><span class="w">${ITEMS[id].w}</span></button>`).join('')}</div></div></section>
   <div class="choose"><button id="goStu">학생으로 참여하기</button><button class="ghost" id="goTv">선생님 화면 (TV)</button></div>`;
  $('#goStu').onclick=joinView; $('#goTv').onclick=()=>{location.hash='teacher';teacherView();};
}

/* ---------- student: join ---------- */
let me=null, ROOMV={}, ME={}, onMe=null;
function parseName(s){const m=String(s).trim().match(/^(\d{1,2})\s*[번.]?\s*(.+)$/);return m?{num:+m[1],name:m[2].trim()}:null;}
function joinView(){
  clearOffs();
  const saved=store('ku-student');
  if(saved&&ROOM&&saved.room===ROOM){me=saved;return enterRoom();}
  $('#sub').textContent='학생 화면';
  ClassWatch.student({db,room:ROOM,root:app});ClassWatch.step('들어가기');
  app.innerHTML=`<div class="grid" style="max-width:760px;margin:0 auto">
   <div class="panel grid"><h2>방 번호</h2><input id="rm" inputmode="numeric" maxlength="4" placeholder="TV에 보이는 4자리" value="${esc(ROOM)}"></div>
   <div class="panel grid"><h2>"번호 이름"을 써요</h2><input id="nm" placeholder="예) 7 김민수" autocomplete="off"></div>
   <div class="msg bad" id="jm" role="status"></div>
   <div class="row"><button id="enter" disabled>들어가기</button><button class="ghost" id="home">처음으로</button></div></div>`;
  const chk=()=>{$('#enter').disabled=!(/^\d{4}$/.test($('#rm').value)&&parseName($('#nm').value));};
  $('#rm').oninput=chk;$('#nm').oninput=chk;
  $('#home').onclick=startView;
  ClassWatch.joinForm({});
  $('#enter').onclick=async()=>{
    const code=$('#rm').value, p=parseName($('#nm').value);
    $('#enter').disabled=true;
    try{
      const open=await withTimeout(roomRef(code).child('open').get());
      if(!open.exists()){$('#jm').textContent='방 번호를 다시 확인해요.';return chk();}
      const r=await withTimeout(roomRef(code).child('students/'+p.num).transaction(c=>c?undefined:{name:p.name,joinedAt:Date.now()},undefined,false));
      if(!r.committed){const c=r.snapshot.val();
        if(!(c&&c.name===p.name)){$('#jm').textContent=`${p.num}번은 이미 "${c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}}
    }catch(e){$('#jm').textContent='연결 문제: '+(e.code||e.message);return chk();}
    ROOM=code;me={room:code,num:p.num,name:p.name};store('ku-student',me);
    history.replaceState(null,'','?room='+code);
    enterRoom();
  };
}
function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app});ClassWatch.who(me.num,me.name);
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  let ready=false;ROOMV={};onMe=null;
  listen(roomRef(me.room).child('students/'+me.num),s=>{
    const v=s.val();
    if(!v){store('ku-student',null);me=null;clearOffs();return joinView();}
    const easyWas=ME.easy;ME=v;
    $('#sub').textContent=`${me.num}번 ${me.name}${ME.easy?' · 🌟':''}`;
    if(!ready){ready=true;renderStage();return;}
    if(!!easyWas!==!!ME.easy&&!busy){renderStage();return;}
    if(typeof onMe==='function')onMe();
  });
  listen(roomRef(me.room).child('run'),s=>{const was=ROOMV.run;ROOMV.run=s.val()||0;if(ready&&was!==ROOMV.run&&!busy)renderStage();});
  listen(roomRef(me.room).child('award'),s=>{ROOMV.award=!!s.val();if(ready&&ME.p&&ME.p.done&&!busy)renderStage();});
}
let busy=false;
const meRef=k=>roomRef(me.room).child('students/'+me.num+(k?'/'+k:''));
function shell(inner){
  app.innerHTML=`<div class="grid">${inner}<div class="row" style="justify-content:space-between"><button class="ghost" id="mute" style="font-size:.85rem;padding:.4em .8em">${MUTE?'🔇 소리 켜기':'🔊 소리 끄기'}</button><button class="ghost" id="relog" style="font-size:.85rem;padding:.4em .8em">다른 이름으로 들어가기</button></div></div>`;
  $('#relog').onclick=()=>{store('ku-student',null);me=null;clearOffs();joinView();};
  $('#mute').onclick=()=>{MUTE=!MUTE;$('#mute').textContent=MUTE?'🔇 소리 켜기':'🔊 소리 끄기';};
}
const wstep=sub=>ClassWatch.step(STAGE.k+(sub?' · '+sub:''),{n:1,total:1,wait:!!(ME.p&&ME.p.done)});
function waitView(){
  ClassWatch.step(STAGE.k+' · 기다리기',{n:1,total:1,wait:true});
  shell(`<div class="panel quiz pop"><div class="emoji">🏯</div><h2 style="font-size:2rem">${esc(STAGE.t)}</h2>
   <p class="q" style="font-size:1.4rem">선생님 설명을 들어요.<br>선생님이 <b>시작</b>을 누르면 열려요.</p></div>`);
}
function renderStage(){busy=false;onMe=null;ClassWatch.detail(null);if(!((ROOMV.run||0)>=1))return waitView();return game();}

/* ---------- 놀이: 카드 짝 맞추기 ---------- */
function newDeck(easy){const ids=easy?EASY:ORDER;return shuffle([...ids,...ids]);}
function game(){
  const P=ME.p||{};
  if(P.done&&!P.again)return gameDone();
  const easy=!!ME.easy;
  let deck=P.deck;
  const want=(easy?EASY:ORDER).length*2;
  if(!deck||(deck.length!==want&&!Object.keys(P.got||{}).length)){deck=newDeck(easy);meRef('p').update({deck,got:{},flips:0,pairs:0});}
  const got=P.got||{}, pairs=P.pairs||0, total=deck.length/2;
  wstep(`${pairs}/${total}쌍`);
  let first=-1;
  shell(`<div class="panel quiz">
   <div class="row" style="justify-content:space-between;width:100%;max-width:640px"><span class="band">${pairs} / ${total}쌍</span><span class="score">🃏 뒤집은 횟수 ${P.flips||0}번</span></div>
   <div class="say" id="talk" style="width:100%;max-width:640px">카드 한 장을 뒤집어요.</div>
   <div class="cards${easy?' easy':''}" id="cards">${deck.map((id,i)=>`<button data-i="${i}" class="${got[i]?'got up':''}" ${got[i]?'disabled':''} aria-label="${got[i]?esc(ITEMS[id].w):'뒤집힌 카드'}">${got[i]?face(id,easy):'❓'}</button>`).join('')}</div>
   <div id="after" class="grid" style="width:100%;justify-items:center"></div></div>`);
  ClassWatch.detail(()=>({q:`${pairs}/${total}쌍`}));
  $$('#cards button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;if(got[i]||i===first||busy)return;
    b.classList.add('up');b.innerHTML=face(deck[i],easy);
    if(first<0){
      first=i;const q=ask(deck[i]);
      $('#talk').innerHTML=`🗣️ 짝이 물어요: “${esc(q)}”<br><small class="muted" style="font-family:var(--text);font-weight:400">${easy?esc(ITEMS[deck[i]].k)+'을(를) 알고 있나요? ':''}같은 카드를 한 장 더 찾아 뒤집어요.</small>`;
      sayEn(q);ClassWatch.detail(()=>({q}));return;
    }
    busy=true;$$('#cards button').forEach(x=>x.disabled=true);
    answer(first,i,deck,easy);
  });
}
function face(id,easy){const it=ITEMS[id];return `<span class="e">${it.e}</span><span class="w">${esc(it.w)}</span>${easy?`<span class="k">${it.k}</span>`:''}`;}
function answer(a,b,deck,easy){
  const id=deck[a], hit=deck[a]===deck[b], ans=hit?YES:NO, box=$('#after'), P=ME.p||{};
  const opts=shuffle([YES,NO,...(easy?[]:[ODD[Math.floor(Math.random()*ODD.length)]])]);
  box.innerHTML=`<div class="q pop">${hit?'같은 카드예요! 🎉':'다른 카드예요.'}</div>
   <p style="margin:0">${hit?'알고 있다고 대답해요.':'모른다고 대답해요.'} <span class="en">${esc(ask(id))}</span></p>
   <div class="opts" id="opts">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="msg" id="m"></div>`;
  const key=hit?'yes':'no';
  pick('#opts',ans,key,hit?'같은 카드예요. 알고 있다는 대답을 골라요.':'다른 카드예요. 모른다는 대답을 골라요.',()=>{
    sayEn(ans);
    if(!hit){
      box.insertAdjacentHTML('beforeend',`<div class="say">🗣️ 짝에게 소리 내어 말해요<br>“${esc(NO)}”</div><button id="next">말했어요 · 카드 덮기 ▶</button>`);
      $('#next').onclick=async()=>{$('#next').disabled=true;await meRef('p').update({flips:(P.flips||0)+1,at:Date.now()});feed(`${ask(id)} → ${NO}`,0);renderStage();};
      return;
    }
    // 같은 카드: 설명하기
    const others=shuffle(ORDER.filter(x=>x!==id)).slice(0,easy?1:2).map(x=>ITEMS[x].d);
    const dopts=shuffle([ITEMS[id].d,...others]);
    box.insertAdjacentHTML('beforeend',`<div class="q pop" style="font-size:1.3rem">${ITEMS[id].e} ${esc(ITEMS[id].w)}${easy?` (${ITEMS[id].k})`:''}을(를) 설명해요. 알맞은 말은?</div>
     <div class="opts" id="dopts">${dopts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="msg" id="m2"></div>`);
    pick('#dopts',ITEMS[id].d,'d_'+id,'다른 것을 설명하는 말이에요. 다시 골라요.',()=>{
      sayEn(ITEMS[id].d);
      box.insertAdjacentHTML('beforeend',`<div class="say">🗣️ 짝에게 소리 내어 말해요<br>“${esc(YES)}<br>${esc(ITEMS[id].d)}”</div><button id="next">말했어요 · 카드 가져가기 ▶</button>`);
      $('#next').onclick=async()=>{
        $('#next').disabled=true;
        const pairs=(P.pairs||0)+1, upd={flips:(P.flips||0)+1,pairs,at:Date.now()};
        upd['got/'+a]=true;upd['got/'+b]=true;
        if(pairs>=deck.length/2){if(!P.done){upd.done=true;upd.doneAt=Date.now();upd.best=upd.flips;}else upd.again=false;}
        await meRef('p').update(upd);feed(`${ask(id)} → ${YES} ${ITEMS[id].d}`,1);renderStage();
      };
    },'#m2');
  });
}
function pick(sel,ans,key,hint,ok,msel='#m'){
  let miss=false;
  $$(sel+' button').forEach(b=>b.onclick=async()=>{
    if(b.dataset.o!==ans){
      b.classList.add('wrong','shake');b.disabled=true;
      if(!miss){miss=true;await meRef('p/wrong/'+key).transaction(v=>(v||0)+1);}
      $(msel).className='msg bad';$(msel).textContent=hint;return;
    }
    $$(sel+' button').forEach(x=>x.disabled=true);b.classList.add('right');
    meRef('p/tries/'+key).transaction(v=>(v||0)+1);
    $(msel).className='msg ok';$(msel).textContent='정답!';
    ok();
  });
}
function feed(t,g){roomRef(me.room).child('feed').push({n:me.num,name:me.name,t,g,at:Date.now()});}
async function gameDone(){
  busy=true;
  let rankTxt='';
  if(ROOMV.award){
    const all=(await roomRef(me.room).child('students').get()).val()||{};
    const k=ranking(all).findIndex(x=>x.n===me.num);
    if(k>=0)rankTxt=`<div class="q" style="color:var(--coral2)">우리 반 ${k+1}등!</div>`;
  }
  busy=false;
  wstep('끝');
  const P=ME.p||{};
  shell(`<div class="panel quiz pop"><span class="band">미션 성공!</span><div class="emoji">🏯</div>
   <h2 style="font-size:2rem">${P.pairs||0}쌍을 모두 찾았어요</h2>
   <div class="score">뒤집은 횟수 ${P.best||P.flips||0}번 (적을수록 좋아요)</div>${rankTxt}
   <p>짝과 역할을 바꾸어 대화를 연습해요.</p>
   <div class="say">A: Do you know about kimchi?<br>B: Yes, I know about it. It's a traditional Korean food.</div>
   <button class="ghost" id="again">🔁 한 판 더 (등수는 처음 판으로)</button></div>`);
  $('#again').onclick=async()=>{$('#again').disabled=true;await meRef('p').update({again:true,deck:newDeck(!!ME.easy),got:{},flips:0,pairs:0});};
  onMe=()=>{if(ME.p&&ME.p.again)renderStage();};
}
function ranking(all){
  return Object.keys(all||{}).map(Number).map(n=>({n,...all[n]})).filter(x=>x.p&&x.p.done)
    .sort((a,b)=>(a.p.best||99)-(b.p.best||99)||(a.p.doneAt||9e15)-(b.p.doneAt||9e15));
}

/* ---------- teacher ---------- */
let tick=null,RD={},showWrong=false;
async function teacherView(){
  clearOffs();
  $('#sub').textContent='선생님 화면 · 연결 중';
  app.innerHTML='<div class="panel grid" style="text-align:center"><h2>방을 만드는 중이에요…</h2></div>';
  let code=store('ku-teacher-room');
  try{
    if(!code||!(await withTimeout(roomRef(code).child('open').get())).exists()){
      code=String(Math.floor(1000+Math.random()*9000));
      await withTimeout(roomRef(code).set({open:Date.now(),app:'culture',stage:1,timer:{min:STAGE.tm,left:STAGE.tm*60,endAt:0}}));
      store('ku-teacher-room',code);
    }
  }catch(e){return showError(e);}
  ROOM=code;
  ClassWatch.teacher({db,room:code});
  const url=location.origin+location.pathname+'?room='+code;
  $('#sub').textContent='선생님 화면 · TV에 띄워 주세요';
  app.innerHTML=`<div class="tv">
   <div class="grid">
    <div class="panel qrp"><h2>태블릿으로 접속</h2><div id="qrbox"></div><div>방 번호 <span class="roomcode">${code}</span></div><p class="muted" style="word-break:break-all;font-size:.75rem;margin:0">${esc(url)}</p></div>
    <div class="panel grid"><div class="timer" id="tm">9:00</div><div class="row" style="justify-content:center"><button class="ghost" id="minus" aria-label="1분 줄이기">－1</button><button id="go">시작</button><button class="ghost" id="plus" aria-label="1분 늘리기">＋1</button></div></div>
    <div class="panel grid"><div class="row" style="justify-content:space-between"><h2>참여</h2><span class="muted" id="cnt"></span></div><div class="people" id="ppl"></div><p class="muted" style="margin:0;font-size:.9rem">이름을 누르면 🌟 쉬운 화면(카드 8장, 보기 2개, 우리말 뜻)이 켜지고 꺼져요.</p></div>
    <div class="row"><button class="ghost" id="newroom">새 방</button><button class="ghost" id="home">처음으로</button></div>
   </div>
   <div class="grid" id="main"></div></div>`;
  if(window.QRCode){try{new QRCode($('#qrbox'),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
  const ref=roomRef(code);
  listen(ref,s=>{RD=s.val()||{};renderTV();});
  const tm=()=>RD.timer||{min:STAGE.tm,left:STAGE.tm*60,endAt:0};
  $('#minus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.max(1,t.min-1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#plus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.min(20,t.min+1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#go').onclick=()=>{const t=tm();if(t.endAt)ref.child('timer').set({min:t.min,left:Math.max(0,Math.round((t.endAt-Date.now())/1000)),endAt:0});else{const l=t.left>0?t.left:t.min*60;ref.update({run:1,timer:{min:t.min,left:l,endAt:Date.now()+l*1000}});}};
  $('#newroom').onclick=()=>{store('ku-teacher-room',null);teacherView();};
  $('#home').onclick=()=>{location.hash='';startView();};
  clearInterval(tick);tick=setInterval(renderTime,250);
}
function renderTime(){
  const el=$('#tm');if(!el)return clearInterval(tick);
  const t=RD.timer||{min:STAGE.tm,left:STAGE.tm*60,endAt:0};
  const left=t.endAt?Math.max(0,Math.round((t.endAt-Date.now())/1000)):t.left;
  el.textContent=left===0&&t.endAt?'시간 끝!':`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  el.classList.toggle('end',!!t.endAt&&left===0);
  $('#go').textContent=t.endAt?'멈춤':'시작';$('#minus').disabled=$('#plus').disabled=!!t.endAt;
}
const students=()=>{const s=RD.students||{};return Object.keys(s).map(Number).sort((a,b)=>a-b).map(n=>({n,...s[n]}));};
function renderTV(){
  const main=$('#main');if(!main)return;
  const S=students();
  const doneIn=x=>!!(x.p&&x.p.done);
  $('#cnt').textContent=`${S.length}명 · 끝 ${S.filter(doneIn).length}명`;
  $('#ppl').innerHTML=S.map(x=>`<button data-ez="${x.n}" class="${doneIn(x)?'ok':''}">${x.n} ${esc(x.name)}${x.easy?' 🌟':''}</button>`).join('')||'<span class="muted">아직 아무도 없어요</span>';
  $$('#ppl button').forEach(b=>b.onclick=()=>{const n=b.dataset.ez;roomRef(ROOM).child('students/'+n+'/easy').set(!(RD.students[n]||{}).easy);});
  RD.award?tvAward(main,S):tv1(main,S);
  const go=(RD.run||0)>=1;
  main.insertAdjacentHTML('afterbegin',go?`<div class="rules" style="border-color:var(--ok);background:#E3F1E7"><b>▶ 학생 화면이 열렸어요.</b> 시간이 멈춰도 학생은 계속할 수 있어요.</div>`
   :`<div class="panel row" style="justify-content:space-between;border-color:var(--coral);background:#FFF4DF"><div><h2>⏸ 학생들은 기다리는 중이에요</h2><span class="muted">놀이 방법을 설명하고 시작을 누르면 학생 화면이 열려요 (타이머도 같이 시작).</span></div><button class="big" id="startNow">▶ 시작</button></div>`);
  const b=$('#startNow');if(b)b.onclick=()=>{const t=RD.timer||{min:STAGE.tm,left:STAGE.tm*60};const l=t.left>0?t.left:t.min*60;roomRef(ROOM).update({run:1,timer:{min:t.min,left:l,endAt:Date.now()+l*1000}});};
}
const nameList=L=>L.map(x=>`<span style="white-space:nowrap">${esc(x.n)} ${esc(x.name)}</span>`).join(', ');
function rateRow(no,title,sub,done,miss){
  const ok=done-miss.length, rate=done?Math.round(ok/done*100):null;
  return `<div class="qr${rate!==null&&rate<70?' low':''}"><div><b>${no}</b> ${title}<br><small class="muted">${sub}</small></div>
   <div class="qb"><div class="track"><div style="width:${rate||0}%"></div></div><span class="pc">${rate===null?'-':rate+'%'}</span><small class="muted">${ok}/${done}명</small></div>
   <div>${miss.length?`틀린 학생 <b>${miss.length}명</b>${showWrong?`: ${nameList(miss)}`:''}`:'<span class="muted">틀린 학생 없음</span>'}</div></div>`;
}
const wrongBtn=()=>`<button class="ghost" id="wrongT">${showWrong?'이름 가리기':'틀린 학생 이름 보기'}</button>`;
function bindWrong(){const b=$('#wrongT');if(b)b.onclick=()=>{showWrong=!showWrong;renderTV();};}
function rateBox(S){
  const R=ROWS.map((r,k)=>{
    const done=S.filter(x=>x.p&&(((x.p.tries||{})[r.id]||0)>0||((x.p.wrong||{})[r.id]||0)>0));
    const miss=done.filter(x=>((x.p.wrong||{})[r.id]||0)>0);
    return {r,no:k+1,done:done.length,miss,rate:done.length?(done.length-miss.length)/done.length:null};
  }).sort((a,b)=>(a.rate??2)-(b.rate??2)||a.no-b.no);
  return `<div class="panel grid" id="qstat"><div class="row" style="justify-content:space-between"><h2>문제별 정답률</h2>${wrongBtn()}</div>
   <p class="muted" style="margin:0">한 번에 맞힌 학생 비율이에요. 낮은 문제부터 보여요. 한 번이라도 틀리게 고른 학생이 틀린 학생에 들어가요.</p>
   <div class="qrate">${R.map(x=>rateRow(x.no+'번',esc(x.r.t),'정답: '+esc(x.r.a),x.done,x.miss)).join('')}</div></div>`;
}
function tv1(main,S){
  const L=S.filter(x=>x.p&&x.p.deck).sort((a,b)=>(b.p.done?1:0)-(a.p.done?1:0)||(b.p.pairs||0)-(a.p.pairs||0)||(a.p.flips||0)-(b.p.flips||0));
  const feedL=Object.values(RD.feed||{}).sort((a,b)=>b.at-a.at).slice(0,6);
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">${esc(STAGE.t)}</h2><button id="awon">시상식 ▶</button></div>
    <div class="lanes">${L.map(x=>{const tot=(x.p.deck||[]).length/2||6;return `<div class="lane"><span class="nm">${esc(x.n)} ${esc(x.name)}${x.p.done?' 🏁':''}</span><span class="planets">${'🃏'.repeat(x.p.done&&!x.p.again?tot:(x.p.pairs||0))||'<span class="muted">·</span>'}</span><span class="pt">${x.p.done?(x.p.best||x.p.flips||0)+'번':(x.p.flips||0)+'번'}</span></div>`;}).join('')||'<p class="muted">아직 시작한 친구가 없어요</p>'}</div>
    <p class="muted" style="margin:0">오른쪽 숫자는 뒤집은 횟수예요. 다 찾은 친구는 적게 뒤집은 순서로 등수가 정해져요.</p></div>
   ${rateBox(S)}
   <div class="two"><div class="panel grid"><h2>방금 나눈 대화</h2><div class="list">${feedL.map(f=>`<div><b>${esc(f.n)} ${esc(f.name)}</b><span class="en">${esc(f.t)}</span></div>`).join('')||'<p class="muted">아직 없어요</p>'}</div></div>
   <div class="rules"><b>놀이 방법</b><ul><li>카드를 한 장 뒤집으면 짝이 <span class="en">Do you know about hanok?</span> 하고 물어요.</li><li>한 장 더 뒤집어 같은 카드면 <span class="en">Yes, I know about it.</span> + 설명(<span class="en">It's a traditional Korean house.</span>) → 카드를 가져가요.</li><li>다른 카드면 <span class="en">No, I have no idea.</span> → 카드를 다시 덮어요. 고른 말은 꼭 짝에게 소리 내어 말해요.</li></ul></div></div>`;
  $('#awon').onclick=()=>roomRef(ROOM).child('award').set(true);
  bindWrong();
}
function tvAward(main,S){
  const L=ranking(RD.students), p=[L[1],L[0],L[2]];
  const wrong={};S.forEach(x=>Object.entries((x.p&&x.p.wrong)||{}).forEach(([k,v])=>wrong[k]=(wrong[k]||0)+v));
  const hard=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>({r:ROWS.find(r=>r.id===k),v})).filter(x=>x.r);
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:2rem">🏯 한국 문화 해설사 시상식</h2><button class="ghost" id="awoff">놀이 화면으로</button></div>
   <div class="podium">${p.map((x,k)=>x?`<div class="p${[2,1,3][k]} pop"><b>${[2,1,3][k]}등</b><span>${esc(x.n)} ${esc(x.name)}</span>${x.p.best||x.p.flips||0}번 뒤집기</div>`:'<span></span>').join('')}</div></div>
   ${hard.length?`<div class="panel grid"><h2>우리 반이 가장 많이 헷갈린 말</h2><div class="list">${hard.map(h=>`<div><b>${esc(h.r.t)}</b><br>정답: <span class="en">${esc(h.r.a)}</span> <span class="muted">(틀린 횟수 ${h.v})</span></div>`).join('')}</div></div>`:''}
   ${rateBox(S)}`;
  $('#awoff').onclick=()=>roomRef(ROOM).child('award').set(false);
  bindWrong();
}

/* ---------- route ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
</body></html>
