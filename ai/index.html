<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 반 AI 연구소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>body{margin:0}
/* Same classroom notice-board look as 원주 탐험대 so the class sees one family of tools. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .4em;font-size:1rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.quiz .q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.2rem;padding:.9em .5em;line-height:1.3}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}
.fig{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--coral2);line-height:1.25}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.5em .9em;font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.roll svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--cream);color:var(--ink);border:1px solid var(--line);padding:.35em .8em;font-family:var(--text);font-size:1rem;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:grid;gap:6px}
.fld label{font-family:var(--display);font-size:1.1rem}
.unit{display:flex;align-items:center;gap:8px}
.unit span{font-family:var(--display)}
.meter{position:relative;height:46px;background:var(--cream);border-radius:10px;margin:26px 0 8px}
.meter .band3{position:absolute;top:0;bottom:0;background:#DDEBE1}
.meter .mk{position:absolute;top:-24px;transform:translateX(-50%);font-family:var(--display);font-size:.95rem;white-space:nowrap}
.meter .ln{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.meter .dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--coral2);transform:translate(-50%,-50%);border:3px solid #fff}
.list{display:grid;gap:8px}
.list div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px}
.list div.out{border-left-color:var(--gold)}
.list b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
.emoji{font-size:clamp(3rem,10vw,4.5rem);line-height:1}
.score{font-family:var(--display);font-size:1.3rem}
/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,15em) 1fr 3.5em;gap:10px;align-items:center}
.bar .track{height:34px;border-radius:10px;background:var(--cream);overflow:hidden}
.bar .track div{height:100%;background:var(--ok);border-radius:10px}
.bar span{font-family:var(--display);font-size:1.1rem}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:2.6em 9em 1fr 5em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 12px}
.rank .r b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--coral2)}
.rank .r .nm{font-family:var(--display);font-size:1.25rem}
.rank .r .pt{font-family:var(--display);font-size:1.4rem;text-align:right;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.6rem}
.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}
.chart svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
@media (max-width:820px){
  .hero,.tv,.two{grid-template-columns:1fr}
  .choose,.opts{grid-template-columns:1fr}
  .steps button{font-size:.85rem}
  .rank .r{grid-template-columns:2.2em 1fr 4.5em}.rank .r .trk{display:none}
}
/* AI 연구소 */
.pad{display:grid;gap:10px;justify-items:center}
.pad canvas{width:min(100%,360px);aspect-ratio:1;background:#fff;border:3px dashed var(--line);border-radius:16px;touch-action:none;cursor:crosshair}
.pad .ask{font-family:var(--display);font-size:clamp(1.5rem,4.5vw,2.1rem);text-align:center;line-height:1.25}
.pad .ask span{font-size:1.4em}
.cls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cls span{background:var(--cream);border-radius:999px;padding:.25em .9em;font-family:var(--display);font-size:1.05rem}
.cls span.ok{background:var(--ok);color:#fff}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.pick button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.05rem;padding:.7em .3em;line-height:1.25}
.pick button b{display:block;font-size:2rem;font-weight:400}
.pick button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.order{display:grid;gap:10px;width:100%}
.order button{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;font-size:1.15rem;display:flex;gap:12px;align-items:center}
.order button i{font-style:normal;width:2em;height:2em;border-radius:50%;background:var(--cream);display:grid;place-items:center;flex:none;font-family:var(--display)}
.order button.set{border-color:var(--ok);background:#E3F1E7}
.order button.set i{background:var(--ok);color:#fff}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.flow div{background:#fff;border:2px solid var(--line);border-top:8px solid var(--coral);border-radius:14px;padding:12px;text-align:center}
.flow div b{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--coral2)}
.flow div .emoji{font-size:2.6rem}
.flow div small{color:var(--muted);font-size:.95rem;display:block;line-height:1.35}
.guess{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.guess .card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.guess .card h3{font-size:1.15rem;color:var(--muted)}
.guess .card .ans{font-family:var(--display);font-size:2rem;line-height:1.2}
.guess .card.ok{border-color:var(--ok);background:#EEF7F0}.guess .card.no{border-color:var(--bad);background:#FBEDE8}
.conf{height:14px;border-radius:7px;background:var(--cream);overflow:hidden;margin-top:6px}.conf div{height:100%;background:var(--blue)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.gal figure{margin:0;position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px}
.gal canvas{width:100%;aspect-ratio:1;display:block;image-rendering:pixelated}
.gal button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;padding:0;border-radius:50%;font-size:.8rem;line-height:24px;background:var(--bad)}
.gal figcaption{font-size:.7rem;text-align:center;color:var(--muted)}
.train{display:grid;place-items:center;gap:10px;min-height:220px;text-align:center}
.train .big{font-size:2.6rem}
@media (max-width:820px){.flow{grid-template-columns:1fr 1fr}.pick{grid-template-columns:1fr 1fr}.guess{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><i>AI</i> 우리 반 AI 연구소</div><small id="sub"></small></div></header>

<script src="../common/watch.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCSSwT67k7lXoYDz4qsmHHDRXUqTS0Zh14",
  authDomain: "classroom-games-7ae7d.firebaseapp.com",
  databaseURL: "https://classroom-games-7ae7d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "classroom-games-7ae7d",
  storageBucket: "classroom-games-7ae7d.firebasestorage.app",
  messagingSenderId: "433158756735",
  appId: "1:433158756735:web:254d9b0b2e36502b4de24a"
};
const STAGES=[null,
  {k:'과정 알기',t:'AI가 만들어지는 과정',tm:6},
  {k:'데이터 모으기',t:'데이터 모으기',tm:8},
  {k:'학습·평가',t:'모델 학습하고 평가하기',tm:10},
  {k:'퀴즈 대결',t:'AI 퀴즈 대결',tm:6}];
// AI가 알아맞힐 그림 세 가지 (교과서 74~76쪽 '모양 분류'와 같은 삼각형·사각형·원)
const CLS=[{id:'tri',e:'🔺',n:'삼각형',j:'을'},{id:'sq',e:'🟦',n:'사각형',j:'을'},{id:'cir',e:'🟡',n:'원',j:'을'}];
const CN=Object.fromEntries(CLS.map(c=>[c.id,c]));
const GOAL=3;      // 학생 한 명이 그림마다 그릴 개수
const FEW=3;       // '조금 배운 AI'가 쓰는 그림 개수 (그림마다)
// 교과서 74~76쪽의 인공지능이 만들어지는 과정
const PROC=[
  {e:'🗂️',n:'데이터 수집하기',d:'예시를 모으고 이름표(클래스) 붙이기'},
  {e:'🧠',n:'모델 학습하기',d:'AI가 데이터에서 규칙 찾기'},
  {e:'🧩',n:'프로그래밍하기',d:'학습한 모델로 동작하는 프로그램 만들기'},
  {e:'🔍',n:'모델 평가하기',d:'새 데이터로 확인하고, 틀리면 데이터 더 넣기'}];
// 1단계: 장면을 보고 몇 단계인지 고르기 (쓰레기 분류 AI)
const SCENE=[
  {id:'s1',q:'페트병과 캔 사진을 많이 찍어 "페트병", "캔" 이름표를 붙였어요.',a:'데이터 수집하기'},
  {id:'s2',q:'컴퓨터가 사진들을 보며 페트병과 캔의 특징을 스스로 찾아요.',a:'모델 학습하기'},
  {id:'s3',q:'"분류 결과가 캔이면 캔 통을 열어라" 블록을 조립했어요.',a:'프로그래밍하기'},
  {id:'s4',q:'처음 보는 캔 사진을 보여 주고 바르게 판단하는지 확인해요.',a:'모델 평가하기'}].map(s=>({...s,o:PROC.map(p=>p.n).filter(n=>n!==s.a)}));
// 4단계 퀴즈 대결
const GAME=[
  {id:'g1',e:'🗂️',q:'인공지능이 만들어지는 과정의 첫 단계는?',a:'데이터 수집하기',o:['모델 평가하기','프로그래밍하기','모델 학습하기']},
  {id:'g2',e:'🐶',q:'고양이와 강아지를 구분하는 AI에게 필요한 데이터는?',a:'이름표가 붙은 고양이·강아지 사진',o:['자동차 사진','이름표 없는 하늘 사진','고양이 사진 1장']},
  {id:'g3',e:'🏷️',q:'사진마다 "고양이", "강아지" 이름을 붙이는 일을 무엇이라고 할까요?',a:'이름표 붙이기(라벨링)',o:['모델 평가하기','그림 그리기','전원 켜기']},
  {id:'g4',e:'📚',q:'데이터가 많고 다양하면 AI는 어떻게 될까요?',a:'더 정확해져요',o:['더 느려지기만 해요','항상 틀려요','변화가 없어요']},
  {id:'g5',e:'❌',q:'고양이 사진에 "강아지" 이름표가 잔뜩 붙어 있으면?',a:'AI가 틀린 답을 배워요',o:['AI가 알아서 고쳐요','더 정확해져요','아무 일도 없어요']},
  {id:'g6',e:'🔍',q:'AI가 잘 맞히는지 처음 보는 데이터로 확인하는 단계는?',a:'모델 평가하기',o:['데이터 수집하기','프로그래밍하기','모델 학습하기']},
  {id:'g7',e:'⭐',q:'삼각형·사각형·원만 배운 AI에게 별을 보여 주면?',a:'배운 것 중 하나로 잘못 답해요',o:['"별"이라고 맞혀요','스스로 별을 배워요','화면이 꺼져요']},
  {id:'g8',e:'🧩',q:'"분류 결과가 원이면 원 모양과 비슷하다고 말하기"를 만드는 단계는?',a:'프로그래밍하기',o:['데이터 수집하기','모델 학습하기','모델 평가하기']},
  {id:'g9',e:'📉',q:'평가해 보니 AI가 자꾸 틀려요. 어떻게 할까요?',a:'데이터를 더 모아 다시 학습시켜요',o:['AI를 버려요','그대로 써요','화면을 크게 해요']}];
const GQ=Object.fromEntries(GAME.map(g=>[g.id,g]));

const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pct=x=>Math.round(x*100);
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function withTimeout(pr,ms=10000){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),ms))]);}
function showError(e){

/* ---------- 그림판과 AI ---------- */
// 그린 그림은 28×28 칸의 진하기(0~15)로 줄여서 저장해요. 이것이 AI의 '데이터'예요.
const G=28;
function mountPad(el,{onChange}={}){
  el.innerHTML=`<canvas width="280" height="280" aria-label="그림판"></canvas><div class="row" style="justify-content:center"><button class="ghost" data-act="clear">지우기</button></div>`;
  const cv=$('canvas',el),cx=cv.getContext('2d');
  let drawing=false,last=null,ink=0;
  cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=14;cx.strokeStyle='#453422';
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*280/r.width,(e.clientY-r.top)*280/r.height];};
  cv.onpointerdown=e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);cx.beginPath();cx.arc(last[0],last[1],7,0,7);cx.fillStyle='#453422';cx.fill();ink++;onChange&&onChange(ink);};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);cx.beginPath();cx.moveTo(...last);cx.lineTo(...p);cx.stroke();last=p;ink++;};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false;onChange&&onChange(ink);};
  const pad={canvas:cv,clear(){cx.clearRect(0,0,280,280);ink=0;onChange&&onChange(0);},get ink(){return ink;},
    // 이 그림을 28×28 데이터로 바꿔요 (그림 크기와 위치를 맞춰서)
    toData(){return canvasToData(cv);},
    // 자동 테스트용: 선을 그려요
    strokes(list){list.forEach(s=>{cx.beginPath();cx.moveTo(...s[0]);s.slice(1).forEach(p=>cx.lineTo(...p));cx.stroke();});ink+=list.length;onChange&&onChange(ink);}};
  $('[data-act=clear]',el).onclick=()=>pad.clear();
  return pad;
}
function canvasToData(cv){
  const W=cv.width,H=cv.height,a=cv.getContext('2d').getImageData(0,0,W,H).data;
  let x0=W,y0=H,x1=-1,y1=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(a[(y*W+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)return null;
  const s=Math.max(x1-x0,y1-y0)+1,cxm=(x0+x1)/2,cym=(y0+y1)/2;
  const o=document.createElement('canvas');o.width=o.height=G;const oc=o.getContext('2d');
  oc.imageSmoothingEnabled=true;oc.imageSmoothingQuality='high';
  // 큰 그림을 한 번에 줄이면 선이 끊겨서 두 번에 나눠 줄여요
  const m=document.createElement('canvas');m.width=m.height=112;const mc=m.getContext('2d');
  mc.imageSmoothingEnabled=true;mc.drawImage(cv,cxm-s/2,cym-s/2,s,s,8,8,96,96);
  oc.drawImage(m,0,0,112,112,0,0,G,G);
  const b=oc.getImageData(0,0,G,G).data;let out='';
  for(let i=0;i<G*G;i++)out+=Math.min(15,Math.round(b[i*4+3]/255*15*1.6)).toString(16);
  return out;
}
const vecCache=new Map();
// 저장된 데이터를 AI가 비교하기 좋은 모양(조금 흐리게, 길이 1)으로 바꿔요
function vec(hex){
  if(vecCache.has(hex))return vecCache.get(hex);
  const v=new Float32Array(G*G);for(let i=0;i<G*G;i++)v[i]=parseInt(hex[i],16)/15;
  const b=new Float32Array(G*G);
  for(let y=0;y<G;y++)for(let x=0;x<G;x++){let s=0,w=0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=G||Y>=G)continue;const k=Math.exp(-(dx*dx+dy*dy)/2.2);s+=v[Y*G+X]*k;w+=k;}b[y*G+x]=s/w;}
  let n=0;for(const t of b)n+=t*t;n=Math.sqrt(n)||1;for(let i=0;i<b.length;i++)b[i]/=n;
  vecCache.set(hex,b);return b;
}
// 가장 닮은 그림 몇 개를 찾아 많이 나온 쪽으로 답해요 (k-최근접 이웃)
function predict(hex,data){
  if(!data.length)return null;
  const q=vec(hex);
  const sims=data.map(d=>{const v=vec(d.v);let s=0;for(let i=0;i<v.length;i++)s+=v[i]*q[i];return {l:d.l,s};}).sort((a,b)=>b.s-a.s);
  const k=Math.min(5,sims.length),score={};let tot=0;
  sims.slice(0,k).forEach(x=>{const w=Math.max(0.01,x.s)**4;score[x.l]=(score[x.l]||0)+w;tot+=w;});
  const best=Object.entries(score).sort((a,b)=>b[1]-a[1])[0];
  return {l:best[0],c:best[1]/tot,n:data.length};
}
// '조금 배운 AI'는 그림마다 먼저 모인 몇 개만 써요
function fewData(data){return CLS.flatMap(c=>data.filter(d=>d.l===c.id).sort((a,b)=>a.at-b.at).slice(0,FEW));}
function thumb(hex,px=56){
  const c=document.createElement('canvas');c.width=c.height=G;const x=c.getContext('2d');const im=x.createImageData(G,G);
  for(let i=0;i<G*G;i++){const t=parseInt(hex[i],16)/15;im.data[i*4]=69;im.data[i*4+1]=52;im.data[i*4+2]=34;im.data[i*4+3]=Math.round(t*255);}
  x.putImageData(im,0,0);return c;
}
const dataList=obj=>Object.entries(obj||{}).map(([k,d])=>({k,...d})).filter(d=>d&&d.v&&CN[d.l]);

// 차례로 문제를 내고, 맞혀야 다음으로 넘어가요
function runQuiz(box,qs,{band,title,fig,onRight,onWrong,onEnd,progress}){
  let i=0,missed=false;
  const draw=()=>{
    const q=qs[i];const opts=shuffle([q.a,...q.o]);missed=false;const t0=Date.now();
    box.innerHTML=`<div><span class="band">${band}</span></div>${title?`<h2>${title}</h2>`:''}
     <div class="prog">${qs.map((_,k)=>`<span class="${k<i?'on':k===i?'cur':''}"></span>`).join('')}</div>
     ${progress?progress():''}<div class="pop" style="width:100%">${fig?fig(q):''}</div><div class="q">${esc(q.q)}</div>
     <div class="opts">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
     <div class="msg" id="qm" role="status"></div>`;
    $$('.opts button',box).forEach(b=>b.onclick=async()=>{
      if(b.dataset.o===q.a){
        b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);
        $('#qm',box).className='msg ok';
        const extra=onRight?await onRight(q,!missed,(Date.now()-t0)/1000,i):'';
        $('#qm',box).textContent='맞았어요!'+(extra||'');
        await new Promise(r=>setTimeout(r,650));
        i++;if(i<qs.length)return draw();
        onEnd();
      }else{
        missed=true;b.classList.add('wrong');b.disabled=true;
        box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
        $('#qm',box).className='msg bad';$('#qm',box).textContent='다시 골라 봐요';
        if(onWrong)onWrong(q);
      }
    });
  };
  draw();
}

    $('#dm').className='msg ok';$('#dm').textContent=`${target.e} ${target.n} 데이터를 보냈어요!`;
    pad.clear();target=pick();ask();
  };
  ask();mine();
}

/* ---------- 3. 학습·평가 ---------- */
let testLabel=null;
function stage3(){
  if(!TRAINED){
    shell(`<div class="panel train"><span class="band">3단계 · 모델 학습하기</span><div class="emoji">🧠</div><div class="big">선생님이 TV에서 AI를 학습시키면 시작해요</div><p class="muted">AI가 우리 반 그림 데이터 ${DATA.length}개를 보며 삼각형·사각형·원의 특징을 찾아요.</p></div>`);
    return;
  }
  const n=(ME.tests||0);
  shell(`<div class="two"><div class="panel pad"><div><span class="band">3단계 · 모델 평가하기</span></div>
     <div class="ask">무엇을 그려서 AI에게 보여 줄까요?</div>
     <div class="pick" id="pick">${CLS.map(c=>`<button data-l="${c.id}" aria-pressed="false"><b>${c.e}</b>${c.n}</button>`).join('')}<button data-l="other" aria-pressed="false"><b>❓</b>배우지 않은 것</button></div>
     <div id="padbox" class="pad"></div>
     <div class="row" style="justify-content:center"><button id="test" disabled>AI에게 보여 주기 ▶</button></div><div class="msg" id="tm2" role="status"></div></div>
    <div class="panel grid"><h2>AI의 대답</h2><div id="res"><p class="muted">그림을 그리고 <b>AI에게 보여 주기</b>를 눌러요.<br>그린 그림은 AI가 처음 보는 <b>평가용 데이터</b>예요.<br>❓를 고르면 별, 하트처럼 AI가 배우지 않은 것을 그려 봐요.</p></div>
     <p class="muted" id="cnt3">평가 ${n}번 · 4번 이상 해 봐요</p></div></div>`);
  const pad=mountPad($('#padbox'),{onChange:()=>upd()});
  window.__pad=pad;
  const upd=()=>{$('#test').disabled=!(testLabel&&pad.ink);};
  $$('#pick button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.l===testLabel);b.onclick=()=>{testLabel=b.dataset.l;$$('#pick button').forEach(x=>x.setAttribute('aria-pressed',x===b));upd();};});
  upd();
  $('#test').onclick=async()=>{
    const v=pad.toData();if(!v)return;
    $('#test').disabled=true;
    const all=DATA.filter(d=>d.at<=TRAINED);
    const many=predict(v,all),few=predict(v,fewData(all));
    if(!many){$('#tm2').className='msg bad';$('#tm2').textContent='AI가 공부한 데이터가 없어요. 2단계에서 그림을 더 모아요.';return;}
    const card=(t,r)=>{const c=CN[r.l],ok=testLabel==='other'?null:r.l===testLabel;
      return `<div class="card ${ok===null?'':ok?'ok':'no'}"><h3>${t}<br><small>공부한 그림 ${r.n}개</small></h3><div class="ans">${c.e} ${c.n}!</div><div>🤖 "${c.n} 모양과 비슷해요."</div><div class="conf" title="확신"><div style="width:${pct(r.c)}%"></div></div><small>확신 ${pct(r.c)}% ${ok===null?'':ok?'· 맞았어요 ⭕':'· 틀렸어요 ❌'}</small></div>`;};
    const lbl=testLabel==='other'?'배우지 않은 것':CN[testLabel].e+' '+CN[testLabel].n;
    $('#res').innerHTML=`<p>내가 그린 것: <b>${lbl}</b></p><div class="guess pop">${card('많이 배운 AI',many)}${card('조금 배운 AI',few)}</div>
      <div class="rules" style="margin-top:12px">${testLabel==='other'?'<b>AI는 배운 것 중에서만 골라요!</b> 처음 보는 것도 삼각형·사각형·원 중 하나라고 답해요.':'<b>생각해 봐요</b> 두 AI의 대답이 왜 다를까요? 공부한 그림 수를 비교해 봐요.'}</div>`;
    const tests=(ME.tests||0)+1;
    await roomRef(me.room).child('tests').push({n:me.num,l:testLabel,v,many:{p:many.l,c:Math.round(many.c*100)},few:{p:few.l,c:Math.round(few.c*100)},at:Date.now()});
    await roomRef(me.room).child('students/'+me.num).update({tests,tested:tests>=4});
    ME.tests=tests;ME.tested=tests>=4;drawSteps();
    $('#cnt3').textContent=`평가 ${tests}번`+(tests>=4?' · 잘했어요! 더 해 봐도 좋아요':' · 4번 이상 해 봐요');
    pad.clear();
  };
}

/* ---------- 4. AI 퀴즈 대결 ---------- */
async function stage4(){
  if(ME.game&&ME.game.done)return gameDone();
  let Gm=ME.game;
  if(!Gm||!Gm.order){
    Gm={order:shuffle(GAME.map(g=>g.id)),i:0,score:0,started:Date.now()};
    await roomRef(me.room).child('students/'+me.num+'/game').set(Gm);ME.game=Gm;
  }
  if(cur!==4)return;
  const rest=Gm.order.slice(Gm.i||0).map(id=>GQ[id]).filter(Boolean);
  shell(`<div class="panel quiz" id="gz"></div>`);
  if(!rest.length)return finishGame();
  let score=Gm.score||0,idx=Gm.i||0;
  onMe=()=>drawSteps();
  runQuiz($('#gz'),rest,{band:'4단계 · AI 퀴즈 대결',fig:q=>`<div class="emoji" aria-hidden="true">${q.e}</div>`,
    progress:()=>`<div class="score">점수 <b id="sc">${score}</b>점 · ${idx+1}/${GAME.length}번째 문제</div>`,
    onRight:async(q,ok,sec)=>{
      const pts=ok?100+Math.round(50*Math.max(0,Math.min(1,1-(sec-3)/17))):0;
      score+=pts;idx++;
      await roomRef(me.room).child('students/'+me.num+'/game').update({i:idx,score});
      ME.game={...ME.game,i:idx,score};
      return pts?` +${pts}점`:' (두 번째 도전은 점수 없이 넘어가요)';
    },
    onWrong:q=>{roomRef(me.room).child(`students/${me.num}/game/wrong/${q.id}`).transaction(v=>(v||0)+1);},
    onEnd:finishGame});
}
async function finishGame(){
  await roomRef(me.room).child('students/'+me.num+'/game').update({done:true,at:Date.now()});
  ME.game={...ME.game,done:true};drawSteps();gameDone();
}
async function gameDone(){
  const Gm=ME.game||{};
  let rankTxt='';
  if(ROOMV.award){
    const all=(await roomRef(me.room).child('students').get()).val()||{};
    const L=ranking(all);const k=L.findIndex(x=>x.n===me.num);
    if(k>=0)rankTxt=`<div class="big">우리 반 ${k+1}등!</div>`;
  }
  if(cur!==4)return;
  shell(`<div class="panel quiz pop"><div><span class="band">대결 끝</span></div><h2 style="font-size:2rem">AI 연구원 인증!</h2>
   <div class="score" style="font-size:2rem">${Gm.score||0}점</div>${rankTxt}
   <div class="rules" style="text-align:left;width:100%"><b>오늘 알게 된 것</b><ul><li>AI는 <b>데이터 수집하기 → 모델 학습하기 → 프로그래밍하기 → 모델 평가하기</b> 순서로 만들어져요.</li><li>데이터가 <b>많고, 다양하고, 이름표가 정확할수록</b> AI가 잘 맞혀요.</li><li>AI는 <b>배운 것 안에서만</b> 답할 수 있어요.</li></ul></div>
   <p class="muted">${ROOMV.award?'TV에서 시상식을 봐요!':'TV에서 시상식을 기다려요.'}</p></div>`);
}
function ranking(all){
  return Object.keys(all||{}).map(Number).map(n=>({n,...all[n]})).filter(x=>x.game)
    .sort((a,b)=>(b.game.score||0)-(a.game.score||0)||(b.game.i||0)-(a.game.i||0)||(a.game.at||9e15)-(b.game.at||9e15));
}

function setStage(n){roomRef(ROOM).update({stage:n,timer:{min:STAGES[n].tm,left:STAGES[n].tm*60,endAt:0}});}
function renderTime(){
  const el=$('#tm');if(!el)return clearInterval(tick);

const students=()=>{const s=RD.students||{};return Object.keys(s).map(Number).sort((a,b)=>a-b).map(n=>({n,...s[n]}));};
let training=false;
function renderTV(){
  const main=$('#main');if(!main)return;

  if(training)return;
  if(st===1)return tv1(main,S);
  if(st===2)return tv2(main);

}
function tv1(main,S){

   <div class="panel grid"><h3>장면 문제를 한 번에 맞힌 친구</h3><div class="bars">${SCENE.map(w=>{const c=done.filter(x=>x.proc.right&&x.proc.right[w.id]).length;
      return `<div class="bar"><span style="font-size:.95rem">${esc(w.q)}</span><div class="track"><div style="width:${done.length?c/done.length*100:0}%"></div></div><span>${c}명</span></div>`;}).join('')}</div></div>
   <div class="rules"><b>함께 이야기해요</b><ul><li>AI는 처음부터 똑똑할까요? 무엇이 AI를 똑똑하게 만들까요?</li><li>오늘 만들 AI: 그림을 보고 🔺 삼각형, 🟦 사각형, 🟡 원 중 무엇과 비슷한지 알려 주는 모양 분류 AI</li><li>학습용 데이터와 평가용 데이터는 왜 따로 둘까요?</li></ul></div>`;

function gallery(list,del){

    if(d.cap){const c=document.createElement('figcaption');c.textContent=d.cap;f.appendChild(c);}

function tv2(main){

    <div class="bars">${CLS.map(c=>{const k=D.filter(d=>d.l===c.id).length;return `<div class="bar" style="grid-template-columns:7em 1fr 3.5em"><span>${c.e} ${c.n}</span><div class="track"><div style="width:${k/top*100}%"></div></div><span>${k}개</span></div>`;}).join('')}</div></div>
   ${CLS.map(c=>`<div class="panel grid"><h3>${c.e} ${c.n} 데이터 <small class="muted">· 이상한 그림은 ✕로 지워요 (데이터 정리)</small></h3><div data-g="${c.id}"></div></div>`).join('')}`;

function tv3(main){

   ${tr?`<div class="two"><div class="panel grid"><h2>AI 정확도 <small class="muted">(평가 ${lab.length}번)</small></h2>
      <div class="bars"><div class="bar"><span>많이 배운 AI<br><small class="muted">그림 ${used}개</small></span><div class="track"><div style="width:${pct(acc('many'))}%"></div></div><span>${pct(acc('many'))}%</span></div>

    const el=$('#recent',main);if(R.length)el.appendChild(gallery(R,false));else el.innerHTML='<p class="muted">아직 없어요</p>';}

// 학습하는 모습을 보여 주고 학습 시각을 저장해요. 학생 화면은 이 시각까지 모인 데이터로 답해요.
function trainAnim(main,D){
  if(!D.length){alert('먼저 2단계에서 그림 데이터를 모아요.');return;}
  training=true;
  main.innerHTML=`<div class="panel train"><span class="band">학습 중</span><div id="flick" style="width:160px"></div><div class="big" id="tcount">0 / ${D.length}</div><p>AI가 그림을 하나씩 보며 삼각형·사각형·원의 특징을 찾고 있어요…</p></div>`;
  const list=shuffle(D),dur=RM?300:Math.min(4000,600+D.length*40),t0=performance.now();
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur),k=Math.max(1,Math.round(p*list.length));
    const fl=$('#flick');if(!fl){training=false;return;}
    fl.innerHTML='';const c=thumb(list[k-1].v);c.style.cssText='width:160px;height:160px;image-rendering:pixelated;background:#fff;border-radius:12px';fl.appendChild(c);
    $('#tcount').textContent=`${k} / ${list.length}`;
    if(p<1)return requestAnimationFrame(step);
    roomRef(ROOM).child('trained').set(firebase.database.ServerValue.TIMESTAMP).then(()=>{training=false;renderTV();});
  };
  requestAnimationFrame(step);
}
function tv4(main,S){
  const L=ranking(RD.students);
  const wrong={};S.forEach(x=>Object.entries((x.game&&x.game.wrong)||{}).forEach(([k,v])=>wrong[k]=(wrong[k]||0)+v));
  const hard=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>({q:GQ[k],v})).filter(x=>x.q);
  const top=Math.max(1,...L.map(x=>x.game.score||0));
  if(RD.award){
    const p=[L[1],L[0],L[2]];
    main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:2rem">AI 퀴즈 대결 시상식</h2><button class="ghost" id="awoff">순위표로</button></div>
     <div class="podium">${p.map((x,k)=>x?`<div class="p${[2,1,3][k]} pop"><b>${[2,1,3][k]}등</b><span>${esc(x.n)} ${esc(x.name)}</span>${x.game.score||0}점</div>`:'<span></span>').join('')}</div></div>
     ${hard.length?`<div class="panel grid"><h2>우리 반이 가장 많이 틀린 문제</h2><div class="list">${hard.map(h=>`<div><b>${h.q.e}</b>${esc(h.q.q)}<br>정답: <b>${esc(h.q.a)}</b> <span class="muted">(틀린 횟수 ${h.v})</span></div>`).join('')}</div></div>`:''}`;
    $('#awoff').onclick=()=>roomRef(ROOM).child('award').set(false);
    return;
  }
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">AI 퀴즈 대결</h2><button id="awon">시상식 ▶</button></div>
   <p class="muted" style="margin:0">한 번에 맞히면 100점 + 빠르기 보너스 최대 50점. 틀리면 다시 골라야 넘어가요. ${GAME.length}문제.</p>
   <div class="rank">${L.map((x,k)=>`<div class="r"><b>${k+1}</b><span class="nm">${esc(x.n)} ${esc(x.name)}${x.game.done?' 🏁':''}</span><div class="bar trk" style="display:block"><div class="track"><div style="width:${(x.game.score||0)/top*100}%;background:var(--coral)"></div></div></div><span class="pt">${x.game.score||0}</span></div>`).join('')||'<p class="muted">아직 시작한 친구가 없어요</p>'}</div></div>
   <div class="rules"><b>약속</b><ul><li>친구 화면은 보지 않아요.</li><li>소리 지르지 않고, 다 푼 친구는 조용히 기다려요.</li></ul></div>`;
  $('#awon').onclick=()=>roomRef(ROOM).child('award').set(true);
}
