<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세계 무역 작전실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* Same classroom notice-board look as 세계 무역 박람회. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F;
  --nature:#5E9B5A; --tech:#3D6E8C; --geo:#C27A2C;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input,select{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center;font-size:.9em}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .4em;font-size:1rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.quiz .q,.q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.2rem;padding:.9em .5em;line-height:1.3}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.opts.three{grid-template-columns:repeat(3,1fr)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--coral2);line-height:1.25}
.emoji{font-size:clamp(3rem,10vw,4.5rem);line-height:1}
.score{font-family:var(--display);font-size:1.3rem}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.list{display:grid;gap:8px}
.list div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px}
.list b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
.map svg{width:100%;height:auto;display:block;border-radius:14px;border:2px solid var(--line)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cols>div{background:#fff;border-radius:16px;padding:10px;display:grid;gap:10px;align-content:start;border-top:8px solid var(--line)}
.cols>div.nature{border-top-color:var(--nature)} .cols>div.tech{border-top-color:var(--tech)} .cols>div.geo{border-top-color:var(--geo)}
.cols h3{font-size:1.25rem}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:2.6em 11em 1fr 5em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 12px}
.rank .r b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--coral2)}
.rank .r .nm{font-family:var(--display);font-size:1.25rem}
.rank .r .pt{font-family:var(--display);font-size:1.4rem;text-align:right;font-variant-numeric:tabular-nums}
.bar .track{height:30px;border-radius:10px;background:var(--cream);overflow:hidden}
.bar .track div{height:100%;background:var(--coral);border-radius:10px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.6rem}
.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}
.steps{grid-template-columns:repeat(5,1fr)}
/* 1단계: 스마트폰 조립 */
.phone{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#2F2A26;border-radius:26px;padding:22px 12px;width:min(100%,260px);margin:0 auto;box-shadow:inset 0 0 0 4px #5A4E44}
.phone span{aspect-ratio:1;border-radius:12px;background:#4A413A;display:grid;place-items:center;font-size:2rem;line-height:1}
.phone span.on{background:#FFF4DF}
.phone small{grid-column:1/-1;color:#fff;text-align:center;font-family:var(--display);font-size:1rem}
.clue{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;width:100%}
.clue .e{font-size:3rem;line-height:1}
.clue b{font-family:var(--display);font-weight:400;font-size:1.4rem}
.article{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;text-align:left;width:100%}
.article h3{font-size:1.35rem;margin-bottom:6px}
.article p{margin:.3em 0}
.article .src{font-size:.85rem;color:var(--muted)}
.article mark{background:#FFE7A8;padding:0 .15em;border-radius:4px}
/* 2단계: 경쟁 */
.multi{display:grid;gap:10px;width:100%}
.multi button{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;font-family:var(--text);font-size:1.15rem;padding:.8em 1em}
.multi button[aria-pressed="true"]{border-color:var(--coral);background:#FFF4DF}
.multi button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.multi button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.comp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.comp button{background:#fff;color:var(--ink);border:3px solid var(--line);display:grid;gap:4px;justify-items:center;padding:12px 6px;font-size:1.15rem;line-height:1.25}
.comp button span{font-size:2.2rem;line-height:1}
.cols>div.tech{border-top-color:var(--tech)} .cols>div.build{border-top-color:var(--geo)} .cols>div.port{border-top-color:var(--nature)}
.cards{display:grid;gap:6px}
.cards div{background:var(--cream);border-radius:10px;padding:6px 10px}
.cards div.hard{background:#F6E1DB}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;height:180px;text-align:center}
.bars div{display:grid;align-content:end;gap:4px;height:100%}
.bars i{display:block;background:var(--blue);border-radius:8px 8px 0 0}
.bars b{font-family:var(--display);font-weight:400}
/* 3단계: 관세 실험실 */
.lab{display:grid;gap:14px;width:100%}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prices>div{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 14px;text-align:center}
.prices .kr{border-color:var(--coral2)} .prices .im{border-color:var(--blue)}
.prices b{display:block;font-family:var(--display);font-weight:400;font-size:2.2rem;font-variant-numeric:tabular-nums}
.prices small{color:var(--muted)}
.slider{display:grid;gap:6px}
.slider input[type=range]{padding:0;border:0;accent-color:var(--coral2);height:36px}
.slider .tv{font-family:var(--display);font-size:1.6rem;color:var(--coral2)}
.factories{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;text-align:center}
.factories span{display:grid;gap:2px;justify-items:center;background:#fff;border-radius:10px;padding:6px 0;border:2px solid var(--line);font-size:1.4rem;line-height:1}
.factories span em{font-style:normal;font-size:1rem}
.factories span.kr{border-color:var(--coral2);background:#FDE7DE}
.factories span.im{border-color:var(--blue);background:#E2EDF3}
.years{display:flex;gap:6px;flex-wrap:wrap}
.years span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.years span.now{background:var(--coral);color:#fff}
.chart svg{width:100%;height:auto;display:block;background:#fff;border-radius:12px;border:2px solid var(--line)}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.meter .track{height:22px;border-radius:999px;background:var(--cream);overflow:hidden}
.meter .track div{height:100%;background:var(--coral);border-radius:999px}
/* 4단계: 공장 어디에 */
.locs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.locs button{background:#fff;color:var(--ink);border:3px solid var(--line);text-align:left;display:grid;gap:6px;align-content:start;font-family:var(--text);font-size:1rem;padding:12px 14px;line-height:1.4}
.locs button b{font-family:var(--display);font-weight:400;font-size:1.5rem}
.locs button ul{margin:0;padding-left:1.1em}
.locs button.right{background:#E3F1E7;border-color:var(--ok)}
.locs button.wrong{background:#F6E1DB;border-color:var(--bad)}
/* 5단계 */
.truck{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;font-size:1.8rem;line-height:1}
.truck i{font-style:normal;display:inline-block;width:26px;height:20px;border-radius:3px;background:var(--coral)}
.truck i:nth-child(3n){background:var(--blue)} .truck i:nth-child(3n+1){background:var(--gold)}
.lanes{display:grid;gap:8px}
.lane{display:grid;grid-template-columns:9em 1fr 3em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:6px 12px}
.lane .nm{font-family:var(--display);font-size:1.15rem}
.lane .road{position:relative;height:34px;background:repeating-linear-gradient(90deg,var(--cream) 0 22px,#fff 22px 30px);border-radius:8px}
.lane .road span{position:absolute;top:0;font-size:1.7rem;line-height:34px;transition:left .6s}
.lane .road::after{content:'🚢';position:absolute;right:-4px;top:0;font-size:1.6rem;line-height:34px}
.sent{display:grid;gap:10px}
.sent .fill{font-family:var(--display);font-size:1.35rem;line-height:1.5;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px}
.sent .fill u{text-decoration:none;border-bottom:3px solid var(--coral);color:var(--coral2);padding:0 .2em}
.stars{display:grid;gap:10px}
.stars .it{background:#fff;border-radius:12px;padding:10px 14px;display:grid;gap:6px}
.stars .it .row button{background:var(--cream);color:var(--ink);font-size:1.4rem;padding:.3em .8em}
.stars .it .row button[aria-pressed="true"]{background:var(--gold);color:#fff}
@media (max-width:820px){
  .hero,.tv,.two,.cols{grid-template-columns:1fr}
  .choose,.opts,.opts.three,.comp,.locs,.prices{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(5,1fr)}.steps button{font-size:.8rem}
  .factories{grid-template-columns:repeat(5,1fr)}
  .rank .r{grid-template-columns:2.2em 1fr 4.5em}.rank .r .trk{display:none}
  .lane{grid-template-columns:6em 1fr 2.5em}
}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><i>🌐</i> 세계 무역 작전실</div><small id="sub"></small></div></header>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../common/watch.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCSSwT67k7lXoYDz4qsmHHDRXUqTS0Zh14",
  authDomain: "classroom-games-7ae7d.firebaseapp.com",
  databaseURL: "https://classroom-games-7ae7d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "classroom-games-7ae7d",
  storageBucket: "classroom-games-7ae7d.firebasestorage.app",
  messagingSenderId: "433158756735",
  appId: "1:433158756735:web:254d9b0b2e36502b4de24a"
};
// 사회 2단원 17~18차시 "무역을 통한 세계 여러 나라의 상호 의존과 경쟁 관계를 살펴볼까요" (교과서 106~111쪽)
// 성취기준 [6사11-03] 사례를 통해 무역의 의미를 이해하고, 국가 간 무역이 발생하는 이유를 탐구한다.
const STAGES=[null,
  {k:'함께 만들기',t:'상호 의존: 스마트폰과 광물 협력 (교과서 106쪽)',tm:8},
  {k:'경쟁하기',t:'경쟁: 세 가지 경쟁 모습 (교과서 107쪽)',tm:5},
  {k:'관세 실험실',t:'관세 실험실: 우리 철강 키우기 (교과서 108쪽)',tm:9},
  {k:'공장 어디에',t:'기업의 세계화: 공장을 어디에 지을까 (교과서 109쪽)',tm:5},
  {k:'정리',t:'컨테이너 퀴즈 · 한 문장 설명 · 자기 평가 (교과서 110~111쪽)',tm:7}];
const NST=5;

// 1단계: 스마트폰 한 대에 담긴 여러 나라 (지도서 248쪽 '스마트폰에 담긴 세계 여러 나라의 상호 의존', 그린피스 누리집)
const PLACES={
  cd:{n:'콩고 민주 공화국',ll:[23,-3],lp:'l'},
  za:{n:'남아프리카 공화국',ll:[25,-29],lp:'l'},
  kr:{n:'대한민국',ll:[127.5,36.5],lp:'t'},
  jp:{n:'일본',ll:[139,36],lp:'r'},
  my:{n:'말레이시아',ll:[102,3.5],lp:'b'},
  vn:{n:'베트남',ll:[106,16],lp:'l'}};
const PARTS=[
  {id:'co',e:'🔋',n:'배터리 속 코발트',c:'cd',clue:'배터리에 쓰이는 코발트는 아프리카 한가운데에 있는 이 나라에서 많이 나와요.'},
  {id:'pd',e:'🔌',n:'전자 부품 속 팔라듐',c:'za',clue:'전자 부품에 쓰이는 팔라듐은 아프리카 남쪽 끝에 있는 이 나라와 러시아에서 주로 나와요.'},
  {id:'ap',e:'🧠',n:'반도체 (AP·메모리)',c:'kr',clue:'많은 정보를 처리하는 반도체와 메모리는 반도체를 가장 많이 수출하는 이 나라의 기업들이 앞서 만들어요.'},
  {id:'cam',e:'📷',n:'카메라 센서',c:'jp',clue:'정밀한 카메라 센서는 로봇 같은 정밀 기계 기술이 뛰어난 우리나라 동쪽 섬나라 기업들도 많이 만들어요.'},
  {id:'coil',e:'🧲',n:'코일 같은 기본 부품',c:'my',clue:'콘덴서나 코일 같은 기본 부품은 타이와 함께 동남아시아의 이 나라에서도 만들어요.'},
  {id:'asm',e:'🏭',n:'마지막 조립',c:'vn',clue:'부품을 모아 마지막으로 조립하는 공장이 많은 나라예요. 중국과 국경을 맞대고 있어요.'}];
const PN=Object.fromEntries(PARTS.map(x=>[x.id,x]));

// 3단계: 관세 실험실 (교과서 108쪽, 1970년대 우리나라 철강 산업)
// 수입 철강 값 100. 우리 철강은 처음 150. 관세를 매기면 수입 철강 값이 올라가요.
// 공장 10곳은 더 싼 쪽을 사요(공장마다 조금씩 다르게 생각해요). 우리 철강을 많이 팔수록 기술이 늘어 만드는 값이 내려가요.
// 공장들이 더 낸 돈(소비자 부담) = 관세 없는 값 100보다 더 낸 돈. 관세를 계속 높게 두면 이 돈이 쌓여요.
const STEEL={imp:100,start:150,min:70,years:5,tariffs:[0,10,20,30,40,50,60]};
function steelYear(c,t){
  const imp=STEEL.imp*(1+t/100);let n=0;const pick=[];
  for(let i=0;i<10;i++){const k=c+(i-4.5)*4<=imp;pick.push(k?1:0);if(k)n++;}
  // 관세가 있으면 우리 회사는 경쟁이 줄어 수입 철강 값 가까이 받아요(만드는 값보다 싸게는 안 팔아요)
  const p=t>0?Math.max(c,Math.round(imp)-5):c;
  const burden=Math.round(n*Math.max(0,p-STEEL.imp)+(10-n)*(imp-STEEL.imp));
  const nc=Math.max(STEEL.min,Math.round(c-(1+2.2*n)));
  return {n,pick,burden,imp:Math.round(imp),nc,p};
}

// 세계 지도: 부품이 나온 나라에서 조립하는 베트남으로 화살표
function mapSVG({found={},label=true}={}){
  const to=proj(PLACES.vn.ll);
  let g=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E0704F"/></marker></defs>
   <rect width="${MAP.W}" height="${MAP.H}" fill="#CFE3EA"/><path d="${LAND}" fill="#F6EEDA" stroke="#C9B98F" stroke-width="1"/>`;
  PARTS.filter(p=>p.c!=='vn').forEach(p=>{const n=found[p.id]||0;if(!n)return;const a=proj(PLACES[p.c].ll);
    const mx=(a[0]+to[0])/2,my=Math.min(a[1],to[1])-Math.max(30,Math.abs(a[0]-to[0])*.15);
    g+=`<path d="M${a[0].toFixed(0)} ${a[1].toFixed(0)}Q${mx.toFixed(0)} ${my.toFixed(0)} ${to[0].toFixed(0)} ${to[1].toFixed(0)}" fill="none" stroke="#F98F6E" stroke-width="${2+Math.min(5,n*.6)}" stroke-linecap="round" opacity=".8" marker-end="url(#ah)"/>`;});
  PARTS.forEach(p=>{const pl=PLACES[p.c];const [cx,cy]=proj(pl.ll);const on=(found[p.id]||0)>0;
    const lx=pl.lp==='l'?cx-24:pl.lp==='r'?cx+24:cx, ly=pl.lp==='t'?cy-26:pl.lp==='b'?cy+38:cy+6, an=pl.lp==='l'?'end':pl.lp==='r'?'start':'middle';
    g+=`<g opacity="${on?1:.45}"><circle cx="${cx}" cy="${cy}" r="18" fill="#fff" stroke="${on?'#E0704F':'#B8A88A'}" stroke-width="4"/><text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="19">${p.e}</text>
     ${label?`<text x="${lx}" y="${ly}" text-anchor="${an}" font-size="18" font-family="Jua" fill="#453422" stroke="#fff" stroke-width="5" paint-order="stroke">${pl.n}</text>`:''}</g>`;});
  return `<div class="map"><svg viewBox="0 0 ${MAP.W} ${MAP.H}" role="img" aria-label="세계 지도: 스마트폰 부품이 온 나라와 조립하는 나라">${g}</svg></div>`;
}

// 철강 값 그래프: 해마다 우리 철강 값과 관세를 붙인 수입 철강 값
function steelChart(hist,{w=520,h=230,many}={}){
  const X=i=>40+i*(w-60)/STEEL.years, Y=v=>h-28-(v-60)/(170-60)*(h-48);
  let g=`<rect width="${w}" height="${h}" fill="#fff"/>`;
  [60,100,140].forEach(v=>{g+=`<line x1="36" x2="${w-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EADFC4"/><text x="30" y="${Y(v)+5}" text-anchor="end" font-size="13" fill="#8A7458">${v}</text>`;});
  g+=`<line x1="36" x2="${w-10}" y1="${Y(100)}" y2="${Y(100)}" stroke="#3D6E8C" stroke-dasharray="6 5" stroke-width="2"/><text x="${w-12}" y="${Y(100)-6}" text-anchor="end" font-size="13" fill="#3D6E8C">관세 없는 수입 철강 100</text>`;
  for(let i=0;i<=STEEL.years;i++)g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="13" fill="#8A7458">${i===0?'처음':i+'년'}</text>`;
  const lines=many||[hist];
  lines.forEach((H,k)=>{if(!H||!H.length)return;
    const pts=[[0,STEEL.start],...H.map((y,i)=>[i+1,y.nc])];
    g+=`<polyline points="${pts.map(([i,v])=>`${X(i).toFixed(0)},${Y(v).toFixed(0)}`).join(' ')}" fill="none" stroke="#E0704F" stroke-width="${many?2.5:4}" opacity="${many?.55:1}" stroke-linejoin="round"/>`;
    if(!many)H.forEach((y,i)=>{g+=`<circle cx="${X(i+1)}" cy="${Y(y.nc)}" r="5" fill="#E0704F"/><text x="${X(i+1)}" y="${Y(y.nc)-10}" text-anchor="middle" font-size="12" fill="#453422">관세 ${y.t}%</text>`;});});
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="해마다 우리 철강 값이 바뀐 그래프">${g}</svg></div>`;
}

   <div class="panel grid">${mapSVG({found:Object.fromEntries(PARTS.map(p=>[p.id,3]))})}</div></section>

/* ---------- student: join ---------- */
let me=null, ROOMV={}, ME={}, cur=1, onMe=null;
function parseName(s){const m=String(s).trim().match(/^(\d{1,2})\s*[번.]?\s*(.+)$/);return m?{num:+m[1],name:m[2].trim()}:null;}
function joinView(){
  clearOffs();
  const saved=store('to-student');
  if(saved&&ROOM&&saved.room===ROOM){me=saved;return enterRoom();}
  $('#sub').textContent='학생 화면';
  ClassWatch.student({db,room:ROOM,root:app});ClassWatch.step('들어가기');
  app.innerHTML=`<div class="grid" style="max-width:760px;margin:0 auto">
   <div class="panel grid"><h2>방 번호</h2><input id="rm" inputmode="numeric" maxlength="4" placeholder="TV에 보이는 4자리" value="${esc(ROOM)}"></div>
   <div class="panel grid"><h2>"번호 이름"을 써요</h2><input id="nm" placeholder="예) 7 김민수" autocomplete="off"></div>
   <div class="msg bad" id="jm" role="status"></div>
   <div class="row"><button id="enter" disabled>들어가기</button><button class="ghost" id="home">처음으로</button></div></div>`;
  const chk=()=>{$('#enter').disabled=!(/^\d{4}$/.test($('#rm').value)&&parseName($('#nm').value));};
  $('#rm').oninput=chk;$('#nm').oninput=chk;
  $('#home').onclick=startView;
  ClassWatch.joinForm({});
  $('#enter').onclick=async()=>{
    const code=$('#rm').value, p=parseName($('#nm').value);
    $('#enter').disabled=true;
    try{
      const open=await withTimeout(roomRef(code).child('open').get());
      if(!open.exists()){$('#jm').textContent='방 번호를 다시 확인해요.';return chk();}
      const r=await withTimeout(roomRef(code).child('students/'+p.num).transaction(c=>c?undefined:{name:p.name,joinedAt:Date.now()},undefined,false));
      if(!r.committed){const c=r.snapshot.val();
        if(!(c&&c.name===p.name)){$('#jm').textContent=`${p.num}번은 이미 "${c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}}
    }catch(e){$('#jm').textContent='연결 문제: '+(e.code||e.message);return chk();}
    ROOM=code;me={room:code,num:p.num,name:p.name};store('to-student',me);
    history.replaceState(null,'','?room='+code);
    enterRoom();
  };
}
function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app});ClassWatch.who(me.num,me.name);
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  let ready=false;ROOMV={};onMe=null;
  listen(roomRef(me.room).child('students/'+me.num),s=>{
    const v=s.val();
    if(!v){store('to-student',null);me=null;clearOffs();return joinView();}
    ME=v;
    $('#sub').textContent=`${me.num}번 ${me.name}`;
    if(!ready){ready=true;if(ROOMV.stage){cur=ROOMV.stage;renderStage();}return;}
    if(typeof onMe==='function')onMe();
  });
  listen(roomRef(me.room).child('stage'),s=>{
    const st=s.val()||1;const was=ROOMV.stage;ROOMV.stage=st;
    if(!ready)return;
    if(was!==st){cur=st;renderStage();} else drawSteps();
  });
  listen(roomRef(me.room).child('award'),s=>{ROOMV.award=!!s.val();if(ready&&cur===5&&ME.s5&&ME.s5.done)s5Done();});
}
const meRef=k=>roomRef(me.room).child('students/'+me.num+(k?'/'+k:''));
function stepDone(n){
  const s=ME['s'+n]||{};
  return !!s.done;
}
function drawSteps(){
  const el=$('#steps');if(!el)return;
  el.innerHTML=[1,2,3,4,5].map(n=>`<button data-s="${n}" ${n>ROOMV.stage?'disabled':''} ${n===cur?'aria-current="step"':''} class="${stepDone(n)?'done':''}"><b>${n}</b>${STAGES[n].k}${stepDone(n)?' ✓':''}</button>`).join('');
  $$('#steps button').forEach(b=>b.onclick=()=>{cur=+b.dataset.s;renderStage();});
}
function shell(inner){
  app.innerHTML=`<div class="grid"><nav class="steps" id="steps" aria-label="활동 단계"></nav>${inner}<div style="text-align:right"><button class="ghost" id="relog" style="font-size:.85rem;padding:.4em .8em">다른 이름으로 들어가기</button></div></div>`;
  $('#relog').onclick=()=>{store('to-student',null);me=null;clearOffs();joinView();};
  drawSteps();
}
const wstep=sub=>ClassWatch.step(STAGES[cur].k+(sub?' · '+sub:''),{n:cur,total:NST,wait:stepDone(cur)});
function renderStage(){
  onMe=()=>drawSteps();ClassWatch.detail(null);
  return [null,stage1,stage2,stage3,stage4,stage5][cur]();
}
// 차례로 문제를 내고, 맞혀야 다음으로 넘어가요
function runQuiz(box,qs,{band,title,fig,onRight,onWrong,onEnd,progress,few,cls,pre}){
  let i=0,missed=false;
  const draw=()=>{
    const q=qs[i];const opts=shuffle([q.a,...(few?shuffle(q.o).slice(0,1):q.o)]);missed=false;const t0=Date.now();
    box.innerHTML=`<div><span class="band">${band}</span></div>${title?`<h2>${title}</h2>`:''}
     <div class="prog">${qs.map((_,k)=>`<span class="${k<i?'on':k===i?'cur':''}"></span>`).join('')}</div>
     ${progress?progress():''}${pre||''}<div class="pop" style="width:100%">${fig?fig(q):''}</div><div class="q">${esc(q.q)}</div>
     <div class="opts ${cls||''}">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
     <div class="msg" id="qm" role="status"></div>`;
    ClassWatch.detail(()=>({q:'문제: '+q.q}));
    $$('.opts button',box).forEach(b=>b.onclick=async()=>{
      if(b.dataset.o===q.a){
        b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);
        $('#qm',box).className='msg ok';
        const extra=onRight?await onRight(q,!missed,(Date.now()-t0)/1000,i):'';
        $('#qm',box).textContent='맞았어요!'+(extra||'');
        await wait(650);
        i++;if(i<qs.length)return draw();
        onEnd();
      }else{
        missed=true;b.classList.add('wrong');b.disabled=true;
        box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
        $('#qm',box).className='msg bad';$('#qm',box).textContent='다시 골라 봐요';
        if(onWrong)onWrong(q);
      }
    });
  };
  draw();
}
const emojiFig=q=>`<div class="emoji" aria-hidden="true">${q.e}</div>`;
const wrongCount=(k,id)=>meRef(`${k}/wrong/${id}`).transaction(v=>(v||0)+1);
function remember(t){return `<div class="rules" style="text-align:left;width:100%"><b>꼭! 기억해요</b><ul>${t.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;}

/* ---------- 1. 함께 만들기 (상호 의존) ---------- */
function stage1(){
  const s=ME.s1||{};
  if(s.done)return s1Done();
  if(s.parts)return s1Article();
  s1Parts();
}
function s1Parts(){
  wstep('스마트폰 조립');
  const got=[];let i=0;const order=PARTS.map(p=>p.id);
  shell(`<div class="panel quiz" id="pb"></div>`);
  const box=$('#pb');
  const draw=()=>{
    const p=PN[order[i]];
    const opts=shuffle([p.c,...shuffle(Object.keys(PLACES).filter(c=>c!==p.c)).slice(0,2)]);
    box.innerHTML=`<div><span class="band">1단계 · 스마트폰 한 대에 담긴 세계</span></div>
     <h2>이 부품은 어느 나라에서 왔을까요? 단서를 읽고 골라요</h2>
     <div class="two" style="width:100%"><div class="grid">
      <div class="clue pop"><div class="e" aria-hidden="true">${p.e}</div><div><b>${esc(p.n)}</b><div>${esc(p.clue)}</div></div></div>
      <div class="opts three">${opts.map(c=>`<button data-c="${c}">${PLACES[c].n}</button>`).join('')}</div>
      <div class="msg" id="pm" role="status"></div></div>
      <div class="grid">${phoneHTML(got)}</div></div>`;
    ClassWatch.detail(()=>({q:'부품: '+p.n}));
    $$('.opts button',box).forEach(b=>b.onclick=async()=>{
      if(b.dataset.c===p.c){
        b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);
        got.push(p.id);$('.phone',box).outerHTML=phoneHTML(got);
        $('#pm',box).className='msg ok';$('#pm',box).textContent=`맞았어요! ${PLACES[p.c].n}의 ${p.n}이(가) 스마트폰에 들어갔어요.`;
        meRef('s1/got/'+p.id).set(true);
        await wait(900);
        i++;if(i<order.length)return draw();
        await meRef('s1').update({parts:true});
        ME.s1={...(ME.s1||{}),parts:true};s1Article();
      }else{
        b.classList.add('wrong');b.disabled=true;
        box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
        $('#pm',box).className='msg bad';$('#pm',box).textContent='단서를 다시 읽어 봐요. 지도의 위치도 떠올려요.';
        wrongCount('s1',p.id);
      }
    });
  };
  draw();
}
function s1Article(){
  if(ME.s1&&ME.s1.qz)return s1Write();
  wstep('기사 읽기');
  shell(`<div class="panel grid"><div class="row" style="justify-content:center">${phoneHTML(PARTS.map(p=>p.id))}</div>
   <p class="big" style="text-align:center;margin:0">스마트폰 한 대에 6나라가 힘을 모았어요!</p></div>
   <div class="panel quiz" id="qz"></div>`);
  runQuiz($('#qz'),S1Q,{band:'1단계 · 서로 기대어 사는 나라들',fig:emojiFig,
    pre:'',
    onWrong:q=>wrongCount('s1',q.id),
    onEnd:async()=>{await meRef('s1').update({qz:true});ME.s1={...ME.s1,qz:true};s1Write();}});
  // 2·3번 문제는 기사를 보며 풀어요
  const obs=new MutationObserver(()=>{const q=$('#qz .q');if(q&&/기사/.test(q.textContent)&&!$('#qz .article')){q.insertAdjacentHTML('beforebegin',ARTICLE);}});
  obs.observe($('#qz'),{childList:true,subtree:true});
  const q=$('#qz .q');if(q&&/기사/.test(q.textContent))q.insertAdjacentHTML('beforebegin',ARTICLE);
}
function s1Write(){
  wstep('관계 예상하기');
  shell(`<div class="panel grid"><div><span class="band">1단계 · 생각을 써요</span></div>${ARTICLE}
   <div class="fld grid"><label for="pred" style="font-family:var(--display);font-size:1.25rem">이런 협력으로 앞으로 두 나라의 관계는 어떻게 변할까요?</label>
    <input id="pred" maxlength="70" placeholder="예) 두 나라가 다른 분야에서도 함께 일하게 될 거예요." autocomplete="off"></div>
   <details><summary style="cursor:pointer;font-family:var(--display)">쓰기 어려우면 골라요</summary><div class="chips" style="margin-top:8px">${PRED_EASY.map(w=>`<button data-w="${esc(w)}" aria-pressed="false">${esc(w)}</button>`).join('')}</div></details>
   <div class="row"><button id="send" disabled>TV로 보내기</button></div></div>`);
  const chk=()=>{$('#send').disabled=$('#pred').value.trim().length<4;};
  $('#pred').oninput=chk;
  $$('.chips button').forEach(b=>b.onclick=()=>{$('#pred').value=b.dataset.w;$$('.chips button').forEach(x=>x.setAttribute('aria-pressed',x===b));chk();});
  $('#send').onclick=async()=>{
    $('#send').disabled=true;
    const pred=$('#pred').value.trim().slice(0,70);
    await meRef('s1').update({done:true,pred,at:Date.now()});
    ME.s1={...ME.s1,done:true,pred};drawSteps();s1Done();
  };
}
function s1Done(){
  wstep('끝');
  shell(`<div class="panel quiz pop"><div><span class="band">보냈어요!</span></div>
   <div class="big">“${esc(ME.s1.pred||'')}”</div>
   ${remember(['무역을 통해 여러 나라의 우수한 물자를 한데 모아 <b>새로운 제품</b>을 만들어요. (스마트폰)','여러 나라가 각자 <b>잘하는 분야</b>를 중심으로 협력해요. (우리나라 기술 + 인도네시아 광물)','이렇게 서로 기대어 함께 이익을 얻는 관계를 <b>상호 의존</b>이라고 해요.'])}
   <p class="muted">선생님이 2단계를 열면 나라들이 경쟁하는 모습을 살펴봐요.</p></div>`);
}

/* ---------- 2. 경쟁하기 ---------- */
function stage2(){
  const s=ME.s2||{};
  if(s.done)return s2Done();
  if(s.sorted)return s2Why();
  if(s.good)return s2Sort();
  s2Good();
}
function s2Good(){
  wstep('수출이 늘면');
  const pick=new Set();
  shell(`<div class="panel quiz" id="gb"><div><span class="band">2단계 · 왜 경쟁할까요?</span></div>
   <h2>수출이 늘어나면 우리나라에 어떤 점이 좋아질까요? 맞는 것을 <u>모두</u> 골라요</h2>
   <div class="multi">${shuffle(GOOD).map(g=>`<button data-g="${g.id}" aria-pressed="false">${esc(g.t)}</button>`).join('')}</div>
   <button id="chk" disabled>확인하기</button><div class="msg" id="gm" role="status"></div></div>`);
  ClassWatch.detail(()=>({q:'수출이 늘면 좋아지는 점 고르기'}));
  $$('.multi button').forEach(b=>b.onclick=()=>{const id=b.dataset.g;if(pick.has(id))pick.delete(id);else pick.add(id);b.setAttribute('aria-pressed',pick.has(id));b.classList.remove('wrong');$('#chk').disabled=!pick.size;});
  $('#chk').onclick=async()=>{
    const okIds=GOOD.filter(g=>g.ok).map(g=>g.id);
    const bad=[...pick].filter(id=>!okIds.includes(id)), miss=okIds.filter(id=>!pick.has(id));
    if(!bad.length&&!miss.length){
      $$('.multi button').forEach(b=>{b.disabled=true;if(pick.has(b.dataset.g))b.classList.add('right');});$('#chk').disabled=true;
      $('#gm').className='msg ok';$('#gm').textContent='맞았어요! 그래서 세계 여러 나라는 수출을 늘리려고 서로 경쟁해요.';
      await meRef('s2').update({good:true});ME.s2={...(ME.s2||{}),good:true};
      await wait(1600);if(cur===2)s2Sort();
    }else{
      bad.forEach(id=>$(`.multi button[data-g="${id}"]`).classList.add('wrong'));
      const gb=$('#gb');gb.classList.remove('shake');void gb.offsetWidth;gb.classList.add('shake');
      $('#gm').className='msg bad';$('#gm').textContent=bad.length?'빨간 것은 좋아지는 점이 아니에요. 다시 골라요.':`좋아지는 점이 ${miss.length}개 더 있어요.`;
      wrongCount('s2','good');
    }
  };
}
function s2Sort(){
  wstep('경쟁 카드 나누기');
  const order=shuffle(CARDS.map(c=>c.id));let i=0;const placed={tech:[],build:[],port:[]};
  shell(`<div class="panel quiz" id="sb"></div>`);
  const box=$('#sb');
  const draw=()=>{
    const c=CN[order[i]];
    box.innerHTML=`<div><span class="band">2단계 · 어떤 경쟁일까요? (교과서 107쪽)</span></div>
     <div class="prog">${order.map((_,k)=>`<span class="${k<i?'on':k===i?'cur':''}"></span>`).join('')}</div>
     <div class="clue pop"><div class="e" aria-hidden="true">${c.e}</div><div style="font-size:1.25rem">${esc(c.t)}</div></div>
     <div class="comp">${Object.entries(COMP).map(([k,v])=>`<button data-k="${k}"><span aria-hidden="true">${v.e}</span>${v.n}</button>`).join('')}</div>
     <div class="msg" id="sm" role="status"></div>
     <div class="cols" style="width:100%;text-align:left">${Object.entries(COMP).map(([k,v])=>`<div class="${k}"><h3>${v.e} ${v.n}</h3><div class="cards">${placed[k].map(id=>`<div>${CN[id].e} ${esc(CN[id].t)}</div>`).join('')}</div></div>`).join('')}</div>`;
    ClassWatch.detail(()=>({q:'카드: '+c.t}));
    $$('.comp button',box).forEach(b=>b.onclick=async()=>{
      if(b.dataset.k===c.k){
        $$('.comp button',box).forEach(z=>z.disabled=true);b.classList.add('right');
        placed[c.k].push(c.id);
        $('#sm',box).className='msg ok';$('#sm',box).textContent='맞았어요!';
        await wait(650);
        i++;if(i<order.length)return draw();
        await meRef('s2').update({sorted:true});ME.s2={...ME.s2,sorted:true};s2Why();
      }else{
        b.disabled=true;b.classList.add('wrong');
        box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
        $('#sm',box).className='msg bad';$('#sm',box).textContent='무엇을 하려고 경쟁하는지 다시 읽어 봐요. 새 기술? 다른 나라에 짓기? 무역을 편하게?';
        wrongCount('s2',c.id);
      }
    });
  };
  draw();
}
function s2Why(){
  wstep('까닭');
  shell(`<div class="panel quiz" id="qz"></div>`);
  runQuiz($('#qz'),S2Q,{band:'2단계 · 왜 경쟁할까요?',fig:emojiFig,onWrong:q=>wrongCount('s2',q.id),
    onEnd:async()=>{await meRef('s2').update({done:true,at:Date.now()});ME.s2={...ME.s2,done:true};drawSteps();s2Done();}});
}
function s2Done(){
  wstep('끝');
  shell(`<div class="panel quiz pop"><div><span class="band">2단계 끝!</span></div>
   <div class="cols" style="width:100%;text-align:left">${Object.entries(COMP).map(([k,v])=>`<div class="${k}"><h3>${v.e} ${v.n}</h3><div class="cards">${CARDS.filter(c=>c.k===k).map(c=>`<div>${c.e} ${esc(c.t)}</div>`).join('')}</div></div>`).join('')}</div>
   ${remember(['세계 여러 나라는 물자나 서비스를 수출하여 더 많은 이익을 얻으려고 서로 <b>경쟁</b>해요.','첨단 기술 개발, 다른 나라 시설 건설, 더 나은 무역 환경 만들기 같은 분야에서 경쟁해요.'])}
   <p class="muted">선생님이 3단계를 열면 관세 실험실에 들어가요.</p></div>`);
}

/* ---------- 3. 관세 실험실 ---------- */
function stage3(){
  const s=ME.s3||{};
  if(s.done)return s3Done();
  if(s.post)return s3Opinion();
  if(s.sim)return s3Post();
  if(s.pre)return s3Sim();
  s3Pre();
}
function s3Pre(){
  wstep('관세 알기');
  shell(`<div class="panel quiz" id="qz"></div>`);
  runQuiz($('#qz'),S3PRE,{band:'3단계 · 관세 실험실 준비',fig:emojiFig,onWrong:q=>wrongCount('s3',q.id),
    onEnd:async()=>{await meRef('s3').update({pre:true});ME.s3={...(ME.s3||{}),pre:true};s3Sim();}});
}
function s3Sim(){
  const s=ME.s3||{};const hist=s.hist?Object.values(s.hist):[];
  const year=hist.length, c=year?hist[year-1].nc:STEEL.start;
  if(year>=STEEL.years)return s3Result();
  wstep(`철강 ${year+1}년차`);
  let t=s.lastT??30;

function steelSummary(s){
  const hist=s.hist?Object.values(s.hist):[];
  const last=hist[hist.length-1]||{nc:STEEL.start,t:0};
  const burden=hist.reduce((a,y)=>a+y.burden,0);
  const ok=last.nc<=STEEL.imp;
  return {hist,final:last.nc,burden,ok,lastT:last.t};
}
