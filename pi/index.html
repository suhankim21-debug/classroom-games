<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>원주율 연구소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* Same classroom notice-board look as 우리말 지킴이 so the class sees one family of tools. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .4em;font-size:1rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}
.quiz{text-align:center;display:grid;gap:14px;justify-items:center}
.quiz .q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.2rem;padding:.9em .5em;line-height:1.3}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
}
.fig{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--coral2);line-height:1.25}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.5em .9em;font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.roll svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--cream);color:var(--ink);border:1px solid var(--line);padding:.35em .8em;font-family:var(--text);font-size:1rem;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:grid;gap:6px}
.fld label{font-family:var(--display);font-size:1.1rem}
.unit{display:flex;align-items:center;gap:8px}
.unit span{font-family:var(--display)}
.meter{position:relative;height:46px;background:var(--cream);border-radius:10px;margin:26px 0 8px}
.meter .band3{position:absolute;top:0;bottom:0;background:#DDEBE1}
.meter .mk{position:absolute;top:-24px;transform:translateX(-50%);font-family:var(--display);font-size:.95rem;white-space:nowrap}
.meter .ln{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.meter .dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--coral2);transform:translate(-50%,-50%);border:3px solid #fff}
.list{display:grid;gap:8px}
.list div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px}
.list div.out{border-left-color:var(--gold)}
.list b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
.emoji{font-size:clamp(3rem,10vw,4.5rem);line-height:1}
.score{font-family:var(--display);font-size:1.3rem}
/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,15em) 1fr 3.5em;gap:10px;align-items:center}
.bar .track{height:34px;border-radius:10px;background:var(--cream);overflow:hidden}
.bar .track div{height:100%;background:var(--ok);border-radius:10px}
.bar span{font-family:var(--display);font-size:1.1rem}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:2.6em 9em 1fr 5em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 12px}
.rank .r b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--coral2)}
.rank .r .nm{font-family:var(--display);font-size:1.25rem}
.rank .r .pt{font-family:var(--display);font-size:1.4rem;text-align:right;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.6rem}
.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:1.1rem}
.tbl th,.tbl td{background:#fff;padding:.45em .6em;text-align:center}
.tbl thead th{background:var(--coral);color:#fff;font-family:var(--display);font-weight:400}
.tbl tbody th{font-family:var(--display);font-weight:400;color:var(--coral2)}
.tbl tr.outr td,.tbl tr.outr th{background:#FFF4DF}
.okc{color:var(--ok);font-family:var(--display);font-size:1.3rem;font-weight:400}
.chart svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
@media (max-width:820px){
  .hero,.tv,.two{grid-template-columns:1fr}
  .choose,.opts{grid-template-columns:1fr}
  .steps button{font-size:.85rem}
  .rank .r{grid-template-columns:2.2em 1fr 4.5em}.rank .r .trk{display:none}
}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><i>π</i> 원주율 연구소</div><small id="sub"></small></div></header>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
const FIREBASE_CONFIG = {

  messagingSenderId: "433158756735",

};
const STAGES=[null,
  {k:'수레바퀴',t:'수레바퀴 굴리기',tm:6},
  {k:'원주율 재기',t:'우리 반 원주율 재기',tm:10},
  {k:'원주율 알기',t:'원주율 알기',tm:4},

const WHEELS=[{id:'ga',nm:'가',d:5},{id:'na',nm:'나',d:7}];
// 3단계: 원주율 개념 확인 (교과서 111쪽 개념 확인, ③ 소고)
const CONCEPT=[
  {e:'⭕',q:'원의 지름에 대한 원주의 비율을 무엇이라고 할까요?',a:'원주율',o:['반지름','원의 중심','지름']},
  {e:'🧮',q:'원주율을 구하는 식은?',a:'(원주) ÷ (지름)',o:['(지름) ÷ (원주)','(원주) × (지름)','(원주) − (지름)']},
  {e:'⚖️',q:'큰 원과 작은 원의 원주율을 비교하면?',a:'크기와 상관없이 같아요',o:['큰 원이 더 커요','작은 원이 더 커요','원마다 달라요']},
  {e:'♾️',q:'원주율을 소수로 나타내면?',a:'3.1415926…처럼 끝없이 이어져요',o:['3.14에서 끝나요','3에서 끝나요','3.5에서 끝나요']},
  {e:'🥁',q:'소고의 지름은 21 cm, 원주는 66 cm예요. 원주율을 반올림하여 소수 둘째 자리까지 나타내면?',a:'3.14',o:['3.13','3.15','3.1']}];
// 4단계 원주율 대결 (계산기를 써도 돼요)
const GAME=[
  {id:'g1',e:'🥫',q:'원주 19.8 cm, 지름 6.3 cm인 음료수 캔의 원주율은? (반올림하여 소수 둘째 자리)',a:'3.14',o:['3.13','3.15','3.2']},
  {id:'g2',e:'🍽️',q:'원주 56.5 cm, 지름 18 cm인 접시의 원주율은? (반올림하여 소수 둘째 자리)',a:'3.14',o:['3.13','3.15','3.18']},
  {id:'g3',e:'🕰️',q:'원주 62.7 cm, 지름 20 cm인 시계의 원주율은? (반올림하여 소수 둘째 자리)',a:'3.14',o:['3.13','3.135','3.1']},
  {id:'g4',e:'🛞',q:'원주 31.4 cm, 지름 10 cm인 바퀴의 원주율은?',a:'3.14',o:['0.314','31.4','314']},
  {id:'g5',e:'✏️',q:'3.1428…을 반올림하여 소수 둘째 자리까지 나타내면?',a:'3.14',o:['3.15','3.1','3.143']},
  {id:'g6',e:'✏️',q:'3.1472…를 반올림하여 소수 둘째 자리까지 나타내면?',a:'3.15',o:['3.14','3.1','3.147']},
  {id:'g7',e:'🪙',q:'원주 7.5 cm, 지름 2.4 cm인 동전의 원주율은? (반올림하여 소수 둘째 자리)',a:'3.13',o:['3.12','3.14','3.2']},
  {id:'g8',e:'⭕',q:'원주 220 cm, 지름 70 cm인 훌라후프의 원주율은? (반올림하여 소수 둘째 자리)',a:'3.14',o:['3.13','3.15','3.2']},
  {id:'g9',e:'⚖️',q:'지름이 10 cm인 원과 20 cm인 원의 원주율을 비교하면?',a:'같아요',o:['지름 20 cm인 원이 2배예요','지름 10 cm인 원이 더 커요','알 수 없어요']},
  {id:'g10',e:'📘',q:'원주율에 대한 설명으로 옳은 것은?',a:'원주를 지름으로 나눈 값이에요',o:['지름을 원주로 나눈 값이에요','원의 넓이를 나타내요','반지름의 2배예요']},
  {id:'g11',e:'📏',q:'친구들이 구한 원주율이 3.12, 3.16처럼 조금씩 다른 까닭은?',a:'재는 과정에서 오차가 생겨서',o:['원마다 원주율이 달라서','계산기마다 달라서','원이 작아서']},
  {id:'g12',e:'🚲',q:'원주는 지름의 약 몇 배일까요?',a:'약 3.14배',o:['약 2배','약 4배','약 3.5배']}];
const GQ=Object.fromEntries(GAME.map(g=>[g.id,g]));
const OBJS=['컵','테이프','물병 뚜껑','풀 뚜껑','동전','시계','접시','쓰레기통'];

const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=x=>String(Math.round(x*10)/10);
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function withTimeout(pr,ms=10000){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),ms))]);}
function showError(e){
  const m=String(e&&(e.code||e.message)||e);
  let why='알 수 없는 오류가 났어요.';
  if(/permission/i.test(m)) why='Firebase 데이터베이스의 <b>규칙</b>이 막고 있어요. Realtime Database → 규칙 탭을 확인해 주세요.';
  else if(/TIMEOUT/.test(m)) why='Firebase 서버에 10초 동안 연결되지 않았어요. 학교 인터넷이 Firebase를 막고 있을 수 있어요.';
  $('#sub').textContent='연결 문제';
  app.innerHTML=`<div class="panel grid"><h2 style="color:var(--bad)">서버에 연결하지 못했어요</h2><p>${why}</p><p class="muted">오류 내용: <code>${esc(m)}</code></p><div class="row"><button id="retry">다시 시도</button><button class="ghost" id="home">처음으로</button></div></div>`;
  $('#retry').onclick=()=>location.reload(); $('#home').onclick=()=>{location.hash='';startView();};
}
window.addEventListener('unhandledrejection',ev=>showError(ev.reason));
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.database();
const roomRef=c=>db.ref('rooms/'+c);
const params=new URLSearchParams(location.search);
let ROOM=params.get('room')||'';
let offs=[];const clearOffs=()=>{offs.forEach(f=>f());offs=[];};
function listen(ref,cb){const h=ref.on('value',cb);offs.push(()=>ref.off('value',h));}

const r1=x=>Math.round(x*10)/10, r2=x=>Math.round(x*100+1e-9)/100;
const f2=x=>r2(x).toFixed(2);

/* ---------- 그림 ---------- */
/* 수레바퀴 굴리기: 가(지름 5 cm)·나(지름 7 cm)를 자 위에 한 바퀴 굴려 원주를 재요 */
function mountWheel(el,{onRoll}={}){
  const W=880,S=34,X0=30,BY=270,MAX=24;
  let w=WHEELS[0],busy=false;
  el.innerHTML=`<div class="grid roll"><div class="row"><span style="font-family:var(--display)">수레바퀴 고르기</span><div class="seg" id="wsel">${WHEELS.map(x=>`<button data-w="${x.id}" aria-pressed="${x===w}">${x.nm} (지름 ${x.d} cm)</button>`).join('')}</div><button id="rollgo">한 바퀴 굴리기 ▶</button></div>
    <svg viewBox="0 0 ${W} 330" role="img" aria-label="수레바퀴 굴리기"><g id="axis"></g><line id="trace" x1="${X0}" y1="${BY}" x2="${X0}" y2="${BY}" stroke="#E0704F" stroke-width="8" stroke-linecap="round"/><g id="wheel"></g><g id="lab"></g></svg>
    <div class="msg" id="rollmsg" role="status">수레바퀴를 고르고 <b>한 바퀴 굴리기</b>를 눌러요. 빨간 선이 굴러간 거리, 곧 <b>원주</b>예요.</div></div>`;
  let ax='';for(let c=0;c<=MAX;c++){const x=X0+c*S;ax+=`<line x1="${x}" y1="${BY}" x2="${x}" y2="${BY+(c%5?8:14)}" stroke="#453422" stroke-width="2"/>${c%2?'':`<text x="${x}" y="${BY+32}" text-anchor="middle" font-size="15" fill="#6D4215">${c}</text>`}`;}
  $('#axis',el).innerHTML=`<rect x="${X0-8}" y="${BY}" width="${MAX*S+16}" height="44" rx="6" fill="#DCEBF2"/>${ax}<text x="${X0+MAX*S}" y="${BY+56}" text-anchor="end" font-size="14" fill="#8A7458">(cm)</text>`;
  const draw=dist=>{
    const r=w.d/2*S,cx=X0+dist,cy=BY-r,th=dist/r;
    let sp='';for(let k=0;k<8;k++){const a=th+k*Math.PI/4;sp+=`<line x1="${cx}" y1="${cy}" x2="${cx+r*.9*Math.cos(a)}" y2="${cy+r*.9*Math.sin(a)}" stroke="#8B5A2B" stroke-width="4"/>`;}
    const px=cx-r*Math.sin(th),py=cy+r*Math.cos(th);
    $('#wheel',el).innerHTML=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#F7E8C2" fill-opacity=".7" stroke="#8B5A2B" stroke-width="7"/>${sp}<circle cx="${cx}" cy="${cy}" r="9" fill="#8B5A2B"/><circle cx="${px}" cy="${py}" r="8" fill="#E0704F"/>`;
    $('#trace',el).setAttribute('x2',X0+dist);
  };
  const reset=()=>{draw(0);$('#lab',el).innerHTML='';};
  reset();
  $$('#wsel button',el).forEach(b=>b.onclick=()=>{if(busy)return;w=WHEELS.find(x=>x.id===b.dataset.w);$$('#wsel button',el).forEach(x=>x.setAttribute('aria-pressed',x===b));reset();$('#rollmsg',el).innerHTML='<b>한 바퀴 굴리기</b>를 눌러요.';});
  $('#rollgo',el).onclick=()=>{
    if(busy)return;busy=true;$('#rollgo',el).disabled=true;$('#lab',el).innerHTML='';
    const C=Math.PI*w.d*S,dur=RM?0:2600,t0=performance.now();
    const step=now=>{
      const p=dur?Math.min(1,(now-t0)/dur):1;draw(C*p);
      if(p<1)return requestAnimationFrame(step);
      const c=r1(Math.PI*w.d);
      $('#lab',el).innerHTML=`<text x="${X0+C/2}" y="${BY-w.d*S-14}" text-anchor="middle" font-size="22" fill="#E0704F" font-family="Jua">원주 약 ${c.toFixed(1)} cm</text>`;
      busy=false;$('#rollgo',el).disabled=false;
      $('#rollmsg',el).innerHTML=`수레바퀴 <b>${w.nm}</b>: 지름 <b>${w.d} cm</b>, 한 바퀴 굴러간 거리(원주) <b>약 ${c.toFixed(1)} cm</b>`;
      if(onRoll)onRoll(w,c);
    };
    requestAnimationFrame(step);
  };
}
function piLine(vals,{big}={}){
  // 원주율 수직선 2.8 ~ 3.5, 같은 값은 위로 쌓아요
  const W=820,H=big?250:170,L=40,R=40,lo=2.8,hi=3.5,base=H-50;
  const sx=v=>L+(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(W-L-R);
  let g=`<rect x="${sx(3.1)}" y="16" width="${sx(3.2)-sx(3.1)}" height="${base-16}" fill="#DDEBE1"/>`;
  for(let k=0;k<=70;k++){const v=lo+k/100,x=sx(v),maj=k%10===0;
    g+=`<line x1="${x}" y1="${base}" x2="${x}" y2="${base+(maj?14:k%5?5:9)}" stroke="#453422" stroke-width="${maj?2:1}"/>${maj?`<text x="${x}" y="${base+34}" text-anchor="middle" font-size="16" fill="#6D4215">${(lo+k/100).toFixed(1)}</text>`:''}`;}
  g+=`<line x1="${L}" y1="${base}" x2="${W-R}" y2="${base}" stroke="#453422" stroke-width="2"/>`;
  g+=`<line x1="${sx(Math.PI)}" y1="10" x2="${sx(Math.PI)}" y2="${base}" stroke="#3D6E8C" stroke-width="2" stroke-dasharray="6 4"/><text x="${sx(Math.PI)+6}" y="26" font-size="16" fill="#3D6E8C" font-family="Jua">3.14…</text>`;
  const stack={};
  g+=vals.map(m=>{const k=f2(m.v);stack[k]=(stack[k]||0)+1;const y=base-12-(stack[k]-1)*20;const out=m.v<lo||m.v>hi;
    return `<circle cx="${sx(m.v)}" cy="${y}" r="9" fill="${out?'#E9B04F':'#E0704F'}" stroke="#fff" stroke-width="2"><title>${esc(m.t||'')} ${k}</title></circle>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="원주율 수직선" style="width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)">${g}</svg>`;
}

function stage1(){

    $('#wt').innerHTML=`<h2>계산기로 (원주) ÷ (지름)을 구해 <u>소수 첫째 자리</u>까지 써요</h2>

     </tbody></table><div class="msg" id="wm" role="status"></div>
     ${done?`<div class="rules"><b>발견!</b> 수레바퀴의 크기가 달라도 원주는 지름의 <b>약 3.1배</b>예요. 선생님이 2단계를 열면 교실의 물건을 직접 재어 봐요.</div>`:

/* ---------- 4. 원주율 대결 ---------- */
async function stage4(){
  if(ME.game&&ME.game.done)return gameDone();
  let G=ME.game;
  if(!G||!G.order){
    G={order:shuffle(GAME.map(g=>g.id)),i:0,score:0,started:Date.now()};
    await roomRef(me.room).child('students/'+me.num+'/game').set(G);ME.game=G;
  }
  if(cur!==4)return;
  const rest=G.order.slice(G.i||0).map(id=>GQ[id]).filter(Boolean);
  shell(`<div class="panel quiz" id="gz"></div>`);
  if(!rest.length)return finishGame();
  let score=G.score||0,idx=G.i||0;
  onMe=()=>drawSteps();
  runQuiz($('#gz'),rest,{band:'4단계 · 원주율 대결',fig:q=>`<div class="emoji" aria-hidden="true">${q.e}</div>`,
    progress:()=>`<div class="score">점수 <b id="sc">${score}</b>점 · ${idx+1}/${GAME.length}번째 문제</div>`,
    onRight:async(q,ok,sec)=>{
      // 계산 문제가 있어 빠르기 보너스는 25초까지 천천히 줄어요
      const pts=ok?100+Math.round(50*Math.max(0,Math.min(1,1-(sec-5)/20))):0;
      score+=pts;idx++;
      await roomRef(me.room).child('students/'+me.num+'/game').update({i:idx,score});
      ME.game={...ME.game,i:idx,score};
      return pts?` +${pts}점`:' (두 번째 도전은 점수 없이 넘어가요)';
    },
    onWrong:q=>{roomRef(me.room).child(`students/${me.num}/game/wrong/${q.id}`).transaction(v=>(v||0)+1);},
    onEnd:finishGame});
}
async function finishGame(){
  await roomRef(me.room).child('students/'+me.num+'/game').update({done:true,at:Date.now()});
  ME.game={...ME.game,done:true};drawSteps();gameDone();
}
async function gameDone(){
  const G=ME.game||{};
  let rankTxt='';
  if(ROOMV.award){
    const all=(await roomRef(me.room).child('students').get()).val()||{};
    const L=ranking(all);const k=L.findIndex(x=>x.n===me.num);
    if(k>=0)rankTxt=`<div class="big">우리 반 ${k+1}등!</div>`;
  }
  if(cur!==4)return;
  shell(`<div class="panel quiz pop"><div><span class="band">대결 끝</span></div><h2 style="font-size:2rem">원주율 연구 완료!</h2>
   <div class="score" style="font-size:2rem">${G.score||0}점</div>${rankTxt}${CONCEPT_CARD}
   <p class="muted">${ROOMV.award?'TV에서 시상식을 봐요!':'TV에서 시상식을 기다려요.'}</p></div>`);
}
function ranking(all){
  return Object.keys(all||{}).map(Number).map(n=>({n,...all[n]})).filter(x=>x.game)
    .sort((a,b)=>(b.game.score||0)-(a.game.score||0)||(b.game.i||0)-(a.game.i||0)||(a.game.at||9e15)-(b.game.at||9e15));
}

      const open=await withTimeout(roomRef(code).child('open').get());
      if(!open.exists()){$('#jm').textContent='방 번호를 다시 확인해요.';return chk();}
      const r=await withTimeout(roomRef(code).child('students/'+p.num).transaction(c=>c?undefined:{name:p.name,joinedAt:Date.now()},undefined,false));
      if(!r.committed){const c=r.snapshot.val();
        if(!(c&&c.name===p.name)){$('#jm').textContent=`${p.num}번은 이미 "${c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}}
    }catch(e){$('#jm').textContent='연결 문제: '+(e.code||e.message);return chk();}
    ROOM=code;me={room:code,num:p.num,name:p.name};store('pi-student',me);
    history.replaceState(null,'','?room='+code);
    enterRoom();
  };
}
function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app});ClassWatch.who(me.num,me.name);
  $('#sub').textContent=`${me.num}번 ${me.name}`;
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  let ready=false;ROOMV={};onMe=null;
  listen(roomRef(me.room).child('students/'+me.num),s=>{
    const v=s.val();
    if(!v){store('pi-student',null);me=null;clearOffs();return joinView();}
    ME=v;
    if(!ready){ready=true;if(ROOMV.stage){cur=ROOMV.stage;renderStage();}return;}
    if(typeof onMe==='function')onMe();
  });
  listen(roomRef(me.room).child('stage'),s=>{
    const st=s.val()||1;const was=ROOMV.stage;ROOMV.stage=st;
    if(!ready)return;
    if(was!==st){cur=st;renderStage();} else drawSteps();
  });
  listen(roomRef(me.room).child('award'),s=>{ROOMV.award=!!s.val();if(ready&&cur===4&&ME.game&&ME.game.done)gameDone();});
}
function stepDone(n){return n===1?!!(ME.wheel&&ME.wheel.done):n===2?!!ME.measured:n===3?!!(ME.concept&&ME.concept.done):!!(ME.game&&ME.game.done);}
function drawSteps(){
  const el=$('#steps');if(!el)return;
  el.innerHTML=[1,2,3,4].map(n=>`<button data-s="${n}" ${n>ROOMV.stage?'disabled':''} ${n===cur?'aria-current="step"':''} class="${stepDone(n)?'done':''}"><b>${n}</b>${STAGES[n].k}${stepDone(n)?' ✓':''}</button>`).join('');
  $$('#steps button').forEach(b=>b.onclick=()=>{cur=+b.dataset.s;renderStage();});
}
function shell(inner){
  if(subOff){subOff();subOff=null;}
  app.innerHTML=`<div class="grid"><nav class="steps" id="steps" aria-label="활동 단계"></nav>${inner}<div style="text-align:right"><button class="ghost" id="relog" style="font-size:.85rem;padding:.4em .8em">다른 이름으로 들어가기</button></div></div>`;
  $('#relog').onclick=()=>{store('pi-student',null);me=null;clearOffs();joinView();};
  drawSteps();
}
let subOff=null;
function renderStage(){
  ClassWatch.step(STAGES[cur].k,{n:cur,total:4,wait:stepDone(cur)});
  onMe=()=>drawSteps();
  if(cur===1)return stage1();
  if(cur===2)return stage2();
  if(cur===3)return stage3();
  return stage4();
}
// 차례로 문제를 내고, 맞혀야 다음으로 넘어가요
function runQuiz(box,qs,{band,title,fig,onRight,onWrong,onEnd,progress}){
  let i=0,missed=false;
  const draw=()=>{
    const q=qs[i];const opts=shuffle([q.a,...q.o]);missed=false;const t0=Date.now();
    box.innerHTML=`<div><span class="band">${band}</span></div>${title?`<h2>${title}</h2>`:''}
     <div class="prog">${qs.map((_,k)=>`<span class="${k<i?'on':k===i?'cur':''}"></span>`).join('')}</div>
     ${progress?progress():''}<div class="pop" style="width:100%">${fig?fig(q):''}</div><div class="q">${esc(q.q)}</div>
     <div class="opts">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
     <div class="msg" id="qm" role="status"></div>`;
    $$('.opts button',box).forEach(b=>b.onclick=async()=>{
      if(b.dataset.o===q.a){
        b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);
        $('#qm',box).className='msg ok';
        const extra=onRight?await onRight(q,!missed,(Date.now()-t0)/1000,i):'';
        $('#qm',box).textContent='맞았어요!'+(extra||'');
        await new Promise(r=>setTimeout(r,650));
        i++;if(i<qs.length)return draw();
        onEnd();
      }else{
        missed=true;b.classList.add('wrong');b.disabled=true;
        box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
        $('#qm',box).className='msg bad';$('#qm',box).textContent='다시 골라 봐요';
        if(onWrong)onWrong(q);
      }
    });
  };
  draw();
}

/* ---------- teacher ---------- */
let tick=null,RD={};
async function teacherView(){
  clearOffs();
  $('#sub').textContent='선생님 화면 · 연결 중';
  app.innerHTML='<div class="panel grid" style="text-align:center"><h2>방을 만드는 중이에요…</h2></div>';

    if(!code||!(await withTimeout(roomRef(code).child('open').get())).exists()){
      code=String(Math.floor(1000+Math.random()*9000));

    <div class="panel qr"><h2>태블릿으로 접속</h2><div id="qrbox"></div><div>방 번호 <span class="roomcode">${code}</span></div><p class="muted" style="word-break:break-all;font-size:.75rem;margin:0">${esc(url)}</p></div>
    <div class="panel grid"><div class="timer" id="tm">5:00</div><div class="row" style="justify-content:center"><button class="ghost" id="minus" aria-label="1분 줄이기">－1</button><button id="go">시작</button><button class="ghost" id="plus" aria-label="1분 늘리기">＋1</button></div></div>
    <div class="panel grid"><h2>단계 열기</h2><div class="tsteps" id="tsteps"></div></div>
    <div class="panel grid"><div class="row" style="justify-content:space-between"><h2>참여</h2><span class="muted" id="cnt"></span></div><div class="people" id="ppl"></div></div>
    <div class="row"><button class="ghost" id="newroom">새 방</button><button class="ghost" id="home">처음으로</button></div>
   </div>
   <div class="grid" id="main"></div></div>`;
  if(window.QRCode){try{new QRCode($('#qrbox'),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
  const ref=roomRef(code);
  listen(ref,s=>{RD=s.val()||{};renderTV();});
  const tm=()=>RD.timer||{min:5,left:300,endAt:0};
  $('#minus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.max(1,t.min-1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#plus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.min(20,t.min+1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#go').onclick=()=>{const t=tm();if(t.endAt)ref.child('timer').set({min:t.min,left:Math.max(0,Math.round((t.endAt-Date.now())/1000)),endAt:0});else{const l=t.left>0?t.left:t.min*60;ref.child('timer').set({min:t.min,left:l,endAt:Date.now()+l*1000});}};
  $('#newroom').onclick=()=>{store('pi-teacher-room',null);teacherView();};
  $('#home').onclick=()=>{location.hash='';startView();};
  clearInterval(tick);tick=setInterval(renderTime,250);
}
function setStage(n){roomRef(ROOM).update({stage:n,timer:{min:STAGES[n].tm,left:STAGES[n].tm*60,endAt:0}});}
function renderTime(){
  const el=$('#tm');if(!el)return clearInterval(tick);
  const t=RD.timer||{min:5,left:300,endAt:0};
  const left=t.endAt?Math.max(0,Math.round((t.endAt-Date.now())/1000)):t.left;
  el.textContent=left===0&&t.endAt?'시간 끝!':`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  el.classList.toggle('end',!!t.endAt&&left===0);
  $('#go').textContent=t.endAt?'멈춤':'시작';$('#minus').disabled=$('#plus').disabled=!!t.endAt;
}
const students=()=>{const s=RD.students||{};return Object.keys(s).map(Number).sort((a,b)=>a-b).map(n=>({n,...s[n]}));};
let tvStage=0;
function renderTV(){
  const main=$('#main');if(!main)return;
  const st=RD.stage||1, S=students();
  $('#tsteps').innerHTML=[1,2,3,4].map(n=>`<button data-s="${n}" ${n===st?'aria-current="step"':''}><b>${n}</b> ${STAGES[n].t}</button>`).join('');
  $$('#tsteps button').forEach(b=>b.onclick=()=>setStage(+b.dataset.s));
  const doneIn=x=>st===1?!!(x.wheel&&x.wheel.done):st===2?!!x.measured:st===3?!!(x.concept&&x.concept.done):!!(x.game&&x.game.done);
  $('#cnt').textContent=`${S.length}명 · 이 단계 끝 ${S.filter(doneIn).length}명`;
  $('#ppl').innerHTML=S.map(x=>`<span class="${doneIn(x)?'ok':''}">${x.n} ${esc(x.name)}</span>`).join('')||'<span class="muted" style="background:none">아직 아무도 없어요</span>';
  const changed=tvStage!==st;tvStage=st;
  if(st===1)return tv1(main,S,changed);
  if(st===2)return tv2(main);
  if(st===3)return tv3(main,S);
  return tv4(main,S);
}
function tv1(main,S,changed){
  const done=S.filter(x=>x.wheel&&x.wheel.done);
  if(changed||!$('#tvroll')){
    main.innerHTML=`<div class="panel grid"><h2 style="font-size:1.8rem">수레바퀴 굴리기 (교과서 110쪽)</h2><div id="tvroll"></div></div>
     <div class="two"><div class="panel grid"><h2>수레바퀴 가·나</h2>
       <table class="tbl"><thead><tr><th>수레바퀴</th><th>원주(cm)</th><th>지름(cm)</th><th>(원주) ÷ (지름)</th></tr></thead><tbody>
       ${WHEELS.map(x=>`<tr><th>${x.nm}</th><td>약 ${r1(Math.PI*x.d).toFixed(1)}</td><td>${x.d}</td><td><button class="ghost" data-rv="${x.id}" style="padding:.2em .8em">보기</button></td></tr>`).join('')}</tbody></table>
       <p class="muted" style="margin:0">교과서에서 잰 값: 가 15.5 cm ÷ 5 cm, 나 21.7 cm ÷ 7 cm → 둘 다 약 3.1</p></div>
      <div class="panel grid"><h2>발견한 친구</h2><div id="tv1stat"></div></div></div>`;
    mountWheel($('#tvroll'));
    $$('[data-rv]').forEach(b=>b.onclick=()=>{const x=WHEELS.find(w=>w.id===b.dataset.rv);b.outerHTML=`<b class="okc">${r1(r1(Math.PI*x.d)/x.d).toFixed(1)}</b>`;});
  }
  $('#tv1stat').innerHTML=`<p class="big">${done.length} / ${S.length}명</p><p>수레바퀴 크기가 달라도 원주는 지름의 <b>약 3.1배</b>예요.</p><div class="people">${S.map(x=>`<span class="${x.wheel&&x.wheel.done?'ok':''}">${x.n} ${esc(x.name)}</span>`).join('')}</div>`;
}
function tv2(main){
  const M=Object.values(RD.measures||{}).sort((a,b)=>a.at-b.at);
  const near=M.filter(m=>m.p>=3.05&&m.p<=3.25);
  const avg=near.length?near.reduce((s,m)=>s+m.c/m.d,0)/near.length:0;
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">우리 반이 구한 원주율</h2><span class="muted" id="t2cnt">${M.length}개 · 3.1과 3.2 사이 ${M.filter(m=>m.p>=3.1&&m.p<3.2).length}개</span></div>
    ${piLine(M.map(m=>({v:m.p,t:m.obj})),{big:true})}
    <div class="row" style="justify-content:space-between"><p class="muted" style="margin:0">점 하나가 물건 하나예요. 크기가 다른 물건인데 점들이 어디에 모였나요?</p>
     ${near.length?`<p class="big" style="margin:0;font-size:1.6rem">우리 반 평균 약 <span id="t2avg">${f2(avg)}</span></p>`:''}</div></div>
   <div class="two"><div class="panel grid"><h2>잰 물건</h2><table class="tbl"><thead><tr><th>물건</th><th>지름</th><th>원주</th><th>원주율</th><th>누가</th></tr></thead><tbody>
     ${M.slice().reverse().map(m=>{const ok=m.p>=3.05&&m.p<=3.25;return `<tr class="${ok?'':'outr'}"><th>${esc(m.obj)}</th><td>${fmt(m.d)}</td><td>${fmt(m.c)}</td><td><b>${f2(m.p)}</b></td><td class="muted">${esc(m.n)} ${esc(m.name)}</td></tr>`;}).join('')||'<tr><td colspan="5" class="muted">아직 없어요</td></tr>'}</tbody></table></div>
    <div class="rules"><b>함께 이야기해요</b><ul><li>모두 3.14가 나오지 않은 까닭은 무엇일까요?</li><li>어떻게 재면 더 정확해질까요?</li><li>원이 커지면 원주율도 커지나요?</li></ul></div></div>`;
}
function tv3(main,S){
  const done=S.filter(x=>x.concept&&x.concept.done);
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">원주율</h2><span class="muted">${done.length}/${S.length}명 끝</span></div>
    <div class="big" style="text-align:center">원의 지름에 대한 원주의 비율 = <u>원주율</u></div>
    <p style="text-align:center;font-family:var(--display);font-size:2rem;margin:.2em 0">(원주율) = (원주) ÷ (지름)</p>
    <p style="text-align:center;font-family:var(--display);font-size:2.6rem;color:var(--blue);margin:0;letter-spacing:.04em">3.1415926535897932…</p>
    <p style="text-align:center;margin:0">끝없이 이어져서 <b>약 3.14</b>로 어림하여 써요.</p></div>
   <div class="panel grid"><h3>한 번에 맞힌 친구</h3><div class="bars">${CONCEPT.map((w,k)=>{const c=done.filter(x=>x.concept.right&&x.concept.right[k]).length;
      return `<div class="bar"><span>${w.e} ${esc(w.a)}</span><div class="track"><div style="width:${done.length?c/done.length*100:0}%"></div></div><span>${c}명</span></div>`;}).join('')}</div></div>`;
}
function tv4(main,S){
  const L=ranking(RD.students);
  const wrong={};S.forEach(x=>Object.entries((x.game&&x.game.wrong)||{}).forEach(([k,v])=>wrong[k]=(wrong[k]||0)+v));
  const hard=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>({q:GQ[k],v})).filter(x=>x.q);
  const top=Math.max(1,...L.map(x=>x.game.score||0));
  if(RD.award){
    const p=[L[1],L[0],L[2]];
    main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:2rem">원주율 대결 시상식</h2><button class="ghost" id="awoff">순위표로</button></div>
     <div class="podium">${p.map((x,k)=>x?`<div class="p${[2,1,3][k]} pop"><b>${[2,1,3][k]}등</b><span>${esc(x.n)} ${esc(x.name)}</span>${x.game.score||0}점</div>`:'<span></span>').join('')}</div></div>
     ${hard.length?`<div class="panel grid"><h2>우리 반이 가장 많이 틀린 문제</h2><div class="list">${hard.map(h=>`<div><b>${h.q.e}</b>${esc(h.q.q)}<br>정답: <b>${esc(h.q.a)}</b> <span class="muted">(틀린 횟수 ${h.v})</span></div>`).join('')}</div></div>`:''}`;
    $('#awoff').onclick=()=>roomRef(ROOM).child('award').set(false);
    return;
  }
  main.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">원주율 대결</h2><button id="awon">시상식 ▶</button></div>
   <p class="muted" style="margin:0">계산기를 써도 돼요. 한 번에 맞히면 100점 + 빠르기 보너스 최대 50점. 틀리면 다시 골라야 넘어가요. ${GAME.length}문제.</p>
   <div class="rank">${L.map((x,k)=>`<div class="r"><b>${k+1}</b><span class="nm">${esc(x.n)} ${esc(x.name)}${x.game.done?' 🏁':''}</span><div class="bar trk" style="display:block"><div class="track"><div style="width:${(x.game.score||0)/top*100}%;background:var(--coral)"></div></div></div><span class="pt">${x.game.score||0}</span></div>`).join('')||'<p class="muted">아직 시작한 친구가 없어요</p>'}</div></div>
   <div class="rules"><b>약속</b><ul><li>친구 화면은 보지 않아요.</li><li>소리 지르지 않고, 다 푼 친구는 조용히 기다려요.</li></ul></div>`;
  $('#awon').onclick=()=>roomRef(ROOM).child('award').set(true);
}

/* ---------- route ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
