<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지구촌 탐험대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --gold:#E9B04F;
  --say:#3D6E8C; --write:#B5652F;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input,textarea{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:10px;padding:0 .35em}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 80px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:var(--card);color:var(--muted);border:2px solid var(--line);padding:.55em .3em;font-size:.98rem;line-height:1.2}
.steps button b{display:block;font-size:1.3rem}
.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}
.steps button.done:not([aria-current="step"]){color:var(--ok);border-color:var(--ok)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
/* 고르기 */
.quiz{display:grid;gap:14px;justify-items:center;text-align:center}
.q{font-family:var(--display);font-size:clamp(1.4rem,4vw,1.9rem);line-height:1.3}
.opts{display:grid;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:3px solid var(--line);font-size:1.2rem;padding:.75em .8em;line-height:1.35;text-align:left;font-family:var(--text);font-weight:700}
.opts.two{grid-template-columns:1fr 1fr}.opts.two button{text-align:center;font-family:var(--display);font-weight:400;font-size:1.4rem}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.card{display:grid;justify-items:center;gap:6px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:16px 22px;width:min(560px,100%)}
.card .em{font-size:3.6rem;line-height:1.1}
.card b{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,4vw,1.9rem);line-height:1.3}
/* teacher */
.tv{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.tsteps{display:grid;gap:8px}
.tsteps button{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.tsteps button[aria-current="step"]{background:var(--coral);color:#fff;border-color:var(--coral)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display)}
.people span.ok{background:var(--ok);color:#fff}
.cmp{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:1.05rem}
.cmp th{font-family:var(--display);font-weight:400;text-align:center;padding:4px 8px;color:var(--muted)}
.cmp td{background:#fff;padding:6px 10px;text-align:center}
.cmp td:first-child{border-radius:12px 0 0 12px;text-align:left;font-family:var(--display)} .cmp td:last-child{border-radius:0 12px 12px 0}
.cmp tr.avg td{background:var(--cream);font-family:var(--display)}
.cmp small{display:block;color:var(--muted);font-size:.85rem}
.wall{display:grid;gap:8px}
.wall div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px;font-size:1.1rem}
.wall b{font-family:var(--display);font-weight:400;color:var(--coral2);margin-right:8px}
.qrate{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.qrow.low{border-color:var(--bad);background:#FFF5F2}
.qrow .qb{display:grid;grid-template-columns:minmax(0,1fr) 3.6em;gap:2px 8px;align-items:center;width:100%}
.qrow .qb .track{width:100%;height:14px;border-radius:999px;background:var(--cream);overflow:hidden}
.qrow .qb .track div{height:100%;background:var(--ok);border-radius:999px}
.qrow.low .qb .track div{background:var(--bad)}
.qrow .pc{font-family:var(--display);font-size:1.3rem}
.qrow.low .pc{color:var(--bad)}
.rank{display:grid;gap:6px}
.rank div{display:grid;grid-template-columns:2.4em 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:6px 12px;font-family:var(--display);font-size:1.2rem}
.podium{display:flex;gap:14px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.podium div{background:#fff;border:3px solid var(--gold);border-radius:16px;padding:14px 20px;text-align:center;font-family:var(--display);min-width:150px}
.podium .p1{font-size:1.6rem;padding-block:26px}
.livecap{background:#111;color:#fff;font-weight:700;font-size:clamp(1.8rem,4vw,2.8rem);border-radius:14px;padding:16px 22px;min-height:2.6em;text-align:center}
/* 잡지 편집실 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:#fff;color:var(--ink);border:2px solid var(--line);font-family:var(--text);font-weight:700;font-size:1rem;padding:.4em .8em;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
.easy .chips button{font-size:1.2rem;padding:.6em 1em}
.field{display:grid;gap:6px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.field>label{font-family:var(--display);font-size:1.2rem}
.field.need>label::after{content:' *';color:var(--coral2)}
.field.miss{border-color:var(--bad)}
.ex{font-size:.92rem;color:var(--muted)}
.plan{display:grid;gap:8px;background:#F3ECFA;border:3px solid #B9A3D6;border-radius:16px;padding:14px}
.plan h3{font-size:1.5rem;text-align:center}
.plan .pp{background:#fff;border:2px dashed #C9779B;border-radius:12px;padding:6px 12px}
.plan .pp b{font-family:var(--display);font-weight:400;color:#9B4F72;display:block;font-size:.95rem}
.check{display:grid;gap:8px}
.check button{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);font-family:var(--text);font-weight:700}
.check button::before{content:'';flex:none;width:1.4em;height:1.4em;border-radius:6px;border:2px solid var(--line)}
.check button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
.check button[aria-pressed="true"]::before{content:'✓';display:grid;place-items:center;background:var(--ok);border-color:var(--ok);color:#fff}
.preview{max-width:100%;max-height:60vh;border-radius:12px;border:3px solid var(--line);display:block;margin:0 auto}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gal .it{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;display:grid;gap:6px;text-align:center;font-family:var(--display);color:var(--ink)}
.gal .it img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--cream)}
.gal .it .noimg{aspect-ratio:3/4;border-radius:10px;background:#F3ECFA;display:grid;place-items:center;padding:8px;font-size:1.05rem}
.gal button.it{font-size:1rem}
.gal .it.seen{border-color:var(--ok)}
.stk{font-size:1.1rem}
.stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stickers button{background:#fff;color:var(--ink);border:3px solid var(--gold);font-size:1.05rem;line-height:1.3;padding:.7em .4em}
.stickers button b{display:block;font-size:2rem}
.stickers button.given{background:var(--gold);color:#fff}
.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.awards div{background:#fff;border:3px solid var(--gold);border-radius:16px;padding:12px;text-align:center;display:grid;gap:6px;font-family:var(--display)}
.awards img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.awards .em{font-size:2.6rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cards .plan{padding:10px;font-size:.98rem}.cards .plan h3{font-size:1.25rem}
.bars{display:grid;gap:6px}
.bars div{display:grid;grid-template-columns:8em 1fr 2em;gap:8px;align-items:center;font-family:var(--display)}
.bars i{display:block;height:16px;border-radius:999px;background:var(--blue)}
.people button{background:var(--cream);color:var(--ink);border-radius:999px;padding:.2em .8em;font-size:1rem}
.people button.ok{background:var(--ok);color:#fff}
/* 스파이를 찾아라 */
.teams{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.teams button{background:#fff;color:var(--ink);border:3px solid var(--line);font-size:1.4rem;padding:1em .2em}
.teams button[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
.topic{display:grid;gap:4px;justify-items:center;text-align:center;background:#2F3A4A;color:#fff;border-radius:18px;padding:14px 18px}
.topic .em{font-size:2.6rem;line-height:1.1}
.topic b{font-family:var(--display);font-weight:400;font-size:1.6rem}
.topic small{opacity:.85}
.scard{display:grid;gap:8px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px}
.scard.spy{border-color:#2F3A4A;background:#EEF1F6}
.scard h3{font-size:1.25rem}
.scard textarea{min-height:3.4em;resize:vertical}
.facts{display:grid;gap:6px}
.facts button{background:#FFFDF7;color:var(--ink);border:2px dashed var(--line);font-family:var(--text);font-weight:700;font-size:1rem;text-align:left;padding:.5em .8em;line-height:1.4}
.facts button.used{border-style:solid;border-color:var(--ok);color:var(--ok)}
.vote{display:grid;gap:10px;width:100%}
.vote button{display:grid;grid-template-columns:2.2em 1fr;gap:10px;align-items:center;background:#fff;color:var(--ink);border:3px solid var(--line);font-family:var(--text);font-weight:700;font-size:1.2rem;text-align:left;line-height:1.4;padding:.8em}
.vote button span{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--coral2)}
.vote button[aria-pressed="true"]{border-color:var(--coral);background:#FFF1EA}
.vote button.right{border-color:var(--ok);background:#E3F1E7}
.vote button.wrong{border-color:var(--bad);background:#F6E1DB}
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.board .bc{background:#fff;border:4px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:2em 1fr;gap:12px;align-items:start;font-size:1.55rem;line-height:1.45;font-weight:700}
.board .bc>span{font-family:var(--display);font-weight:400;font-size:2.2rem;color:var(--coral2);line-height:1}
.board .bc small{display:block;font-size:1rem;font-weight:400;color:var(--muted)}
.board .bc .vt{display:block;font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--blue)}
.board .bc.spy{border-color:var(--bad);background:#FFF1EC}
.board .bc.spy>span{color:var(--bad)}
.board .bc.truth{border-color:var(--ok)}
.board .bc .fix{display:block;margin-top:6px;font-size:1.15rem;color:var(--ok)}
.score{font-family:var(--display);font-size:1.3rem}
@media (max-width:820px){.teams{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:1fr}}
/* 지구촌 탐험대 */
.wmap{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;background:#BFE3F2;border:3px solid #8CC4DC;border-radius:22px;overflow:hidden}
.wmap button{position:absolute;display:grid;place-items:center;align-content:center;gap:2px;background:#9FD18B;color:#2F4A22;border:3px solid #7DB36A;border-radius:38%;font-size:clamp(.85rem,2.2vw,1.15rem);padding:2px;line-height:1.15}
.wmap button span{font-size:clamp(1.3rem,4vw,2.2rem)}
.wmap button:disabled{opacity:.35}
.wmap button.right{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.wmap button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.say{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#fff;border:3px solid #6FB7D6;border-radius:22px;padding:12px 16px;text-align:left;width:min(760px,100%)}
.say .face{font-size:3rem;line-height:1}
.say p{margin:0;font-size:1.15rem;font-weight:700}
.bag{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--display)}
.bag span{background:var(--cream);border-radius:999px;padding:.15em .7em}
.bag span.no{color:var(--muted)}
.cands{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
.cands button{display:grid;gap:4px;background:#fff;color:var(--ink);border:3px solid var(--line);font-family:var(--text);font-weight:700;font-size:1.05rem;text-align:left}
.cands button b{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--coral2)}
.cands button.right{border-color:var(--ok);background:#E3F1E7}
.cands button.wrong{border-color:var(--bad);background:#F6E1DB}
.hint{margin:0;background:#FFF4DF;border-radius:10px;padding:6px 12px}
.qcard{display:grid;gap:4px;background:#fff;border:3px solid var(--blue);border-radius:16px;padding:12px 16px}
.qcard b{font-family:var(--display);font-weight:400;font-size:1.5rem}
.qcard small,.qlist small,.qwall small{color:var(--muted)}
.qlist{display:grid;gap:8px}
.qlist button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:#fff;color:var(--ink);border:2px solid var(--line);font-family:var(--text);font-weight:700;font-size:1.1rem;text-align:left}
.qlist button small{grid-column:1/-1;font-weight:400}
.qlist button span{grid-row:1/3;grid-column:2;font-size:1.6rem;align-self:center}
.qlist button[aria-pressed="true"]{border-color:var(--gold);background:#FFF6E0}
.qwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.qwall div{display:grid;gap:4px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px}
.qwall div.best{border-color:var(--gold);background:#FFF6E0}
.qwall b{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.35}
.qwall span{font-family:var(--display);color:var(--coral2)}
.bars.wide div{grid-template-columns:minmax(10em,22em) 1fr 2em}
.bars.wide span{font-size:1rem}
@media (max-width:640px){.cands{grid-template-columns:1fr}.bars.wide div{grid-template-columns:1fr 5em 2em}}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><i>🌏</i> 지구촌 탐험대</div><small id="sub"></small></div></header>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCSSwT67k7lXoYDz4qsmHHDRXUqTS0Zh14",
  authDomain: "classroom-games-7ae7d.firebaseapp.com",
  databaseURL: "https://classroom-games-7ae7d-default-rtdb.asia-southeast1.firebasedatabase.app",

  storageBucket: "classroom-games-7ae7d.firebasestorage.app",
  messagingSenderId: "433158756735",
  appId: "1:433158756735:web:254d9b0b2e36502b4de24a"
};
const APP='globe';
const STAGES=[null,
  {k:'두영이 찾기',t:'단원 미션: 두영이를 찾아라 (교과서 120~121쪽)',tm:8},
  {k:'공부할 내용',t:'공부할 내용 찾아 쓰기 (교과서 122~123쪽)',tm:6},
  {k:'탐구 질문',t:'중요 단어 → 탐구 질문 만들기 (교과서 123쪽)',tm:9},
  {k:'맛보기 퀴즈',t:'지구촌 맛보기 퀴즈',tm:5}];
const NS=4;
/* 대륙 (지도 단추 위치: 왼쪽·위·너비·높이 %) */
const CONT=[
  {id:'na',n:'북아메리카',e:'🗽',x:4,y:6,w:27,h:38},
  {id:'sa',n:'남아메리카',e:'🦜',x:17,y:50,w:17,h:42},
  {id:'eu',n:'유럽',e:'🏰',x:41,y:6,w:15,h:24},
  {id:'af',n:'아프리카',e:'🦁',x:40,y:34,w:19,h:48},
  {id:'as',n:'아시아',e:'🐼',x:58,y:4,w:34,h:46},
  {id:'oc',n:'오세아니아',e:'🦘',x:73,y:60,w:21,h:28}];
const CN=id=>(CONT.find(c=>c.id===id)||{}).n||id;

function showError(e){
  const m=String(e&&(e.code||e.message)||e);
  let why='알 수 없는 오류가 났어요.';
  if(/permission/i.test(m)) why='Firebase 데이터베이스의 규칙이 막고 있어요.';
  else if(/TIMEOUT/.test(m)) why='Firebase 서버에 10초 동안 연결되지 않았어요. 학교 인터넷이 Firebase를 막고 있을 수 있어요.';
  $('#sub').textContent='연결 문제';
  app.innerHTML=`<div class="panel grid"><h2 style="color:var(--bad)">서버에 연결하지 못했어요</h2><p>${why}</p><p class="muted">오류 내용: <code>${esc(m)}</code></p><div class="row"><button id="retry">다시 시도</button></div></div>`;
  $('#retry').onclick=()=>location.reload();
}
window.addEventListener('unhandledrejection',ev=>{if(ev.reason&&(ev.reason.code||ev.reason.message))showError(ev.reason);});

let me=null, RV={stage:0}, ME={}, cur=1, busy=false, STU={}, STARS={};
function parseName(s){const m=String(s).trim().match(/^(\d{1,2})\s*[번.]?\s*(.+)$/);return m?{num:+m[1],name:m[2].trim()}:null;}
function joinView(){
  clearOffs();
  const saved=store(APP+'-student');
  if(saved&&ROOM&&saved.room===ROOM){me=saved;return enterRoom();}
  $('#sub').textContent='학생 화면';
  ClassWatch.student({db,room:ROOM,root:app,gate:true});ClassWatch.step('들어가기');
  app.innerHTML=`<div class="grid" style="max-width:560px;margin:0 auto">
   <div class="panel grid"><h2>방 번호</h2><input id="rm" inputmode="numeric" maxlength="4" placeholder="TV에 보이는 4자리" value="${esc(ROOM)}"></div>
   <div class="panel grid"><h2>"번호 이름"을 써요</h2><input id="nm" placeholder="예) 7 김민수" autocomplete="off"></div>
   <div class="msg bad" id="jm" role="status"></div>
   <div class="row"><button id="enter" disabled>들어가기</button></div></div>`;
  const chk=()=>{$('#enter').disabled=!(/^\d{4}$/.test($('#rm').value)&&parseName($('#nm').value));};
  $('#rm').oninput=chk;$('#nm').oninput=chk;
  ClassWatch.joinForm();
  $('#enter').onclick=async()=>{
    const code=$('#rm').value, p=parseName($('#nm').value);
    $('#enter').disabled=true;
    try{
      const open=await withTimeout(roomRef(code).child('open').get());
      if(!open.exists()){$('#jm').textContent='방 번호를 다시 확인해요.';return chk();}
      const r=await withTimeout(roomRef(code).child('students/'+p.num).transaction(c=>c?undefined:{name:p.name,joinedAt:Date.now()},undefined,false));
      if(!r.committed){const c=r.snapshot.val();
        if(!(c&&c.name===p.name)){$('#jm').textContent=`${p.num}번은 이미 "${c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}}
    }catch(e){$('#jm').textContent='연결 문제: '+(e.code||e.message);return chk();}
    ROOM=code;me={room:code,num:p.num,name:p.name};store(APP+'-student',me);
    history.replaceState(null,'','?room='+code);
    enterRoom();
  };
}
function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app,gate:true});ClassWatch.who(me.num,me.name);
  $('#sub').textContent=`${me.num}번 ${me.name}`;
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  let ready=false;RV={stage:0};
  const R=roomRef(me.room);
  listen(R.child('students/'+me.num),s=>{
    const v=s.val();
    if(!v){store(APP+'-student',null);me=null;clearOffs();return joinView();}
    const easyWas=ME.easy;ME=v;
    $('#sub').textContent=`${me.num}번 ${me.name}${ME.easy?' · 🌟':''}`;
    if(!ready){ready=true;if(RV.stage){cur=RV.stage;renderStage();}return;}
    if(!!easyWas!==!!ME.easy&&!busy){renderStage();return;}
    drawSteps();
  });
  listen(R.child('stage'),s=>{
    const st=s.val()||1;const was=RV.stage;RV.stage=st;
    if(!ready)return;
    if(was!==st){cur=st;renderStage();} else drawSteps();
  });
  listen(R.child('students'),s=>{const was=qsig();STU=s.val()||{};if(ready&&cur===3&&stepDone(3)&&qsig()!==was)starView();});
  listen(R.child('stars'),s=>{STARS=s.val()||{};});
}
const qsig=()=>Object.keys(STU).map(n=>n+':'+((STU[n].s3||{}).q||'')).join('|');
const meRef=()=>roomRef(me.room).child('students/'+me.num);
function stepDone(n){return !!(ME['s'+n]&&ME['s'+n].done);}
function drawSteps(){
  const el=$('#steps');if(!el)return;
  el.innerHTML=Array.from({length:NS},(_,i)=>i+1).map(n=>`<button data-s="${n}" ${n>RV.stage?'disabled':''} ${n===cur?'aria-current="step"':''} class="${stepDone(n)?'done':''}"><b>${n}</b>${STAGES[n].k}${stepDone(n)?' ✓':''}</button>`).join('');
  $$('#steps button').forEach(b=>b.onclick=()=>{cur=+b.dataset.s;renderStage();});
}
function shell(inner){
  app.innerHTML=`<div class="grid${ME.easy?' easy':''}"><nav class="steps" id="steps" aria-label="활동 단계" style="grid-template-columns:repeat(${NS},1fr)"></nav>${inner}</div>`;
  drawSteps();
}
const wstep=sub=>ClassWatch.step(STAGES[cur].k+(sub?' · '+sub:''),{n:cur,total:NS,wait:stepDone(cur)});
function renderStage(){
  busy=false;ClassWatch.detail(null);wstep();
  if(cur===1)return stage1();
  if(cur===2)return stage2();
  if(cur===3)return stage3();
  return stage4();
}

function rec(id,ok){
  if(!me||!id)return;
  if(ME.ans&&ME.ans[id]!==undefined)return;
  ME.ans={...(ME.ans||{}),[id]:ok};
  meRef().child('ans/'+id).transaction(v=>v===null?ok:undefined);
}
function pick(box,{id,q,a,o,onOk,top='',okMsg='맞았어요!'}){
  const opts=shuffle([a,...(ME.easy?o.slice(0,1):o)]);let first=true;
  box.innerHTML=`<div class="quiz">${top}<div class="q">${esc(q)}</div><div class="opts${ME.easy?' two':''}">${opts.map(x=>`<button data-o="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="msg" id="pm" role="status"></div></div>`;
  ClassWatch.detail(()=>({q:q}));
  $$('.opts button',box).forEach(b=>b.onclick=()=>{
    const ok=b.dataset.o===a;if(first){rec(id,ok);first=false;}
    if(ok){b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);$('#pm',box).className='msg ok';$('#pm',box).textContent=okMsg;setTimeout(onOk,RM?300:(okMsg.length>20?2200:900));}
    else{b.classList.add('wrong');b.disabled=true;$('#pm',box).className='msg bad';$('#pm',box).textContent='다시 생각해 봐요.';}
  });
}

/* ---------- 1. 두영이를 찾아라 ---------- */
const S1IDS=['c1','c2','c3','c4','d1','d2','d3'];

async function s1ok(id,extra){await meRef().child('s1/ok_'+id).set(true);ME.s1={...(ME.s1||{}),['ok_'+id]:true};if(extra)extra();else stage1();}

  const id=S1IDS[k];

        box.innerHTML=`<div class="quiz">${top2}<div class="card"><span class="em">${c.it}</span><b>단서를 얻었어요!</b><p style="margin:0">${esc(c.look)}<br>➡ 두영이도 <b>${esc(c.itn)}</b>을/를 가지고 있어요.</p></div><button id="next">다음 단서 ▶</button></div>`;
        $('#next').onclick=stage1;})});
  }else if(id==='d1'){
    mapPick(box,{id,a:'as',top,q:'단서를 다 모았어요! 두영이는 어느 대륙에 있을까요?',
      card:`<div class="say"><span class="face">🧑</span><p>세계에서 <b>인구가 가장 많은 대륙</b>에서 활동하고 있대요.</p></div>`,onOk:()=>s1ok(id)});

      <div class="cands">${list.map(x=>`<button data-k="${x.k}"><b>${x.k}</b>${x.its.map(t=>`<span>${esc(t)}</span>`).join('')}</button>`).join('')}</div><div class="msg" id="pm" role="status"></div></div>`;
    ClassWatch.detail(()=>({q:'두영이 후보 고르기'}));
    let first=true;
    $$('.cands button',box).forEach(b=>b.onclick=()=>{
      const ok=b.dataset.k==='가';if(first){rec(id,ok);first=false;}

      else{b.classList.add('wrong');b.disabled=true;$('#pm',box).className='msg bad';$('#pm',box).textContent='🎒 모은 단서와 하나씩 견주어 봐요.';}
    });
  }else{
    pick(box,{...DQ,top,onOk:()=>s1ok(id)});
  }
}
function s1Done(){
  wstep('끝');ClassWatch.detail(null);
  shell(`<div class="panel grid" style="text-align:center"><span class="band">1단계 끝</span><div class="topic"><span class="em">🧒🌳</span><b>두영이는 아시아 몽골에서 사람들과 나무를 심고 있어요!</b><small>🪏 삽 · 👕 지구촌 지킴이 티셔츠 · 👒 모자 · 🧤 장갑</small></div>

  wstep('질문 만들기');

    ${ME.easy?`<div class="field"><label>② 궁금한 질문을 하나 골라요</label><div class="vote" id="ez">${EASYQ.map((q,i)=>`<button data-i="${i}" aria-pressed="${d.q===q}"><span>${i+1}</span>${esc(q)}</button>`).join('')}</div></div>`:
    `<div class="field"><label for="q3">② 고른 단어로 내가 정말 궁금한 것을 질문으로 써요</label><textarea id="q3" rows="2" maxlength="80" placeholder="내 생각으로 써요">${esc(d.q||'')}</textarea><div id="tf3"></div></div>`}
    <div class="msg bad" id="fm" role="status"></div><div class="row"><button id="send">질문 올리기</button></div></div>`);
  const drawW=()=>$$('#wd button').forEach(b=>b.setAttribute('aria-pressed',W3.includes(b.dataset.w)));
  $$('#wd button').forEach(b=>b.onclick=()=>{const w=b.dataset.w;if(W3.includes(w))W3=W3.filter(x=>x!==w);else{if(W3.length>=2)W3.shift();W3.push(w);}drawW();});
  $('#add').onclick=()=>{const v=$('#mine').value.trim().slice(0,12);if(!v)return;if(!W3.includes(v)){if(W3.length>=2)W3.shift();W3.push(v);}
    if(!$(`#wd button[data-w="${CSS.escape(v)}"]`)){const b=document.createElement('button');b.dataset.w=v;b.textContent=v;b.onclick=()=>{W3=W3.includes(v)?W3.filter(x=>x!==v):[...W3.slice(-1),v];drawW();};$('#wd').appendChild(b);}
    $('#mine').value='';drawW();};
  let ezq=d.q||'';
  $$('#ez button').forEach(b=>b.onclick=()=>{ezq=EASYQ[+b.dataset.i];$$('#ez button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  const tf=ME.easy?{level:()=>0}:ThinkFirst.mount($('#tf3'),{key:me.room+'-'+me.num+'-globe3',wait:40,
    hints:[`<ul><li>고른 두 단어는 서로 어떤 관계일까요?</li><li>그 단어를 보면 <b>왜? 어디? 어떻게? 누가?</b> 가운데 무엇이 가장 궁금해요?</li><li>우리 생활이나 우리나라와 이어지는 점은 없을까요?</li></ul>`,
      `<p style="margin:4px 0">눌러서 넣고 <b>…</b> 자리를 내 말로 채워요.</p><div class="chips">${STARTS.map(s=>`<button type="button" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>`],

  listen(ref,s=>{RD=s.val()||{};renderTV();});
  const tm=()=>RD.timer||{min:3,left:180,endAt:0};
  $('#minus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.max(1,t.min-1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#plus').onclick=()=>{const t=tm();if(!t.endAt){const m=Math.min(30,t.min+1);ref.child('timer').set({min:m,left:m*60,endAt:0});}};
  $('#go').onclick=()=>{const t=tm();if(t.endAt)ref.child('timer').set({min:t.min,left:Math.max(0,Math.round((t.endAt-now())/1000)),endAt:0});else{const l=t.left>0?t.left:t.min*60;ref.child('timer').set({min:t.min,left:l,endAt:now()+l*1000});if(RD.go!==true)ref.child('go').set(true);}};
  $('#newroom').onclick=()=>{store(APP+'-teacher-room',null);teacherView();};
  $('#home').onclick=()=>{location.hash='';startView();};
  clearInterval(tick);tick=setInterval(renderTime,250);
}
function setStage(n){tvAward=false;roomRef(ROOM).update({stage:n,go:false,timer:{min:STAGES[n].tm,left:STAGES[n].tm*60,endAt:0}});}
function renderTime(){
  const el=$('#tm');if(!el)return clearInterval(tick);
  const t=RD.timer||{min:3,left:180,endAt:0};
  const left=t.endAt?Math.max(0,Math.round((t.endAt-now())/1000)):t.left;
  el.textContent=left===0&&t.endAt?'시간 끝!':`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  el.classList.toggle('end',!!t.endAt&&left===0);
  const waitSt=RD.go!==true;
  $('#go').textContent=t.endAt?'멈춤':waitSt?'▶ 활동 시작':'시작';
  const gs=$('#gostat');if(gs){gs.textContent=waitSt?'학생들은 대기 중이에요. 설명을 마치면 [▶ 활동 시작]을 눌러요.':`${RD.stage||1}단계 활동이 열려 있어요.`;gs.className='msg '+(waitSt?'bad':'ok');}
  $('#minus').disabled=$('#plus').disabled=!!t.endAt;
}
const students=()=>{const s=RD.students||{};return Object.keys(s).map(Number).sort((a,b)=>a-b).map(n=>({n,...s[n]}));};
function renderTV(){
  const main=$('#main');if(!main)return;
  const st=RD.stage||1, S=students();
  $('#tsteps').innerHTML=Array.from({length:NS},(_,i)=>i+1).map(n=>`<button data-s="${n}" ${n===st?'aria-current="step"':''}><b>${n}</b> ${STAGES[n].t}</button>`).join('');
  $$('#tsteps button').forEach(b=>b.onclick=()=>setStage(+b.dataset.s));
  const doneIn=x=>!!(x['s'+st]&&x['s'+st].done);
  $('#cnt').textContent=`${S.length}명 · 이 단계 끝 ${S.filter(doneIn).length}명`;
  $('#ppl').innerHTML=S.map(x=>`<button data-ez="${x.n}" class="${doneIn(x)?'ok':''}">${x.n} ${esc(x.name)}${x.easy?' 🌟':''}</button>`).join('')||'<span class="muted">아직 아무도 없어요</span>';
  $$('#ppl button').forEach(b=>b.onclick=()=>{const n=b.dataset.ez;roomRef(ROOM).child('students/'+n+'/easy').set(!(RD.students[n]||{}).easy||null);});
  const html=st===1?tv1(S):st===2?tv2(S):st===3?tv3(S):tv4(S);
  if(html!==lastMain){main.innerHTML=html;lastMain=html;}
  const bind=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f;};
  bind('award',()=>{tvAward=!tvAward;lastMain='';renderTV();});
  bind('namesT',()=>{showNames=!showNames;lastMain='';renderTV();});
  $('#tvq').innerHTML=quizBox(S,st);
  bind('wrongT',()=>{showWrong=!showWrong;renderTV();});
  bind('allT',()=>{tvAll=!tvAll;renderTV();});
}
function tv1(S){
  const P=S.filter(x=>x.s1);
  const fin=P.filter(x=>x.s1.done).sort((a,b)=>a.s1.done-b.s1.done);
  return `<div class="panel grid"><h2 style="font-size:1.8rem">🌏 단원 미션: 두영이를 찾아라 (교과서 120~121쪽)</h2>
    <div class="rules"><b>미션</b><ul><li>① 지도 속 사람들의 모습을 살펴봐요.</li><li>② 네 사람이 있는 곳을 지도에서 찾고, 태블릿에서 대륙을 눌러요.</li><li>③ 네 사람의 이야기와 맞는 두영이를 찾아 교과서에 ○표 해요.</li></ul></div>
    <div class="rank">${P.map(x=>`<div><span>${x.s1.done?'✓':'…'}</span><span>${x.n} ${esc(x.name)}</span><span>${CLUES.map(c=>x.s1['ok_'+c.id]?c.it:'▫️').join(' ')}${x.s1.ok_d2?' 🧒':''}</span></div>`).join('')||'<p class="muted">아직 없어요</p>'}</div>
    ${fin.length?`<p class="score" style="margin:0">🔍 두영이를 찾은 순서: ${fin.map((x,i)=>`${i+1}. ${x.n} ${esc(x.name)}`).join(' · ')}</p>`:''}</div>`;
}
function tv2(S){
  const cnt={};S.forEach(x=>{const l=(x.s2||{}).like;if(l)cnt[l]=(cnt[l]||0)+1;});
  const mx=Math.max(1,...Object.values(cnt));
  return `<div class="panel grid"><h2 style="font-size:1.8rem">📖 이 단원에서 공부할 내용 (교과서 122~123쪽)</h2>
    <p style="margin:0">교과서 빈칸을 먼저 쓰고 태블릿으로 확인해요. 정답은 PPT에서 하나씩 공개해요.</p>
    <h3>✓ 우리 반이 가장 기대하는 내용 (${Object.values(cnt).reduce((a,b)=>a+b,0)}명)</h3>
    <div class="bars wide">${TOPIC.map(t=>`<div><span>${t.e} ${esc(t.t)}</span><i style="width:${(cnt[t.id]||0)/mx*100}%"></i><b>${cnt[t.id]||0}</b></div>`).join('')}</div></div>`;
}
function starCount(){const c={};Object.values(RD.stars||{}).forEach(m=>Object.keys(m||{}).forEach(n=>c[n]=(c[n]||0)+1));return c;}
function tv3(S){
  const c=starCount();
  const Q=S.filter(x=>x.s3&&x.s3.q).sort((a,b)=>(c[b.n]||0)-(c[a.n]||0)||a.n-b.n);
  return `<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">❓ 우리 반 탐구 질문 (${Q.length}개)</h2><button class="ghost" id="namesT">${showNames?'이름 가리기':'이름 보기'}</button></div>
    <p style="margin:0">⭐가 많은 질문부터 보여요. 이 질문들을 단원을 공부하며 하나씩 해결해 봐요.</p>
    <p class="muted" style="margin:0" id="tfsum">${ThinkFirst.summary(Q.filter(x=>!x.easy).map(x=>x.s3.hint))}</p>
    <div class="qwall">${Q.map((x,i)=>`<div class="${i<3&&c[x.n]?'best':''}"><small>${esc((x.s3.words||[]).join(', '))}${showNames?` · ${x.n} ${esc(x.name)}${x.s3.hint?' · '+ThinkFirst.tag(x.s3.hint):''}`:''}</small><b>${esc(x.s3.q)}</b><span>⭐ ${c[x.n]||0}</span></div>`).join('')||'<p class="muted">아직 없어요</p>'}</div></div>`;
}
function tv4(S){
  const P=S.filter(x=>x.s4).map(x=>({x,sc:QZ.filter(q=>x.ans&&x.ans[q.id]===true).length,n:QZ.filter(q=>x.s4['ok_'+q.id]).length,t:x.s4.done||9e15})).sort((a,b)=>b.sc-a.sc||b.n-a.n||a.t-b.t);
  const btn=`<button class="ghost" id="award">${tvAward?'진행 보기':'🏆 시상식'}</button>`;
  if(tvAward){const top=P.slice(0,3);
    return `<div class="panel grid" style="text-align:center"><div class="row" style="justify-content:flex-end">${btn}</div><h2 style="font-size:2.2rem">🏆 지구촌 탐험대 시상식</h2>
      <div class="podium">${[1,0,2].map(i=>top[i]?`<div class="p${i+1}">${['🥇','🥈','🥉'][i]}<br>${top[i].x.n} ${esc(top[i].x.name)}<br>${top[i].sc}/${QZ.length}</div>`:'').join('')}</div>
      <div class="rank">${P.map((r,k)=>`<div><span>${k+1}</span><span>${r.x.n} ${esc(r.x.name)}</span><span>${r.sc}/${QZ.length}</span></div>`).join('')}</div></div>`;}
  return `<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">🌐 지구촌 맛보기 퀴즈</h2>${btn}</div>
    <div class="rank">${P.map((r,k)=>`<div><span>${r.x.s4.done?'✓':'…'}</span><span>${r.x.n} ${esc(r.x.name)}</span><span>${r.n}/${QZ.length} · 한 번에 ${r.sc}</span></div>`).join('')||'<p class="muted">아직 없어요</p>'}</div></div>`;
}
/* 문제별 정답률 + 틀린 학생 이름 (처음 답 기준) */
function quizBox(S,st){
  const AQ=QA();
  if(!tvAll&&!AQ.some(q=>q.st===st))return `<div class="panel row" style="justify-content:space-between"><span class="muted">이 단계에는 문제가 없어요.</span><button class="ghost" id="allT">퀴즈 정답률 보기</button></div>`;
  const R=AQ.filter(q=>tvAll||q.st===st).map(q=>{const no=AQ.filter(x=>x.st===q.st).indexOf(q)+1;
    const done=S.filter(x=>x.ans&&x.ans[q.id]!==undefined);const miss=done.filter(x=>x.ans[q.id]===false);const ok=done.length-miss.length;
    return {q,no,done:done.length,ok,miss,rate:done.length?Math.round(ok/done.length*100):null};})
    .sort((a,b)=>(a.rate??101)-(b.rate??101)||a.q.st-b.q.st||a.no-b.no);
  return `<div class="panel grid" id="qstat"><div class="row" style="justify-content:space-between"><h2>문제별 정답률 ${tvAll?'(모든 단계)':`(${st}단계)`}</h2><div class="row"><button class="ghost" id="allT">${tvAll?'이 단계만':'모든 단계 보기'}</button><button class="ghost" id="wrongT">${showWrong?'이름 가리기':'틀린 학생 이름 보기'}</button></div></div>
   <p class="muted" style="margin:0">처음 답한 것이 맞은 비율이에요. 낮은 문제부터 보여요.</p>
   <div class="qrate">${R.map(r=>`<div class="qrow${r.rate!==null&&r.rate<70?' low':''}" data-q="${r.q.id}">
     <div class="qt"><b>${r.q.st}-${r.no}</b> ${esc(r.q.q)}<br><small class="muted">정답: ${esc(r.q.a)}</small></div>
     <div class="qb"><div class="track"><div style="width:${r.rate||0}%"></div></div><span class="pc">${r.rate===null?'-':r.rate+'%'}</span><small class="muted">${r.ok}/${r.done}명</small></div>
     <div class="qw">${r.miss.length?`틀린 학생 <b>${r.miss.length}명</b>${showWrong?`: <span class="who">${r.miss.map(x=>`<span style="white-space:nowrap">${esc(x.n)} ${esc(x.name)}</span>`).join(', ')}</span>`:''}`:'<span class="muted">틀린 학생 없음</span>'}</div></div>`).join('')}</div></div>`;
}

/* ---------- route ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
</body></html>
