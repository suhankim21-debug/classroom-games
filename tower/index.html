<title>문장 탑 쌓기</title>

<style>body{margin:0}
/* Same classroom notice-board look as the other class games. Single light look by choice (classroom TV). */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --en:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input,textarea,select{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
textarea{font-family:var(--en);font-size:1rem;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:8px;width:1.4em;height:1.4em;display:grid;place-items:center;font-size:.9em}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul,.rules ol{margin:.3em 0 0;padding-left:1.3em}
.big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--coral2);line-height:1.25}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.5em .9em;font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.fld{display:grid;gap:6px}
.fld>label,.fld>.lb{font-family:var(--display);font-size:1.1rem}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
  .drop{animation:drop .5s cubic-bezier(.3,1.4,.6,1)} @keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
}
/* student */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.teams button{font-size:1.4rem;padding:.9em .4em;background:#fff;color:var(--ink);border:3px solid var(--line)}
.teams button span{display:block;font-size:2rem}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.levels button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.6em .4em;line-height:1.25;font-size:1rem}
.levels button b{display:block;font-size:1.1rem;color:var(--gold);letter-spacing:.05em}
.levels button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.card{display:grid;gap:14px;justify-items:center;text-align:center}
.pic{font-size:clamp(3.2rem,11vw,5rem);line-height:1}
.ti{width:1.3em;height:1.3em;vertical-align:-.3em;object-fit:contain}
.ti.big{width:2.4em;height:2.4em;display:block;margin:0 auto}
.ti.huge{width:min(160px,40vw);height:auto;aspect-ratio:1;display:block}
.snd{background:transparent;border:2px solid rgba(255,255,255,.5);color:#fff;padding:.2em .6em;font-size:1.1rem}
.count{position:fixed;inset:0;background:rgba(69,52,34,.82);display:grid;place-items:center;z-index:50;color:#fff;font-family:var(--display);font-size:clamp(6rem,30vw,16rem)}
.fever{background:linear-gradient(90deg,#E0704F,#E9B04F);color:#fff;font-family:var(--display);text-align:center;border-radius:12px;padding:.3em .8em;font-size:1.25rem}

 .confetti{position:fixed;top:-20px;z-index:60;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}}

.thumb{width:2.2em;height:1.65em;object-fit:cover;border-radius:4px;vertical-align:middle}
.ko{font-family:var(--display);font-size:clamp(1.3rem,4vw,1.8rem);line-height:1.35}
.en{font-family:var(--en);font-weight:800;font-size:clamp(1.3rem,4vw,1.9rem);line-height:1.6;color:var(--ink);letter-spacing:.01em}

.towers{display:grid;gap:12px;align-items:end;background:linear-gradient(#FFFDF7,#F7E8C2);border:2px solid var(--line);border-radius:18px;padding:14px 14px 0}
.tw{display:grid;justify-items:center;align-content:end;gap:4px;min-width:0}
.tw .cnt{font-family:var(--display);font-size:clamp(1.4rem,3vw,2.2rem);font-variant-numeric:tabular-nums}

.tw .crown{font-size:1.8rem;height:1.2em}
.feed{display:grid;gap:6px}
.feed div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:6px 12px;font-family:var(--display);font-size:1.1rem}
.feed div em{font-style:normal;color:var(--muted);font-family:var(--text);font-size:.95rem}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.6rem}
.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}
.stars{display:grid;gap:8px}
.stars div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:8px 12px}
.stars div b{font-family:var(--display);font-weight:400;font-size:1.2rem;color:var(--coral2)}
.preview{max-height:260px;overflow:auto;display:grid;gap:4px;font-size:.95rem}
.preview div{background:#fff;border-radius:8px;padding:4px 10px}
.preview div .s{font-family:var(--en);font-weight:800}
.preview div u{text-decoration-color:var(--coral);text-decoration-thickness:3px}
@media (max-width:820px){
  .hero,.tv{grid-template-columns:1fr}
  .choose{grid-template-columns:1fr}
  .levels button{font-size:.9rem}
}

const TEAM_ICONS=['🐯','🐰','🐻','🦊','🐼','🐸'];
const TEAM_IMG=['tiger','rabbit','bear','fox','panda','frog'];
// 조 마스코트 그림 (Codex로 그림). 그림을 못 불러오면 이모지로 보여요

const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const shuffle=(a,r=Math.random)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 문장 다루기 ---------- */
function parseSet(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split('|').map(x=>x.trim());
    let pic='',ko='',en='';
    if(p.length>=3){[pic,ko,en]=p;} else if(p.length===2){[ko,en]=p;} else return null;
    en=en.replace(/\s+/g,' ');
    if(!/[A-Za-z]/.test(en))return null;
    if(!/\[[^\]]+\]/.test(en)){ // 빈칸 표시가 없으면 가장 긴 낱말을 빈칸으로
      const ws=en.match(/[A-Za-z']+/g)||[];const long=ws.slice().sort((a,b)=>b.length-a.length)[0];
      if(long)en=en.replace(new RegExp('\\b'+long.replace(/'/g,"'")+'\\b'),'['+long+']');
    }
    return {pic:pic||'✏️',ko,en};
  }).filter(Boolean);
}
// 그림 칸에는 이모지나 그림 파일 주소(img/… 또는 https://…)를 쓸 수 있어요
const isImg=p=>/^(https?:\/\/|img\/)|\.(png|jpe?g|webp|gif|svg)(\?.*)?$/i.test(String(p||'').trim());
const picHtml=(p,alt,cls='')=>isImg(p)?`<img class="${cls}" src="${esc(String(p).trim())}" alt="${esc(alt||'')}" loading="lazy" onerror="this.replaceWith(document.createTextNode('✏️'))">`:esc(p);
/* ---------- 소리 (파일 없이 브라우저에서 만들어요) ---------- */
let AC=null,MUTE=!!store('tw-mute');
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,t0,d,type='sine',v=.18){const a=ac();if(!a||MUTE)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);
  g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05);}
const SFX={

  const C=['#F98F6E','#E9B04F','#3F8A5A','#3D6E8C','#8C5BA8'];

function countdown(startAt,cb){
  let el=$('.count');if(!el){el=document.createElement('div');el.className='count';el.setAttribute('role','status');document.body.appendChild(el);}
  let last=null;
  const f=()=>{const ms=startAt-now();if(ms<=0){el.textContent='GO!';if(last!=='go'){last='go';SFX.go();}setTimeout(()=>{el.remove();cb&&cb();},500);return;}
    const k=Math.ceil(ms/1000);if(k!==last){last=k;el.textContent=k;SFX.beep();}setTimeout(f,100);};

}

const plain=en=>en.replace(/[\[\]]/g,'');
const fixQuotes=s=>String(s).replace(/[‘’`´]/g,"'").replace(/[“”]/g,'"');
// 대소문자, 문장부호, 띄어쓰기 수는 따지지 않아요. I'm = I am 처럼 줄임말도 같은 답으로 봐요.
function expand(s){
  return s.replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not')
    .replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would')
    .replace(/\b(it|that|he|she|what|where|there|who|how|when|this|here)'s\b/g,'$1 is').replace(/\blet's\b/g,'let us');
}
const words=s=>expand(fixQuotes(s).toLowerCase()).replace(/[^a-z0-9' ]+/g,' ').replace(/'(?![a-z])|(?<![a-z])'/g,' ').split(/\s+/).filter(Boolean);
const same=(a,b)=>{const x=words(a),y=words(b);return x.length===y.length&&x.every((w,i)=>w===y[i]);};
// 쓴 문장과 정답을 낱말 단위로 맞춰 보고, 틀린 낱말과 빠진 낱말을 표시해요 (LCS)
function diff(input,answer){
  const a=fixQuotes(input).trim().split(/\s+/).filter(Boolean), b=fixQuotes(answer).trim().split(/\s+/).filter(Boolean);
  const k=w=>words(w).join(' ');
  const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=k(a[i])===k(b[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0,missing=0;
  while(i<n||j<m){
    if(i<n&&j<m&&k(a[i])===k(b[j])){out.push(`<span class="w">${esc(a[i])}</span>`);i++;j++;}
    else if(i<n&&j<m&&L[i+1][j+1]===L[i][j]){out.push(`<span class="x">${esc(a[i])}</span>`);i++;j++;} // 철자가 틀린 낱말
    else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){out.push(`<span class="m">?</span>`);missing++;j++;}
    else{out.push(`<span class="x">${esc(a[i])}</span>`);i++;}
  }
  return {html:out.join(' '),missing};
}
const blanksOf=en=>[...en.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]);
const tilesOf=en=>plain(en).split(/\s+/).filter(Boolean);

function towerSvg(blocks,max,color,golds){
  const H=320,W=150,bw=110,cap=Math.max(16,max);
  const bh=Math.min(22,(H-20)/cap);
  let g='';
  for(let i=0;i<blocks;i++){
    const y=H-(i+1)*bh, off=(i%2?6:-6)*(bh/22);
    const gold=golds&&golds.has(i);
    g+=`<rect x="${(W-bw)/2+off}" y="${y}" width="${bw}" height="${Math.max(1,bh-1.5)}" rx="${Math.min(5,bh/4)}" fill="${gold?'#E9B04F':color}" ${gold?'':(i%2?'fill-opacity=".82"':'')}/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="블록 ${blocks}개">${g}</svg>`;
}

function teamTotals(all,n){
  const T=Array.from({length:n},(_,i)=>({t:i+1,s:0,c:0,m:[]}));
  Object.entries(all||{}).forEach(([num,v])=>{if(v&&v.team&&T[v.team-1]){T[v.team-1].s+=v.score||0;T[v.team-1].c+=v.solved||0;T[v.team-1].m.push({n:+num,...v});}});
  return T.slice().sort((a,b)=>b.s-a.s||b.c-a.c||a.t-b.t);
}
