<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 반 추리 게임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* 다른 게임과 같은 교실 게시판 느낌. 밤에는 화면 전체가 어두워져요 */
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F; --night:#1F2540; --night2:#2E3760; --moon:#F4E3A1;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55;transition:background .6s}
body.dark{background:var(--night)}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
button.okb{background:var(--ok)} button.blueb{background:var(--blue)} button.darkb{background:var(--night2)}
button.small{font-size:.9rem;padding:.35em .8em;border-radius:10px}
input,select{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
body.dark .top{background:#141A30}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center;font-size:.9em}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 24px}
#sec{padding-bottom:14px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
body.dark .panel{background:var(--night2);border-color:#46508A;color:#F3EEDD}
body.dark .muted{color:#B9B6D3}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.center{text-align:center;justify-items:center}
.emoji{font-size:clamp(3rem,10vw,4.5rem);line-height:1}
.big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--coral2);line-height:1.25}
body.dark .big{color:var(--moon)}
.huge{font-family:var(--display);font-size:clamp(2.2rem,7vw,4rem);line-height:1.15}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px;color:var(--ink)}
.rules ul{margin:.3em 0 0;padding-left:1.2em}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pulse{animation:pu 1.2s ease-in-out infinite alternate} @keyframes pu{to{transform:scale(1.04)}}
}
/* 첫 화면 */
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.hero p{font-size:1.15rem}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcards div{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.gcards b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
/* 들어가기 */
.check{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-family:var(--display);font-size:1.15rem}
.check input{width:1.6em;height:1.6em;flex:none;accent-color:var(--coral2)}
/* 비밀 카드 */
.secret{display:grid;gap:12px;justify-items:center;text-align:center;background:#fff;border:3px dashed var(--coral);border-radius:22px;padding:22px 16px;min-height:280px;align-content:center;color:var(--ink)}
.secret.open{border-style:solid;background:#FFF9EC}
.secret.liar{background:#2B2140;border-color:#7E5BC8;color:#fff}
.secret.mafia{background:#3A1F28;border-color:var(--bad);color:#fff}
.secret.doctor{background:#E8F4EC;border-color:var(--ok)}
.secret.police{background:#E4EEF6;border-color:var(--blue)}
.secret .word{font-family:var(--display);font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.1}
.secret .desc{font-size:1.15rem;max-width:30em}
.holdbtn{font-size:1.3rem;padding:1em 1.4em;width:100%;max-width:520px}
.easy .holdbtn{font-size:1.6rem}
.starters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.starters span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display);color:var(--ink)}
/* 사람 고르기 */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick button{background:#fff;color:var(--ink);border:3px solid var(--line);font-size:1.25rem;padding:.8em .4em;line-height:1.25}
.pick button b{display:block;font-size:2rem;font-weight:400;color:var(--coral2)}
.pick button[aria-pressed="true"]{border-color:var(--coral2);background:#FFE7DC}
.pick button.mate{border-style:dashed}
.chosen{font-family:var(--display);font-size:1.4rem;background:#E3F1E7;border:2px solid var(--ok);border-radius:14px;padding:8px 14px;color:var(--ink)}
.chosen small{font-family:var(--text);font-size:.95rem;color:var(--muted)}
.pick button small{display:block;font-family:var(--text);font-size:.85rem;color:var(--bad)}
.easy .pick{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.easy .pick button{font-size:1.5rem;padding:1em .4em}
.easy .pick button b{font-size:2.6rem}
/* 퀴즈 */
.quiz{text-align:center;display:grid;gap:12px;justify-items:center}
.quiz .q{font-family:var(--display);font-size:clamp(1.3rem,4vw,1.8rem);line-height:1.3}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.opts.two{grid-template-columns:1fr 1fr}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.2rem;padding:.8em .4em;line-height:1.3}
.opts button span{display:block;font-size:2rem}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.easy .opts button{font-size:1.5rem}.easy .opts button span{font-size:3rem}
.prog{display:flex;gap:6px;justify-content:center}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
.task{display:flex;gap:8px;align-items:center;font-family:var(--display);font-size:1.15rem}
.task i{font-style:normal;display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--line);color:#fff}
.task.done i{background:var(--ok)}
/* 선생님 TV */
.tv{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
body.dark .roomcode{color:var(--moon)}
.timer{font-family:var(--display);font-size:clamp(3rem,8vw,5rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1rem;padding:.45em .8em}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:grid;gap:6px}
.fld .lb{font-family:var(--display);font-size:1.1rem}
.bigpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigpick button{background:#fff;color:var(--ink);border:3px solid var(--line);display:grid;gap:4px;justify-items:center;padding:16px;font-size:1.5rem}
.bigpick button span{font-size:3rem;line-height:1}
.bigpick button small{font-family:var(--text);font-size:1rem;color:var(--muted)}
.bigpick button[aria-pressed="true"]{border-color:var(--coral2);background:#FFF4DF}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.sets button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.05rem;padding:.6em .5em;text-align:left;display:flex;gap:8px;align-items:center}
.sets button span{font-size:1.6rem}
.sets button[aria-pressed="true"]{border-color:var(--coral2);background:#FFF4DF}
.plist{display:grid;gap:6px}
.plist .p{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;color:var(--ink)}
.plist .p .nm{font-family:var(--display);font-size:1.2rem}
.plist .p button{background:#fff;color:var(--muted);border:2px solid var(--line)}
.plist .p button[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{background:var(--cream);border-radius:999px;padding:.2em .8em;font-family:var(--display);color:var(--ink)}
.people span.ok{background:var(--ok);color:#fff}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.seat{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px;text-align:center;font-family:var(--display);color:var(--ink)}
.seat b{display:block;font-size:2.2rem;font-weight:400;color:var(--coral2);line-height:1.1}
.seat span{font-size:1.3rem}
.seat.now{border-color:var(--coral2);background:#FFE7DC}
.seat.done{opacity:.55}
.seat.out{background:#D9D4E6;color:#6F6A85;border-color:#B8B2CC}
.seat.out b{color:#6F6A85}
.seat.ok{border-color:var(--ok)}
.seat small{display:block;font-family:var(--text);font-size:.95rem}
.seat small:first-child{color:var(--muted)}
.seat.hot{border-color:var(--bad);background:#FBE3DC}
.tally{display:grid;gap:8px}
.tally .t{display:grid;grid-template-columns:9em 1fr 3em;gap:10px;align-items:center;font-family:var(--display);font-size:1.3rem}
.tally .track{height:30px;border-radius:10px;background:var(--cream);overflow:hidden}
.tally .track div{height:100%;background:var(--coral);border-radius:10px;transition:width .8s}
.tally .t.top .track div{background:var(--bad)}
.tally .t b{text-align:right;font-weight:400}
.win{border-radius:22px;padding:22px;text-align:center;display:grid;gap:8px;justify-items:center}
.win.citizen{background:#E3F1E7;border:3px solid var(--ok);color:var(--ink)}
.win.villain{background:#3A1F28;border:3px solid var(--bad);color:#fff}
.win.liar{background:#2B2140;border:3px solid #7E5BC8;color:#fff}
.rank{display:grid;gap:6px}
.rank .r{display:grid;grid-template-columns:2.4em 1fr 4em;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:6px 12px;font-family:var(--display);font-size:1.2rem;color:var(--ink)}
.rank .r b{font-weight:400;color:var(--coral2)} .rank .r .pt{text-align:right}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.6rem}
.podium .p1{background:var(--gold);min-height:240px}.podium .p2{min-height:190px;background:var(--blue2)}.podium .p3{min-height:150px}
.moon{font-size:5rem;line-height:1}
.roleset{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.roleset div{background:#fff;border-radius:14px;padding:8px 16px;font-family:var(--display);font-size:1.3rem;color:var(--ink);border:2px solid var(--line)}
.hold-note{font-size:.95rem}
#tvsecret{position:fixed;inset:0;z-index:70;background:rgba(20,26,48,.92);color:#fff;display:none;place-items:center;padding:20px;text-align:center;font-family:var(--display);font-size:1.4rem}
#tvsecret.on{display:grid}
@media (max-width:820px){
  .hero,.tv{grid-template-columns:1fr}
  .choose,.bigpick{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .tally .t{grid-template-columns:6.5em 1fr 2.4em;font-size:1.1rem}
}
</style></head><body>

// 투표 세기: 가장 많이 받은 한 명만 뽑혀요 (같으면 아무도 안 뽑혀요)
function tally(votes,cands){
  const c={};cands.forEach(n=>c[n]=0);let skip=0;
  Object.values(votes||{}).forEach(t=>{if(+t&&c[t]!==undefined)c[t]++;else skip++;});
  const mx=Math.max(0,...Object.values(c));const top=Object.keys(c).filter(n=>c[n]===mx&&mx>0).map(Number);
  return {c,skip,top:top.length===1?top[0]:0,tie:top.length>1};
}

  const key2=JSON.stringify([myNt.pick,SEC.check,SEC.role==='mafia'?Object.fromEntries(Object.entries(NT).map(([k,v])=>[k,v.pick])):0]);

// 꾹 누르면(쉬운 화면은 한 번 누르면) 비밀 카드가 보여요
function holdCard(box,face,cls,label='꾹 누르고 있으면 내 카드가 보여요'){
  const easy=!!P.easy;
  box.innerHTML=`<div class="secret" id="card"><div class="emoji">🂠</div><button class="holdbtn" id="hold">${easy?'👆 눌러서 카드 보기':'👆 '+label}</button><div class="muted hold-note">${easy?'다시 누르면 가려져요':'손을 떼면 다시 가려져요'}</div></div>`;
  let open=false;
  const show=on=>{open=on;const c=$('#card',box);if(!c)return;
    c.className='secret'+(on?' open '+(cls||''):'');
    c.innerHTML=on?face+`<button class="holdbtn ghost" id="hold" style="${easy?'':'display:none'}">가리기</button>`:`<div class="emoji">🂠</div><button class="holdbtn" id="hold">${easy?'👆 눌러서 카드 보기':'👆 '+label}</button><div class="muted hold-note">${easy?'다시 누르면 가려져요':'손을 떼면 다시 가려져요'}</div>`;
    bind();};
  const bind=()=>{const b=$('#hold',box);if(!b)return;
    if(easy){b.onclick=()=>show(!open);}
    else{b.onpointerdown=e=>{e.preventDefault();show(true);};b.oncontextmenu=e=>e.preventDefault();}};
  if(!easy){const up=()=>{if(open)show(false);};box.onpointerup=up;box.onpointerleave=up;box.onpointercancel=up;}
  bind();
}

/* ---------- 학생: 마피아 게임 ---------- */
function roleFace(){
  const r=ROLES[SEC.role];if(!r)return '';
  const mates=(SEC.mates||[]).filter(n=>n!==me.num);
  const checks=Object.entries(SEC.check||{}).map(([d,c])=>`<div>${d}일째 밤: ${tag(c.t)} → <b>${c.mafia?'🦹 마피아예요!':'🙂 마피아가 아니에요'}</b></div>`).join('');
  return `<div class="emoji">${r.e}</div><div class="word">나는 ${r.n}</div><div class="desc">${r.job}</div>
   ${SEC.role==='mafia'&&mates.length?`<div class="desc">함께하는 마피아: <b>${mates.map(tag).join(', ')}</b></div>`:''}${checks?`<div class="desc">${checks}</div>`:''}`;
}
const aliveList=()=>Object.keys(G.alive||{}).map(Number).filter(n=>G.alive[n]).sort((a,b)=>a-b);
function seatsHTML(){
  return `<div class="seats">${Object.keys(G.alive||{}).map(Number).sort((a,b)=>a-b).map(n=>`<div class="seat ${G.alive[n]?'':'out'}"><b>${G.alive[n]?n:'😴'}</b><span>${G.alive[n]?'':n+' '}${esc(nameOf(n))}</span></div>`).join('')}</div>`;
}
function nightQuiz(box,done){
  const words=W(G.set);const easy=!!P.easy;const N=3;let i=0,ok=0,missed=false;
  const draw=()=>{
    const a=pickOne(words);const opts=shuffle([a,...shuffle(words.filter(x=>x.w!==a.w)).slice(0,easy?1:2)]);missed=false;
    box.innerHTML=`<div class="quiz"><div class="task"><i>2</i> 밤 퀴즈 (${i+1}/${N}) · 한 번에 맞히면 1점</div><div class="prog">${Array.from({length:N},(_,k)=>`<span class="${k<i?'on':k===i?'cur':''}"></span>`).join('')}</div>
     <div class="q">"${esc(a.d)}"</div><div class="opts ${easy?'two':''}">${opts.map(o=>`<button data-w="${esc(o.w)}"><span>${o.e}</span>${esc(o.w)}</button>`).join('')}</div><div class="msg" id="qm" role="status"></div></div>`;
    $$('.opts button',box).forEach(b=>b.onclick=async()=>{
      if(b.dataset.w===a.w){b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);if(!missed)ok++;$('#qm',box).className='msg ok';$('#qm',box).textContent='맞았어요!';
        await new Promise(r=>setTimeout(r,550));i++;if(i<N)return draw();done(ok);}
      else{missed=true;b.classList.add('wrong');b.disabled=true;$('#qm',box).className='msg bad';$('#qm',box).textContent='다시 골라 봐요';}
    });
  };
  draw();
}
function stuMafia(){
  const inGame=G.alive&&me.num in G.alive;
  const ph=G.phase;const alive=inGame&&!!G.alive[me.num];
  const head=`<div class="row" style="justify-content:space-between"><span class="band">🦹 마피아 게임${G.day?` · ${G.day}일째`:''}</span><span class="muted">${alive?'':'👻 유령'}</span></div>`;
  if(!inGame){ClassWatch.step('다음 게임 기다리기',{wait:true});return frame(`<div class="panel grid center"><div class="emoji">⏳</div><h2>이번 게임이 끝나면 함께해요</h2></div>`);}

  if(ph==='role'){
    ClassWatch.step('역할 보기',{n:1,total:4});
    frame(`${head}<div class="panel grid center"><h2 style="font-size:1.7rem">내 역할을 몰래 확인해요</h2><p class="muted" style="margin:0">친구에게 보여 주지 않아요. 확인했으면 TV를 봐요.</p></div>`);

  }
  if(ph==='night'){
    const mine=NT[me.num]||{};

    frame(`${head}<div class="panel grid center"><div class="moon">🌙</div><h2 style="font-size:1.7rem">밤이 되었어요</h2><p style="margin:0">태블릿을 몸 쪽으로 세워 화면을 가려요. 모두 똑같이 화면을 눌러요.</p></div>`);
    if(mine.done){sec.innerHTML=`<div class="panel grid center"><div class="emoji">😴</div><h2>다 했어요! 고개를 숙이고 기다려요</h2></div>`;return;}
    const role=alive?SEC.role:'ghost';

    let cands=A;
    if(role==='mafia')cands=A.filter(n=>!(SEC.mates||[]).includes(n));
    else if(role==='police'||role==='citizen'||role==='ghost')cands=A.filter(n=>n!==me.num);
    const label=role==='ghost'?'👻 유령의 예측: 누가 마피아일까요? (맞히면 1점)':R.pick;
    sec.innerHTML=`<div class="panel grid" id="tk1"></div><div class="panel" id="tk2"></div>`;
    let pick=mine.pick||0;
    const drawPick=()=>{
      const matePicks=role==='mafia'?(SEC.mates||[]).filter(n=>n!==me.num).map(n=>NT[n]&&NT[n].pick?`${tag(n)} → ${tag(NT[n].pick)}`:'').filter(Boolean):[];
      const chk=role==='police'&&SEC.check&&SEC.check[G.day];

      ${chk&&chk.t===pick?`<div class="big" style="font-size:1.6rem">${tag(chk.t)} → ${chk.mafia?'🦹 마피아예요!':'🙂 마피아가 아니에요'}</div>`:''}

      <div class="pick">${cands.map(n=>`<button data-n="${n}" aria-pressed="${pick===n}"><b>${n}</b>${esc(nameOf(n))}${role==='mafia'&&(SEC.mates||[]).some(m=>m!==me.num&&NT[m]&&NT[m].pick===n)?'<small>마피아 친구가 고름</small>':''}</button>`).join('')}</div>`;
      $$('#tk1 .pick button').forEach(b=>b.onclick=()=>{if(role==='police'&&chk)return;pick=+b.dataset.n;roomRef(me.room).child(`nt/${G.day}/${me.num}/pick`).set(pick);drawPick();});};
    redrawPick=()=>{pick=(NT[me.num]||{}).pick||pick;drawPick();};

      if(!pick){$('#tk2').innerHTML='<div class="task done"><i>2</i> 퀴즈 끝! 위에서 친구를 골라야 끝나요</div>';
        const wait=setInterval(async()=>{if(pick){clearInterval(wait);await roomRef(me.room).child(`nt/${G.day}/${me.num}`).update({ok,done:true});}},300);return;}
      await roomRef(me.room).child(`nt/${G.day}/${me.num}`).update({ok,done:true});
    });

  }
  if(ph==='morning'){

    frame(`${head}<div class="panel grid center pop"><div class="emoji">${meOut?'😴':M.t&&M.saved?'🧑‍⚕️':'☀️'}</div>
      <h2 style="font-size:1.8rem">${meOut?'마피아가 나를 잠재웠어요':M.t?(M.saved?'의사가 친구를 지켜 냈어요!':`${tag(M.t)} 친구가 잠들었어요`):'아무 일도 없었어요'}</h2>
      ${meOut?'<p style="margin:0">이제 <b>유령</b>이에요. 말은 하지 않고, 밤마다 예측과 퀴즈로 점수를 모아요. 내 역할은 비밀이에요.</p>':''}</div>${seatsHTML()}`);
    return myRole();
  }
  if(ph==='day'){
    ClassWatch.step('토론',{n:3,total:4,wait:true});
    frame(`${head}<div class="panel grid center"><h2 style="font-size:1.8rem">${alive?'누가 마피아일까요? 이야기해요':'👻 유령은 조용히 들어요'}</h2><div class="timer" id="stm"></div>
      ${alive?'<p class="muted" style="margin:0">"왜 그렇게 생각해?" 하고 까닭을 물어봐요.</p>':''}</div>${seatsHTML()}`);
    return myRole();
  }
  if(ph==='vote'){
    ClassWatch.step('투표',{n:4,total:4,wait:!alive||MYV!=null});
    if(!alive){frame(`${head}<div class="panel grid center"><div class="emoji">👻</div><h2>친구들이 투표하고 있어요</h2></div>${seatsHTML()}`);return myRole();}
    const C=aliveList().filter(n=>n!==me.num);
    frame(`${head}<div class="panel grid"><h2 style="font-size:1.7rem">누구를 내보낼까요?</h2><p class="muted" style="margin:0">${MYV!=null?(MYV?`<b style="color:var(--ok)">${tag(MYV)}</b>에게 투표했어요.`:'<b>기권</b>했어요.')+' 결과가 나오기 전까지 바꿀 수 있어요.':'한 명을 눌러 투표해요. 잘 모르겠으면 기권해요.'}</p>

    return myRole();
  }
  if(ph==='verdict'){
    ClassWatch.step('투표 결과',{n:4,total:4,wait:true});

  if(ph==='end'){

    frame(`${head}<div class="win ${G.win==='mafia'?'villain':'citizen'} pop"><div class="emoji">${G.win==='mafia'?'🦹':'🎉'}</div><div class="huge">${G.win==='mafia'?'마피아 팀 승리!':'시민 팀 승리!'}</div>

  }
}

/* ---------- 선생님: 라이어 게임 ---------- */
async function liarStart(round){
  const S=players();const nums=S.map(x=>x.n);
  const words=W(CFG.set);const used=(RD.h&&RD.h.used&&RD.h.set===CFG.set)?RD.h.used:[];
  let pool=words.filter(w=>!used.includes(w.w));if(pool.length<2)pool=words;
  const word=pickOne(pool);
  const fake=CFG.mode==='fool'?pickOne(words.filter(w=>w.w!==word.w)):null;
  const k=Math.min(CFG.liars,nums.length>=8?2:1);
  const liars=chooseSpecial(nums,k);
  const order=shuffle(nums);
  const secU={};
  nums.forEach(n=>{const L=liars.includes(n);
    secU[n]=L?(fake?{r:round,liar:true,fake:true,word:fake.w,e:fake.e,d:fake.d}:{r:round,liar:true}):{r:round,liar:false,word:word.w,e:word.e,d:word.d};});
  const R=roomRef(ROOM);
  await R.update({sec:secU,h:{liars,word:word.w,e:word.e,d:word.d,fake:fake?fake.w:'',set:CFG.set,used:[...(used.length>=words.length-1?[]:used),word.w]},lg:null,
    g:{game:'liar',set:CFG.set,mode:CFG.mode,phase:'card',round,order,laps:CFG.laps,talkSec:CFG.talkSec,talk:{i:0,lap:1},endAt:0}});
  say('카드를 나눠 주었어요. 친구에게 보이지 않게 내 카드를 확인해요.');
}

     <div class="rules"><b>말하기 규칙</b><ul><li>차례가 되면 제시어를 <b>한 문장</b>으로 설명해요.</li><li>제시어를 그대로 말하면 안 돼요. 너무 쉽게 말하면 라이어가 알아채요!</li><li>도움이 필요한 친구는 한 낱말로 말해도 좋아요.</li></ul></div>
     <div class="row" style="justify-content:center"><button id="go" style="font-size:1.4rem">말하기 시작 ▶</button></div>`;

const nameOf2=n=>(((RD.players||{})[n]||{}).name)||'';
let finishing=false;
async function liarFinish(win,guess){
  if(finishing)return;finishing=true;
  try{
    const g=G_();const R={...(g.result||{})};const order=g.order||[];
    if(G_().phase==='end')return;
    R.win=win;R.guess=guess||'';R.fakeWord=(RD.h||{}).fake||'';
    R.why=!R.acc?'표가 나뉘어 라이어가 숨는 데 성공했어요.':!(R.liars||[]).includes(R.acc)?`${R.acc}번 친구는 라이어가 아니었어요.`:win==='liar'?`라이어가 제시어 "${R.word}"를 맞혀 역전했어요!`:`라이어가 "${guess||'?'}"라고 답해서 틀렸어요.`;
    const pts={};order.forEach(n=>{const L=(R.liars||[]).includes(n);pts[n]=win==='liar'?(L?3:0):(L?0:1);});

/* ---------- 선생님: 마피아 게임 ---------- */
async function mafiaStart(){
  const S=players();const nums=S.map(x=>x.n);
  const mf=Math.min(CFG.mafia||autoMafia(nums.length),Math.floor((nums.length-1)/2));
  const want=mf+(CFG.doctor?1:0)+(CFG.police?1:0);
  const sp=chooseSpecial(nums,Math.min(want,nums.length));
  const roles={};nums.forEach(n=>roles[n]='citizen');
  const maf=sp.slice(0,mf);maf.forEach(n=>roles[n]='mafia');
  let i=mf;if(CFG.doctor&&sp[i])roles[sp[i++]]='doctor';if(CFG.police&&sp[i])roles[sp[i++]]='police';
  const secU={};nums.forEach(n=>secU[n]=roles[n]==='mafia'?{role:'mafia',mates:maf}:{role:roles[n]});
  const alive={};nums.forEach(n=>alive[n]=1);
  await roomRef(ROOM).update({sec:secU,h:{roles},nt:null,v:null,
    g:{game:'mafia',set:CFG.set,phase:'role',day:0,alive,dayMin:CFG.dayMin,showTeam:CFG.showTeam,count:{mafia:mf,doctor:Object.values(roles).includes('doctor')?1:0,police:Object.values(roles).includes('police')?1:0},endAt:0}});
  say('역할 카드를 나눠 주었어요. 친구에게 보이지 않게 내 역할을 확인해요.');
}
// 경찰이 고르면 바로 결과를 경찰 태블릿에만 보내요
function hostWatch(){
  const g=RD.g||{},h=RD.h||{};
  if(g.game!=='mafia'||g.phase!=='night'||!h.roles)return;
  const N=(RD.nt||{})[g.day]||{};
  Object.entries(h.roles).forEach(([n,r])=>{
    if(r!=='police'||!g.alive[n])return;
    const p=N[n]&&N[n].pick;const done=((RD.sec||{})[n]||{}).check||{};
    if(p&&(!done[g.day]||done[g.day].t!==p))roomRef(ROOM).child(`sec/${n}/check/${g.day}`).set({t:p,mafia:h.roles[p]==='mafia'});
  });
}
function winner(alive,roles){
  const A=Object.keys(alive).filter(n=>alive[n]);const m=A.filter(n=>roles[n]==='mafia').length;
  return m===0?'citizen':m>=A.length-m?'mafia':'';
}
let resolving=false;
async function resolveNight(){
  if(resolving)return;resolving=true;
  try{
    const g=G_(),h=RD.h||{},roles=h.roles||{};const N=(RD.nt||{})[g.day]||{};
    const alive={...g.alive};const A=Object.keys(alive).filter(n=>alive[n]).map(Number);
    const mafiaPicks={};A.filter(n=>roles[n]==='mafia').forEach(n=>{const p=N[n]&&N[n].pick;if(p&&alive[p])mafiaPicks[p]=(mafiaPicks[p]||0)+1;});
    const mx=Math.max(0,...Object.values(mafiaPicks));const tops=Object.keys(mafiaPicks).filter(k=>mafiaPicks[k]===mx).map(Number);
    const t=tops.length?pickOne(tops):0;
    const doc=A.find(n=>roles[n]==='doctor');const saved=!!(t&&doc&&N[doc]&&N[doc].pick===t);
    const pts={};
    Object.keys(alive).map(Number).forEach(n=>{const x=N[n]||{};let p=x.ok||0;
      if((!alive[n]||roles[n]==='citizen')&&x.pick&&roles[x.pick]==='mafia')p++;pts[n]=p;});
    if(t&&!saved)alive[t]=0;
    const win=winner(alive,roles);
    const picks={};A.forEach(n=>{if(N[n]&&N[n].pick)picks[n]=N[n].pick;});
    await roomRef(ROOM).child('h/hist/'+g.day).set({mafia:Object.fromEntries(A.filter(n=>roles[n]==='mafia').map(n=>[n,(N[n]&&N[n].pick)||0])),doc:doc||0,docPick:(doc&&N[doc]&&N[doc].pick)||0,t,saved,done:Object.keys(alive).filter(n=>N[n]&&N[n].done).length,all:Object.keys(alive).length});
    await gref().update({phase:'morning',alive,morning:{t,saved},win:win||null,endAt:0});
    await addPts(pts);
  }finally{resolving=false;}
}
async function resolveVote(){
  const g=G_(),roles=(RD.h||{}).roles||{};const V=(RD.v||{})[voteKey(g)]||{};

  if(g.phase==='vote'){
    const n=A.filter(x=>V[x]!==undefined).length;
    main.innerHTML=`${head}<div class="panel grid center"><div class="emoji">🗳️</div><div class="huge">누구를 내보낼까요?</div><div class="big">${n} / ${A.length}명 투표</div><p class="muted" style="margin:0">가장 많이 받은 한 명이 나가요. 같은 표면 아무도 나가지 않아요.</p></div>
     ${seats(x=>g.alive[x]&&V[x]!==undefined?{cls:'ok',sub:'투표함'}:{})}
     <div class="row" style="justify-content:center"><button class="ghost" id="back">◀ 토론 더 하기</button><button id="res" style="font-size:1.4rem" ${n?'':'disabled'}>결과 보기 ▶</button></div>`;
    say('누구를 내보낼까요? 태블릿에서 투표해요.');
    $('#back').onclick=()=>gref().update({phase:'day',endAt:now()+60000});
    $('#res').onclick=()=>{if(n<A.length&&!confirm(`아직 ${A.length-n}명이 투표하지 않았어요.\n그래도 결과를 볼까요?`))return;resolveVote();};return;
  }
  if(g.phase==='verdict'){
    const Vd=g.verdict||{};const mx=Math.max(1,...Object.values(Vd.tally||{}));
    main.innerHTML=`${head}<div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="panel grid"><h2>투표 결과</h2><div class="tally">${Object.entries(Vd.tally||{}).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div class="t ${+n===Vd.out?'top':''}"><span>${tagT(n)}</span><div class="track"><div style="width:${c/mx*100}%"></div></div><b>${c}</b></div>`).join('')}${Vd.skip?`<div class="t"><span>🤷 기권</span><div class="track"><div style="width:${Vd.skip/mx*100}%;background:var(--line)"></div></div><b>${Vd.skip}</b></div>`:''}</div></div>
      <div class="panel grid center pop"><div class="emoji">${Vd.out?(Vd.team==='mafia'?'🦹':Vd.team?'😢':'🚪'):'🤝'}</div><div class="huge" style="font-size:2.2rem">${Vd.out?`${tagT(Vd.out)} 친구가 나가요`:'표가 나뉘어 아무도 나가지 않아요'}</div>${Vd.out&&Vd.team?`<div class="big">${Vd.team==='mafia'?'마피아였어요!':'시민 팀이었어요…'}</div>`:''}</div></div>
     ${seats()}<div class="row" style="justify-content:center">${g.win?'<button id="end" style="font-size:1.4rem">🏁 게임 결과 보기</button>':'<button class="darkb" id="night" style="font-size:1.4rem">🌙 다음 밤</button>'}</div>`;
    say(Vd.out?`${Vd.out}번 ${nameOf2(Vd.out)} 친구가 나가요.${Vd.team?(Vd.team==='mafia'?' 마피아였어요!':' 시민 팀이었어요.'):''}`:'표가 나뉘어 아무도 나가지 않아요.');
    if($('#end'))$('#end').onclick=mafiaEnd;else $('#night').onclick=toNight;return;
  }
  if(g.phase==='end'){
    const roles=g.reveal||{};
    main.innerHTML=`${head}<div class="win ${g.win==='mafia'?'villain':'citizen'} pop"><div class="emoji">${g.win==='mafia'?'🦹':'🎉'}</div><div class="huge">${g.win==='mafia'?'마피아 팀 승리!':'시민 팀 승리!'}</div><div>이긴 팀은 모두 +2점. 밤 퀴즈와 맞힌 예측 점수도 더했어요.</div></div>
     <div class="panel grid"><h2>모두의 역할</h2>${seats(n=>({cls:roles[n]==='mafia'?'hot':'',sub:`${ROLES[roles[n]].e} ${ROLES[roles[n]].n}`}))}</div>
     ${nightLog(g.hist,tagT)}
     <div class="panel grid"><h2>점수</h2>${scoreboard(S)}</div>
     <div class="row" style="justify-content:center"><button id="again" style="font-size:1.4rem">한 게임 더 ▶</button><button class="ghost" id="aw">🏆 시상식</button></div>`;
    say(g.win==='mafia'?'마피아 팀 승리!':'시민 팀 승리!');
    $('#again').onclick=()=>{CFG.set=g.set;roomRef(ROOM).child('g').set({phase:'lobby'});};
    $('#aw').onclick=()=>roomRef(ROOM).child('award').set(true);
  }
}

/* ---------- 길 찾기 ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
</body></html>
