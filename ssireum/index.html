<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
/* Same classroom notice-board look as 우리말 지킴이 so the class sees one family of tools. Single light look by choice (classroom TV). */
:root{

}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--coral);border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 48px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

.hero p{font-size:1.15rem}

.steps button[aria-current="step"]{background:var(--coral);border-color:var(--coral);color:#fff}

.quiz .q{font-family:var(--display);font-size:clamp(1.4rem,4vw,2rem);line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:1.2rem;padding:.9em .5em;line-height:1.3}
.opts button.wrong{background:#F6E1DB;border-color:var(--bad);color:var(--bad)}
.opts button.right{background:#E3F1E7;border-color:var(--ok);color:var(--ok)}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog span{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog span.on{background:var(--ok)} .prog span.cur{background:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 씨름장 넓이 연구소 */
.fig{max-width:240px}
.cutbox svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.eq{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-family:var(--display);font-size:1.4rem}
.eq input{width:5em;text-align:center;font-size:1.3rem}
.formula{font-family:var(--display);font-size:clamp(1.2rem,3.4vw,1.7rem);background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4em .8em;text-align:center}
.formula u{text-decoration:none;color:var(--coral2)}
.chain{display:grid;gap:4px;font-family:var(--display);font-size:clamp(1.05rem,2.6vw,1.45rem);background:#fff;border:2px solid var(--line);border-radius:14px;padding:.6em 1em}
.chain u{text-decoration:none;color:var(--coral2)} .chain b{font-weight:400;color:var(--coral2)}
.plist{display:grid;gap:8px}
.pcard{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:8px 14px;font-family:var(--display);font-size:1.25rem}
.pcard.star{border-left-color:var(--gold)}
.pcard b{font-weight:400;color:var(--coral2);margin-right:6px}
/* 문제별 정답률 */
.qrate{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.qrow.low{border-color:var(--bad);background:#FFF5F2}
.qrow .qt,.qrow .qw{text-align:left;justify-self:start}
.qrow .qb{display:grid;grid-template-columns:minmax(0,1fr) 3.6em;gap:2px 8px;align-items:center;width:100%}
.qrow .qb .track{width:100%;height:14px;border-radius:999px;background:var(--cream);overflow:hidden}
.qrow .qb .track div{height:100%;background:var(--ok);border-radius:999px}
.qrow.low .qb .track div{background:var(--bad)}
.qrow .pc{font-family:var(--display);font-size:1.3rem}
.qrow.low .pc{color:var(--bad)}
@media (max-width:820px){.qrow{grid-template-columns:1fr}}

/* ---------- 그림: 원 자르기와 이어 붙이기 (교과서 116쪽) ----------
   위쪽 반원 조각은 파랑(빨간 호), 아래쪽 반원 조각은 주황(파란 호). 이어 붙이면 파랑은 호가 위, 주황은 호가 아래.
   o: {lab:'?'|'ans'|false, circle:true, R} */
function cutSVG(n,o={}){
  const R=o.R||100,showC=o.circle!==false,lab=o.lab||false;
  const s=R*Math.sin(Math.PI/n),rc=R*Math.cos(Math.PI/n),Wr=(n+1)*s;
  const pad=lab?60:16,cx=pad+R,top=lab?46:16,cy=top+R;
  const X0=showC?cx+R+60+(lab?44:0):pad, yb=top+R*(showC?1.5:1); // 이어 붙인 모양: 파랑 꼭짓점이 아래(yb)
  const W=X0+Wr+(lab?24:16), H=top+2*R+(lab?20:16);
  const BL='#9CC5EA',OR='#F8B57A',ARCB='#E3262B',ARCO='#4A90D9',ln='#2B2B2B',lw=n>32?0.5:1;
  let g='';
  if(showC){
    for(let k=0;k<n;k++){const a0=Math.PI+k*2*Math.PI/n,a1=a0+2*Math.PI/n,mid=(a0+a1)/2,up=Math.sin(mid)<0;
      g+=`<path d="M ${cx} ${cy} L ${(cx+R*Math.cos(a0)).toFixed(2)} ${(cy+R*Math.sin(a0)).toFixed(2)} A ${R} ${R} 0 0 1 ${(cx+R*Math.cos(a1)).toFixed(2)} ${(cy+R*Math.sin(a1)).toFixed(2)} Z" fill="${up?BL:OR}" stroke="${ln}" stroke-width="${lw}"/>`;}
    g+=`<path d="M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}" fill="none" stroke="${ARCB}" stroke-width="4"/><path d="M ${cx+R} ${cy} A ${R} ${R} 0 0 1 ${cx-R} ${cy}" fill="none" stroke="${ARCO}" stroke-width="4"/>`;
    g+=`<path d="M ${cx+R+14} ${cy} h 28 m -10 -9 l 10 9 l -10 9" fill="none" stroke="#5A9BD5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  let arcs='';
  for(let i=0;i<n/2;i++){const ax=X0+s+i*2*s;
    g+=`<path d="M ${(ax-s).toFixed(2)} ${(yb-rc).toFixed(2)} A ${R} ${R} 0 0 1 ${(ax+s).toFixed(2)} ${(yb-rc).toFixed(2)} L ${ax.toFixed(2)} ${yb} Z" fill="${BL}" stroke="${ln}" stroke-width="${lw}"/>`;
    arcs+=`<path d="M ${(ax-s).toFixed(2)} ${(yb-rc).toFixed(2)} A ${R} ${R} 0 0 1 ${(ax+s).toFixed(2)} ${(yb-rc).toFixed(2)}" fill="none" stroke="${ARCB}" stroke-width="3"/>`;
    const bx=X0+2*s+i*2*s,yt=yb-rc;
    g+=`<path d="M ${(bx+s).toFixed(2)} ${yb} A ${R} ${R} 0 0 1 ${(bx-s).toFixed(2)} ${yb} L ${bx.toFixed(2)} ${yt.toFixed(2)} Z" fill="${OR}" stroke="${ln}" stroke-width="${lw}"/>`;
    arcs+=`<path d="M ${(bx+s).toFixed(2)} ${yb} A ${R} ${R} 0 0 1 ${(bx-s).toFixed(2)} ${yb}" fill="none" stroke="${ARCO}" stroke-width="3"/>`;}
  g+=arcs;
  if(lab){
    const yT=yb-R,yB=yb;
    const tw=lab==='ans'?'원주의 1/2':'?',hh=lab==='?'?'?':'반지름';
    g+=`<path d="M ${X0+s} ${yT-8} v -10 H ${X0+Wr} v 10" fill="none" stroke="#C8452D" stroke-width="2.5"/><text x="${X0+s+(Wr-s)/2}" y="${yT-24}" text-anchor="middle" font-size="22" font-family="Jua" fill="#C8452D">가로: ${tw}</text>`;
    g+=`<path d="M ${X0-6} ${yT} h -10 V ${yB} h 10" fill="none" stroke="#3D6E8C" stroke-width="2.5"/><text x="${X0-24}" y="${(yT+yB)/2}" text-anchor="middle" font-size="22" font-family="Jua" fill="#3D6E8C" transform="rotate(-90 ${X0-24} ${(yT+yB)/2})">세로: ${hh}</text>`;
  }
  return `<svg class="cut" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" role="img" aria-label="원을 ${n}등분하여 이어 붙인 모양">${g}</svg>`;
}
/* 문제 그림: 원 하나에 반지름 또는 지름 표시 */
function circleSVG({r,d,u='cm',label,color='#F7D34A'}){
  const W=260,C=130,R=100;let g=`<circle cx="${C}" cy="${C}" r="${R}" fill="${color}" stroke="#8A7458" stroke-width="3"/><circle cx="${C}" cy="${C}" r="4" fill="#453422"/>`;
  if(r!=null)g+=`<line x1="${C}" y1="${C}" x2="${C+R}" y2="${C}" stroke="#453422" stroke-width="3"/><text x="${C+R/2}" y="${C-10}" text-anchor="middle" font-size="22" font-family="Jua" fill="#453422">${r} ${u}</text>`;
  if(d!=null)g+=`<line x1="${C-R}" y1="${C}" x2="${C+R}" y2="${C}" stroke="#453422" stroke-width="3"/><text x="${C}" y="${C-10}" text-anchor="middle" font-size="22" font-family="Jua" fill="#453422">${d} ${u}</text>`;
  if(label)g+=`<text x="${C}" y="${C+46}" text-anchor="middle" font-size="18" font-family="Jua" fill="#6D4215">${label}</text>`;
  return `<svg class="fig" viewBox="0 0 ${W} ${W}" role="img" aria-label="원">${g}</svg>`;
}

/* ---------- 처음 답 기록 (문제별 정답률) ---------- */
function rec(id,ok){
  if(!me||!id)return;
  if(ME.ans&&ME.ans[id]!==undefined)return;
  ME.ans={...(ME.ans||{}),[id]:ok};
  roomRef(me.room).child(`students/${me.num}/ans/${id}`).transaction(v=>v===null?ok:undefined);
}

/* ---------- 공통: 고르기 문제 ---------- */
function pick(box,{id,q,a,o,why,onOk,fig=''}){
  const opts=shuffle([a,...o]);let first=true;
  box.innerHTML=`<div class="quiz">${fig}<div class="q">${q}</div><div class="opts">${opts.map(x=>`<button data-o="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="msg" id="pm" role="status"></div></div>`;
  $$('.opts button',box).forEach(b=>b.onclick=()=>{
    const ok=b.dataset.o===a;if(first){rec(id,ok);first=false;}
    if(ok){b.classList.add('right');$$('.opts button',box).forEach(x=>x.disabled=true);$('#pm',box).className='msg ok';$('#pm',box).textContent='맞았어요!';setTimeout(onOk,RM?0:650);}
    else{b.classList.add('wrong');b.disabled=true;box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');$('#pm',box).className='msg bad';$('#pm',box).innerHTML=(why&&why[b.dataset.o])||'다시 골라 봐요';}
  });
}
/* 칸 채우기: fields=[{id,want}] , hint(values)->안내 */
function fillEq(box,{id,html,fields,hint,okText,onOk,solve}){
  box.innerHTML=html+`<div class="msg" id="wm" role="status"></div><div class="row" id="act" style="justify-content:center"><button id="chk">확인하기</button></div>`;
  let miss=0,first=true;
  $('#chk').onclick=async()=>{
    const v=fields.map(f=>num($('#'+f.id,box).value));
    const bad=t=>{$('#wm',box).className='msg bad';$('#wm',box).innerHTML=t;box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');};
    if(v.some(x=>x==null))return bad('빈칸을 모두 채워요.');
    const ok=fields.every((f,k)=>same(v[k],f.want));
    if(first){rec(id,ok);first=false;}
    if(!ok){miss++;return bad((hint(v)||'다시 계산해 봐요.')+(miss>=2&&solve?`<br>풀이: ${solve}`:''));}
    $('#chk').disabled=true;$$('input',box).forEach(x=>x.disabled=true);
    $('#wm',box).className='msg ok';$('#wm',box).innerHTML=okText;
    onOk(miss);
  };
}

  if(R.i<total){

    shell(`<div class="two"><div class="panel grid"><div class="row" style="justify-content:space-between"><span class="band">3단계 · 원의 넓이 구하기</span><span class="muted">${R.i+1}/${total}</span></div>
      <h2>${P.t}</h2>${circleSVG({...P.show,u,color:P.color})}${FORMULA}<p class="muted" style="margin:0">원주율 3.14 · 계산기를 써도 돼요. 다 풀면 짝과 풀이를 비교해요.</p></div>
      <div class="panel grid" id="work"></div></div>`);
    return fillEq($('#work'),{id:P.id,html:`<h2>넓이를 구해요</h2>${P.show.d?`<p style="margin:0">지름이 ${P.show.d} ${u}이니까 반지름은?</p>`:''}
        <div class="eq"><input id="a" type="number" inputmode="decimal" aria-label="반지름"> × <input id="b" type="number" inputmode="decimal" aria-label="반지름"> × 3.14 = <input id="c" type="number" inputmode="decimal" aria-label="넓이" style="width:6.5em"> ${u}²</div>`,
      fields:[{id:'a',want:P.r},{id:'b',want:P.r},{id:'c',want:A}],
      hint:v=>(same(v[0],D)||same(v[1],D))?`${D} ${u}는 지름이에요. 반지름은 지름 ÷ 2 = <b>${P.r}</b>`:same(v[2],r2(D*3.14))?'그건 원주(지름 × 3.14)예요. 넓이는 반지름 × 반지름 × 3.14!':same(v[2],r2(P.r*3.14*2))?'반지름 × 3.14 × 2는 원주예요. 반지름을 두 번 곱해요.':same(v[2],P.r*P.r*3)||same(v[2],r2(P.r*P.r*3.1))?'원주율은 3.14를 써요.':(same(v[0],P.r)&&same(v[1],P.r))?'곱셈을 다시 해 봐요. 계산기를 써도 돼요.':'',
      solve:`${P.r} × ${P.r} × 3.14 = <b>${A}</b>`,okText:`맞았어요! ${A} ${u}². ${P.ok||''}`,
      onOk:async m=>{addMiss(m);$('#act').innerHTML=`<button id="nx">${R.i+1<total?'다음 문제 ▶':'끝! ▶'}</button>`;$('#nx').onclick=async()=>{await save({i:R.i+1,...(R.i+1>=total?{done:true,at:Date.now()}:{})});stage3();};}});
  }
  const ch=R.ch||0;
  shell(`<div class="panel quiz pop"><div><span class="band">3단계 끝</span></div><div class="big">원의 넓이 4문제 성공!</div>${FORMULA}
     <p>짝과 풀이를 비교해 봐요. 지름을 준 문제에서 무엇을 먼저 했나요?</p></div>
    <div class="panel grid" id="work"></div>`);
  const work=$('#work');
  if(ch===0)return fillEq(work,{id:'c5',html:`<h2>⭐ 빨리 끝낸 친구 도전 1</h2><p style="margin:0">원주가 31.4 cm인 둥근 접시가 있어요. 접시의 넓이는?</p>
      <div class="eq">지름 = 31.4 ÷ 3.14 = <input id="a" type="number" inputmode="decimal" aria-label="지름"> cm</div>
      <div class="eq">반지름 = <input id="b" type="number" inputmode="decimal" aria-label="반지름"> cm</div>
      <div class="eq">넓이 = <input id="c" type="number" inputmode="decimal" aria-label="넓이"> cm²</div>`,
    fields:[{id:'a',want:10},{id:'b',want:5},{id:'c',want:78.5}],hint:v=>same(v[2],314)?'반지름 5로 계산해요.':'',solve:'지름 10, 반지름 5, 5 × 5 × 3.14 = <b>78.5</b>',okText:'맞았어요! 78.5 cm²',
    onOk:async()=>{await wait(900);await save({ch:1});stage3();}});
  if(ch===1)return pick(work,{id:'c6',fig:`<h2>⭐ 도전 2</h2>`,q:'반지름이 2배가 되면 원의 넓이는 몇 배가 될까요?<br><small class="muted">(반지름 1 cm와 2 cm로 계산해 봐요)</small>',a:'4배',o:['2배','3배'],
    why:{'2배':'1 × 1 × 3.14 = 3.14, 2 × 2 × 3.14 = 12.56. 몇 배인가요?','3배':'1 × 1 × 3.14 = 3.14, 2 × 2 × 3.14 = 12.56. 몇 배인가요?'},onOk:async()=>{await save({ch:2});stage3();}});
  work.innerHTML=`<h2>⭐ 도전 모두 성공!</h2><p style="margin:0">반지름이 2배 → 넓이는 2 × 2 = 4배. 반지름을 두 번 곱하기 때문이에요.</p><p class="muted" style="margin:0">TV를 보며 기다려요.</p>`;

/* ---------- student: room ---------- */
let me=null, ROOMV={}, ME={}, cur=1, onMe=null;
function enterRoom(){
  clearOffs();ClassWatch.student({db,room:me.room,root:app});ClassWatch.who(me.num,me.name);
  $('#sub').textContent=`${me.num}번 ${me.name}`;
  app.innerHTML='<div class="panel"><h2>들어가는 중…</h2></div>';
  let ready=false;ROOMV={};onMe=null;
  listen(roomRef(me.room).child('students/'+me.num),s=>{
    const v=s.val();
    if(!v){store(APP+'-student',null);me=null;clearOffs();return joinView();}
    ME=v;
    if(!ready){ready=true;if(ROOMV.stage){cur=ROOMV.stage;renderStage();}return;}
    if(typeof onMe==='function')onMe();
  });
  listen(roomRef(me.room).child('stage'),s=>{
    const st=s.val()||1;const was=ROOMV.stage;ROOMV.stage=st;
    if(!ready)return;
    if(was!==st){cur=st;renderStage();} else drawSteps();
  });
  /* 선생님이 시작을 누르기 전에는 그 단계를 대기 화면으로 보여 줘요 */
  listen(roomRef(me.room).child('go'),s=>{
    const g=s.val()||0;const was=ROOMV.go||0;ROOMV.go=g;
    if(!ready)return;
    if((cur>was)!==(cur>g))renderStage(); else drawSteps();
  });
}
function waitView(){
  ClassWatch.step('대기',{n:cur,total:NST,wait:true});
  shell(`<div class="panel quiz pop"><div><span class="band">${cur}단계 · ${STAGES[cur].k}</span></div><div class="emoji" aria-hidden="true">👂</div>
    <h2 style="font-size:1.8rem">선생님 설명을 들어요</h2><p>선생님이 <b>시작</b>을 누르면 활동이 열려요. 태블릿은 잠깐 내려놓아요.</p></div>`);
}
function stepDone(n){return !!(ME['s'+n]&&ME['s'+n].done);}
function drawSteps(){
  const el=$('#steps');if(!el)return;
  el.innerHTML=[1,2,3].map(n=>`<button data-s="${n}" ${n>ROOMV.stage||n>(ROOMV.go||0)?'disabled':''} ${n===cur?'aria-current="step"':''} class="${stepDone(n)?'done':''}"><b>${n}</b>${STAGES[n].k}${stepDone(n)?' ✓':''}</button>`).join('');
  $$('#steps button').forEach(b=>b.onclick=()=>{cur=+b.dataset.s;renderStage();});
}
function shell(inner){
  app.innerHTML=`<div class="grid"><nav class="steps" id="steps" aria-label="활동 단계"></nav>${inner}<div style="text-align:right"><button class="ghost" id="relog" style="font-size:.85rem;padding:.4em .8em">다른 이름으로 들어가기</button></div></div>`;
  $('#relog').onclick=()=>{store(APP+'-student',null);me=null;clearOffs();joinView();};
  drawSteps();
}
function renderStage(){
  if(cur>(ROOMV.go||0))return waitView();
  ClassWatch.step(STAGES[cur].k,{n:cur,total:NST,wait:stepDone(cur)});
  onMe=()=>drawSteps();
  if(cur===1)return stage1();
  if(cur===2)return stage2();
  return stage3();
}

function withTimeout(pr,ms=10000){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),ms))]);}
function showError(e){
  const m=String(e&&(e.code||e.message)||e);
  let why='알 수 없는 오류가 났어요.';
  if(/permission/i.test(m)) why='Firebase 데이터베이스의 <b>규칙</b>이 막고 있어요. Realtime Database → 규칙 탭을 확인해 주세요.';
  else if(/TIMEOUT/.test(m)) why='Firebase 서버에 10초 동안 연결되지 않았어요. 학교 인터넷이 Firebase를 막고 있을 수 있어요.';
  $('#sub').textContent='연결 문제';
  app.innerHTML=`<div class="panel grid"><h2 style="color:var(--bad)">서버에 연결하지 못했어요</h2><p>${why}</p><p class="muted">오류 내용: <code>${esc(m)}</code></p><div class="row"><button id="retry">다시 시도</button><button class="ghost" id="home">처음으로</button></div></div>`;
  $('#retry').onclick=()=>location.reload(); $('#home').onclick=()=>{location.hash='';startView();};
}
window.addEventListener('unhandledrejection',ev=>showError(ev.reason));
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.database();
const roomRef=c=>db.ref('rooms/'+c);
const params=new URLSearchParams(location.search);
let ROOM=params.get('room')||'';
let offs=[];const clearOffs=()=>{offs.forEach(f=>f());offs=[];};
function listen(ref,cb){const h=ref.on('value',cb);offs.push(()=>ref.off('value',h));}

function parseName(s){const m=String(s).trim().match(/^(\d{1,2})\s*[번.]?\s*(.+)$/);return m?{num:+m[1],name:m[2].trim()}:null;}
function joinView(){
  clearOffs();
  const saved=store(APP+'-student');
  if(saved&&ROOM&&saved.room===ROOM){me=saved;return enterRoom();}
  $('#sub').textContent='학생 화면';
  ClassWatch.student({db,room:ROOM,root:app});ClassWatch.step('들어가기');
  app.innerHTML=`<div class="grid" style="max-width:560px;margin:0 auto">
   <div class="panel grid"><h2>방 번호</h2><input id="rm" inputmode="numeric" maxlength="4" placeholder="TV에 보이는 4자리" value="${esc(ROOM)}"></div>
   <div class="panel grid"><h2>"번호 이름"을 써요</h2><input id="nm" placeholder="예) 7 김민수" autocomplete="off"></div>
   <div class="msg bad" id="jm" role="status"></div>
   <div class="row"><button id="enter" disabled>들어가기</button><button class="ghost" id="home">처음으로</button></div></div>`;
  const chk=()=>{$('#enter').disabled=!(/^\d{4}$/.test($('#rm').value)&&parseName($('#nm').value));};
  $('#rm').oninput=chk;$('#nm').oninput=chk;
  $('#home').onclick=startView;
  ClassWatch.joinForm();
  $('#enter').onclick=async()=>{
    const code=$('#rm').value, p=parseName($('#nm').value);
    $('#enter').disabled=true;
    try{
      const open=await withTimeout(roomRef(code).child('open').get());
      if(!open.exists()){$('#jm').textContent='방 번호를 다시 확인해요.';return chk();}
      const r=await withTimeout(roomRef(code).child('students/'+p.num).transaction(c=>c?undefined:{name:p.name,joinedAt:Date.now()},undefined,false));
      if(!r.committed){const c=r.snapshot.val();
        if(!(c&&c.name===p.name)){$('#jm').textContent=`${p.num}번은 이미 "${c.name}" 이름으로 들어와 있어요. 번호를 확인해요.`;return chk();}}
    }catch(e){$('#jm').textContent='연결 문제: '+(e.code||e.message);return chk();}
    ROOM=code;me={room:code,num:p.num,name:p.name};store(APP+'-student',me);
    history.replaceState(null,'','?room='+code);
    enterRoom();
  };
}

function setStage(n){roomRef(ROOM).update({stage:n,timer:{min:STAGES[n].tm,left:STAGES[n].tm*60,endAt:0}});}

  const draw=()=>{
    $('#tvp').innerHTML=PROBS.map((P,k)=>`<div class="pcard"><b>${k+1}</b> ${esc(P.t)}${tvAns?`<br><span class="okc">${P.r} × ${P.r} × 3.14 = ${area(P.r)} ${P.u||'cm'}²</span>`:''}</div>`).join('')
      +`<div class="pcard star"><b>⭐</b> 원주 31.4 cm 접시${tvAns?`<br><span class="okc">지름 10 → 반지름 5 → 78.5 cm²</span>`:''}</div><div class="pcard star"><b>⭐</b> 반지름 2배 → 넓이 몇 배?${tvAns?' <span class="okc">4배</span>':''}</div>`;
    $('#tvaT').textContent=tvAns?'정답 가리기':'정답 보기';
    $('#tvs').innerHTML=tvSsi?`<table class="tbl"><thead><tr><th>씨름 경기장 지름</th><th>반지름</th><th>넓이</th></tr></thead><tbody>${[8,9,10].map(d=>`<tr><th>${d} m</th><td>${d/2} m</td><td>${d/2} × ${d/2} × 3.14 = <b>${r2(d*d/4*3.14)}</b> m²</td></tr>`).join('')}</tbody></table><p class="muted" style="margin:0">우리 교실 바닥은 몇 m²쯤일까요? 가로·세로를 어림해 씨름 경기장과 견주어 봐요.</p>`:'';
  };
  $('#tvtop').innerHTML=`<div class="two"><div class="panel grid"><h2 style="font-size:1.8rem">원의 넓이를 구해 봐요</h2>${FORMULA}
     <div class="plist" id="tvp"></div><div class="row"><button class="ghost" id="tvaT"></button><button class="ghost" id="tvsT">🤼 씨름 경기장 8·9·10 m</button></div></div>
    <div class="panel grid"><div style="max-width:300px;margin:0 auto">${circleSVG({d:'8~10',u:'m',color:'#F3E2B5',label:'씨름 경기장 (모래판)'})}</div><div id="tvs"></div>
     <div class="rules"><b>짝과 확인해요</b><ul><li>지름을 준 문제에서 무엇을 먼저 했나요? (지름 ÷ 2)</li><li>원주를 구하는 식과 넓이를 구하는 식은 어떻게 다른가요?</li></ul></div></div></div>`;
  $('#tvaT').onclick=()=>{tvAns=!tvAns;draw();};
  $('#tvsT').onclick=()=>{tvSsi=tvSsi?0:1;draw();};
  draw();
}
function progressBox(st,S){
  const its=ITEMS.filter(x=>x.st===st);
  const has=id=>S.filter(x=>x.ans&&x.ans[id]!==undefined).length;
  const miss=S.reduce((s,x)=>s+((x['s'+st]&&x['s'+st].miss)||0),0);
  return `<div class="panel grid"><h2>얼마나 했나요?</h2><div class="bars">${its.map((q,k)=>`<div class="bar"><span>${esc(q.q.length>26?q.q.slice(0,25)+'…':q.q)}</span><div class="track"><div style="width:${S.length?has(q.id)/S.length*100:0}%"></div></div><span>${has(q.id)}명</span></div>`).join('')}</div>${st>1?`<p class="muted" style="margin:0">다시 계산한 횟수: 우리 반 ${miss}번</p>`:''}</div>`;
}
/* 문제별 정답률 + 틀린 학생 이름 (처음 답 기준) */
function quizStats(S,st){
  return ITEMS.map(q=>({q,no:ITEMS.filter(x=>x.st===q.st).indexOf(q)+1})).filter(r=>tvAll||r.q.st===st).map(r=>{
    const done=S.filter(x=>x.ans&&x.ans[r.q.id]!==undefined);
    const miss=done.filter(x=>x.ans[r.q.id]===false);
    const ok=done.length-miss.length;
    return {...r,done:done.length,ok,miss,rate:done.length?Math.round(ok/done.length*100):null};
  });
}
function quizBox(S,st){
  const R=quizStats(S,st).sort((a,b)=>(a.rate??101)-(b.rate??101)||a.q.st-b.q.st||a.no-b.no);
  return `<div class="panel grid" id="qstat"><div class="row" style="justify-content:space-between"><h2>문제별 정답률 ${tvAll?'(모든 단계)':`(${st}단계)`}</h2><div class="row"><button class="ghost" id="allT">${tvAll?'이 단계만':'모든 단계 보기'}</button><button class="ghost" id="wrongT">${showWrong?'이름 가리기':'틀린 학생 이름 보기'}</button></div></div>
   <p class="muted" style="margin:0">처음 답한 것이 맞은 비율이에요. 낮은 문제부터 보여요. 다시 골라서 맞힌 학생도 틀린 학생에 들어가요.</p>
   <div class="qrate">${R.map(r=>`<div class="qrow${r.rate!==null&&r.rate<70?' low':''}" data-q="${r.q.id}">
     <div class="qt"><b>${r.q.st}-${r.no}</b> ${esc(r.q.q)}<br><small class="muted">정답: ${esc(r.q.a)}</small></div>
     <div class="qb"><div class="track"><div style="width:${r.rate||0}%"></div></div><span class="pc">${r.rate===null?'-':r.rate+'%'}</span><small class="muted">${r.ok}/${r.done}명</small></div>
     <div class="qw">${r.miss.length?`틀린 학생 <b>${r.miss.length}명</b>${showWrong?`: <span class="who">${r.miss.map(x=>`<span style="white-space:nowrap">${esc(x.n)} ${esc(x.name)}</span>`).join(', ')}</span>`:''}`:'<span class="muted">틀린 학생 없음</span>'}</div></div>`).join('')}</div></div>`;
}

/* ---------- route ---------- */
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash==='#teacher')teacherView();
else if(ROOM)joinView();
else startView();
</script>
