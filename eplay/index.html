<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영어 쓰기 마당</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@600;800&display=swap">
<style>/* 줄은 어절 단위로만 바꿔요 */ html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0}
:root{
  --wall:#E9DFC4; --card:#FFFDF7; --cream:#F7E8C2; --coral:#F98F6E; --coral2:#E0704F; --ink:#453422; --body:#6D4215; --muted:#8A7458;
  --line:#DCCDA6; --ok:#3F8A5A; --bad:#C8452D; --blue:#3D6E8C; --blue2:#8DB3C7; --gold:#E9B04F;
  --display:'Jua','Gowun Dodum',system-ui,sans-serif; --text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --en:'Nunito','Segoe UI',system-ui,sans-serif; color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:.7em 1.1em;cursor:pointer;background:var(--coral);color:#fff;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--coral2);border:2px solid var(--coral)}
input,textarea{font-family:var(--text);font-size:1.1rem;padding:.55em .75em;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
textarea{font-family:var(--en);font-size:1rem;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.top{background:var(--ink);color:#fff;padding-block:12px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem}
.top small{opacity:.85;font-size:.95rem}
main{padding-block:18px 60px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.band{display:inline-block;background:var(--coral);color:#fff;font-family:var(--display);padding:.15em .8em;border-radius:6px;font-size:1.05rem}
.msg{font-family:var(--display);font-size:1.15rem;min-height:1.5em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.rules{background:#FFF4DF;border:2px solid var(--coral);border-radius:14px;padding:12px 16px}
.rules ul,.rules ol{margin:.3em 0 0;padding-left:1.3em}
.big{font-family:var(--display);font-size:clamp(1.5rem,4vw,2.3rem);color:var(--coral2);line-height:1.25}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.5em .9em;font-size:1.02rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.fld{display:grid;gap:6px}.fld>.lb{font-family:var(--display);font-size:1.1rem}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr 1fr;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.choose button{font-size:1.35rem;padding:1em}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.gcards button{background:#fff;color:var(--ink);border:3px solid var(--line);text-align:left;display:grid;gap:4px;align-content:start;font-family:var(--text);font-size:1rem;line-height:1.4}
.gcards button b{font-family:var(--display);font-weight:400;font-size:1.35rem}
.gcards button[aria-pressed="true"]{border-color:var(--coral2);background:#FFF4DF}
.en{font-family:var(--en);font-weight:800;letter-spacing:.01em}
.ko{font-family:var(--display);font-size:clamp(1.2rem,3.6vw,1.6rem);line-height:1.35}
.pic{font-size:clamp(2.6rem,9vw,4rem);line-height:1}
.pic img{display:block;width:min(240px,60vw);aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:3px solid var(--line);background:#fff;margin:0 auto}
.thumb{width:2.2em;height:1.65em;object-fit:cover;border-radius:4px;vertical-align:middle}
.write{font-family:var(--en);font-weight:800;font-size:clamp(1.15rem,3.6vw,1.6rem);padding:.6em .7em}
.card{display:grid;gap:14px;justify-items:center;text-align:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:3.4em}
.tiles button{font-family:var(--en);font-weight:800;font-size:1.3rem;background:#fff;color:var(--ink);border:2px solid var(--line);padding:.45em .8em}
.tiles button.used{visibility:hidden}
.built{min-height:3.6em;width:100%;border:2px dashed var(--line);border-radius:14px;padding:8px;background:#fff}
.built button{background:var(--cream);border-color:var(--coral)}
.diff{font-family:var(--en);font-weight:800;font-size:1.3rem;line-height:1.7}
.diff .w{color:var(--ok)} .diff .x{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px}
.diff .m{color:var(--bad);border:2px dashed var(--bad);border-radius:6px;padding:0 .4em;margin:0 .15em;font-size:.9em}
.ghostans{font-family:var(--en);font-weight:800;font-size:clamp(1.2rem,3.6vw,1.6rem);color:var(--blue);background:#EAF2F6;border-radius:10px;padding:.3em .7em}
.myscore{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-family:var(--display);font-size:1.15rem}
.myscore b{color:var(--coral2);font-size:1.4rem;font-weight:400}
.listen{background:var(--blue);font-size:.95rem;padding:.45em .9em}
.opts{display:grid;gap:10px;width:100%}
.opts button{background:#fff;color:var(--ink);border:3px solid var(--line);font-family:var(--en);font-weight:800;font-size:clamp(1.15rem,3.4vw,1.5rem);padding:.7em}
.opts button.on{border-color:var(--coral2);background:#FFF4DF}
.opts button.right{border-color:var(--ok);background:#E3F1E7}
.opts button.wrong{border-color:var(--bad);background:#F6E1DB}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.side{background:#fff;border:4px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px;justify-items:center;text-align:center;color:var(--ink);font-family:var(--text)}
.side .tm{font-size:clamp(2.4rem,7vw,3.6rem);line-height:1}
.side .s{font-family:var(--en);font-weight:800;font-size:clamp(1.15rem,3.2vw,1.9rem);line-height:1.35}
.side.L{border-color:#E0704F}.side.R{border-color:#3D6E8C}
.side.win{background:#FFF4D6;box-shadow:0 0 0 4px var(--gold)}
.timer{font-family:var(--display);font-size:clamp(2.6rem,7vw,4.2rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--bad)}
.count{position:fixed;inset:0;background:rgba(69,52,34,.82);display:grid;place-items:center;z-index:50;color:#fff;font-family:var(--display);font-size:clamp(5rem,26vw,14rem)}
/* teacher */
.tv{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
.qrp{display:grid;justify-items:center;gap:6px;text-align:center}
#qrbox{background:#fff;padding:10px;border-radius:12px}
#qrbox img,#qrbox canvas{display:block;max-width:100%}
.roomcode{font-family:var(--display);font-size:2.4rem;letter-spacing:.1em;color:var(--coral2)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:.25em .7em;font-size:.95rem}
.people button.ok{border-color:var(--ok)}
.feed{display:grid;gap:6px}
.feed div{background:#fff;border-left:6px solid var(--coral);border-radius:10px;padding:6px 12px;font-family:var(--display);font-size:1.05rem}
.rank{display:grid;gap:4px}
.rank div{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;background:#fff;border-radius:10px;padding:4px 10px;font-family:var(--display);font-size:1.1rem}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;text-align:center}
.podium div{background:var(--coral);color:#fff;border-radius:16px 16px 0 0;padding:16px 8px;font-family:var(--display)}
.podium div b{display:block;font-size:2.4rem;font-weight:400}
.podium div span{display:block;font-size:1.5rem}
.podium .p1{background:var(--gold);min-height:230px}.podium .p2{min-height:180px;background:var(--blue2)}.podium .p3{min-height:140px}
.preview{max-height:220px;overflow:auto;display:grid;gap:4px;font-size:.95rem}
.preview div{background:#fff;border-radius:8px;padding:4px 10px}
.preview u{text-decoration-color:var(--coral);text-decoration-thickness:3px}
/* 문제별 정답률 */
.qrate{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:1.6fr 1fr 1.2fr;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.qrow.low{border-color:var(--bad);background:#FFF5F2}
.qrow .qb{display:grid;grid-template-columns:minmax(0,1fr) 3.6em;gap:2px 8px;align-items:center}
.qrow .track{height:14px;border-radius:999px;background:var(--cream);overflow:hidden}
.qrow .track div{height:100%;background:var(--ok);border-radius:999px}
.qrow.low .track div{background:var(--bad)}
.qrow .pc{font-family:var(--display);font-size:1.3rem}
.qrow.low .pc{color:var(--bad)}
/* 경주 */
.race{display:grid;gap:14px;background:linear-gradient(#EAF2F6,#F7E8C2);border:2px solid var(--line);border-radius:18px;padding:16px}
.lane{position:relative;height:84px;background:repeating-linear-gradient(90deg,#fff 0 46px,#F4EEDD 46px 92px);border-radius:14px;border:3px solid var(--line);overflow:hidden}
.lane .fin{position:absolute;right:0;top:0;bottom:0;width:16px;background:repeating-linear-gradient(#453422 0 10px,#fff 10px 20px)}
.lane .rn{position:absolute;top:50%;font-size:56px;line-height:1;transform:translate(-50%,-50%) scaleX(-1)}
.lane .lb{position:absolute;left:10px;top:4px;font-family:var(--display);font-size:1rem;color:var(--muted)}
/* 번개 받아쓰기 */
.flyzone{position:relative;height:260px;background:#1F2A33;border-radius:18px;overflow:hidden;color:#fff}
.flyzone .fly{position:absolute;left:0;right:0;top:50%;text-align:center;font-family:var(--en);font-weight:800;font-size:clamp(2.4rem,6vw,4.4rem);white-space:nowrap;opacity:0}
.flyzone .fly span{display:inline-block;white-space:pre}
@keyframes a-slide{0%{transform:translate(100%,-50%);opacity:1}100%{transform:translate(-100%,-50%);opacity:1}}
@keyframes a-spin{0%{transform:translate(90%,-50%) rotate(0);opacity:1}100%{transform:translate(-90%,-50%) rotate(-720deg);opacity:1}}
@keyframes a-zoom{0%{transform:translateY(-50%) scale(3.2);opacity:0}25%{opacity:1}80%{opacity:1}100%{transform:translateY(-50%) scale(.15);opacity:0}}
@keyframes a-blink{0%{opacity:0}10%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes a-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}
@keyframes a-flip{0%{transform:translate(100%,-50%) scaleY(1);opacity:1}25%{transform:translate(50%,-50%) scaleY(-1)}50%{transform:translate(0,-50%) scaleY(1)}75%{transform:translate(-50%,-50%) scaleY(-1)}100%{transform:translate(-100%,-50%) scaleY(1);opacity:1}}
.bigans{font-family:var(--en);font-weight:800;font-size:clamp(2rem,5vw,3.4rem);text-align:center;color:var(--ink);background:#fff;border-radius:16px;padding:.3em .6em}
/* 모자 */
.hatzone{position:relative;height:300px;background:linear-gradient(#3D6E8C,#2C5068);border-radius:18px;overflow:hidden}
.hatzone .hat{position:absolute;bottom:96px;width:30%;text-align:center;font-size:110px;line-height:1;transform:translateX(-50%);transition:none}
.hatzone .pal{position:absolute;bottom:100px;width:30%;text-align:center;font-size:64px;line-height:1;transform:translateX(-50%)}
.hatzone .labels{position:absolute;left:0;right:0;bottom:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 8px}
.hatzone .labels div{background:#fff;border-radius:12px;padding:6px 8px;text-align:center;font-family:var(--en);font-weight:800;font-size:clamp(1rem,2.2vw,1.6rem);line-height:1.25;min-height:76px;display:grid;place-items:center}
.hatzone .labels div b{display:block;font-family:var(--display);font-weight:400;color:var(--muted);font-size:.85rem}
.hatzone .labels div.on{background:#FFF4D6;box-shadow:0 0 0 4px var(--gold)}
/* 우주 정거장 */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.doors button{background:#2C3E50;color:#fff;border-radius:18px;padding:18px 12px;display:grid;gap:8px;justify-items:center;font-family:var(--en);font-weight:800;font-size:clamp(1.1rem,3vw,1.5rem);line-height:1.35;border:5px solid #8DA2B5}
.doors button .d{font-size:2.6rem;line-height:1}
.robot{background:#EAF2F6;border:2px solid var(--blue2);border-radius:16px;padding:10px 14px;text-align:left;width:100%}
.map{display:grid;gap:6px}
.map .mr{display:grid;grid-template-columns:7.5em 1fr 3.4em;gap:8px;align-items:center}
.map .mr .nm{font-family:var(--display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map .cells{display:grid;gap:3px}
.map .cells i{height:30px;border-radius:6px;background:#fff;border:2px solid var(--line);font-style:normal;display:grid;place-items:center;font-size:1.1rem}
.map .cells i.cp{border-color:var(--gold)}
.map .cells i.past{background:#E3F1E7;border-color:#B9D9C3}
.map .cells i.me{background:#FFF4D6;border-color:var(--coral2)}
.map .pt{font-family:var(--display);text-align:right}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:sh .35s} @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pop{animation:pop .45s ease-out} @keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:none;opacity:1}}
  .confetti{position:fixed;top:-20px;z-index:60;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
}
@media (max-width:820px){
  .hero,.tv,.qrow{grid-template-columns:1fr}
  .choose{grid-template-columns:1fr}
  .map .mr{grid-template-columns:5.5em 1fr 3em}
}
</style></head><body>

  'ybm-6-9':{name:'YBM(최희경) 6-9 How Can I Get to the Library?',text:`../tower/img/ybm-6-9/s01_bus.webp | 그곳에 버스로 갈 수 있어. | You can get there [by] [bus].

  'ybm-6-11':{name:'YBM(최희경) 6-11 Do You Know about the Space Station?',text:`🛰️ | 너는 우주 정거장에 대해 알고 있니? | Do you know about the [space station]?

  const a=fixQuotes(input).trim().split(/\s+/).filter(Boolean), b=fixQuotes(answer).trim().split(/\s+/).filter(Boolean);
  const k=w=>words(w).join(' ');
  const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=k(a[i])===k(b[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0,missing=0;
  while(i<n||j<m){
    if(i<n&&j<m&&k(a[i])===k(b[j])){out.push(`<span class="w">${esc(a[i])}</span>`);i++;j++;}

    else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){out.push(`<span class="m">?</span>`);missing++;j++;}
    else{out.push(`<span class="x">${esc(a[i])}</span>`);i++;}

function raceTrack(seed,win){
  const r=rng(seed);const mk=()=>{const p=[0];for(let i=0;i<8;i++)p.push(p[i]+.4+r());return p;};
  const L=mk(),R=mk();
  const norm=(p,end)=>p.map(x=>x/p[8]*end);
  const lose=.86+r()*.1;
  return {L:norm(L,win==='L'?1:lose),R:norm(R,win==='R'?1:lose)};
}
const RACE_MS=9000;
function racePos(p,t){const x=Math.max(0,Math.min(1,t/RACE_MS))*8;const i=Math.min(7,Math.floor(x));return p[i]+(p[i+1]-p[i])*(x-i);}

function hatPlan(seed,swaps,spicy){const r=rng(seed);const L=[];for(let i=0;i<swaps;i++){if(spicy&&r()<.35){L.push(r()<.5?[0,2]:[2,0]);continue;}const a=r()<.5?0:1;L.push(r()<.5?[a,a+1]:[a+1,a]);}return L;}

function storyScene(items,num,room,k){

  if(k===skey||busy){drawMine();return;}
  skey=k;ClassWatch.detail(null);
  const g=GAMES[CF.game],ph=CF.phase||'setup';
  if(!g||ph==='setup'){ClassWatch.step('기다리기',{wait:true});return shell(`<div class="panel card pop"><div class="pic">⏳</div><h2 style="font-size:1.8rem">들어왔어요!</h2><p class="big" style="font-size:1.35rem">선생님이 게임을 고르고 있어요.<br><span class="muted" style="font-size:1rem">TV를 보며 기다려요.</span></p></div>`);}
  if(ph==='lobby'){ClassWatch.step('기다리기',{wait:true});return shell(`<div class="panel card pop"><div class="pic">${g.icon}</div><h2 style="font-size:1.9rem">${g.name}</h2>
    <div class="rules" style="text-align:left;width:100%"><b>게임 방법</b><ol>${g.rules.map(x=>`<li>${x}</li>`).join('')}</ol>${CF.game!=='story'?'<p style="margin:.4em 0 0">⌨️ 키보드를 <b>영어</b>로 바꿔 두어요.</p>':''}</div>
    <p class="big" style="font-size:1.35rem">선생님이 시작할 때까지 기다려요.</p></div>`);}
  if(ph==='end')return stuEnd();

  if(CF.game!=='story'&&!R){return shell(`<div class="panel card pop"><div class="pic">📺</div><h2>TV를 보세요!</h2><p class="big">곧 첫 문제가 나와요.</p></div>`);}

function shell(inner){

   <div class="row" style="justify-content:space-between"><button class="ghost" id="relog" style="font-size:.85rem;padding:.4em .8em">다른 이름으로 들어가기</button></div></div>`;
  $('#relog').onclick=()=>{store('ep-student',null);me=null;clearOffs();joinView();};

}
function drawMine(){const el=$('#mine');if(!el)return;const g=GAMES[CF.game];
  el.innerHTML=g&&CF.phase!=='setup'?(CF.game==='story'?`<span>${me.num}번 ${esc(me.name)}</span><span>지나온 방 <b>${(ME.s||{}).pos||0}</b> / ${storyLen(CF.items||[])}</span>`:`<span>${me.num}번 ${esc(me.name)}</span><span>내 점수 <b>${ME.score||0}</b></span>`):'';}
const stamp=qid=>{const st=ME.st||{};return st[qid]===undefined;};
function firstTry(qid,ok){if(stamp(qid)){ME.st=Object.assign({},ME.st,{[qid]:ok?1:0});meRef('st/'+qid).set(ok?1:0);}}
// 쓰기 칸 (쉬운 화면이면 낱말 카드 늘어놓기)
function writer(box,answer,{easy,hint,onRight,onWrong,maxTries=0,show=false}){
  let tries=0,shown=show;
  const draw=()=>{
    if(easy&&!shown){
      const t=shuffle(tilesOf(answer).map((w,i)=>({w,i})));
      box.innerHTML=`<div class="built tiles" id="built" aria-label="만든 문장"></div><div class="tiles" id="pool">${t.map(x=>`<button data-i="${x.i}">${esc(x.w)}</button>`).join('')}</div>
        <div class="diff" id="fb"></div><div class="msg" id="qm" role="status"></div><div class="row" style="justify-content:center"><button id="ok">확인 ✔</button><button class="ghost" id="clr">다시 놓기</button></div>`;
      const pick=[];const ws=tilesOf(answer);
      const d=()=>{$('#built',box).innerHTML=pick.map((i,k)=>`<button data-k="${k}">${esc(ws[i])}</button>`).join('');
        $$('#built button',box).forEach(b=>b.onclick=()=>{const i=pick.splice(+b.dataset.k,1)[0];$(`#pool button[data-i="${i}"]`,box).classList.remove('used');d();});};
      $$('#pool button',box).forEach(b=>b.onclick=()=>{if(b.classList.contains('used'))return;b.classList.add('used');pick.push(+b.dataset.i);d();});
      $('#clr',box).onclick=()=>{pick.length=0;$$('#pool button',box).forEach(b=>b.classList.remove('used'));d();};
      box._val=()=>pick.map(i=>ws[i]).join(' ');
    }else{
      box.innerHTML=`${shown?`<p style="margin:0">정답을 보고 따라 써요.</p><div class="ghostans">${esc(plain(answer))}</div>`:''}
        <input class="write" id="w" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(hint||'영어로 써요')}">
        <div class="diff" id="fb" aria-live="polite"></div><div class="msg" id="qm" role="status"></div><div class="row" style="justify-content:center"><button id="ok">확인 ✔</button></div>`;
      const w=$('#w',box);setTimeout(()=>w.focus(),50);w.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
      box._val=()=>w.value;
    }
    $('#ok',box).onclick=check;
    ClassWatch.detail(()=>({w:box._val?box._val():''}));
  };
  const check=async()=>{
    const v=box._val();if(!v.trim())return;
    if(same(v,plain(answer))){SFX.right();$('#qm',box).className='msg ok';$('#qm',box).textContent='맞았어요!';$('#fb',box).innerHTML=`<span class="w">${esc(plain(answer))}</span>`;$('#ok',box).disabled=true;onRight&&onRight(v,tries===0&&!shown);return;}
    tries++;SFX.wrong();box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
    onWrong&&onWrong(v,tries);
    const d=diff(v,plain(answer));
    if(!easy||shown)$('#fb',box).innerHTML=d.html;
    $('#qm',box).className='msg bad';
    if(maxTries&&tries>=maxTries){$('#qm',box).textContent='기회를 다 썼어요.';$('#ok',box).disabled=true;return;}
    if(tries>=2&&!shown&&!maxTries){$('#qm',box).textContent='두 번 틀렸어요. 정답을 보고 따라 써요.';await sleep(1300);shown=true;tries=0;draw();return;}
    $('#qm',box).textContent=easy&&!shown?'낱말 순서를 다시 생각해 봐요.':(d.missing?`빠진 낱말이 ${d.missing}개 있어요.`:'빨간 낱말의 철자를 확인해요.');
  };
  draw();
}

  }
  if(R.stage==='race'){
    shell(`<div class="panel card pop"><div class="pic">📺</div><h2 style="font-size:2rem">TV를 보세요!</h2>${a.side?`<p class="big">${tm(a.side)[0]} ${tm(a.side)[1]} 팀 힘내라!</p>${a.ok?'':'<p class="muted">문장을 다 쓰지 못했어요. 다음 라운드에 도전!</p>'}`:'<p class="muted">이번 라운드는 고르지 않았어요.</p>'}</div>`);return;
  }
  const win=R.win,pts=a.pts||0;
  if(pts>0){SFX.right();confetti(pts>=3?40:16);}
  shell(`<div class="panel card pop"><span class="band">${R.n}라운드 결과</span><div class="pic">${tm(win)[0]}</div><h2 style="font-size:1.8rem">${tm(win)[1]} 팀 승리!</h2>
    <p class="big">${a.ok?(a.side===win?`이긴 팀 문장! +${pts}점`:`진 팀이지만 바르게 썼어요! +${pts}점`):'이번엔 0점'}</p><p class="muted">선생님이 다음 라운드를 열 때까지 기다려요.</p></div>`);
}

  else if(ph==='play'){

  if(el._h!==h){el._h=h;el.innerHTML=h;

    on('b-stop',()=>{if(confirm('게임을 끝낼까요?'))rref().child('cfg/phase').set('end');});

    on('b-again',()=>{if(confirm('같은 게임·문장으로 한 판 더 할까요? 점수는 0이 돼요.'))resetTo('lobby');});

}
function teacherTick(){
  const el=$('#tm');if(!el)return clearInterval(tick);
  const c=cfg(),r=RD.r;let left=null;
  if(c.phase==='play'&&c.game==='story')left=Math.max(0,Math.ceil((c.endAt-now())/1000));
  else if(c.phase==='play'&&r&&r.endAt&&['write','go'].includes(r.stage))left=Math.max(0,Math.ceil((r.endAt-now())/1000));
  el.textContent=left===null?(c.phase==='end'?'끝!':'⏸'):fmt(left);
  el.classList.toggle('end',left!==null&&left<=10);
  if(left!==null&&left<=5&&left>0&&left!==teacherTick.last){teacherTick.last=left;SFX.tick();}
  if(c.phase!=='play')return;
  if(c.game==='story'){if(now()>c.endAt&&fired!=='storyend'+c.gid){fired='storyend'+c.gid;SFX.end();rref().child('cfg/phase').set('end');}return;}
  if(!r)return;
  const key=r.n+r.stage;
  if(c.game==='cup'&&r.stage==='write'&&now()>r.endAt&&fired!==key){fired=key;closeStage();}
  if(c.game==='cup'&&r.stage==='race'&&now()>r.at+RACE_MS+800&&fired!==key){fired=key;finishRound();}
  if(c.game==='speed'&&r.stage==='go'&&now()>r.endAt&&fired!==key){fired=key;finishRound();}
  if(c.game==='hats'&&r.stage==='shuffle'&&now()>r.at+HAT_SHOW+HAT_DOWN+r.swaps.length*r.step+500&&fired!==key){fired=key;rref().child('r').update({stage:'write',endAt:now()+(r.kind==='s'?50000:30000)});}
  if(c.game==='hats'&&r.stage==='write'&&now()>r.endAt&&fired!==key){fired=key;finishRound();}
}
async function resetTo(phase,extra={}){
  const up={};studs().forEach(x=>{up[`students/${x.n}/score`]=0;up[`students/${x.n}/a`]=null;up[`students/${x.n}/st`]=null;up[`students/${x.n}/s`]=null;});
  up.r=null;up.feed=null;up['cfg/qs']=null;up['cfg/phase']=phase;up['cfg/award']=false;up['cfg/endAt']=0;up['cfg/gid']=(cfg().gid||1)+1;
  Object.entries(extra).forEach(([k,v])=>up['cfg/'+k]=v);
  fired='';await rref().update(up);
}
async function startGame(){
  const c=cfg();
  if(c.game==='story'){
    const items=c.items,qs={};items.forEach((it,k)=>{qs['i'+k]={t:`${it.pic&&!isImg(it.pic)?it.pic+' ':''}${it.ko}`,a:plain(it.en)};});
    await rref().child('cfg').update({phase:'play',startAt:now(),endAt:now()+(c.opt.storyMin||15)*60000,qs});return;
  }
  await rref().child('cfg/phase').set('play');
  nextRound(1);
}
async function nextRound(force){
  const c=cfg(),items=c.items||[],n=force||((RD.r?RD.r.n:0)+1),total=c.opt.rounds||8;
  if(n>total){await rref().child('cfg/phase').set('end');return;}
  const seed=Math.floor(Math.random()*1e9),r0=rng(seed);
  const used=(c.used||[]);
  const pickItems=(k)=>{let pool=items.map((_,i)=>i).filter(i=>!used.includes(i));if(pool.length<k)pool=items.map((_,i)=>i);return shuffle(pool,r0).slice(0,k);};
  let r={n,seed,at:now()},qs={};
  if(c.game==='cup'){
    const [a,b]=pickItems(2);const tp=shuffle(TEAMS.map((_,i)=>i),r0);
    r={...r,stage:'write',L:{k:a,tm:tp[0]},R:{k:b,tm:tp[1]},sport:Math.floor(r0()*SPORTS.length),win:r0()<.5?'L':'R',endAt:now()+(c.opt.sec||60)*1000};
    qs['c'+n+'L']={t:`${n}라운드 ${TEAMS[tp[0]][0]} 팀`,a:plain(items[a].en)};qs['c'+n+'R']={t:`${n}라운드 ${TEAMS[tp[1]][0]} 팀`,a:plain(items[b].en)};
    await rref().update({'cfg/used':[...used,a,b].slice(-Math.max(2,items.length-2))});
  }else if(c.game==='speed'){
    const W=wordList(items),half=Math.ceil(total/2),kind=n<=half&&W.length>=2?'w':'s';
    let text,ko='';
    if(kind==='w'){const usedW=c.usedW||[];let pool=W.filter(w=>!usedW.includes(w));if(!pool.length)pool=W;text=pool[Math.floor(r0()*pool.length)];await rref().child('cfg/usedW').set([...usedW,text]);}
    else{const [k]=pickItems(1);text=plain(items[k].en);ko=items[k].ko;await rref().child('cfg/used').set([...used,k].slice(-Math.max(1,items.length-1)));}
    const others=(kind==='w'?W:items.map(x=>plain(x.en))).filter(x=>x.toLowerCase()!==text.toLowerCase());
    const opts=shuffle([text,others[Math.floor(r0()*others.length)]||text.split('').reverse().join('')],r0);
    const stage=Math.min(ANIMS.length-1,Math.floor((n-1)/total*ANIMS.length));
    const anim=n===1?'slide':ANIMS[Math.min(ANIMS.length-1,stage+(r0()<.4?1:0))];
    const base={slow:1.5,normal:1,fast:.7}[c.opt.speed||'normal'];
    const dur=Math.round((kind==='s'?5200:3600)*base*(1-.35*(n-1)/Math.max(1,total-1)));
    r={...r,stage:'go',kind,text,ko,opts,anim,dur,replay:0,endAt:now()+dur+(kind==='s'?30000:20000)};
    qs['p'+n]={t:`${n}번 ${kind==='s'?'문장':'낱말'}`,a:text};
  }else if(c.game==='hats'){
    const W=wordList(items),half=Math.ceil(total/2),kind=n<=half&&W.length>=3?'w':'s';
    const labels=kind==='w'?shuffle(W,r0).slice(0,3):pickItems(3).map(k=>plain(items[k].en));
    const spicy=!!c.opt.spicy,swaps=hatPlan(seed,(spicy?8:5)+Math.floor(n/3),spicy),start=Math.floor(r0()*3);
    r={...r,stage:'shuffle',kind,labels,start,swaps,step:spicy?430:650,fin:hatFinal(start,swaps)};
    qs['h'+n]={t:`${n}번 ${kind==='s'?'문장':'낱말'}`,a:labels[r.fin]};
  }
  fired='';
  const up={r};Object.entries(qs).forEach(([k,v])=>up['cfg/qs/'+k]=v);
  await rref().update(up);
}
function closeStage(){
  const c=cfg(),r=RD.r;if(!r)return;
  if(c.game==='cup'&&r.stage==='write'){SFX.drum();rref().child('r').update({stage:'race',at:now()+300});}
  else finishRound();
}
async function finishRound(){
  const c=cfg(),r=RD.r;if(!r||r.stage==='done')return;
  const up={'r/stage':'done'};
  studs().forEach(x=>{
    const a=(x.a||{})[r.n];if(!a)return;let pts=0;
    if(c.game==='cup'){if(a.ok)pts=a.side===r.win?3:1;}
    else if(c.game==='speed'){if(a.ok)pts=r.kind==='s'?2:1;}
    else if(c.game==='hats'){const ok=!!a.t&&same(a.t,r.labels[r.fin]);pts=ok?(r.kind==='s'?3:2):0;
      const qid='h'+r.n;if(!x.st||x.st[qid]===undefined)up[`students/${x.n}/st/${qid}`]=ok?1:0;}
    up[`students/${x.n}/a/${r.n}/pts`]=pts;
    if(pts)up[`students/${x.n}/score`]=INC(pts);
  });
  if(c.game==='hats')studs().forEach(x=>{const qid='h'+r.n;if(!((x.a||{})[r.n])&&(!x.st||x.st[qid]===undefined))up[`students/${x.n}/st/${qid}`]=0;});
  await rref().update(up);
}

      <p class="muted" style="margin:0">⏸ 학생 화면은 선생님이 ▶ 게임 시작을 누를 때까지 기다려요.</p></div>`;
    return;
  }
  if(c.phase==='end'){c.award?tvAward(st):tvEnd(st);return;}
  if(c.game==='story')return tvStory(st);
  if(!r){st.innerHTML='';return;}
  const head=`<div class="row" style="justify-content:space-between"><h2 style="font-size:1.7rem">${g.icon} ${g.name}</h2><span class="band">${r.n} / ${c.opt.rounds}</span></div>`;
  if(c.game==='cup')return tvCup(st,head,c,r);
  if(c.game==='speed')return tvSpeed(st,head,c,r);
  if(c.game==='hats')return tvHats(st,head,c,r);
}
function tvCup(st,head,c,r){
  const items=c.items,T=s=>TEAMS[r[s].tm];
  const sideCard=s=>{const it=items[r[s].k];return `<div class="side ${s}${r.stage==='done'&&r.win===s?' win':''}"><span class="tm">${T(s)[0]}</span><b style="font-family:var(--display);font-weight:400;font-size:1.5rem">${T(s)[1]} 팀</b><div class="pic">${picHtml(it.pic,it.ko)}</div><span class="s${c.opt.spicy&&r.stage==='write'?' later':''}">${esc(plain(it.en))}</span><span class="muted">${esc(it.ko)}</span><span class="cnt" data-c="${s}"></span></div>`;};
  if(r.stage==='write'){st.innerHTML=`<div class="panel grid">${head}<p class="big" style="text-align:center;margin:0">응원할 팀을 골라 그 팀 문장을 바르게 써요!${c.opt.spicy?'<br><small class="muted" style="font-size:1rem">🌶 매운맛: 15초 뒤에 문장이 사라져요. 잘 기억해요!</small>':''}</p><div class="sides">${sideCard('L')}${sideCard('R')}</div></div>`;
    if(c.opt.spicy){const hideAt=r.at+15000-now();setTimeout(()=>$$('.side .s.later').forEach(x=>{x.textContent='🌶 기억해서 써요!';}),Math.max(0,hideAt));}
    return;}
  const sp=SPORTS[r.sport],tr=raceTrack(r.seed,r.win);
  if(r.stage==='race'){
    st.innerHTML=`<div class="panel grid">${head}<h2 style="text-align:center;font-size:2.2rem">${sp.e} ${sp.t} 경주!</h2>
      <div class="race">${['L','R'].map(s=>`<div class="lane"><span class="lb">${T(s)[1]} 팀 · <span class="en">${esc(plain(items[r[s].k].en))}</span></span><div class="fin"></div><span class="rn" id="rn${s}">${T(s)[0]}</span></div>`).join('')}</div></div>`;
    let lastBeep=0;
    const step=()=>{const t=now()-r.at;['L','R'].forEach(s=>{const el=$('#rn'+s);if(el)el.style.left=(4+racePos(tr[s],t)*88)+'%';});
      if(t>lastBeep+700&&t<RACE_MS){lastBeep=t;SFX.swap();}
      if(t<RACE_MS+400)anim=requestAnimationFrame(step);else{SFX.fanfare();confetti(50);}};
    step();return;
  }
  st.innerHTML=`<div class="panel grid">${head}<h2 style="text-align:center;font-size:2.4rem">🏆 ${T(r.win)[0]} ${T(r.win)[1]} 팀 승리!</h2><div class="sides">${sideCard('L')}${sideCard('R')}</div>
    <div class="row" style="justify-content:center"><button class="listen" id="hearW">🔊 이긴 팀 문장 듣기</button></div></div>`;
  $('#hearW').onclick=()=>sayEn(plain(items[r[r.win].k].en));
}
function tvSpeed(st,head,c,r){
  if(r.stage==='go'){
    const letters=r.anim==='blink'||r.anim==='hop';
    const per=r.dur/Math.max(1,r.text.length);
    const inner=letters?r.text.split('').map((ch,i)=>`<span style="animation:${r.anim==='blink'?'a-blink':'a-hop'} ${r.anim==='blink'?Math.max(300,per*3):600}ms ${i*per}ms both${r.anim==='hop'?' 3':''}">${esc(ch)}</span>`).join(''):esc(r.text);
    const outer=r.anim==='blink'?`opacity:1;transform:translateY(-50%)`:r.anim==='hop'?`animation:a-slide ${r.dur}ms linear both`:`animation:a-${r.anim} ${r.dur}ms linear both`;
    st.innerHTML=`<div class="panel grid">${head}<div class="flyzone"><div class="fly" id="fly" style="${outer}">${inner}</div></div>
      <p class="big" style="text-align:center;margin:0">⚡ 본 것을 태블릿에 써요! ${r.kind==='s'?'(문장)':'(낱말)'}</p></div>`;
    SFX.whoosh();
    if(r.anim==='blink')setTimeout(()=>{const f=$('#fly');if(f)f.style.opacity=0;},r.dur+400);
    return;
  }
  st.innerHTML=`<div class="panel grid">${head}<p class="muted" style="margin:0;text-align:center">정답</p><div class="bigans">${esc(r.text)}</div>${r.ko?`<p class="ko" style="text-align:center">${esc(r.ko)}</p>`:''}
    <div class="row" style="justify-content:center"><button class="listen" id="hearS">🔊 듣기</button></div></div>`;
  $('#hearS').onclick=()=>sayEn(r.text);sayEn(r.text);
}
function tvHats(st,head,c,r){
  const lab=r.labels.map((t,i)=>`<div data-i="${i}" class="${r.stage==='done'&&i===r.fin?'on':''}"><span><b>${['①','②','③'][i]}</b>${esc(t)}</span></div>`).join('');
  st.innerHTML=`<div class="panel grid">${head}<div class="hatzone" id="hz"><span class="pal" id="pal">🐹</span>${[0,1,2].map(i=>`<span class="hat" id="hat${i}">🎩</span>`).join('')}<div class="labels">${lab}</div></div>
    <p class="big" style="text-align:center;margin:0" id="hmsg"></p></div>`;
  const X=i=>(100/6+i*100/3)+'%';
  const hats=[0,1,2].map(i=>$('#hat'+i)),pal=$('#pal');
  const T0=HAT_SHOW,T1=HAT_SHOW+HAT_DOWN,end=T1+r.swaps.length*r.step;
  // 모자 i가 처음 자리 i에서 출발해 바뀌어요. 햄스터는 처음 자리 start의 모자 안에.
  const posAt=t=>{const p=[0,1,2];let lift=[0,0,0];
    if(t<T1){return {p,y:[0,0,0],up:t<T0?1:1-(t-T0)/HAT_DOWN};}
    const k=Math.min(r.swaps.length,Math.floor((t-T1)/r.step));
    for(let i=0;i<k;i++){const [a,b]=r.swaps[i];const ha=p.indexOf(a),hb=p.indexOf(b);p[ha]=b;p[hb]=a;}
    let fx=p.slice(),y=[0,0,0];
    if(k<r.swaps.length){const f=(t-T1-k*r.step)/r.step,[a,b]=r.swaps[k];const ha=p.indexOf(a),hb=p.indexOf(b);
      fx[ha]=a+(b-a)*f;fx[hb]=b+(a-b)*f;const far=Math.abs(a-b)>1?1.8:1;y[ha]=-Math.sin(f*Math.PI)*60*far;y[hb]=Math.sin(f*Math.PI)*20;}
    return {p:fx,y,up:0};};
  const msg=$('#hmsg');
  if(r.stage==='shuffle'){
    let lastK=-1;
    const step=()=>{const t=now()-r.at,s=posAt(t);
      hats.forEach((h,i)=>{h.style.left=X(s.p[i]);h.style.transform=`translate(-50%,${s.y[i]-(i===r.start?s.up*90:0)}px)`;});
      pal.style.left=X(r.start);pal.style.visibility=t<T1?'visible':'hidden';
      msg.textContent=t<T0?'🐹 햄스터는 여기에 숨어요!':t<end?'👀 눈을 떼지 말고 따라가요!':'어디에 있을까요? 태블릿을 기다려요';
      const k=Math.floor((t-T1)/r.step);if(t>T1&&k!==lastK&&k<r.swaps.length){lastK=k;SFX.swap();}
      if(t<end+300)anim=requestAnimationFrame(step);};
    step();return;
  }
  const s=posAt(1e9);
  hats.forEach((h,i)=>{h.style.left=X(s.p[i]);h.style.transform='translate(-50%,0)';});
  pal.style.left=X(r.fin);
  if(r.stage==='write'){pal.style.visibility='hidden';msg.textContent='🐹가 있는 자리 아래 글을 태블릿에 써요!';return;}
  const hi=hats.findIndex((_,i)=>i===r.start);hats[hi].style.transform='translate(-50%,-110px)';pal.style.visibility='visible';
  msg.innerHTML=`정답: ${['①','②','③'][r.fin]} <span class="en">${esc(r.labels[r.fin])}</span> <button class="listen" id="hearH">🔊</button>`;
  $('#hearH').onclick=()=>sayEn(r.labels[r.fin]);SFX.fanfare();
}
function tvStory(st){
  const c=cfg();
  st.innerHTML=`<div class="panel grid"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">🚀 우주 정거장 탈출</h2><span class="band">${esc(c.setName||'')}</span></div><div class="map" id="map"></div></div>`;
}
const nameList=L=>L.map(x=>`<span style="white-space:nowrap">${esc(x.n)} ${esc(x.name)}</span>`).join(', ');
function rateBox(){
  const qs=cfg().qs||{},S=studs();
  const rows=Object.keys(qs).map((id,i)=>{const done=S.filter(x=>x.st&&x.st[id]!==undefined),miss=done.filter(x=>x.st[id]===0);return {id,i,q:qs[id],done:done.length,miss,rate:done.length?(done.length-miss.length)/done.length:null};})
    .filter(x=>x.done>0).sort((a,b)=>(a.rate??2)-(b.rate??2)||a.i-b.i);
  return `<div class="panel grid" id="qstat"><div class="row" style="justify-content:space-between"><h2>문제별 정답률</h2><button class="ghost" id="wrongT">${showWrong?'이름 가리기':'틀린 학생 이름 보기'}</button></div>
   <p class="muted" style="margin:0">처음 답(한 번에 맞혔는지) 기준이에요. 낮은 문제부터 보여요.</p>
   <div class="qrate">${rows.map(x=>{const ok=x.done-x.miss.length,rt=Math.round(x.rate*100);return `<div class="qrow${rt<70?' low':''}"><div><b>${esc(x.q.t)}</b><br><small class="en">${esc(x.q.a)}</small></div>
     <div class="qb"><div class="track"><div style="width:${rt}%"></div></div><span class="pc">${rt}%</span><small class="muted">${ok}/${x.done}명</small></div>
     <div>${x.miss.length?`틀린 학생 <b>${x.miss.length}명</b>${showWrong?`: ${nameList(x.miss)}`:''}`:'<span class="muted">틀린 학생 없음</span>'}</div></div>`;}).join('')||'<p class="muted">아직 푼 문제가 없어요</p>'}</div></div>`;
}
function rankBox(){
  const L=ranking();
  return `<div class="panel grid"><h2>순위</h2><div class="rank">${L.slice(0,10).map((x,i)=>`<div><span>${i+1}</span><span>${x.n} ${esc(x.name)}${x.easy?' 🌟':''}</span><span>${cfg().game==='story'?(x.s&&x.s.done?'🚀 탈출':((x.s||{}).pos||0)+'방'):(x.score||0)+'점'}</span></div>`).join('')||'<p class="muted">아직 없어요</p>'}</div></div>`;
}
function ranking(){
  const S=studs();
  if(cfg().game==='story')return S.slice().sort((a,b)=>{const x=a.s||{},y=b.s||{};return (y.done?1:0)-(x.done?1:0)||(x.done&&y.done?(x.doneAt||0)-(y.doneAt||0):0)||(y.pos||0)-(x.pos||0)||(x.traps||0)-(y.traps||0)||a.n-b.n;});
  return S.slice().sort((a,b)=>(b.score||0)-(a.score||0)||a.n-b.n);
}
function drawLive(){
  const c=cfg(),r=RD.r,live=$('#live'),S=studs();
  if(c.phase==='setup'||c.phase==='lobby'){
    live.innerHTML=c.phase==='lobby'?`<div class="panel grid"><h2>들어온 친구 ${S.length}명</h2><div class="people">${S.map(x=>`<span class="band" style="background:#fff;color:var(--ink);border:2px solid var(--line)">${x.n} ${esc(x.name)}</span>`).join('')||'<span class="muted">QR을 찍고 들어와요</span>'}</div></div>`:'';
    return;
  }
  let h='';
  if(c.phase==='play'&&c.game!=='story'&&r){
    const A=S.map(x=>(x.a||{})[r.n]).filter(Boolean);
    if(c.game==='cup'&&r.stage==='write'){['L','R'].forEach(s=>{const el=$(`.cnt[data-c="${s}"]`);if(el)el.innerHTML=`<span class="band">고른 친구 ${A.filter(a=>a.side===s).length}명 · 다 씀 ${A.filter(a=>a.side===s&&a.ok).length}명</span>`;});}
    const doneN=c.game==='cup'?A.filter(a=>a.ok).length:c.game==='speed'?A.filter(a=>a.ok||(a.tries||0)>=2).length:A.filter(a=>a.t).length;
    if(r.stage!=='done')h+=`<div class="panel row" style="justify-content:space-between"><b style="font-family:var(--display);font-size:1.3rem">${c.game==='hats'&&r.stage==='shuffle'?'👀 모두 TV를 보는 중':`✍️ 낸 친구 ${doneN} / ${S.length}명`}</b>${c.game==='speed'?`<span class="muted">맞힌 친구 ${A.filter(a=>a.ok).length}명</span>`:''}</div>`;
  }
  if(c.phase==='play'&&c.game==='story'){
    const N=storyLen(c.items||[]),m=$('#map');
    if(m)m.innerHTML=ranking().map(x=>{const s=x.s||{};return `<div class="mr"><span class="nm">${x.n} ${esc(x.name)}${x.easy?' 🌟':''}</span><div class="cells" style="grid-template-columns:repeat(${N+1},1fr)">${Array.from({length:N+1},(_,k)=>`<i class="${k===N?'':isCp(k)?'cp':''} ${k<(s.pos||0)?'past':''} ${k===(s.pos||0)&&!s.done?'me':''}">${k===N?(s.done?'🚀':'🏁'):k===(s.pos||0)?'🧑‍🚀':isCp(k)?'🚩':''}</i>`).join('')}</div><span class="pt">${s.done?'탈출':((s.pos||0)+'/'+N)}${s.traps?` <small class="muted">🕳️${s.traps}</small>`:''}</span></div>`;}).join('')||'<p class="muted">아직 없어요</p>';
    const F=Object.values(RD.feed||{}).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,5);
    h+=`<div class="panel grid"><h2>우주 정거장 소식</h2><div class="feed">${F.map(f=>`<div>${f.t==='done'?'🚀':f.t==='cp'?'🚩':'🕳️'} ${f.n}번 ${esc(f.name)} ${f.t==='done'?'탈출 성공!':f.t==='cp'?`${f.k}번째 방 체크포인트 도착`:`${f.k}번째 방에서 함정에 빠졌어요`}</div>`).join('')||'<p class="muted">첫 소식을 기다려요…</p>'}</div></div>`;
  }
  if(c.phase==='play'||c.phase==='end')h+=rankBox()+rateBox();
  live.innerHTML=h;
  const b=$('#wrongT');if(b)b.onclick=()=>{showWrong=!showWrong;drawLive();};
}
function tvEnd(st){
  const g=GAMES[cfg().game];
  st.innerHTML=`<div class="panel grid" style="text-align:center"><div class="pic">${g.icon}</div><h2 style="font-size:2.2rem">${g.name} 끝!</h2><p class="big">🏆 시상식을 눌러 결과를 보아요.</p></div>`;
  SFX.end();
}
function tvAward(st){
  const L=ranking(),p=[L[1],L[0],L[2]],story=cfg().game==='story';
  const val=x=>story?(x.s&&x.s.done?'🚀 탈출':((x.s||{}).pos||0)+'방'):(x.score||0)+'점';
  const qs=cfg().qs||{},S=studs();
  const hard=Object.keys(qs).map(id=>({q:qs[id],m:S.filter(x=>x.st&&x.st[id]===0).length})).filter(x=>x.m>0).sort((a,b)=>b.m-a.m).slice(0,3);
  st.innerHTML=`<div class="panel grid"><h2 style="text-align:center;font-size:2.2rem">🏆 ${GAMES[cfg().game].name} 시상식</h2>
    <div class="podium">${p.map((x,i)=>x?`<div class="p${[2,1,3][i]} pop"><b>${[2,1,3][i]}등</b><span>${x.n} ${esc(x.name)}</span>${val(x)}</div>`:'<span></span>').join('')}</div></div>
    ${hard.length?`<div class="panel grid"><h2>우리 반이 많이 틀린 문장 · 함께 읽어요</h2><div class="feed">${hard.map((h,i)=>`<div>${esc(h.q.t)} · <span class="en">${esc(h.q.a)}</span> <button class="listen" data-say="${i}">🔊</button> <em class="muted">틀린 친구 ${h.m}명</em></div>`).join('')}</div></div>`:''}`;
  $$('[data-say]',st).forEach(b=>b.onclick=()=>sayEn(hard[+b.dataset.say].q.a));
  SFX.fanfare();confetti(90);
}

/* ---------- route ---------- */
document.addEventListener('pointerdown',()=>ac(),{once:true});
if(location.hash==='#watch'&&ROOM){$('#sub').textContent='학생 화면 보기 · 선생님 전용';ClassWatch.teacher({db,room:ROOM,solo:true});}
else if(location.hash.startsWith('#teacher'))teacherView();
else if(ROOM)joinView();
else startView();
